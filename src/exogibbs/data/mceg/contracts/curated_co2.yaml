assumptions:
- statement: Ideal-gas C(g) + 2 O(g) -> CO2(g), standard pressure 1 bar; retained ATcT 1.172 total atomization
    and NASA atom thermal gauge.
  evidence:
  - scientific_sources
  - production_execution
- statement: Representative 626 ground-relative internal functions at mass 44.0095 u, nuclear-spin factor one,
    preserved source c2 and current-SI translation. Exchange symmetry is already included; no added ZPE, isotope
    mixing entropy or thermal-average diagnostic is adopted.
  evidence:
  - scientific_sources
domains:
- kind: numerical_evaluation
  status: documented
  description: Bounded continuous JAX thermochemistry and saved production cold solves in both networks.
