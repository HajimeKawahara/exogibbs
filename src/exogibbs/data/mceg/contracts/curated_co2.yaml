follow_ups:
- id: physical_application_evidence
  target_kind: claim
  target: physical_accuracy
  revision: '1'
  action: Add separately scoped physical evidence when required by a concrete application; this does not suspend
    adoption.
  requires:
  - Assess isotope, upper-state/continuum and correlated energy uncertainties relevant to the application.
  - Assess omitted atmospheric physics and observational evidence where relevant.
  completion: Retain numerical and physical claims separately while documenting new application evidence.
limitations:
- statement: The fixed-isotope thermal-average diagnostic omits isotope D0, atom/molecule mixing conventions
    and fractionation. Its response is not an uncertainty bound or natural-isotope correction.
  evidence:
  - scientific_sources
- statement: The source warning above about 3500 K concerns non-dissociating pure CO2. Species thermodynamics
    can be used in a reacting network, but this does not establish complete high-state or continuum accuracy.
  evidence:
  - scientific_sources
- statement: Production checks cover the saved finite grid. Independent-solver and hydrogen-poor results are
    earlier candidate evidence, not new production executions.
  evidence:
  - production_execution
  - scientific_sources
