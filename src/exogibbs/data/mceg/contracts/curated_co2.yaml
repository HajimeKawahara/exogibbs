  reasons:
  - The inspected modern thermodynamic construction and explicit reference conventions justify the scoped replacement.
    The high-temperature hydrogen-poor example changes CO2 by +0.4462%, compared with local standard-Q sensitivity
    of about +/-0.0567%; interpolation error is much smaller. The fixed-isotope-average response is not a physical
    isotope correction. Existing ATcT energy is unchanged and full physical uncertainty remains unknown.
  status: supported
  origin: reviewed
