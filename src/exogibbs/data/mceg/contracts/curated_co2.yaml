  reasons:
  - All 150 actual-default cold solves converge. Maximum elemental residual is 1.3522e-6, mass-action residual
    1.1369e-12 and relative charge residual 4.5328e-14. The unchanged candidate potentials and historical data
    remain reproducible; both networks preserve their elemental budgets and fixed species.
  status: supported
  origin: reviewed
- id: physical_accuracy_review
  kind: evidence_support
  claim: physical_accuracy
  claim_revision: '1'
  subject: curated_co2_production_20261104
  context: production_gas_domain
