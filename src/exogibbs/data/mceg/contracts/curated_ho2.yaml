schema_version: '0.2'
model:
  id: exogibbs.curated_ho2.v1
  name: Curated gas default with NASA/ATcT HO2
  description: Adopt the exact reviewed NASA HO2 thermal reaction and balanced ATcT energy on the pinned
    KH base. Scoped source choice and fresh cumulative production verification are supported; full physical
    accuracy remains unknown.
  implementation: &id001
    repository: https://github.com/HajimeKawahara/exogibbs
    revision: sha256:74f95f4fb386a503359f054375651b41575c2ccc0ac9b405125b956d63870dca
    entry_points:
    - exogibbs.presets.curated.chemsetup
    - exogibbs.presets.curated_ho2.chemsetup
assumptions:
- statement: Only HO2 changes from curated-kh-v1. KH, OH, H2O, CO2, TiO, C2H, all other functions, species,
    budgets, charge and the atomic gauge are retained.
  evidence:
  - scientific_sources
  - production_execution
- statement: Same-version ATcT 1.172 H+2O-HO2 gives D0=694.662 kJ/mol. Remove NASA energy using its native
    R and insert ATcT with modern SI R; delta(D0/R)=-2.0209623169357656 K is applied once.
  evidence:
  - scientific_sources
- statement: Copy exact NASA9 reaction coefficients without fitting, extra spin, symmetry, ZPE or atomic
    corrections. JANAF original nodes at identical energy and atomic reference are a thermal control,
    not an adopted continuous model.
  evidence:
  - scientific_sources
  - production_execution
domains:
- kind: numerical_evaluation
  status: documented
  description: Continuous packaged HO2 thermodynamics and actual public-factory cold solves in both network
    modes.
  conditions:
  - No extrapolation outside 1500-4000 K; invalid temperatures return NaN.
  - '75 conditions per network: five temperatures 1500/2000/2500/3000/4000 K, pressures 1e-6/1e-4/0.01/1/100
    bar and C/O=0.5888436553555908/1/1.5.'
  - Production and frozen candidate thermodynamics agree on 2501 temperatures; every non-HO2 potential
    equals curated-kh-v1.
  evidence:
  - scientific_sources
  - production_execution
- kind: scientific_applicability
  status: unknown
  description: Full isotope/continuum/energy uncertainty, condensation, transport and atmospheric observational
    validation are outside scope.
  conditions: []
  evidence:
  - scientific_sources
  - production_execution
claims:
- id: scientific_selection
  revision: '1'
  kind: theoretical
  statement: The NASA thermal reaction with balanced ATcT 1.172 energy is scientifically preferred to
    inherited JANAF HO2 within the bounded gas model.
  scope: curated-ho2-v1 on 1500-4000 K and 1 bar standard pressure, inheriting curated-kh-v1. Only HO2
    changes, with NASA dimensionless thermal functions, original atomic gauge and balanced ATcT 1.172
    D0=694.662 kJ/mol. Both 537-species ion-inclusive and 421-species neutral networks; no complete atmospheric
    physical validation.
- id: production_adoption
  revision: '1'
  kind: numerical_verification
  statement: The public curated default implements the exact reviewed HO2 thermodynamics on curated-kh-v1
    and passes new production solves and independently assembled candidate-on-KH controls in both network
    modes.
  scope: curated-ho2-v1 on 1500-4000 K and 1 bar standard pressure, inheriting curated-kh-v1. Only HO2
    changes, with NASA dimensionless thermal functions, original atomic gauge and balanced ATcT 1.172
    D0=694.662 kJ/mol. Both 537-species ion-inclusive and 421-species neutral networks; no complete atmospheric
    physical validation.
- id: physical_accuracy
  revision: '1'
  kind: physical_validation
  statement: The complete adopted gas model has quantified physical uncertainty and validated planetary
    atmospheric abundance accuracy.
  scope: curated-ho2-v1 on 1500-4000 K and 1 bar standard pressure, inheriting curated-kh-v1. Only HO2
    changes, with NASA dimensionless thermal functions, original atomic gauge and balanced ATcT 1.172
    D0=694.662 kJ/mol. Both 537-species ion-inclusive and 421-species neutral networks; no complete atmospheric
    physical validation.
