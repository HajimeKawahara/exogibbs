contexts:
- id: production_gas_domain
  scope: curated-ho2-v1 on 1500-4000 K and 1 bar standard pressure, inheriting curated-kh-v1. Only HO2
    changes, with NASA dimensionless thermal functions, original atomic gauge and balanced ATcT 1.172
    D0=694.662 kJ/mol. Both 537-species ion-inclusive and 421-species neutral networks; no complete atmospheric
    physical validation.
  settings:
    dataset: curated-ho2-v1
    base_dataset: curated-kh-v1
    temperature_range_K: 1500-4000
    standard_pressure_bar: 1
    networks: ions and neutral
    energy_anchor: ATcT 1.172 balanced 694.662 kJ/mol
    thermal_source: Exact reviewed HO2-H-2O NASA9 reaction; energy constant shifted once
    previous_follow_up: HO2 candidate production choice completed by authorized adoption; full physical
      scope remains unknown
assessments:
- id: scientific_selection_review
  kind: evidence_support
  claim: scientific_selection
  claim_revision: '1'
  subject: curated_ho2_production_20261105
  context: production_gas_domain
  method:
    id: review_ho2_scoped_production_adoption
    revision: '1'
    description: Separate the justified bounded source choice and actual production verification from
      complete physical accuracy.
  evidence:
  - scientific_sources
  reasons:
  - Replace the obsolete JANAF formation energy with the exact NASA reaction and same-version balanced
    ATcT energy. The Burgess evaluation documents the discrepancy; same-energy JANAF node controls show
    a smaller thermal contrast. The +0.23% to -2.01% JANAF/NASA node contrast is a sensitivity, not a
    confidence interval.
  status: supported
  origin: reviewed
- id: production_adoption_review
  kind: evidence_support
  claim: production_adoption
  claim_revision: '1'
  subject: curated_ho2_production_20261105
  context: production_gas_domain
  method:
    id: review_ho2_scoped_production_adoption
    revision: '1'
    description: Separate the justified bounded source choice and actual production verification from
      complete physical accuracy.
  evidence:
  - scientific_sources
  - production_execution
  reasons:
  - The public factory passes 150 fresh cold solves, six tighter candidate-on-KH controls and two FastChem
    comparisons. Only HO2 changes from the KH background; the old OH-background candidate abundances are
    not treated as identical. The dense potential discrepancy is below 3.56e-14; tighter HO2 ln(x) agreement
    is below 3.27e-13 and FastChem agreement below 1.20e-8 dex.
  status: supported
  origin: reviewed
- id: physical_accuracy_review
  kind: evidence_support
  claim: physical_accuracy
  claim_revision: '1'
  subject: curated_ho2_production_20261105
  context: production_gas_domain
  method:
    id: review_ho2_scoped_production_adoption
    revision: '1'
    description: Separate the justified bounded source choice and actual production verification from
      complete physical accuracy.
  evidence:
  - scientific_sources
  - production_execution
  reasons:
  - Shared source ancestry, isotope/continuum completeness, same-version ATcT covariance and application-specific
    atmospheric observational validation remain unquantified; numerical closure does not resolve them.
  status: unknown
  origin: reviewed
follow_ups:
- id: physical_scope
  target_kind: claim
  target: physical_accuracy
  revision: '1'
  action: Resolve isotope/continuum conventions and same-version energy covariance when required by a
    named application.
  requires:
  - JANAF/NASA agreement is not an independent experiment or a complete physical uncertainty interval.
  - Historical source-paper and covariance follow-ups remain recorded in the source/candidate contracts.
  completion: Provide application-specific physical evidence or retain explicit unknown status without
    blocking the bounded adopted source improvement.
limitations:
- statement: Source selection, caloric closure, finite substitutions and solver parity do not establish
    complete atmospheric physical accuracy.
  evidence:
  - scientific_sources
  - production_execution
- statement: The old isolated HO2 candidate used curated-oh-v1. New production combines the prior KH change
    with HO2, so only target thermodynamics are compared to that archive; new candidate-on-KH controls
    verify composition.
  evidence:
  - production_execution
