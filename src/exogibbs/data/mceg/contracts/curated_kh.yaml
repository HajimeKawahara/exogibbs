schema_version: '0.2'
model:
  id: exogibbs.curated_kh.v1
  name: Curated gas with spectroscopic KH energy
  description: Adopt the reviewed KH energy on the pinned OH base without changing thermal functions.
    Scoped scientific choice and production verification are supported; full physical accuracy remains
    unknown.
  implementation: &id001
    repository: https://github.com/HajimeKawahara/exogibbs
    revision: sha256:cbddb94fe757cf2370854a1093cb4da339ca9c5c701049f66ab353eeb4d50f10
    entry_points:
    - exogibbs.presets.curated.chemsetup
    - exogibbs.presets.curated_kh.chemsetup
assumptions:
- statement: Only KH changes from curated-oh-v1; OH, H2O, CO2, TiO, C2H, species, budgets, charge and
    atomic conventions are retained.
  evidence:
  - scientific_sources
  - production_execution
- statement: Apply -delta(D0)/(RT) once with delta(D0)=-9532.161360874597 J/mol. Reaction G/H increase;
    S/Cp remain unchanged. No refit or extra spin/ZPE correction.
  evidence:
  - scientific_sources
  - production_execution
domains:
- kind: numerical_evaluation
  status: documented
  description: Continuous packaged thermodynamics and actual public-factory cold solves on both fixed
    gas networks.
  conditions:
  - No extrapolation outside 1500-4000 K; invalid temperatures return NaN.
  - '75 cases per network: five temperatures, five pressures from 1e-6 to 100 bar, C/O=0.5888436553555908/1/1.5.'
  evidence:
  - scientific_sources
  - production_execution
- kind: scientific_applicability
  status: unknown
  description: Complete D0/thermal uncertainty, isotope/continuum contributions and atmospheric observations
    remain outside scope.
  conditions: []
  evidence:
  - scientific_sources
  - production_execution
claims:
- id: scientific_selection
  revision: '1'
  kind: theoretical
  statement: The spectroscopic KH dissociation energy with retained thermal functions is scientifically
    preferred to the larger inherited JANAF energy in the bounded gas model.
  scope: 'curated-kh-v1 on 1500-4000 K and 1 bar standard pressure, inheriting curated-oh-v1. Only KH
    energy changes: spectroscopic D0=170857.838639 J/mol replaces balanced JANAF 180390 J/mol; thermal
    functions and atomic convention are retained. Both 537-species ion-inclusive and 421-species neutral
    networks; complete physical accuracy remains unknown.'
- id: production_adoption
  revision: '1'
  kind: numerical_verification
  statement: The public curated default implements the reviewed KH energy candidate on curated-oh-v1 and
    reproduces its finite response in both networks.
  scope: 'curated-kh-v1 on 1500-4000 K and 1 bar standard pressure, inheriting curated-oh-v1. Only KH
    energy changes: spectroscopic D0=170857.838639 J/mol replaces balanced JANAF 180390 J/mol; thermal
    functions and atomic convention are retained. Both 537-species ion-inclusive and 421-species neutral
    networks; complete physical accuracy remains unknown.'
- id: physical_accuracy
  revision: '1'
  kind: physical_validation
  statement: The complete adopted gas model has quantified physical uncertainty and validated atmospheric
    abundance accuracy.
  scope: 'curated-kh-v1 on 1500-4000 K and 1 bar standard pressure, inheriting curated-oh-v1. Only KH
    energy changes: spectroscopic D0=170857.838639 J/mol replaces balanced JANAF 180390 J/mol; thermal
    functions and atomic convention are retained. Both 537-species ion-inclusive and 421-species neutral
    networks; complete physical accuracy remains unknown.'
