contexts:
- id: production_gas_domain
  scope: 'curated-kh-v1 on 1500-4000 K and 1 bar standard pressure, inheriting curated-oh-v1. Only KH
    energy changes: spectroscopic D0=170857.838639 J/mol replaces balanced JANAF 180390 J/mol; thermal
    functions and atomic convention are retained. Both 537-species ion-inclusive and 421-species neutral
    networks; complete physical accuracy remains unknown.'
  settings:
    dataset: curated-kh-v1
    base_dataset: curated-oh-v1
    temperature_range_K: 1500-4000
    standard_pressure_bar: 1
    networks: ions and neutral
    energy_anchor: Zemke 1988 D0=14282.6 cm-1
    thermal_source: Exact retained JANAF/FastChem fit and atomic convention
    previous_follow_up: Authorized KH candidate production choice completed; complete physical scope remains
      unknown
assessments:
- id: scientific_selection_review
  kind: evidence_support
  claim: scientific_selection
  claim_revision: '1'
  subject: curated_kh_production_20261105
  context: production_gas_domain
  method:
    id: review_kh_scoped_production_adoption
    revision: '1'
    description: Separate the bounded source choice and actual production verification from complete physical
      accuracy.
  evidence:
  - scientific_sources
  reasons:
  - The inspected abstract supplies D0=14282.6 cm-1; the exact energy correction avoids a new fit and
    unsupported spin/ZPE changes. Conserved finite substitutions and smaller same-D0 NASA thermal-reference
    controls support this source choice. The De uncertainty is not reused as a D0 error bar.
  status: supported
  origin: reviewed
- id: production_adoption_review
  kind: evidence_support
  claim: production_adoption
  claim_revision: '1'
  subject: curated_kh_production_20261105
  context: production_gas_domain
  method:
    id: review_kh_scoped_production_adoption
    revision: '1'
    description: Separate the bounded source choice and actual production verification from complete physical
      accuracy.
  evidence:
  - scientific_sources
  - production_execution
  reasons:
  - All 150 production cold cases, six tighter controls and two FastChem checks pass. Dense candidate
    agreement is within 2.67e-15 in h, KH log fractions within 3.20e-14, and all non-KH potentials and
    budgets are preserved.
  status: supported
  origin: reviewed
- id: physical_accuracy_review
  kind: evidence_support
  claim: physical_accuracy
  claim_revision: '1'
  subject: curated_kh_production_20261105
  context: production_gas_domain
  method:
    id: review_kh_scoped_production_adoption
    revision: '1'
    description: Separate the bounded source choice and actual production verification from complete physical
      accuracy.
  evidence:
  - scientific_sources
  - production_execution
  reasons:
  - The precision D0 uncertainty, inherited thermal-fit accuracy, isotope/continuum contributions and
    application-specific atmospheric validation remain unquantified. Numerical closure cannot resolve
    shared source errors.
  status: unknown
  origin: reviewed
follow_ups:
- id: physical_scope
  target_kind: claim
  target: physical_accuracy
  revision: '1'
  action: Resolve source precision, thermal and physical limits only for the accuracy and application
    actually claimed.
  requires:
  - The 1988 full text is useful for precision D0 uncertainty; its absence does not invalidate the inspected
    central value.
  - Khan state selection and PF reconciliation are separate prerequisites for a full thermal replacement.
  completion: Provide application-specific evidence or retain unknown without blocking the bounded energy
    adoption.
limitations:
- statement: Source agreement, conserved equilibrium and solver parity do not establish complete physical
    uncertainty. Trace all-element relative residual reaches 1.48e-6 despite much tighter K/H/C/O closure.
  evidence:
  - scientific_sources
  - production_execution
