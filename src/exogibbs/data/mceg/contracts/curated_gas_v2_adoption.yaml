schema_version: '0.2'
model:
  id: exogibbs.curated_gas.v2
  name: Curated gas v2 combined molecular adoption
  description: Adopt atom-balanced selected energies while retaining atomic thermals and empirical source-fit residuals,
    and replace only O2 molecular thermals by the evaluated natural-isotope model minus its NASA proxy. CNN remains
    provisional; C4N2 uses NASA529.2kJ/mol, not NIST529.3; N2O5 and P4S3 use distinct H298 anchors with no invented
    physical D0. Coordinated HNCO/NCO, NO2/N2O4 and cis/trans-HNO2 replacements apply each species once.
  implementation: &id001
    repository: https://github.com/HajimeKawahara/exogibbs
    revision: sha256:d17b0393cb94596082c650abe90d9bdf7c46a4185a23c48ab1e16f76e7817f66
    entry_points:
    - exogibbs.presets.curated_v2.chemsetup
    - exogibbs.presets.curated.chemsetup
assumptions:
- statement: Energy-only shifts add delta_GH/(R*T) to inherited reaction potentials; positive G/H is the negative
    physical D0 change for D0-anchored rows. Physical anchors are distinct from fitted R*a intercepts.
  evidence:
  - scientific_sources
- statement: The HNCO/NCO, NO2/N2O4 and cis/trans-HNO2 cycles use coordinated energy choices with duplicate companion
    specifications deduplicated. N2O5/P4S3 have H298 anchors, not fabricated D0 values.
  evidence:
  - scientific_sources
  - production_execution
- statement: O2 thermal correction is evaluated molecular minus NASA molecular proxy on the retained fit/atomic
    gauge; the selected energy is added once. No extra isotope, spin, symmetry or native-R alignment is applied.
  evidence:
  - scientific_sources
  - production_execution
domains:
- kind: numerical_evaluation
  status: documented
  description: curated-gas-v2 on pinned curated-ch2-v1; 27 source decisions update 28 molecular species on 1500-4000
    K at one-bar standard pressure. Fixed 537-species ion-inclusive and 421-species neutral networks; complete physical
    uncertainty and atmospheric accuracy remain unquantified.
  conditions:
  - 75 conditions per network:1500,2000,2500,3000,4000K;1e-6,1e-4,0.01,1,100bar;C/O=0.5888436553555908,1,1.5.
  - 150 final fresh production solves,6 tighter independent references,10 joint-path solves and2 ion-inclusive FastChem
    comparisons;150 baseline cases reused once.
  - 2752-node all-target scalar/JAX GHSCp identity and unchanged non-target columns. Direct public-alias identity
    adds no solves.
  - A separate initial passed150/6/10/2 execution was rerun after a docstring import-timing ambiguity; arrays match
    exactly and are not double-counted as final evidence.
  evidence:
  - scientific_sources
  - production_execution
  - default_binding
- kind: scientific_applicability
  status: unknown
  description: ATcT covariance, CNN theoretical provenance, retained high-temperature excited-state/large-amplitude
    thermals, isotopic conventions and empirical-fit residuals leave full physical uncertainty unquantified. Source
    marginal widths and finite numerical controls are not a complete reaction or atmospheric uncertainty model.
  conditions: []
  evidence:
  - scientific_sources
