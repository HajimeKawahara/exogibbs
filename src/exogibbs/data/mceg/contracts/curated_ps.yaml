assumptions:
- statement: Only PS changes from curated-cn-v1; species,formula matrix,budgets,charge,all atomic functions and
    earlier curated choices remain.
  evidence:
  - production_execution
- statement: Add the molecular thermal difference to the literal current fit. Retain D0=438 kJ/mol,deltaD0=0,nativeNASA
    R and the physical source/finite-fit distinction; no zero-temperature extrapolation or potentialDe substitution.
  evidence:
  - scientific_sources
  - compact_representation
- statement: The fixed223645-level cutoff and spin/mass conventions follow the candidate. The compact polynomial
    approximates these thermals; degree convergence is not complete physical uncertainty.
  evidence:
  - scientific_sources
  - compact_representation
domains:
- kind: numerical_evaluation
  status: documented
  description: Named curated-ps-v1 on curated-cn-v1,1500-4000K,one-bar standard pressure. Only P1S1 receives the
    reviewed fixed-cutoff POPS-minus-NASA/Gurvich molecular thermal difference; Lodders D0=438 kJ/mol and inherited
    fit/source residual retained. Both537-species ion-inclusive and421-species neutral networks; no full atmospheric
    validation.
  conditions:
  - "Scalar/array JAX thermodynamics on1500\u20134000K; invalid temperatures returnNaN."
  - "75 conditions per network at five temperatures,five pressures1e-6\u2013100bar and threeC/O values;150 fresh\
    \ production endpoints."
  - Direct-state controls use the cumulative CNbase; publicdefault activation is coordinated with subsequentTiO2
    adoption.
  evidence:
  - compact_representation
  - production_execution
- kind: scientific_applicability
  status: unknown
  description: Complete excited-state,isotope,energy-covariance and atmospheric uncertainty remain outside the scoped
    adoption.
  conditions: []
  evidence:
  - scientific_sources
  - production_execution
