contexts:
- id: curated_ps_production
  scope: Named curated-ps-v1 on curated-cn-v1,1500-4000K,one-bar standard pressure. Only P1S1 receives the reviewed
    fixed-cutoff POPS-minus-NASA/Gurvich molecular thermal difference; Lodders D0=438 kJ/mol and inherited fit/source
    residual retained. Both537-species ion-inclusive and421-species neutral networks; no full atmospheric validation.
  settings:
    dataset: curated-ps-v1
    base_dataset: curated-cn-v1
    temperature_range_K: "1500\u20134000"
    pressure_range_bar: "1e-6\u2013100"
    standard_pressure_bar: 1
    ion_species: 537
    neutral_species: 421
    new_production_solves: 150
    tighter_reference_solves: 6
    independent_solver_comparisons: 2
    delta_D0_J_mol: 0
    polynomial_degree: 18
    public_default_scope: Namedstage; subsequentTiO2 activation retains thisupdate
assessments:
- id: scientific_selection_review
  kind: evidence_support
  claim: scientific_selection
  claim_revision: '1'
  subject: ps_production_adoption_20261106
  context: curated_ps_production
  method:
    id: ps_scoped_production_adoption
    revision: '1'
    description: Separate source-based selection, compact numerical approximation, cumulative production verification
      and unknown complete physical accuracy.
  evidence:
  - scientific_sources
  - compact_representation
  - production_execution
  reasons:
  - The retained D0=438 +/-10 kJ/mol, native NASA R, molecular H0 gauge, central cutoff, spin divisor and natural-mass
    proxy exactly follow the reviewed source definition; deltaD0=0.
  - Explicit X/B/a thermodynamics motivates adoption. a4Pi supplies1.57709%Q at4000K but is unrefined abinitio;
    unknown full accuracy does not negate the scoped choice or create a missing-literature merge gate.
  status: supported
  origin: reviewed
- id: production_adoption_review
  kind: evidence_support
  claim: production_adoption
  claim_revision: '1'
  subject: ps_production_adoption_20261106
  context: curated_ps_production
  method:
    id: ps_scoped_production_adoption
    revision: '1'
    description: Separate source-based selection, compact numerical approximation, cumulative production verification
      and unknown complete physical accuracy.
  evidence:
  - scientific_sources
  - compact_representation
  - production_execution
  reasons:
  - Degree18 lnQ representation is checked against223645 direct levels at2758 temperatures. Maximum packaged/JAX
    errors G8.74e-10 J/mol,H6.85e-8 J/mol,S4.56e-11 J/mol/K,Cp8.53e-9 J/mol/K,h2.85e-14; no energy alignment is
    fitted.
  - "150 new endpoints plus6 tighter exact-state controls pass. All non-PS potentials equal the CN base. PS incremental\
    \ ratios0.999314096\u20131.014492964; maximum PSlnx control9.60e-14 and absolute whole-network control3.25e-14.\
    \ Two FastChem comparisons agree within5.95e-6dex."
  - Differences from the old COS-base PS-only candidate contain the CN background update; neutral production is
    newly solved rather than inferred from an absent old neutral candidate.
  status: supported
  origin: reviewed
- id: physical_accuracy_review
  kind: evidence_support
  claim: physical_accuracy
  claim_revision: '1'
  subject: ps_production_adoption_20261106
  context: curated_ps_production
  method:
    id: ps_scoped_production_adoption
    revision: '1'
    description: Separate source-based selection, compact numerical approximation, cumulative production verification
      and unknown complete physical accuracy.
  evidence:
  - scientific_sources
  - compact_representation
  - production_execution
  reasons:
  - Unrefined a4Pi energy/coupling, higher-state completeness, isotope-mixture approximation, correlated energy
    uncertainty and non-equilibrium/condensed/observational planetary physics remain unquantified.
  status: unknown
  origin: reviewed
limitations:
- statement: a4Pi is unrefined abinitio and couplings toX are omitted. Within-file cutoff/electronic sensitivity
    does not bound missing manifolds, and representative isotopologue levels with natural-mass translation are not
    an isotope mixture.
  evidence:
  - scientific_sources
- statement: Finite-grid approximation and solver controls verify supplied equations, not full atmospheric physical
    accuracy. Small trace responses near control variation are not interpreted as significant.
  evidence:
  - compact_representation
  - production_execution
follow_ups:
- id: excited_state_precision
  target_kind: claim
  target: physical_accuracy
  revision: '1'
  action: If greater precision is required, constrain a4Pi excitation/coupling and higher manifolds, then propagate
    their thermal effect separately from source-energy uncertainty.
  requires:
  - Improved independent theoretical or experimental electronic-state information; not a prerequisite for this completed
    scoped adoption.
  completion: A better quantified excited-state thermal model without silently changing retained atomic/energy conventions.
