model:
  id: exogibbs.curated_ps.v1
  name: Curated PS thermals on the cumulative CN base
  description: Adopt the scoped retained-energy POPS update with a compact continuous representation; numerical
    production and conditional scientific selection are supported, complete physical accuracy is unknown.
  implementation: &id001
