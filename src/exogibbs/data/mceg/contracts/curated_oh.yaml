schema_version: '0.2'
model:
  id: exogibbs.curated_oh.v1
  name: Curated gas default with NASA/ATcT OH
  description: Adopt the exact reviewed NASA OH thermal reaction and balanced ATcT energy on the pinned
    H2O base. Scoped scientific selection and production verification are supported; complete physical
    accuracy remains unknown.
  implementation:
    repository: https://github.com/HajimeKawahara/exogibbs
    revision: sha256:323f0753b3d4462ba87e626939dea9b21fc5030329881e24800c4e00f4cc7444
    entry_points:
    - exogibbs.presets.curated.chemsetup
    - exogibbs.presets.curated_oh.chemsetup
assumptions:
- statement: Only OH changes from curated-h2o-v1. H2O, CO2, TiO, C2H and all other functions, species,
    budgets, charge and atomic gauge are retained.
  evidence:
  - scientific_sources
  - production_execution
- statement: Balanced ATcT 1.172 H+O-OH gives D0=425.604 kJ/mol. Remove NASA energy with its native R
    and insert ATcT with modern SI R; the D0/R shift is -21.585709716324345 K and is applied once.
  evidence:
  - scientific_sources
- statement: The exact NASA9 reaction coefficients are copied without refitting. No extra nuclear spin,
    symmetry, ZPE or atomic correction is added. MYTHOS is a finite-state sensitivity control, not an
    adopted replacement.
  evidence:
  - scientific_sources
  - production_execution
domains:
- kind: numerical_evaluation
  status: documented
  description: Continuous packaged OH thermodynamics and actual public-factory cold solves in both network
    modes.
  conditions:
  - No extrapolation outside 1500-4000 K; invalid temperatures return NaN.
  - '75 conditions per network: five temperatures 1500/2000/2500/3000/4000 K, pressures 1e-6/1e-4/0.01/1/100
    bar and C/O=0.5888436553555908/1/1.5.'
  - Production and frozen candidate thermodynamics agree on 2501 temperatures; every non-OH potential
    equals curated-h2o-v1.
  evidence:
  - scientific_sources
  - production_execution
- kind: scientific_applicability
  status: unknown
  description: Full isotope/continuum/energy uncertainty, condensation, transport and atmospheric observational
    validation are outside scope.
  conditions: []
  evidence:
  - scientific_sources
  - production_execution
claims:
- id: scientific_selection
  revision: '1'
  kind: theoretical
  statement: The NASA thermal reaction with balanced ATcT 1.172 energy is scientifically preferred to
    inherited JANAF OH within the bounded gas model.
  scope: curated-oh-v1 on 1500-4000 K and 1 bar standard pressure, inheriting curated-h2o-v1. Only OH
    changes, with NASA dimensionless thermal functions, original atomic gauge and balanced ATcT 1.172
    D0=425.604 kJ/mol. Both 537-species ion-inclusive and 421-species neutral networks; no complete atmospheric
    physical validation.
- id: production_adoption
  revision: '1'
  kind: numerical_verification
  statement: The public curated default implements the exact reviewed OH candidate on curated-h2o-v1 and
    reproduces its finite response in both network modes.
  scope: curated-oh-v1 on 1500-4000 K and 1 bar standard pressure, inheriting curated-h2o-v1. Only OH
    changes, with NASA dimensionless thermal functions, original atomic gauge and balanced ATcT 1.172
    D0=425.604 kJ/mol. Both 537-species ion-inclusive and 421-species neutral networks; no complete atmospheric
    physical validation.
- id: physical_accuracy
  revision: '1'
  kind: physical_validation
  statement: The complete adopted gas model has quantified physical uncertainty and validated planetary
    atmospheric abundance accuracy.
  scope: curated-oh-v1 on 1500-4000 K and 1 bar standard pressure, inheriting curated-h2o-v1. Only OH
    changes, with NASA dimensionless thermal functions, original atomic gauge and balanced ATcT 1.172
    D0=425.604 kJ/mol. Both 537-species ion-inclusive and 421-species neutral networks; no complete atmospheric
    physical validation.
