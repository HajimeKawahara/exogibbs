contexts:
- id: production_gas_domain
  scope: curated-oh-v1 on 1500-4000 K and 1 bar standard pressure, inheriting curated-h2o-v1. Only OH
    changes, with NASA dimensionless thermal functions, original atomic gauge and balanced ATcT 1.172
    D0=425.604 kJ/mol. Both 537-species ion-inclusive and 421-species neutral networks; no complete atmospheric
    physical validation.
  settings:
    dataset: curated-oh-v1
    base_dataset: curated-h2o-v1
    temperature_range_K: 1500-4000
    standard_pressure_bar: 1
    networks: ions and neutral
    energy_anchor: ATcT 1.172 balanced 425.604 kJ/mol
    thermal_source: Exact reviewed OH-H-O NASA9 reaction, energy constant shifted once
    previous_follow_up: OH candidate production choice completed by authorized adoption; full physical
      scope remains unknown
assessments:
- id: scientific_selection_review
  kind: evidence_support
  claim: scientific_selection
  claim_revision: '1'
  subject: curated_oh_production_20261105
  context: production_gas_domain
  method:
    id: review_oh_scoped_production_adoption
    revision: '1'
    description: Separate the justified bounded source choice and actual production verification from
      complete physical accuracy.
  evidence:
  - scientific_sources
  reasons:
  - The inspected IUPAC evaluation identifies a JANAF electronic/caloric defect. Exact NASA reaction and
    derivative checks plus conserved finite substitutions support the replacement. MYTHOS at identical
    energy and atomic references differs by less than 0.098 percent in K; this is a thermal sensitivity,
    not a full uncertainty estimate.
  status: supported
  origin: reviewed
- id: production_adoption_review
  kind: evidence_support
  claim: production_adoption
  claim_revision: '1'
  subject: curated_oh_production_20261105
  context: production_gas_domain
  method:
    id: review_oh_scoped_production_adoption
    revision: '1'
    description: Separate the justified bounded source choice and actual production verification from
      complete physical accuracy.
  evidence:
  - scientific_sources
  - production_execution
  reasons:
  - All 150 production cold cases, six tighter candidate controls and two FastChem comparisons pass. Production
    h agrees with the frozen candidate on 2501 temperatures within 1.07e-14, non-OH functions and budgets
    are retained, and both full production grids reproduce the archived candidate response.
  status: supported
  origin: reviewed
- id: physical_accuracy_review
  kind: evidence_support
  claim: physical_accuracy
  claim_revision: '1'
  subject: curated_oh_production_20261105
  context: production_gas_domain
  method:
    id: review_oh_scoped_production_adoption
    revision: '1'
    description: Separate the justified bounded source choice and actual production verification from
      complete physical accuracy.
  evidence:
  - scientific_sources
  - production_execution
  reasons:
  - Shared source ancestry, isotope/continuum completeness, same-version ATcT covariance and application-specific
    atmospheric observational validation remain unquantified; numerical closure does not resolve them.
  status: unknown
  origin: reviewed
follow_ups:
- id: physical_scope
  target_kind: claim
  target: physical_accuracy
  revision: '1'
  action: Resolve isotope/continuum conventions and same-version energy covariance when required by a
    named application.
  requires:
  - MYTHOS/NASA agreement is not an independent experiment or a complete physical uncertainty interval.
  - Historical source-paper and covariance follow-ups remain recorded in the source/candidate contracts.
  completion: Provide application-specific physical evidence or retain explicit unknown status without
    blocking the bounded adopted source improvement.
limitations:
- statement: Source selection, caloric closure, finite substitutions and solver parity do not establish
    complete atmospheric physical accuracy.
  evidence:
  - scientific_sources
  - production_execution
