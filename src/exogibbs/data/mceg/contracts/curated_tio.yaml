schema_version: '0.2'
model:
  id: exogibbs.curated_tio.v1
  name: Curated gas default with modern TiO thermochemistry
  description: Versioned adoption of the reviewed TOTO/Jain TiO model on the unchanged C2H-corrected gas base.
    Scientific selection and numerical implementation are supported within scope; complete physical accuracy
    remains unknown.
  implementation:
    repository: https://github.com/HajimeKawahara/exogibbs
    revision: sha256:3aed1f224d37606a2afcf2cb54f4fbe63ac09d5e4f596f97b8b5ddc798bd6651
    entry_points:
    - exogibbs.presets.curated.chemsetup
    - exogibbs.presets.curated_tio.chemsetup
assumptions:
- statement: Ideal gas formation Ti(g) + O(g) -> TiO(g), with standard pressure 1 bar and the existing NASA
    neutral-atom gauge.
  evidence:
  - scientific_sources
  - production_execution
- statement: 48Ti16O internal states represent elemental TiO with molecular mass 63.8664 u; no extra nuclear
    spin or ZPE correction. The central bound-state inventory and six-knot Gibbs representation are adopted
    without refitting or duplicate high-state additions.
  evidence:
  - scientific_sources
domains:
- kind: numerical_evaluation
  status: documented
  description: Continuous JAX thermochemistry on 1500-4000 K; production cold solves on the fixed five-temperature,
    five-pressure, three-composition grid for both networks.
  conditions:
  - 'Five temperatures: 1500, 2000, 2500, 3000, 4000 K.'
  - 'Five pressures: 1e-6, 1e-4, 0.01, 1, 100 bar.'
  - 'C/O: 0.5888436553555908, 1, 1.5; other element/H ratios fixed.'
  - No extrapolation; nonfinite or out-of-range temperatures return NaN.
  evidence:
  - scientific_sources
  - production_execution
- kind: scientific_applicability
  status: unknown
  description: Source preference does not quantify full physical uncertainty or validate physical atmospheres;
    isotope fractionation, condensation, rainout, transport and spectra are outside scope.
  conditions: []
  evidence:
  - scientific_sources
claims:
- id: scientific_selection
  revision: '1'
  kind: theoretical
  statement: TOTO/Jain is scientifically preferred over the preceding JANAF/BC TiO hybrid for the explicitly
    scoped curated gas model.
  scope: The curated-tio-v1 gas model on 1500-4000 K at standard pressure 1 bar; 48Ti16O internal levels with
    elemental NASA mass and neutral-atom references; 537 ion-inclusive or 421 neutral species. No physical
    atmosphere validation.
- id: production_adoption
  revision: '1'
  kind: numerical_verification
  statement: The public curated default implements the frozen TiO candidate, preserves non-TiO formation functions
    and passes the saved ion-inclusive and neutral production checks.
  scope: The curated-tio-v1 gas model on 1500-4000 K at standard pressure 1 bar; 48Ti16O internal levels with
    elemental NASA mass and neutral-atom references; 537 ion-inclusive or 421 neutral species. No physical
    atmosphere validation.
- id: physical_accuracy
  revision: '1'
  kind: physical_validation
  statement: The adopted complete gas model has quantified thermochemical uncertainty and validated physical
    atmospheric abundance accuracy.
  scope: The curated-tio-v1 gas model on 1500-4000 K at standard pressure 1 bar; 48Ti16O internal levels with
    elemental NASA mass and neutral-atom references; 537 ion-inclusive or 421 neutral species. No physical
    atmosphere validation.
evidence:
- id: scientific_sources
  kind: theory
  summary: 'Adopt the fully specified TOTO/Jain candidate as a conditional source preference: modern states
    replace the identified JANAF singlet assumption and the measured ground energy has a smaller quoted uncertainty.
    The 0.045 eV energy shift lies within the legacy +/-0.061 eV uncertainty and does not disprove the old
    value.'
