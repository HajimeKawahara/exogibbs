schema_version: '0.2'
model:
  id: exogibbs.ch4_source_review.v1
  name: Methane energy and thermal-source investigation
  description: Review methane energy, thermal functions, versioned partition sums and the existing carbon footprint;
    retain production coefficients provisionally.
  implementation: &id001
    repository: https://github.com/HajimeKawahara/exogibbs
    revision: sha256:ca4e8b3899d428425700d5e6447e8546ac23654d7fcd8e4c5ee9d001051c511c
    entry_points:
    - mceg/reviews/ch4_source_review.py
assumptions:
- statement: A balanced neutral-atom reaction is needed to compare source ground energies; molecular formation enthalpies
    alone are insufficient.
  evidence:
  - literature_review
  - source_replay
- statement: Spectroscopic CH4 partition sums include proton spin; Q/16 is compared with nuclear-spin-free thermochemistry
    while isotope conventions remain explicit.
  evidence:
  - literature_review
  - source_replay
domains:
- kind: numerical_evaluation
  status: documented
  description: Frozen methane source properties and partition comparisons, plus a previously solved gas-only grid.
  conditions:
  - Source properties at 300, 500, 1000, 1500, 2000, 3000, 4000 and 6000 K; production comparison only at 1500-4000
    K.
  - Partition comparisons at 300, 500, 1000, 1500, 2000, 2500, 3000 and 4000 K. TIPS stops at 2500 K; MM completeness
    is estimated only through 2000 K.
  - 'Reused 75-case, 537-species current-curated ion-inclusive grid: 1500, 2000, 2500, 3000, 4000 K; 1e-6, 1e-4,
    0.01, 1, 100 bar; reference C/O, 1, 1.5.'
  evidence:
  - source_replay
- kind: scientific_applicability
  status: unknown
  description: No reconciled complete thermal model or physical atmospheric validation through 4000 K.
  conditions: []
  evidence:
  - literature_review
claims:
- id: source_attribution
  revision: '1'
  kind: numerical_verification
  statement: Over the curated 1500-4000 K domain, the frozen methane difference is primarily thermal and survives
    a balanced reaction-energy alignment.
  scope: Neutral ideal-gas CH4, C(g) + 4 H(g) -> CH4(g), standard pressure 1 bar; frozen source comparison and archived
    footprint only.
- id: partition_comparison
  revision: '1'
  kind: numerical_verification
  statement: Spin-normalized partition comparisons preserve source-version differences and incomplete temperature
    coverage without extrapolating missing TIPS data.
  scope: Neutral ideal-gas CH4, C(g) + 4 H(g) -> CH4(g), standard pressure 1 bar; frozen source comparison and archived
    footprint only.
- id: complete_thermal_accuracy
  revision: '1'
  kind: physical_validation
  statement: A complete methane thermal model has quantified physical accuracy over 1500-4000 K.
  scope: Neutral ideal-gas CH4, C(g) + 4 H(g) -> CH4(g), standard pressure 1 bar; frozen source comparison and archived
    footprint only.
- id: atmospheric_accuracy
  revision: '1'
  kind: physical_validation
  statement: The methane source choice accurately predicts physical atmospheric abundances.
  scope: Neutral ideal-gas CH4, C(g) + 4 H(g) -> CH4(g), standard pressure 1 bar; frozen source comparison and archived
    footprint only.
evidence:
- id: literature_review
  kind: literature
  summary: Identify methane, printed JANAF and NASA/ATcT ancestry, nuclear-spin conventions, modern partition coverage
