contexts:
- id: source_comparison
  scope: Neutral ideal-gas CH4, C(g) + 4 H(g) -> CH4(g), standard pressure 1 bar; frozen source comparison and archived
    footprint only.
  settings:
    reaction: C(g) + 4 H(g) -> CH4(g)
    standard_pressure_bar: 1
    gas_constant_J_mol_K: 8.31446261815324
    NASA_header_gas_constant_J_mol_K: 8.31451
    spectroscopic_isotopologue: 12CH4
    nuclear_spin_product_removed: 16
    production_baseline: curated-c2h-v1; existing methane record unchanged
    equilibrium_substitution: not_run; archived footprint replay only
    elemental_budget: Existing Asplund 2021 grid with C/H varied for C/O; no new budgets or solves
assessments:
- id: source_attribution_review
  kind: evidence_support
  claim: source_attribution
  claim_revision: '1'
  subject: ch4_sources_20261102
  context: source_comparison
  method:
    id: review_ch4_source_and_partition_evidence
    revision: '1'
    description: Separate numerical source replay and version attribution from physical thermal and atmospheric
      accuracy.
  evidence:
  - literature_review
  - source_replay
  reasons:
  - Energy corrections are hundreds of J/mol, while thermal disagreement grows with temperature; the official printed
    table and frozen source comparisons are distinguished from physical validation.
  status: supported
  origin: reviewed
- id: partition_comparison_review
  kind: evidence_support
  claim: partition_comparison
  claim_revision: '1'
  subject: ch4_sources_20261102
  context: source_comparison
  method:
    id: review_ch4_source_and_partition_evidence
    revision: '1'
    description: Separate numerical source replay and version attribution from physical thermal and atmospheric
      accuracy.
  evidence:
  - literature_review
  - source_replay
  reasons:
  - Nuclear-spin normalization, source masses, documented MM completeness and absent TIPS values are explicit; TIPS2025/2021
    changes are numerically reproduced without assigning an unverified cause.
  status: supported
  origin: reviewed
- id: complete_thermal_accuracy_review
  kind: evidence_support
  claim: complete_thermal_accuracy
  claim_revision: '1'
  subject: ch4_sources_20261102
  context: source_comparison
  method:
    id: review_ch4_source_and_partition_evidence
    revision: '1'
    description: Separate numerical source replay and version attribution from physical thermal and atmospheric
      accuracy.
  evidence:
  - literature_review
  - source_replay
  reasons:
  - MM completeness is estimated only through 2000 K, TIPS tables end at 2500 K, and the historical 3000 K extrapolation
    was challenged by later work. A complete 1500-4000 K replacement remains unselected.
  status: unknown
  origin: reviewed
- id: atmospheric_accuracy_review
  kind: evidence_support
  claim: atmospheric_accuracy
  claim_revision: '1'
  subject: ch4_sources_20261102
  context: source_comparison
  method:
    id: review_ch4_source_and_partition_evidence
    revision: '1'
    description: Separate numerical source replay and version attribution from physical thermal and atmospheric
      accuracy.
  evidence:
  - literature_review
  - source_replay
  reasons:
  - No physical abundance observations or benchmark are evaluated; an archived conserved carbon share is not atmospheric
    validation.
  status: unknown
  origin: reviewed
follow_ups:
- id: resolve_partition_versions_and_high_energy_states
  target_kind: claim
  target: complete_thermal_accuracy
  revision: '1'
  action: Reconcile versioned methane partition calculations and complete high-energy caloric coverage before adopting
    a thermal replacement.
  requires:
  - TIPS2021/2025 methane generators and original datasets
  - Nikitin 2015 full numerical treatment and 2017 corrected coefficients
  - Bound-state coverage and first/second energy moments through 4000 K with common spin/isotope conventions
  completion: Document justified continuous G/H/S/Cp and uncertainty, then evaluate finite equilibrium substitutions
    under a new model identity.
- id: physical_atmosphere_benchmark
  target_kind: claim
  target: atmospheric_accuracy
  revision: '1'
  action: Evaluate an adopted model against an appropriate independent physical benchmark.
  requires:
  - Justified thermochemical candidate
  - Defined atmosphere, observable and physical reference
  completion: Assess physical accuracy separately from solver or source-table agreement.
limitations:
- statement: Neither raw NASA nor MM/TIPS is adopted; retaining the current implementation does not establish JANAF
    superiority.
  evidence:
  - literature_review
  - source_replay
- statement: Effective Q compares natural-mass thermochemical sources with 12CH4, not a full isotope-resolved mixture.
    MM numerical rows beyond its completeness estimate are diagnostics.
  evidence:
  - literature_review
  - source_replay
- statement: TIPS2021/2025 methane differences are reproduced but their cause is unresolved; no data error or improvement
    is asserted.
  evidence:
  - literature_review
  - source_replay
- statement: The reused carbon footprint is not a new source-sensitivity calculation or physical observation; no
    condensation, nonideality, quenching or spectral validation is performed.
  evidence:
  - source_replay
