  reasons:
  - Finite ideal-gas abundance footprint is a prioritization measure, not an observation. No candidate substitution
    or atmospheric validation is performed.
  status: unknown
  origin: reviewed
follow_ups:
- id: recover_original_identity_and_thermal_model
  target_kind: claim
  target: complete_replacement_accuracy
  revision: '1'
  action: Recover Tsuji 1964 molecular/state inputs and reconcile modern linear and cyclic thermal models.
  requires:
  - Original C3H geometry, multiplicity and energy definitions
  - Vibronic state coverage, partition normalization and shared energy covariance
  - A named justified candidate and fixed-network substitution test
  completion: Document a physically supported candidate and domain before production adoption.
limitations:
- statement: Current versus Burcat caloric differences are conditional model discrepancies, not physical uncertainty
    intervals.
  evidence:
  - literature
  - source_replay
- statement: No production replacement, new equilibrium solve, condensation, nonideality, quenching or spectral
    validation is performed.
  evidence:
  - source_replay
