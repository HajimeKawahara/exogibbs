assumptions:
- statement: The neutral C3H formula alone does not identify its isomer or state sum.
  evidence:
  - literature
- statement: The caloric comparison uses the same NASA atomic functions; Burcat ideal-gas H/Cp are compared without
    asserting an unchecked pressure convention for S/G/K.
  evidence:
  - source_replay
domains:
- kind: numerical_evaluation
  status: documented
  description: Five 1500-4000 K source nodes and existing 75-case 537-species gas grid.
  conditions:
  - 'Source nodes: 1500, 2000, 2500, 3000, 4000 K.'
  - 'Grid: T = 1500, 2000, 2500, 3000, 4000 K; P = 1e-6, 1e-4, 0.01, 1, 100 bar; C/O = 0.5888436553555908, 1, 1.5.'
  evidence:
  - source_replay
- kind: scientific_applicability
  status: unknown
  description: Complete high-temperature species definition and atmospheric accuracy are not established.
  conditions: []
  evidence:
  - literature
claims:
- id: source_and_footprint
  revision: '1'
  kind: numerical_verification
  statement: The unchanged C3H polynomial approximately reproduces the correctly converted Tsuji 1973 table, has
    a large conditional caloric disagreement with Burcat 2005, and carries up to 11.6431 percent of carbon in the
    archived 75-case grid.
  scope: Neutral C3H source attribution and conditional linear-candidate caloric comparison at 1500-4000 K; archived
    75-case carbon footprint; no adoption.
- id: conditional_energy_preference
  revision: '1'
  kind: theoretical
  statement: For explicitly identified linear CCCH, the evaluated ATcT 1.172 molecular/atomic energy is a preferred
    anchor for a future thermal model; historical identity and high-temperature state completeness still require
    review.
  scope: Neutral C3H source attribution and conditional linear-candidate caloric comparison at 1500-4000 K; archived
    75-case carbon footprint; no adoption.
- id: complete_replacement_accuracy
  revision: '1'
  kind: physical_validation
  statement: A complete replacement for the inherited C3H species has quantified physical accuracy over 1500-4000
    K.
  scope: Neutral C3H source attribution and conditional linear-candidate caloric comparison at 1500-4000 K; archived
    75-case carbon footprint; no adoption.
- id: atmospheric_accuracy
  revision: '1'
  kind: physical_validation
  statement: The retained or a candidate C3H representation predicts accurate atmospheric abundances.
  scope: Neutral C3H source attribution and conditional linear-candidate caloric comparison at 1500-4000 K; archived
    75-case carbon footprint; no adoption.
