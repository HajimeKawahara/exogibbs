assessments:
- id: source_and_footprint_review
  kind: evidence_support
  claim: source_and_footprint
  claim_revision: '1'
  subject: c3h_sources_20261102
  context: source_review
  method:
    id: review_c3h_identity_and_thermal_sources
    revision: '1'
    description: Separate approximate source replay, conditional reference reasoning and finite grid importance
      from physical validation.
  evidence:
  - literature
  - source_replay
  reasons:
  - The printed dissociation pressure convention and five numerical nodes are audited. Maximum residual 0.023871
    ln K is approximate fit agreement, larger than displayed coefficient rounding. Carbon share is derived from
    an existing converged grid, without a new solve.
  status: supported
  origin: reviewed
- id: conditional_energy_preference_review
  kind: evidence_support
  claim: conditional_energy_preference
  claim_revision: '1'
  subject: c3h_sources_20261102
  context: source_review
  method:
    id: review_c3h_identity_and_thermal_sources
    revision: '1'
    description: Separate approximate source replay, conditional reference reasoning and finite grid importance
      from physical validation.
  evidence:
  - literature
  - reference_reasoning
  - source_replay
  reasons:
  - ATcT explicitly separates linear/cyclic species and evaluates experimental/theoretical constraints with correlated
    atomic references. Its energy does not determine the hot thermal function or prove the identity of the 1973
    entry.
  status: supported
  origin: reviewed
- id: complete_replacement_accuracy_review
  kind: evidence_support
  claim: complete_replacement_accuracy
  claim_revision: '1'
  subject: c3h_sources_20261102
  context: source_review
  method:
    id: review_c3h_identity_and_thermal_sources
    revision: '1'
    description: Separate approximate source replay, conditional reference reasoning and finite grid importance
      from physical validation.
  evidence:
  - literature
  - source_replay
  reasons:
  - Original Tsuji 1964 structure/state inputs and complete vibronic thermodynamics remain unresolved. Burcat is
    a conditional caloric candidate and CDMS supplies only a partial low-temperature state catalog.
  status: unknown
  origin: reviewed
- id: atmospheric_accuracy_review
  kind: evidence_support
  claim: atmospheric_accuracy
  claim_revision: '1'
  subject: c3h_sources_20261102
