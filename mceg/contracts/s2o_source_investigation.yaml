contexts:
- id: source_nodes
  scope: SSO gas-atom formation constants and molecular source diagnostics.
  settings:
    standard_pressure_bar: 1
    temperatures_K: 500, 1000, 1500, 3000
    reaction: 2 S(g) + O(g) -> SSO(g)
    baseline: gas_source_comparison/baseline-001
    network: No abundance network solved; baseline curated values refer to 421 neutral species
    atomic_reference_policy: Native JANAF/NASA for source ratios; fixed JANAF atoms only for the explicitly
      labelled Lodders diagnostic
    equilibrium_impact: not_run
assessments:
- id: source_diagnosis_review
  kind: evidence_support
  claim: source_diagnosis
  claim_revision: '1'
  subject: s2o_20261102
  context: source_nodes
  method: &id002
    id: s2o_source_review
    revision: '2'
    description: Inspect identity, source genealogy and numerical decomposition separately from complete physical
      support.
  evidence:
  - source_inspection
  - offline_execution
  reasons:
  - Official downloads reproduce the frozen entries and Lodders explicitly documents the erroneous columns.
    This does not prove the historical arithmetic mechanism.
  status: supported
  origin: reviewed
- id: numerical_replay_review
  kind: evidence_support
  claim: numerical_replay
  claim_revision: '2'
  subject: s2o_20261102
  context: source_nodes
  method: *id002
  evidence:
  - offline_execution
  reasons:
  - Archived comparison is regenerated with verified input hashes; the source-data and implementation scopes
    remain explicit.
  status: supported
  origin: reviewed
- id: physical_accuracy_review
  kind: evidence_support
  claim: physical_accuracy
  claim_revision: '1'
  subject: s2o_20261102
  context: source_nodes
  method: *id002
  evidence:
  - source_inspection
  - offline_execution
  reasons:
  - Primary threshold papers are inspected, but thermal-model completeness, the experimental internal-energy
    assumption, modern correlated atomic references and physical applicability remain incomplete; no fixed-network
    substitution has been run.
  status: unknown
  origin: reviewed
follow_ups:
- id: complete_energy_and_thermal_review
  target_kind: claim
  target: physical_accuracy
  revision: '1'
  action: Inspect the remaining thermal/theoretical sources and reconcile the balanced ATcT energy with its
    correlated atomic anchors; retain the verified primary-cycle reduction as scoped evidence.
  requires:
  - Original Gurvich thermal inventory and remaining Karton/theoretical source passages
  - Uncertainty definitions and covariance; assess the 1977 internal-energy assumption and preserve its abstract/body
    error bars
  - Thermal and electronic-state model details and original FastChem fitting inputs, or an explicitly defined
    independent thermal candidate
  completion: Add a scoped candidate-energy and thermal assessment; do not promote mixed-network physical accuracy
    from a single-source review.
- id: quantify_application_impact
  target_kind: claim
  target: physical_accuracy
  revision: '1'
  action: Run a scoped one-species SSO energy/thermal diagnostic with explicit assumptions; assess the exact
    justified candidate separately before adoption.
  requires:
  - Fixed 537-species ion-inclusive network and T/P/elemental budget
  - Element and charge conservation and mass-action residuals
  - Absolute abundances and sulfur/oxygen allocation
  completion: Archive a separate context and execution receipt for finite replacements; retain failed or unrun
    points explicitly.
limitations:
- statement: A publication error and reproducible database differences do not establish the accuracy of the
    retained fit, a new ATcT thermal model, or atmosphere-wide physical accuracy.
  evidence:
  - source_inspection
  - offline_execution
- statement: Full downloaded publications remain unarchived; their hashes document inspected bytes. Only selected
    tables, transcribed facts and the NASA record are needed for offline replay.
  evidence:
  - source_inspection
