schema_version: '0.2'
model:
  id: exogibbs.s2o_source_investigation.v1
  name: SSO identity, JANAF column error and source investigation
  description: Scoped L0-L3 source diagnosis with no production adoption; retain current fit pending energy and
    application review.
  implementation: &id001
    repository: https://github.com/HajimeKawahara/exogibbs
    revision: sha256:20d0807e7254b2827e2e3e4e51b1012527327de407298507296ca3fa2f9a46b0
    entry_points:
    - mceg/reviews/s2o_source_investigation.py
assumptions:
- statement: Formation K uses 2 neutral gas S atoms plus one neutral gas O atom at 1 bar; elemental formation quantities
    are converted consistently.
  evidence:
  - source_inspection
  - offline_execution
domains:
- kind: numerical_evaluation
  status: documented
  description: Discrete source comparisons, not validated atmospheric conditions.
  conditions:
  - 500, 1000, 1500 and 3000 K; no pressure/composition equilibrium network executed.
  - Curated values below 1500 K remain missing; reference tables are not extrapolated.
  evidence:
  - offline_execution
- kind: scientific_applicability
  status: unknown
  description: High-temperature thermal functions and atmospheric abundance accuracy remain unestablished.
  conditions: []
  evidence:
  - source_inspection
claims:
- id: source_diagnosis
  revision: '1'
  kind: numerical_verification
  statement: The SSO formation-column disagreement is present in official JANAF and is identified as an error by
    Lodders 2004; it is distinct from disagreement between molecular energy evaluations.
  scope: SSO identity and four sampled nodes, not an explanation of the original arithmetic mechanism or all source
    ancestry.
- id: numerical_replay
  revision: '1'
  kind: numerical_verification
  statement: The archived source comparison, matched official records and molecular energy/thermal decomposition
    reproduce offline.
  scope: Four exact nodes, archived data and script hashes; curated K values reused from baseline-001, no new equilibrium
    solve.
- id: physical_accuracy
  revision: '1'
  kind: physical_validation
  statement: The selected thermochemistry quantitatively describes SSO and its atmospheric abundance in the intended
    applications.
  scope: Requires original-source and uncertainty review, thermal-state verification and fixed-network application
    tests.
evidence:
- id: source_inspection
  kind: literature
  summary: Official JANAF p1727, NASA Appendix D p184, Lodders sections 2.2.1-2.2.2 and Tables 4-5, and ATcT 1.172
    SSO identity and provenance were inspected.
  sources:
  - tests/data/validation/s2o_source_investigation/20261102/sources.json
  - documents/mceg/s2o_source_investigation.rst
  scope: Underlying Gurvich, Berkowitz, Norwood and Karton original accounts remain incompletely inspected; NASA
    and Lodders share thermal ancestry and ATcT shares experimental constraints. No adoption change.
  subject: s2o_20261102
  context: source_nodes
  artifacts:
  - source: tests/data/validation/s2o_source_investigation/20261102/sources.json
    sha256: 14dd339624b00ab95a205578ebd43c801e016796a9a1fb204b5becf037c1283d
  - source: documents/mceg/s2o_source_investigation.rst
    sha256: a30ccade25034168fe02ef1fe0d8170a173406484443c96e06da78da3f1b79c0
  provenance:
    role: primary
    location: documents/mceg/s2o_source_investigation.rst
    inspection: inspected
    note: Underlying Gurvich, Berkowitz, Norwood and Karton original accounts remain incompletely inspected; NASA
      and Lodders share thermal ancestry and ATcT shares experimental constraints. No adoption change.
- id: offline_execution
  kind: numerical_test
  summary: Three fresh JANAF records, eighteen printed NASA coefficients and four temperature samples reproduce;
    the 1500 K raw-column residual is 4.468655846141134 dex.
  sources:
  - tests/data/validation/s2o_source_investigation/20261102/comparison.json
  - tests/data/validation/s2o_source_investigation/20261102/receipt.json
  scope: Source comparison only. The ATcT atomization value 851.124 kJ/mol uses rounded correlated inputs; it has
    no derived independent uncertainty. Abundance effects not run.
  subject: s2o_20261102
  context: source_nodes
  artifacts:
  - source: tests/data/validation/s2o_source_investigation/20261102/comparison.json
    sha256: 3eba12fb95abd4bd86ae01e33f6545d4ef644f097471c24a9fc498e5f5600c1c
  - source: tests/data/validation/s2o_source_investigation/20261102/receipt.json
    sha256: 37060536b71c5e00d5343019bd9a1442bdbd781b53b044d265af633a223924d1
  provenance:
    role: primary
    location: documents/mceg/s2o_source_investigation.rst
    inspection: inspected
    note: Source comparison only. The ATcT atomization value 851.124 kJ/mol uses rounded correlated inputs; it has
      no derived independent uncertainty. Abundance effects not run.
  result: passed
