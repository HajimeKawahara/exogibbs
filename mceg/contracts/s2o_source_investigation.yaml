schema_version: '0.2'
model:
  id: exogibbs.s2o_source_investigation.v1
  name: SSO identity, JANAF column error and source investigation
  description: Scoped L0-L3 source diagnosis with no production adoption; retain current fit pending energy
    and application review.
  implementation: &id001
    repository: https://github.com/HajimeKawahara/exogibbs
    revision: sha256:36eebd8d12f16707c31aceebefe630c8c58f177ec2b8105af0743b83903bec7f
    entry_points:
    - mceg/reviews/s2o_source_investigation.py
assumptions:
- statement: Formation K uses 2 neutral gas S atoms plus one neutral gas O atom at 1 bar; elemental formation
    quantities are converted consistently.
  evidence:
  - source_inspection
  - offline_execution
domains:
- kind: numerical_evaluation
  status: documented
  description: Discrete source comparisons, not validated atmospheric conditions.
  conditions:
  - 500, 1000, 1500 and 3000 K; no pressure/composition equilibrium network executed.
  - Curated values below 1500 K remain missing; reference tables are not extrapolated.
  evidence:
  - offline_execution
- kind: scientific_applicability
  status: unknown
  description: High-temperature thermal functions and atmospheric abundance accuracy remain unestablished.
  conditions: []
  evidence:
  - source_inspection
claims:
- id: source_diagnosis
  revision: '1'
  kind: numerical_verification
  statement: The SSO formation-column disagreement is present in official JANAF and is identified as an error
    by Lodders 2004; it is distinct from disagreement between molecular energy evaluations.
  scope: SSO identity and four sampled nodes, not an explanation of the original arithmetic mechanism or all
    source ancestry.
- id: numerical_replay
  revision: '2'
  kind: numerical_verification
  statement: The archived source comparison, matched official records, molecular energy/thermal decomposition
    and reported primary fragment-threshold cycle reproduce offline.
  scope: Four exact source nodes and the printed experimental reduction; no new equilibrium solve, thermal-assumption
    validation or energy adoption.
- id: physical_accuracy
  revision: '1'
  kind: physical_validation
  statement: The selected thermochemistry quantitatively describes SSO and its atmospheric abundance in the
    intended applications.
  scope: Requires original-source and uncertainty review, thermal-state verification and fixed-network application
    tests.
evidence:
- id: source_inspection
  kind: literature
  summary: Official source tables, Lodders 2004, ATcT 1.172, and supplied full Berkowitz 1977 and Norwood 1989
    papers were inspected; threshold passages and differing 1977 error bars were visually checked.
  sources:
  - tests/data/validation/s2o_source_investigation/20261102/sources.json
  - documents/mceg/s2o_source_investigation.rst
  scope: Primary fragment-cycle access gaps closed. Gurvich thermal inventory and remaining theoretical sources
    are incomplete; the compilations share experimental/thermal ancestry. No adoption change.
  subject: s2o_20261102
  context: source_nodes
  artifacts:
  - source: tests/data/validation/s2o_source_investigation/20261102/sources.json
    sha256: d62ec24a5fd3e0ba77571ee3746e80ff892e7e2e77ea5f135b59898c36f838e5
  - source: documents/mceg/s2o_source_investigation.rst
    sha256: 09e3d95e24f840e12eeaf41cd70c1f3ab896f415a4a07e0b08a9bd5f4c6e01d0
  provenance:
    role: primary
    location: documents/mceg/s2o_source_investigation.rst
    inspection: inspected
    note: Primary fragment-cycle access gaps closed. Gurvich thermal inventory and remaining theoretical sources
      are incomplete; the compilations share experimental/thermal ancestry. No adoption change.
- id: offline_execution
  kind: numerical_test
  summary: Official source comparison replays; wavelength plus reported thermal correction reproduces 13.745
    eV to printed rounding, and the updated SO adiabatic subtraction gives 3.451 eV for SSO -> S + SO.
  sources:
  - tests/data/validation/s2o_source_investigation/20261102/comparison.json
  - tests/data/validation/s2o_source_investigation/20261102/receipt.json
  scope: Fragment energy is not atomization. The thermal correction is applied once; original error bars and
    correlated atomic anchors are not combined into a new uncertainty. Abundance effects not run.
  subject: s2o_20261102
  context: source_nodes
  artifacts:
  - source: tests/data/validation/s2o_source_investigation/20261102/comparison.json
    sha256: 8c1b94fb7e5ac67cba990b378fe6a7c71df30442796cf7cd7ca95e1a95d17da2
  - source: tests/data/validation/s2o_source_investigation/20261102/receipt.json
    sha256: facb949a35429997cc39b1df5b838da3ece6d341f98dd3b41f08b2d7e3787450
  provenance:
    role: primary
    location: documents/mceg/s2o_source_investigation.rst
    inspection: inspected
    note: Fragment energy is not atomization. The thermal correction is applied once; original error bars and
      correlated atomic anchors are not combined into a new uncertainty. Abundance effects not run.
  result: passed
