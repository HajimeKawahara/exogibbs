contexts:
- id: nasa9_cold_grid
  scope: The explicit seven-element NASA9 gas conditions, catalog and source interventions, with source-bounded phase insertion at those same states.
  settings:
    temperature_samples_K: '200, 300, 400, 500, 600, 800, 1000, 1500'
    pressure_samples_bar: '1e-6, 0.001, 1'
    selected_heavy_element_multipliers: '1, 100'
    energy_probe_pressure_bar: 0.001
    standard_pressure_bar: 1.0
    sampled_gas_states: 448
    gas_condensation: false
- id: native_seven_element_grid
  scope: Matched native GGChem gas-only and equilibrium-condensation profiles, plus independent ExoGibbs condensation solves with directly exported native thermochemistry and retained elemental inventory.
  settings:
    temperature_lower_K: 200.0
    temperature_upper_K: 3000.0
    samples_per_profile: 31
    pressure_bar: 0.001
    elements: 'H He C N O P S'
    metallicity: 1.0
    rainout: false
assessments:
- id: cold_validation_numerical_review
  kind: evidence_support
  claim: cold_gas_numerical_closure
  claim_revision: '1'
  subject: cold_gas_validation_snapshot
  context: nasa9_cold_grid
  method: &method
    id: cold_network_source_and_execution_review
    revision: '1'
    description: Inspect input identities, explicit intervention scopes and primitive acceptance gates; keep source accuracy and complete phase coverage separate from numerical support.
  evidence: [gas_execution]
  reasons: [All 448 accepted states meet the unchanged conservation and trace mass-action gates.]
  status: supported
  origin: reviewed
- id: cold_validation_solver_review
  kind: evidence_support
  claim: cold_gas_solver_agreement
  claim_revision: '1'
  subject: cold_gas_validation_snapshot
  context: nasa9_cold_grid
  method: *method
  evidence: [matched_gas_execution]
  reasons:
  - All 448 states pass the declared 1e-8 log-constant and mass-action gates, 1e-5 log-abundance gate, 1e-8 elemental gate and 1e-12 total-pressure gate.
  - The maximum all-species absolute log mole-fraction difference is 4.159858235652791e-9, including trace gases; thermochemical function evaluation is independent.
  status: supported
  origin: reviewed
- id: cold_validation_catalog_review
  kind: evidence_support
  claim: finite_catalog_and_source_response
  claim_revision: '1'
  subject: cold_gas_validation_snapshot
  context: nasa9_cold_grid
  method: *method
  evidence: [gas_execution]
  reasons:
  - The 107-gas expansion changes a single P carrier by at most 4.8593e-5 of the P inventory, whereas the recorded H3PO4 and HOPO anchor alternatives cause much larger sampled changes.
  status: supported
  origin: reviewed
- id: cold_validation_phase_review
  kind: evidence_support
  claim: source_bounded_phase_insertion
  claim_revision: '1'
  subject: cold_phase_validation_snapshot
  context: nasa9_cold_grid
  method: *method
  evidence: [phase_execution]
  reasons:
  - Positive phosphorus-phase affinities occur in 18 of 48 baseline states in the source-bounded screen; an out-of-range phase is not treated as stable or absent, and positive affinity alone does not determine its final amount.
  status: supported
  origin: reviewed
- id: cold_validation_native_condensation_review
  kind: evidence_support
  claim: native_seven_element_condensation
  claim_revision: '1'
  subject: native_condensation_snapshot
  context: native_seven_element_grid
  method: *method
  evidence: [native_condensation_execution]
  reasons:
  - Both native seven-element profiles completed 31 sampled states and pass the recorded element gates; the condensed profile also passes the phase saturation gates; the incomplete 27-element profile is excluded.
  status: supported
  origin: reviewed
- id: cold_validation_physical_review
  kind: evidence_support
  claim: cold_network_physical_accuracy
  claim_revision: '1'
  subject: cold_gas_validation_snapshot
  context: nasa9_cold_grid
  method: *method
  evidence: [source_audit, gas_execution]
  reasons:
  - Independent gas energy anchors, source-specific physical validity, omitted phases and application-specific constraints remain unresolved despite numerical closure and finite-catalog convergence.
  - Supersaturation and native condensation show that gas-only abundances cannot in general be interpreted as the final cold equilibrium reservoir.
  status: unknown
  origin: reviewed
- id: cold_validation_condensate_solver_review
  kind: evidence_support
  claim: matched_gas_condensate_solver_agreement
  claim_revision: '1'
  subject: matched_condensation_snapshot
  context: native_seven_element_grid
  method: *method
  evidence: [matched_condensation_execution]
  reasons:
  - All 31 states pass unchanged gates on elemental residual, gas mass action, active and inactive phase affinities, nonnegative phase amounts and finite log gas amounts.
  - Maximum reconstructed all-gas log mole-fraction difference is 5.86124e-9; independently printed gas values agree within 2.36967e-9 above the declared trace floor, and condensate elemental allocation differs by at most 1.08808e-10.
  status: supported
  origin: reviewed
follow_ups:
- id: resolve_cold_gas_energy_anchors
  target_kind: claim
  target: cold_network_physical_accuracy
  revision: '1'
  action: Reconcile H3PO4, HOPO and HPO energy anchors against independently inspected experimental and computational evidence on a common reference basis.
  requires: [Original experimental or computational details, Common elemental references, Thermal functions and valid intervals, Source-specific uncertainty]
  completion: Record independently justified molecular choices and residual uncertainty without treating model sensitivity as a statistical error distribution.
- id: establish_complete_cold_phase_comparison
  target_kind: claim
  target: cold_network_physical_accuracy
  revision: '1'
  action: Complete an application-specific gas and condensed-phase comparison, including missing phosphates and relevant elemental backgrounds, before offering a production cold preset.
  requires: [Identity-matched phase records, Common gas and condensed thermochemistry, Completed solver comparisons, Declared atmospheric and rainout assumptions]
  completion: Establish numerical and physical support separately for the final declared network and domain, or retain explicit unknown applicability.
