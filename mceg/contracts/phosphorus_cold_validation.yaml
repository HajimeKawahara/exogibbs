schema_version: '0.2'
model:
  id: exogibbs.phosphorus_cold_validation.v1
  name: Cold phosphorus network, source sensitivity and phase checks
  description: Validate declared gas networks and pure-phase insertion calculations, compare independently executed solvers, and separate numerical support from physical source accuracy.
  implementation: &implementation
    repository: https://github.com/HajimeKawahara/exogibbs
    revision: sha256:356a39b39d41cb6320e78002f2a1130b4038fe867ab6eaa0a493f21f7e6449d3
    entry_points:
    - mceg/reviews/phosphorus_cold_validation_20261031.py
    - mceg/reviews/phosphorus_cold_ggchem_validation_20261031.py
    - mceg/reviews/phosphorus_cold_source_audit_20261031.py
    - mceg/reviews/phosphorus_cold_phases_20261031.py
    - mceg/reviews/phosphorus_native_phase_reference_20261031.py
    - mceg/reviews/phosphorus_native_phase_export_20261031.py
    - mceg/reviews/phosphorus_cold_condensate_comparison_20261031.py
assumptions:
- statement: The NASA9 gas comparisons preserve every shared species function, elemental abundance and reference convention; P4O6 remains fixed while each removal, candidate addition or energy offset is applied separately.
  evidence: [gas_execution, source_audit]
- statement: Energy-anchor interventions retain baseline entropy and heat capacity and are sensitivity scenarios, not complete alternate source functions or statistical uncertainty bounds.
  evidence: [gas_execution, source_audit]
- statement: Pure condensed phases have unit activity and negligible condensed-volume pressure corrections; positive ln saturation identifies an insertion descent direction but does not determine the final multiphase mixture.
  evidence: [phase_execution]
domains:
- kind: numerical_evaluation
  status: documented
  description: NASA9 gas networks and source-bounded pure-phase insertion on explicit pressure, temperature and composition samples.
  conditions:
  - The gas grid uses 200, 300, 400, 500, 600, 800, 1000 and 1500 K at 1e-6, 0.001 and 1 bar, with solar and 100-times selected heavy-element abundances relative to hydrogen.
  - Baseline and four species-removal models each use 48 states; ten energy probes each use 16 states at 0.001 bar; the 29-species expansion uses 48 states, totaling 448 gas states.
  - Every gas sample requires convergence, finite abundances, maximum relative elemental residual below 1e-5 and absolute log mass-action residual below 1e-8, including trace species.
  - Original NASA9 intervals are retained; the gas evaluator is restricted to the shared 200-1500 K interval and condensed-phase evaluations outside each record's intervals are absent rather than extrapolated.
  evidence: [gas_execution, phase_execution, source_audit]
- kind: numerical_evaluation
  status: documented
  description: A distinct native GGChem seven-element equilibrium-condensation comparison using Burcat-priority gas records and the native condensed catalog.
  conditions:
  - The native profile has 31 temperature samples from 200 to 3000 K at 0.001 bar with solar H/He/C/N/O/P/S abundances, 1156 gases and 22 retained condensed phases.
  - The matched ExoGibbs comparison independently solves those 31 gas-plus-condensate states from cold starts using directly exported native thermochemical functions.
  - The native gas-only and condensation profiles share the same gas thermochemical selection; native dispol fit intervals are not independently certified.
  - The interrupted 27-element trajectory is excluded from completed-profile support.
  evidence: [native_condensation_execution, matched_condensation_execution]
- kind: scientific_applicability
  status: unknown
  description: Exact low-temperature energy anchors, complete gas and phase coverage, and application-specific atmospheric accuracy remain unestablished.
  conditions: []
  evidence: [source_audit, gas_execution, phase_execution, native_condensation_execution]
claims:
- id: cold_gas_numerical_closure
  revision: '1'
  kind: numerical_verification
  statement: All 448 declared ExoGibbs gas states pass independent elemental-conservation and all-species mass-action gates.
  scope: The sampled 78-gas networks, isolated interventions and 107-gas expansion using pinned NASA9 functions; no continuous-domain or physical accuracy claim.
- id: cold_gas_solver_agreement
  revision: '1'
  kind: numerical_verification
  statement: Independently executed ExoGibbs and GGChem calculations agree for all declared matched NASA9 gas inputs, including trace species.
  scope: Identical gas identities, original functions, reference conventions, elemental budgets and sampled temperatures and pressures; source accuracy is not established by solver agreement.
- id: finite_catalog_and_source_response
  revision: '1'
  kind: numerical_verification
  statement: Adding 29 identity-reviewed candidate gases changes the largest sampled single-carrier P allocation by less than 0.00486 percentage points, while isolated energy-anchor alternatives materially change the cold phosphorus allocation.
  scope: Only the two pinned NASA9 source catalogs and declared H/He/C/N/O/P/S conditions; this is finite-catalog convergence, not completeness across all chemistry or phases.
- id: source_bounded_phase_insertion
  revision: '1'
  kind: numerical_verification
  statement: Source-bounded pure-phase insertion checks identify sampled gas equilibria with positive phosphorus-condensate saturation.
  scope: The 29 retained CEA pure-phase records, including six P phases, evaluated only inside their original intervals; positive affinity disproves gas-only stability for the selected functions but does not solve phase amounts.
- id: native_seven_element_condensation
  revision: '1'
  kind: numerical_verification
  statement: The completed native seven-element gas and equilibrium-condensation profiles demonstrate removal of phosphorus from the gas under the declared native source selection.
  scope: The 31-state native GGChem comparison; no extrapolation to the unfinished 27-element profile or independent physical validation of native fit intervals.
- id: cold_network_physical_accuracy
  revision: '1'
  kind: physical_validation
  statement: The selected thermochemical data and complete phase network quantitatively predict the phosphorus reservoir in the intended cold atmospheres.
  scope: Requires independently supported molecular and condensed-phase energies, adequate species coverage and atmospheric conditions; numerical closure and catalog convergence are insufficient.
- id: matched_gas_condensate_solver_agreement
  revision: '1'
  kind: numerical_verification
  statement: ExoGibbs and native GGChem agree on gas and condensed-phase equilibria at all 31 declared seven-element states using identical exported thermochemical functions.
  scope: Independent ExoGibbs cold starts with 1156 gases and 22 pure phases at the native temperature knots; shared function values are not independently evaluated or physically validated by this comparison.
evidence:
- id: source_audit
  kind: literature
  summary: Source inspection distinguishes H3PO4 and HOPO identities, computed and measured energy anchors, polynomial representation ranges, source alternatives and remaining phase or experimental gaps.
  sources:
  - documents/mceg/phosphorus_cold_validation.rst
  - mceg/reviews/phosphorus_cold_sources_20261031.json
  - mceg/reviews/phosphorus_cold_source_audit_20261031.py
  - https://doi.org/10.1063/1.1521760
  - https://doi.org/10.1063/1.466782
  - https://doi.org/10.1021/acs.jpca.5b07071
  scope: Inspected source statements and selected records; source intervals describe representations and original experimental or computational details are not all independently reconstructed.
  artifacts:
  - source: documents/mceg/phosphorus_cold_validation.rst
    sha256: 45814fd6e58be021ebb00a10771409f16c33092affcc0b05e02f9057d8fd7648
  - source: mceg/reviews/phosphorus_cold_sources_20261031.json
    sha256: f1f3885b01a35b0e286b28b35bf7865f5c10062ad293b97ab9916f80a6fc408a
  provenance:
    role: secondary
    location: The authored source record lists inspected source locations, direct versus indirect support and original source hashes.
    inspection: partial
    note: Alternative anchors and isotope or isomer identities are retained explicitly; a plausible gas record is not a complete low-temperature physical validation.
- id: gas_execution
  kind: benchmark
  result: passed
  summary: All 448 ExoGibbs states pass; candidate expansion, independent removals and energy probes retain shared background functions and export per-state primitive closure.
  sources:
  - mceg/reviews/phosphorus_cold_validation_20261031.py
  - tests/data/validation/phosphorus_cold_validation/gas_summary.json.gz
  scope: Provider-owned execution on the explicit sampled inputs; the coefficient-free receipt retains all P curves, numerical residuals, species identities and input hashes.
  subject: cold_gas_validation_snapshot
  context: nasa9_cold_grid
  artifacts:
  - source: tests/data/validation/phosphorus_cold_validation/gas_summary.json.gz
    sha256: 76a65c4cf6b3696e51302c97324d860b97317d9d850ea1b764292d0efe941d93
  provenance:
    role: primary
    location: Executed cold starts, self-seeded refinement, elemental residuals, trace-species mass action and controlled source or catalog differences.
    inspection: inspected
    note: The base and expanded networks contain 78 and 107 gases respectively; all original source functions and the fixed P4O6 choice are preserved except for explicitly labelled probes.
- id: matched_gas_execution
  kind: benchmark
  result: passed
  summary: All 448 matched GGChem states pass; independent NASA9 evaluation agrees within 9.10e-13 in ln K and every gas abundance agrees within 4.16e-9 in natural log mole fraction.
  sources:
  - mceg/reviews/phosphorus_cold_ggchem_validation_20261031.py
  - mceg/reviews/phosphorus_ggchem_reference.py
  - tests/data/validation/phosphorus_cold_validation/ggchem_comparison.json.gz
  scope: The new 448-state matched-input calculation uses a Fortran NASA9 adapter and pinned unmodified SMCHEM16; GGChem receives no ExoGibbs solution, seed or neighboring-temperature continuation.
  subject: cold_gas_validation_snapshot
  context: nasa9_cold_grid
  artifacts:
  - source: tests/data/validation/phosphorus_cold_validation/ggchem_comparison.json.gz
    sha256: 83e01a8cf935145933bac8e09f4d7ce7ea849f70b0e21700ce0e6b396c77446f
  provenance:
    role: primary
    location: New-grid independent function evaluations, all-species log abundances, elemental residuals, mass action and total pressure closure.
    inspection: inspected
    note: Shared molecular source records can share physical errors; independent evaluators and solvers establish numerical consistency only.
- id: phase_execution
  kind: benchmark
  result: passed
  summary: Pure-phase affinities use reconstructed absolute elemental chemical potentials, original NASA9 condensed functions and explicit valid-range masks.
  sources:
  - mceg/reviews/phosphorus_cold_phases_20261031.py
  - tests/data/validation/phosphorus_cold_validation/phase_summary.json.gz
  scope: Conditional insertion into accepted gas solutions; all unavailable phase/temperature evaluations remain null, and shifted gas scenarios retain the unchanged condensed functions explicitly.
  subject: cold_phase_validation_snapshot
  context: nasa9_cold_grid
  artifacts:
  - source: tests/data/validation/phosphorus_cold_validation/phase_summary.json.gz
    sha256: 34e3ad95b902538cae265a17f837a0568647fe8f0b750ef30a4024ee31556d45
  provenance:
    role: primary
    location: Source-bounded phase evaluation, independent reconstruction of elemental potentials and positive saturation checks.
    inspection: inspected
    note: This is a phase-stability screen, not a multiphase equilibrium solver or validation of all missing condensed phases.
- id: native_condensation_execution
  kind: benchmark
  result: passed
  summary: A completed native seven-element GGChem profile compares gas-only and equilibrium-condensation conditions with the same 1156 gas records and 22 candidate condensed phases.
  sources:
  - tests/data/validation/phosphorus_cold_validation/native7_phase_receipt.json
  - https://github.com/pw31/GGchem/tree/65bbb8f9ca3d6c0b4e58cb7dd3862322452d0d4b
  scope: Native GGChem execution only; source fit bounds are not certified, and the interrupted 27-element run is excluded from completed-profile evidence.
  subject: native_condensation_snapshot
  context: native_seven_element_grid
  artifacts:
  - source: tests/data/validation/phosphorus_cold_validation/native7_phase_receipt.json
    sha256: f4db7f591bfa2b46a5d714de6e486702c0f47af79a383d8b2463637e9320d5b4
  provenance:
    role: primary
    location: Matched native gas records, gas-only and condensation outputs, total element accounting and phase saturation checks.
    inspection: inspected
    note: The independently executed matched ExoGibbs calculation has separate evidence and is not inferred from this native run.
- id: matched_condensation_execution
  kind: benchmark
  result: passed
  summary: All 31 independent ExoGibbs gas-plus-condensate states pass conservation, log mass action, active and inactive phase-affinity gates and matched native abundance comparisons.
  sources:
  - mceg/reviews/phosphorus_cold_condensate_comparison_20261031.py
  - mceg/reviews/phosphorus_native_phase_export_20261031.py
  - tests/data/validation/phosphorus_cold_validation/condensate_comparison.json.gz
  - tests/data/validation/phosphorus_cold_validation/direct_phase_function_receipt.json
  scope: Native gas and phase functions are exported directly at the sampled temperatures, including native melting and NH4SH formula-unit conventions; native equilibria are used for scoring only, not ExoGibbs initialization.
  subject: matched_condensation_snapshot
  context: native_seven_element_grid
  artifacts:
  - source: tests/data/validation/phosphorus_cold_validation/condensate_comparison.json.gz
    sha256: 6a9401fcfc0a5e8cd633ed933089636ec6877faa1ec4a21b5180d53eb552cf9d
  - source: tests/data/validation/phosphorus_cold_validation/direct_phase_function_receipt.json
    sha256: cb5c895180739ecc31df3114d8dce7842b141f4804a759abbbf056f570a963e3
  provenance:
    role: primary
    location: ExoGibbs independent cold solves, full trace-element accounting, gas log mass action, phase affinities, and native gas and condensate comparisons.
    inspection: inspected
    note: Native printed trace densities are floored. Full reference log mole fractions are reconstructed from native atomic partial pressures and the shared gas constants; independently printed values are also compared above log mole fraction -600. Shared thermochemical evaluation is not independently validated.
limitations:
- statement: The 29-gas expansion exhausts the reviewed candidates in two pinned catalogs for these elements, not all possible molecules or background species; P4S3 and gases absent from those catalogs are not covered by this convergence test.
  evidence: [source_audit, gas_execution]
- statement: H3PO4 and HOPO energy differences materially affect abundances; anchor-only probes keep thermal functions fixed and do not supply complete alternative thermochemistry or calibrated error bars.
  evidence: [source_audit, gas_execution]
- statement: Source-bounded phase insertion cannot establish final condensate amounts, complete phase competition or a rainout profile; native condensation is equilibrium with retained total elemental inventory.
  evidence: [phase_execution, native_condensation_execution]
- statement: Native GGChem fit intervals are not retained in dispol files, and the 27-element condensation trajectory did not complete the low-temperature range.
  evidence: [native_condensation_execution]
- statement: No production curated dataset, default choice or 1500-4000 K evaluation domain is changed by this research validation.
  evidence: [source_audit, gas_execution]
