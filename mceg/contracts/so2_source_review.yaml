assessments:
- id: source_construction_review
  kind: evidence_support
  claim: source_construction
  claim_revision: '1'
  subject: so2_sources_20261104
  context: source_review
  method: &id003
    id: review_so2_energy_completeness_and_scope
    revision: '1'
    description: Separate source construction, normalized completeness diagnostics, scoped retention and
      unestablished physical accuracy.
  evidence:
  - literature
  - source_replay
  - retention_reasoning
  reasons:
  - ATcT balanced D0 is 1064718 J/mol versus NASA 1062769.902. The native-R-aware shift is 235.030751838
    K; curated/NASA K is 1.169629659 at 1500 K and 1.060518233 at 4000 K. The S five-level sum agrees
    with NASA within 0.008%; archived SO2 potentials reproduce exactly.
  status: supported
  origin: reviewed
- id: normalized_diagnostics_review
  kind: evidence_support
  claim: normalized_diagnostics
  claim_revision: '1'
  subject: so2_sources_20261104
  context: source_review
  method: *id003
  evidence:
  - literature
  - source_replay
  - retention_reasoning
  reasons:
  - 'The current file contains 3270270 states, Emax 14999.996460 cm-1, Jmax 165 and all g=2J+1. Metadata
    count 3270271/max 8000 are preserved. At 4000 K the highest 1000 cm-1 shell contributes 5.8601% of
    Q; full Cp is 33.416 versus NASA 60.144. TIPS2025 differs from 2021 by at most 2.02 ppm. Its derivative-window
    sensitivity is below 0.047 J/mol/K (2021: 0.052).'
  status: supported
  origin: reviewed
- id: scoped_retention_review
  kind: evidence_support
  claim: scoped_retention
  claim_revision: '1'
  subject: so2_sources_20261104
  context: source_review
  method: *id003
  evidence:
  - literature
  - source_replay
  - retention_reasoning
  reasons:
  - ExoAmes Q/NASA is 1.003256 and 0.999126 at 1500/2000 K, while Cp differs by -0.328/-3.454 J/mol/K.
    The high-T state deficit is not a NASA error estimate. TIPS2025 Q/NASA at 4000 K is 0.961466, from
    a harmonic product rather than demonstrated complete anharmonic physics. The JANAF/NASA thermal residual
    remains explicit.
  status: supported
  origin: reviewed
- id: physical_accuracy_review
  kind: evidence_support
  claim: physical_accuracy
  claim_revision: '1'
  subject: so2_sources_20261104
  context: source_review
  method: *id003
  evidence:
  - literature
  - source_replay
  - retention_reasoning
  reasons:
  - Complete high-T states, energy covariance, isotope mixtures, omitted electronic-state bounds and targeted
    atmospheric substitutions are absent. The saved maximum SO2 mole fraction of 1.09251e-10 does not
    measure photochemical SO2 or bound oxidizing, cooler or high-metallicity atmospheres.
  status: unknown
  origin: reviewed
follow_ups:
- id: complete_anharmonic_thermal_evaluation
  target_kind: claim
  target: physical_accuracy
  revision: '1'
  action: Reconcile the published ExoAmes convergence claim with the current distribution; extend energy/J
    coverage and test Q/H/S/Cp before constructing a thermal candidate.
  requires:
  - Underwood 2016 DOI 10.1093/mnras/stw849 and ExoAmes DOI 10.5281/zenodo.5716834; the full paper and
    current files are already inspected.
  - Partition-generation provenance or corrected/extended states with hashes; separate the opacity lower-state
    8000 cm-1 limit from the full upper-state 15000 cm-1 limit.
  - Quantify higher states, isotopes and atomic covariance for a stated accuracy; compare NASA, JANAF
    and TIPS with common conventions.
  completion: Archive converged high-temperature diagnostics and an explicit candidate decision. Unresolved
    complete physical accuracy does not block scoped retention.
- id: named_atmosphere_response
  target_kind: claim
  target: physical_accuracy
  revision: '1'
  action: If a material thermal correction is supported, fit and assess a conserved finite replacement
    for a defined planetary domain.
  requires:
  - A stated temperature, pressure, metallicity, C/O and oxidizing/reducing domain.
  - A kinetic/irradiation model for photochemical SO2; equilibrium alone does not represent the observed
    production pathway.
  - Additional Gurvich pages or primary constants only when a concrete discrepancy requires them, not
    as a blanket merge prerequisite.
  completion: Record separate candidate-fit, numerical-conservation and scoped abundance-response evidence.
limitations:
- statement: Compact CI replay checks recorded moments. Independent resummation requires the hashed original
    3.27-million-state file; full papers and large files are not vendored.
  evidence:
  - source_replay
- statement: The paper high-T convergence claim, current state inventory and metadata disagree. Shell
    tests demonstrate material edge contributions but do not measure missing states beyond the cutoff.
  evidence:
  - literature
  - source_replay
- statement: TIPS calorics are local derivatives of rounded PF values, not published Cp. Product-approximation,
    isotope and electronic-state uncertainties remain.
  evidence:
  - literature
  - source_replay
- statement: The historical Gurvich monograph and complete ATcT covariance were not reaudited. The hot
    hydrogen-rich archive does not validate photochemical, cooler, oxidizing or high-metallicity atmospheres.
  evidence:
  - literature
  - source_replay
