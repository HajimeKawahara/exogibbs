assumptions:
- statement: Ground-relative balanced D0 is distinct from De/ZPE and single-species formation enthalpy;
    NASA native R is preserved.
  evidence:
  - literature
  - source_replay
- statement: 32S16O2 has nuclear-spin product one and exchange symmetry represented by allowed states.
    Natural-mass translation with representative-isotope internal Q is an explicit approximation.
  evidence:
  - literature
  - source_replay
domains:
- kind: numerical_evaluation
  status: documented
  description: Neutral SO2, S(g) + 2 O(g) -> SO2(g), one bar; nine 300-4000 K thermal nodes, curated 1500-4000
    K. ExoAmes above 2000 K is a completeness diagnostic outside its distributed PF range. The 75 saved
    curated-h2o-v1 cases are not a new substitution.
  conditions:
  - NASA source validity is 300-6000 K; production is 1500-4000 K.
  - TIPS has a 1-5000 K product approximation; ExoAmes published PF is 1-2000 K, with larger T evaluated
    only as diagnostics.
  - No new abundance substitution; the current 75-case archive is hot, hydrogen-rich and gas-only.
  evidence:
  - source_replay
- kind: scientific_applicability
  status: unknown
  description: Complete physical uncertainty and planetary atmosphere accuracy are not established.
  conditions: []
  evidence:
  - literature
  - source_replay
