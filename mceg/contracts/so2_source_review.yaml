- id: source_construction
  revision: '1'
  kind: numerical_verification
  statement: The unchanged SO2 polynomial combines NASA thermal functions with same-version atom-balanced
    ATcT 1.172 D0; energy conventions and atomic fine-structure checks are explicit.
  scope: Neutral SO2, S(g) + 2 O(g) -> SO2(g), one bar; nine 300-4000 K thermal nodes, curated 1500-4000
    K. ExoAmes above 2000 K is a completeness diagnostic outside its distributed PF range. The 75 saved
    curated-h2o-v1 cases are not a new substitution.
- id: normalized_diagnostics
  revision: '1'
  kind: numerical_verification
  statement: The pinned compact state moments, published PF and exact TIPS tables reproduce normalized
    Q/G/H/S/Cp/K diagnostics and distinguish cutoff and derivative limitations.
  scope: Neutral SO2, S(g) + 2 O(g) -> SO2(g), one bar; nine 300-4000 K thermal nodes, curated 1500-4000
    K. ExoAmes above 2000 K is a completeness diagnostic outside its distributed PF range. The 75 saved
    curated-h2o-v1 cases are not a new substitution.
- id: scoped_retention
  revision: '1'
  kind: theoretical
  statement: Retain the current SO2 thermal and energy construction pending a completed anharmonic high-temperature
    evaluation. Neither the finite ExoAmes distribution nor TIPS product approximation establishes a superior
    replacement over 1500-4000 K.
  scope: Neutral SO2, S(g) + 2 O(g) -> SO2(g), one bar; nine 300-4000 K thermal nodes, curated 1500-4000
    K. ExoAmes above 2000 K is a completeness diagnostic outside its distributed PF range. The 75 saved
    curated-h2o-v1 cases are not a new substitution.
- id: physical_accuracy
  revision: '1'
  kind: physical_validation
  statement: The current SO2 model has complete quantified thermal, isotope, energy and planetary abundance
    accuracy.
  scope: Neutral SO2, S(g) + 2 O(g) -> SO2(g), one bar; nine 300-4000 K thermal nodes, curated 1500-4000
    K. ExoAmes above 2000 K is a completeness diagnostic outside its distributed PF range. The 75 saved
    curated-h2o-v1 cases are not a new substitution.
