- statement: The auxiliary law supplies no full Gibbs scalar or host chemical potentials and does
    not select an equilibrium model.
  evidence:
  - implementation
- statement: The raw extrapolated law is not capped at unit concentration; a finite result can exceed
    the physical fraction domain.
