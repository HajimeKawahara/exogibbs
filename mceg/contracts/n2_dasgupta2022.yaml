schema_version: '0.2'
model:
  id: exogibbs.n2_dasgupta2022.v1
  name: Dasgupta total dissolved nitrogen law
  description: Total elemental-N mass fraction depending on N2 partial pressure, total melt pressure,
    temperature, redox and oxide composition.
  implementation:
    repository: https://github.com/HajimeKawahara/exogibbs
    revision: 7dc3ce1183c0b3d74e24cde502f638cac3625b83
    entry_points:
    - exogibbs.solubility.n2_dasgupta2022
    - exogibbs.solubility.volatile.ln_n2_dasgupta2022
assumptions:
- statement: w_N = 1e-6 * [sqrt(p_N2/GPa)*exp(5908*sqrt(P_melt/GPa)/T - 1.6*delta_IW) + (p_N2/GPa)*exp(4.67
    + 7.11*x_SiO2 - 13.06*x_Al2O3 - 120.67*x_TiO2)].
  evidence:
  - implementation
- statement: Total elemental-N mass fraction, converted from ppm by mass; it is not an N2 molecular
    fraction.
  evidence:
  - implementation
- statement: The named driving partial pressure or fugacity is distinct from total melt pressure.
    Unit scaling alone does not convert partial pressure into fugacity.
  evidence:
  - implementation
- statement: delta_IW is a base-10 oxygen-fugacity offset, not absolute f_O2. Default oxide mole fractions
    are (SiO2,Al2O3,TiO2)=(0.56,0.11,0.01).
  evidence:
  - implementation
domains:
- kind: numerical_evaluation
  status: documented
  description: Inspected numerical API and caller obligations; not a physical validation domain.
  conditions:
  - Finite nonnegative driving pressure/fugacity in the stated native unit. Broadcast-compatible JAX
    inputs are accepted; no clipping to reported calibration ranges is performed.
  - T > 0 K, total melt P >= 0 GPa, finite delta_IW, each supplied oxide fraction in [0,1] with sum
    <= 1. The log API uses natural ln(p_N2/GPa).
  - Zero driving pressure gives zero concentration; the fractional-power derivative is singular at
    zero. Positive interiors are needed for finite derivatives.
  evidence:
  - implementation
- kind: scientific_applicability
  status: unknown
  description: Composition-specific physical accuracy and joint applicability remain unestablished
    by this survey.
  conditions: []
  evidence:
  - upstream_model
  - implementation
