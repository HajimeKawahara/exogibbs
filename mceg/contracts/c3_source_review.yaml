contexts:
- id: source_comparison
  scope: Neutral linear gaseous C3, 3 C(g) -> C3(g), standard pressure 1 bar; separate cyclic species and energy/thermal
    conventions; no production adoption.
  settings:
    standard_pressure_bar: 1
    reaction: 3 C(g) -> C3(g)
    reference_temperature_K: 298.15
    gas_constant_J_mol_K: 8.31446261815324
    temperatures_K: 500, 1000, 1500, 3000
    ATcT_version: '1.172'
    partition_convention: 12C3 spin factor one; explicit legacy mass and source-R conventions; ground electronic
      state only for AtLast.
    network: Individual source records; no equilibrium mixture
    elemental_budget: Not applicable to source property comparison
- id: fixed_network_sensitivity
  scope: 75 paired ideal-gas conditions, current curated-c2h-v1 versus a raw-NASA C3-only diagnostic, 537 ion-inclusive
    species.
  settings:
    baseline: curated-c2h-v1
    probe: curated-c2h-v1+raw-nasa-c3-diagnostic
    standard_pressure_bar: 1
    network_species: 537
    ions: true
    temperatures_K: 1500, 2000, 2500, 3000, 4000
    pressures_bar: 1e-6, 1e-4, 0.01, 1, 100
    C_over_O: 0.5888436553555908, 1, 1.5
    elemental_budget: Asplund 2021 reference; vary only C/H; preserve other element/H ratios before normalization.
    solver: CPU float64 cold starts at epsilon_crit 1e-13 and 5e-14
    independent_solver: Standalone FastChem 4.0.3 at C/O=1.5, 2000 K, 1e-6 bar, identical h/A/b at each endpoint.
    neutral_only: not_run
