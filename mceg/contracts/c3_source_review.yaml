schema_version: '0.2'
model:
  id: exogibbs.c3_source_review.v1
  name: Tricarbon source investigation and carbon redistribution
  description: Audit C3 energy and thermal references, identify AtLast consistency limits, and measure an isolated
    raw-NASA source substitution.
  implementation: &id001
    repository: https://github.com/HajimeKawahara/exogibbs
    revision: sha256:7a5c3fe717951bd95787968f188bb96c260c49bf9b6ab99b52ea6157d902739a
    entry_points:
    - mceg/reviews/c3_source_review.py
assumptions:
- statement: The compared species is neutral linear ground-state C3; cyclic singlet/triplet C3 entries and the C3
    -> C2 + C dissociation reaction are distinct.
  evidence:
  - literature_review
  - source_replay
- statement: Balanced ATcT comparison uses C3 and C from the same version; quoted confidence limits and rounded
    correlations are not independent errors.
  evidence:
  - literature_review
  - source_replay
- statement: 12C3 has nuclear-spin factor one in the inspected state weights; the inconsistent factor six in the
    definition file is not applied to its partition function.
  evidence:
  - literature_review
  - source_replay
- statement: Only C3 thermochemistry changes within each fixed-network source pair; only C/H varies between the
    C/O settings before normalization.
  evidence:
  - finite_substitution
domains:
- kind: numerical_evaluation
  status: documented
  description: Exact-node source decomposition, partition/caloric/state diagnostics and 75 paired equilibrium cases.
  conditions:
  - Source decomposition at 500, 1000, 1500, 3000 K with 298.15 K reference; curated comparison only within 1500-4000
    K.
  - Partition diagnostics use recorded mass, source gas constants, isotope and state coverage; full-state sums are
    separately reproducible with the external source file.
  - 'Equilibrium: 1500, 2000, 2500, 3000, 4000 K; 1e-6, 1e-4, 0.01, 1, 100 bar; C/O = 0.5888436553555908, 1, 1.5.'
  evidence:
  - source_replay
  - finite_substitution
- kind: scientific_applicability
  status: unknown
  description: Energy preference and thermal reassessment do not establish a complete replacement or atmospheric
    accuracy.
  conditions: []
  evidence:
  - literature_review
  - source_replay
  - finite_substitution
claims:
- id: source_attribution
  revision: '1'
  kind: numerical_verification
  statement: The current C3 fit agrees with JANAF, while energy alignment leaves a substantial JANAF/NASA thermal
    discrepancy; the archived AtLast files also have reproducible normalization metadata and state-sum consistency
    issues.
  scope: Neutral linear gaseous C3, 3 C(g) -> C3(g), standard pressure 1 bar; separate cyclic species and energy/thermal
    conventions; no production adoption.
- id: conditional_reference_preference
  revision: '1'
  kind: theoretical
  statement: The balanced ATcT energy and modern spectroscopic diagnostics support an ATcT energy anchor and thermal
    reassessment, rather than wholesale raw-NASA substitution.
  scope: Conditional reference-selection reasoning, not experimental certification of an exact thermal function
    or adoption of the downloaded AtLast table.
- id: finite_source_sensitivity
  revision: '1'
  kind: numerical_verification
  statement: A C3-only raw-NASA substitution redistributes carbon in the fixed current-curated gas network, with
    verified constraints and an independent solver comparison.
  scope: 75 paired ideal-gas conditions, current curated-c2h-v1 versus a raw-NASA C3-only diagnostic, 537 ion-inclusive
    species.
- id: complete_thermal_accuracy
  revision: '1'
  kind: physical_validation
  statement: A selected replacement C3 model has quantified energy and thermal accuracy throughout 1500-4000 K.
  scope: Requires a consistent partition/state release, caloric and high-energy convergence, electronic coverage
    and justified reference conventions.
- id: atmospheric_accuracy
  revision: '1'
  kind: physical_validation
  statement: The C3 substitution improves predicted atmospheric composition or spectra.
  scope: Physical atmosphere accuracy is separate from fixed-model numerical sensitivity.
evidence:
- id: literature_review
  kind: literature
  summary: Inspect JANAF bending assumptions, NASA ancestry, the versioned ATcT network and modern AtLast spectroscopy,
    with explicit original-source and completeness limits.
