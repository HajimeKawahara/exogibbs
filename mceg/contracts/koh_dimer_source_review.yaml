assumptions:
- statement: H2K2O2 and NASA K2O2H2 denote the neutral hydroxide dimer, distinct from peroxide, monomer, hydrates,
    ions and condensed phases.
  evidence:
  - literature
- statement: Both source comparisons use 1 bar; frozen atomic references are retained explicitly, while 2KOH(g)->dimer
    association cancels atoms but changes both molecular source functions.
  evidence:
  - source_replay
domains:
- kind: numerical_evaluation
  status: documented
  description: 'Neutral ideal-gas hydroxide dimer source investigation: four frozen screening nodes, seven
    published thermal-function nodes, archived 75-case potassium footprint; no production adoption.'
  conditions:
  - Screening at 500, 1000, 1500 and 3000 K; current fit only evaluated at 1500-4000 K.
  - Published absolute-function comparison at 298.15, 500, 1000, 1500, 2000, 3000 and 4000 K.
  - 'Archived grid: 1500-4000 K, five pressures from 1e-6 to100bar, C/O=0.5888436553555908,1,1.5.'
  evidence:
  - source_replay
- kind: scientific_applicability
  status: unknown
  description: Complete high-temperature physical accuracy and atmospheric applicability are not established.
  conditions: []
  evidence:
  - literature
