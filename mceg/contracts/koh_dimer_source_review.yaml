- id: source_and_footprint
  revision: '1'
  kind: numerical_verification
  statement: The frozen source discrepancy is reproduced and decomposed; the NASA record follows Gurvich1997,
    the printed molecular-constant change explains the thermal difference, and the archived maximum dimer potassium
    fraction is 2.206309434e-9.
  scope: 'Neutral ideal-gas hydroxide dimer source investigation: four frozen screening nodes, seven published
    thermal-function nodes, archived 75-case potassium footprint; no production adoption.'
- id: conditional_source_preference
  revision: '1'
  kind: theoretical
  statement: Among the inspected sources, Gurvich1997/NASA is the scientifically preferred improvement direction
    because it revises molecular thermal construction and the experimental energy analysis; empirical constants
    and shared experimental ancestry remain explicit.
  scope: 'Neutral ideal-gas hydroxide dimer source investigation: four frozen screening nodes, seven published
    thermal-function nodes, archived 75-case potassium footprint; no production adoption.'
- id: original_source_confirmation
  revision: '1'
  kind: physical_validation
