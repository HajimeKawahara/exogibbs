    inspected and confirmed.
  scope: 'Neutral ideal-gas hydroxide dimer source investigation: four frozen screening nodes, seven published
    thermal-function nodes, archived 75-case potassium footprint; no production adoption.'
- id: quantified_physical_accuracy
  revision: '1'
  kind: physical_validation
  statement: A complete dimer replacement has quantified physical accuracy over 1500-4000 K.
  scope: 'Neutral ideal-gas hydroxide dimer source investigation: four frozen screening nodes, seven published
    thermal-function nodes, archived 75-case potassium footprint; no production adoption.'
- id: atmospheric_accuracy
