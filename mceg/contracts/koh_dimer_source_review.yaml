follow_ups:
- id: evaluate_named_candidate
  target_kind: claim
  target: quantified_physical_accuracy
  revision: '1'
  action: Construct and test a named Gurvich/NASA dimer candidate with consistent atomic references and one
    fixed-network substitution before a production decision.
  requires:
  - Explicit choice of dimer-only replacement; monomer+dimer replacement is a separate model
  - Thermodynamic consistency and focused numerical substitution checks; all old primary papers are not a prerequisite
    to candidate evaluation
  completion: Record the candidate, numerical result and justified adopted domain or reason to retain the current
    representation.
- id: confirm_ancestral_experiments
  target_kind: claim
  target: original_source_confirmation
  revision: '1'
  action: Inspect old vapor/beam originals and document their measured species, pressure ratios, condensed-phase
    conditions and relation to the evaluations.
  requires:
  - 'Hastie et al1984: DOI10.1007/978-1-4612-5180-4_19; Gusarov and Gorokhov1968 Zh.Fiz.Khim42,860-865, DOI
    unverified'
  - 'Girichev and Lapshina1989: DOI10.1007/BF00751899; Belyaeva1978thesis/1991Opt.Spektrosk71,88, DOI unverified'
  - 'Schoonmaker and Porter1959: DOI10.1063/1.1730469'
  completion: Update MCEG source confirmation; unresolved primary-paper access does not block merging the completed
    investigation.
- id: improve_hot_partition_if_relevant
  target_kind: claim
  target: quantified_physical_accuracy
  revision: '1'
  action: Seek independent molecular constants and quantified soft-mode anharmonic/structural uncertainty when
    applications make the dimer important.
  requires:
  - A declared target domain, including cooler potassium-rich cases if needed
  - Consistent molecular state, isotope and energy-zero convention
  completion: Record an improved physical support argument or explicit remaining limits.
limitations:
- statement: Source differences and the harmonic/rotor diagnostic are model comparisons, not independent uncertainty
    measurements or a new validated partition function.
  evidence:
