schema_version: '0.2'
model:
  id: exogibbs.h2o_candidate.v1
  name: H2O 2025 evaluated candidate and finite substitution
  description: Construct integrated-Cp evaluated and discrete-state alternatives, compare conserved cold
    equilibria, and retain explicit scattering/isotope limits without changing production.
  implementation: &id001
    repository: https://github.com/HajimeKawahara/exogibbs
    revision: sha256:3cd13c858b16eeadab73f9dd007777453d4596842338280dc29280b2f2b00113
    entry_points:
    - mceg/reviews/h2o_candidate.py
    - mceg/reviews/h2o_equilibrium_impact.py
assumptions:
- statement: Both candidates retain ATcT 1.172 total atomization 917.819 kJ/mol, NASA atomic thermal functions,
    shared para ground zero, 1 bar and aggregate translation mass 18.01528 u. Dominant-isotope internal
    states do not form a complete isotope-resolved reaction.
  evidence:
  - source_scope
  - candidate_validation
- statement: Published 2025 S already excludes proton spin product four; its numeric H is J/mol despite
    kJ/mol header. Discrete state weights 3/1 are retained before dividing Q by four.
  evidence:
  - source_scope
  - candidate_validation
- statement: Inverse expanded U(Cp) fit weights balance numerical approximation only; no independent error
    model or new fit uncertainty is inferred.
  evidence:
  - candidate_validation
- statement: Scattering phase-shift density is not simply a duplicate free OH+H population; its interaction
    assignment in the ideal reacting mixture remains unverified.
  evidence:
  - source_scope
domains:
- kind: numerical_evaluation
  status: documented
  description: Continuous candidate and retained fixed-network equilibrium response.
  conditions:
  - 1500-4000 K only; 251 fitted Cp rows, 2250 withheld Cp rows and 45 withheld direct-state sums.
  - 75 conditions, 537 ion-inclusive species, five temperatures 1500/2000/2500/3000/4000 K, five pressures
    1e-6-100 bar, three C/O ratios; 150 new cold endpoints, 9 tighter controls, 5 path points, 6 FastChem
    comparisons.
  evidence:
  - candidate_validation
  - finite_execution
- kind: scientific_applicability
  status: unknown
  description: Complete isotope/scattering/energy uncertainty and planetary abundance physical accuracy
    are not established.
  conditions: []
  evidence:
  - source_scope
  - finite_execution
claims:
- id: continuous_thermodynamics
  revision: '1'
  kind: numerical_verification
  statement: Both candidates are continuous derivative-consistent formation models with verified normalization,
    source fidelity and the retained ATcT/NASA atomic reference.
  scope: H2(16O) internal states at aggregate mass 18.01528 u, 1 bar, 1500-4000 K, retained ATcT 1.172
    total D0 / NASA atoms; fixed 537-species / 75-condition curated-tio-v1 gas network; no production
    adoption.
- id: finite_substitution
  revision: '1'
  kind: numerical_verification
  statement: Changing H2O alone on the current fixed 537-species network produces conserved and numerically
    resolved equilibrium responses.
  scope: H2(16O) internal states at aggregate mass 18.01528 u, 1 bar, 1500-4000 K, retained ATcT 1.172
    total D0 / NASA atoms; fixed 537-species / 75-condition curated-tio-v1 gas network; no production
    adoption.
- id: candidate_direction
  revision: '1'
  kind: theoretical
  statement: Recommend the evaluated 2025 thermal candidate for scoped production adoption on 1500-4000
    K, retaining the explicit isotope and scattering limitations. The discrete alternative quantifies
    a smaller scope response on the tested grid.
  scope: H2(16O) internal states at aggregate mass 18.01528 u, 1 bar, 1500-4000 K, retained ATcT 1.172
    total D0 / NASA atoms; fixed 537-species / 75-condition curated-tio-v1 gas network; no production
    adoption.
- id: physical_accuracy
  revision: '1'
  kind: physical_validation
  statement: The complete H2O model has quantified physical accuracy for planetary atmosphere abundances
    across 1500-4000 K.
  scope: H2(16O) internal states at aggregate mass 18.01528 u, 1 bar, 1500-4000 K, retained ATcT 1.172
    total D0 / NASA atoms; fixed 537-species / 75-condition curated-tio-v1 gas network; no production
    adoption.
