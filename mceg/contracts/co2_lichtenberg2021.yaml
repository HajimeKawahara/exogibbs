assumptions:
- statement: w_CO2 = 1.937e-15 * (p_CO2 / Pa)**(1/0.714).
  evidence:
  - implementation
- statement: CO2 mass fraction, not elemental-C mass fraction.
  evidence:
  - implementation
- statement: The named driving partial pressure or fugacity is distinct from total melt pressure.
    Unit scaling alone does not convert partial pressure into fugacity.
  evidence:
  - implementation
