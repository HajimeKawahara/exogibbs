- statement: The auxiliary law supplies no full Gibbs scalar or host chemical potentials and does
    not select an equilibrium model.
  evidence:
  - implementation
- statement: The 2090-experiment envelope covers the joint H2O-CO2 dataset, not a validated water-only
    rectangle. No CO2 branch or independent H2/He-rich-fluid or 2173 K BSE validation is supplied.
  evidence:
  - implementation
- statement: A multisolute mass convention and thermodynamic continuation must be stated by the consumer;
    evaluating capacities outside that differentiated continuation loses host response.
  evidence:
  - implementation
