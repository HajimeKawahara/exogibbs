contexts:
- id: fixed_network_grid
  scope: Finite single-species substitution, cold restarts and selected independent solver verification.
  settings:
    network: 537 species; ions=True
    temperatures_K: 1500,2000,2500,3000,4000
    pressures_bar: 1e-6,1e-4,0.01,1,100
    standard_pressure_bar: 1
    carbon_to_oxygen: 0.5888436553555908,1,1.5
    budgets: equilibria.npz budget array, normalized nuclear sum=1; zero net charge
    formula_matrix: equilibria.npz; identical in each pair
    primary_tolerance: 1.0e-13
    strict_tolerance: 5.0e-14
    endpoint_solves: 150
    strict_cold_solves: 150
    lambda_solves: 5
    independent_fastchem_solves: 2
    dtype: float64
    backend: cpu
