  - src/exogibbs/data/curated/c2h_v1.json
  - tests/data/validation/c2h_source_review/20261102/sources.json
  - tests/data/validation/c2h_source_review/20261102/literature.json
  subject: c2h_correction_20261102
  context: fixed_network_grid
  scope: C2H correction and the explicitly recorded cases only.
  artifacts:
