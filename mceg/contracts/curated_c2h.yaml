  requires:
  - Ervin numerical tables and Peric vibronic-state details
  - Correlated reaction-energy uncertainty and high-temperature thermal uncertainty
  - Condensation/nonideality/quenching and spectral constraints when relevant
  completion: Add independently scoped physical evidence; do not promote solver agreement or a source K ratio to
