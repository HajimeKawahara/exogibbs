schema_version: '0.2'
model:
  id: exogibbs.curated_c2h.v1
  name: Curated gas with conditional C2H correction
  description: Opt-in NASA CCH thermal functions plus balanced ATcT 1.172 D0; all other curated-gas-v1 choices are
    preserved.
  implementation: &id001
    repository: https://github.com/HajimeKawahara/exogibbs
    revision: sha256:b18ff4dab8a3144ee234ad2feced37645db05a353198f2fd36a1bdb35471d236
    entry_points:
    - exogibbs.presets.curated_c2h.chemsetup
assumptions:
- statement: Ideal gas formation from 2 C(g) + H(g) to CCH(g), standard pressure 1 bar.
  evidence:
  - selected_sources
- statement: All 537 species are re-equilibrated; only C2H h changes within each identical-network/budget pair.
  evidence:
  - finite_substitution
domains:
- kind: numerical_evaluation
  status: documented
  description: Continuous evaluation on 1500-4000 K, with 75 paired ion-inclusive equilibrium points.
  conditions:
  - Temperatures 1500, 2000, 2500, 3000, 4000 K.
  - Pressures 1e-6, 1e-4, 0.01, 1, 100 bar.
  - C/O 0.5888436553555908, 1, 1.5; other element/H ratios fixed.
  - Neutral mode shares corrected constants; the abundance study uses ions=True.
  evidence:
  - finite_substitution
- kind: scientific_applicability
  status: unknown
  description: No whole-mixture accuracy or calibrated thermal uncertainty; conditional source adoption. Condensation,
    rainout, nonideality, quenching, photochemistry and spectra are not validated.
  conditions: []
  evidence:
  - selected_sources
claims:
- id: conditional_selection
  revision: '1'
  kind: theoretical
  statement: The conditional NASA/ATcT source choice has complete primary-source and high-temperature thermal support.
  scope: Only the stated source choice or sampled gas-only application, never all atmospheres.
- id: single_species_impact
  revision: '1'
  kind: numerical_verification
  statement: The saved fixed-network changes follow a C2H-only substitution and pass the declared numerical checks.
  scope: Only the stated source choice or sampled gas-only application, never all atmospheres.
- id: whole_mixture_accuracy
  revision: '1'
  kind: physical_validation
  statement: The corrected complete gas model has quantified physical accuracy across its evaluation domain and
    applications.
  scope: Only the stated source choice or sampled gas-only application, never all atmospheres.
evidence:
- id: selected_sources
  kind: implementation
  summary: Pinned NASA CCH/C/H records and balanced ATcT D0=1075.066 kJ/mol; only the reaction energy coefficient
    shifts; literature access gaps remain.
