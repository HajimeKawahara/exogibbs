assessments:
- id: identity_attribution_review
  kind: evidence_support
  claim: identity_attribution
  claim_revision: '1'
  subject: c2h_20261102
  context: source_comparison
  method:
    id: review_c2h
    revision: '1'
    description: Inspect identity, ancestry and reaction decomposition separately from model adoption and abundance
      impact.
  evidence:
  - source_review
  - numerical_replay
  reasons:
