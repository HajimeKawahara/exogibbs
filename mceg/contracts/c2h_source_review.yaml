  status: unknown
  origin: reviewed
follow_ups:
- id: resolve_physical_accuracy
  target_kind: claim
  target: physical_accuracy
  revision: '1'
  action: Inspect remaining original papers and construct a consistent candidate thermal/energy model.
  requires:
  - Ervin numerical tables and uncertainty definition
  - Peric vibronic model details
  - Balanced atomic/molecular energy and covariance
  completion: Record thermal applicability and energy uncertainty without treating a diagnostic energy shift as
    adoption.
- id: resolve_abundance_impact
  target_kind: claim
  target: abundance_impact
  revision: '1'
  action: Run one-species finite substitution after candidate review.
  requires:
  - Fixed 537-species network and elemental budgets
  - Residual checks and cold-start verification
  completion: Archive abundance, log abundance, absolute changes and elemental shares under a new subject/context.
limitations:
- statement: NASA, Jacox and ATcT share experimental ancestors. Agreement is not independent replication.
  evidence:
  - source_review
- statement: Record identity and attribution do not establish full local database provenance or physical accuracy
    of the curated mixture.
  evidence:
  - source_review
  - numerical_replay
