  scope: Only selected source records and four nodes; not a new adoption.
- id: physical_accuracy
  revision: '1'
  kind: physical_validation
  statement: A replacement C2H thermal and energy model has quantified accuracy over 1500-4000 K.
  scope: Requires complete source inspection and thermal validation.
- id: abundance_impact
  revision: '1'
  kind: physical_validation
  statement: A C2H substitution has a validated effect on atmospheric equilibrium composition.
  scope: Fixed 537-species network and explicit elemental budget required.
