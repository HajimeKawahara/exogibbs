contexts:
- id: source_review
  scope: Neutral S2, 2S(g)->S2(g), one bar; source 300-4000 K, curated 1500-4000 K; 75 archived 537-species
    endpoints. No planetary validation.
  settings:
    reaction: 2S(g)->S2(g)
    standard_pressure_bar: 1
    atomic_energy: ATcT 1.172 current ; 1.228 separate comparison
    atomic_thermal: NASA; native JANAF difference separate
    partition_normalization: Lowest occupied level, nuclear spin 1, no extra symmetry factor
    curated_change: none
    equilibrium_substitution: not_run
assessments:
- id: source_construction_review
  kind: evidence_support
  claim: source_construction
  claim_revision: '1'
  subject: s2_sources_20261105
  context: source_review
  method:
    id: review_s2_energy_and_uv_thermal_scope
    revision: '1'
    description: Separate energy reconstruction, finite-state replay, retention and physical accuracy.
  evidence:
  - literature
  - source_replay
  - retention_reasoning
  reasons:
  - ATcT 1.172 D0=426.290 kJ/mol versus NASA 421.557260; native-R shift 569.506718981 K. Latest 1.228 balanced
    D0=426.280 kJ/mol; correlated species shifts cancel.
  status: supported
  origin: reviewed
- id: finite_state_comparison_review
  kind: evidence_support
  claim: finite_state_comparison
  claim_revision: '1'
  subject: s2_sources_20261105
  context: source_review
  method:
    id: review_s2_energy_and_uv_thermal_scope
    revision: '1'
    description: Separate energy reconstruction, finite-state replay, retention and physical accuracy.
  evidence:
  - literature
  - source_replay
  - retention_reasoning
  reasons:
  - 17766 states; gtot=2J+1, X odd N/B even N; no extra spin or symmetry factor. Gomez/HITRAN tables identical;
    moments agree within 4.5 ppm at selected nodes. Missing singlets, terminal shells and raw label conflict
    recorded.
  status: supported
  origin: reviewed
- id: scoped_retention_review
  kind: evidence_support
  claim: scoped_retention
  claim_revision: '1'
  subject: s2_sources_20261105
  context: source_review
  method:
    id: review_s2_energy_and_uv_thermal_scope
    revision: '1'
    description: Separate energy reconstruction, finite-state replay, retention and physical accuracy.
  evidence:
  - literature
  - source_replay
  - retention_reasoning
  reasons:
  - Gomez/NASA Q=.983437 at 1500 K and .717657 at 4000 K; Cp at 4000 K=27.591 vs NASA 42.603 J/mol/K. J>=145
    and X v10 shells each exceed 2%. Updated energy adds no substantial correction; NASA physical completeness
    is not established.
  status: supported
  origin: reviewed
- id: physical_accuracy_review
  kind: evidence_support
  claim: physical_accuracy
  claim_revision: '1'
  subject: s2_sources_20261105
  context: source_review
  method:
    id: review_s2_energy_and_uv_thermal_scope
    revision: '1'
    description: Separate energy reconstruction, finite-state replay, retention and physical accuracy.
  evidence:
  - literature
  - source_replay
  - retention_reasoning
  reasons:
  - Missing low electronic states, J/v convergence, bound/resonance treatment, isotope mixtures and correlated
    energy uncertainty remain unresolved. No finite substitution, photochemistry, condensation, transport or
    observational validation.
  status: unknown
  origin: reviewed
follow_ups:
- id: thermal_convergence
  target_kind: claim
  target: physical_accuracy
  revision: '1'
  action: Converge X and low-singlet/higher electronic Q and first/second moments through 4000 K; distinguish
    bound levels, resonances and continuum before fitting and finite substitution.
  requires:
  - Gomez 10.1093/mnras/stae246 already inspected; Xing 10.1080/00268976.2012.741721 potential data or equivalent
    verified levels.
  - Common occupied-ground zero, permutation statistics and explicit isotope convention; J/v/electronic convergence
    bounds.
  completion: A derivative-consistent candidate plus sulfur-conserving finite-substitution evidence; not required
    to merge the scoped source review.
- id: provenance_details
  target_kind: claim
  target: physical_accuracy
  revision: '1'
  action: Reconcile raw excited-state labels and, when useful, inspect full energy-provenance papers and covariance.
  requires:
  - Frederix 10.1021/jp905104u and Thorpe 10.1021/acs.jpca.6c05060 currently abstract/official-table inspection
    only; original Gurvich pages optional.
  - Preserve raw distribution and prior receipts; no silent relabeling or mixed ATcT versions.
  completion: Record source clarification and rerun affected comparisons; no unconditional paper-acquisition
    gate.
limitations:
- statement: The complete UV list is intentionally restricted in J/v and electronic manifolds; table availability
    to 5000 K does not establish thermal completeness.
  evidence:
  - literature
  - source_replay
- statement: Boundary-shell populations overlap and do not quantify missing Q. NASA/JANAF/BC differences are
    not resolved by this replay.
  evidence:
  - source_replay
- statement: Latest ATcT comparison uses rounded correlated species values; raw covariance is not propagated.
    Full original energy-provenance papers and Gurvich pages were not inspected.
  evidence:
  - literature
- statement: Archived current abundance is not a response or planetary accuracy bound; default curated-h2o-v1
    and all production columns remain unchanged.
  evidence:
  - source_replay
