schema_version: '0.2'
model:
  id: exogibbs.s2_source_review.v1
  name: S2 balanced energy and UV thermal-coverage review
  description: Retain the current construction provisionally; converge low electronic and rovibrational states
    before a thermal replacement.
  implementation: &id001
    repository: https://github.com/HajimeKawahara/exogibbs
    revision: sha256:e24dfe77190ec26058dcfc3b25e077bc6f827afa29c96332614f193700f180f8
    entry_points:
    - mceg/reviews/s2_source_review.py
assumptions:
- statement: Use same-version balanced D0 with ground sulfur atoms and the occupied molecular ground zero;
    preserve native NASA R in dimensionless functions.
  evidence:
  - literature
  - source_replay
- statement: 32S2 nuclear spin product is one; permitted N parity already accounts for permutation symmetry.
    Natural translation with representative-isotope levels is an elemental proxy.
  evidence:
  - literature
  - source_replay
domains:
- kind: numerical_evaluation
  status: documented
  description: Neutral S2, 2S(g)->S2(g), one bar; source 300-4000 K, curated 1500-4000 K; 75 archived 537-species
    endpoints. No planetary validation.
  conditions:
  - Nine source nodes 300-4000 K; production only 1500-4000 K.
  - 75 archived cases over 1e-6-100 bar and three C/O values; no new equilibrium solve.
  evidence:
  - source_replay
- kind: scientific_applicability
  status: unknown
  description: Full physical uncertainty and planetary applicability remain unestablished.
  conditions: []
  evidence:
  - literature
  - source_replay
claims:
- id: source_construction
  revision: '1'
  kind: numerical_verification
  statement: The unchanged S2 column combines NASA thermal functions with same-version ATcT 1.172 atomization
    energy; the latest 1.228 balanced energy agrees to displayed precision.
  scope: Neutral S2, 2S(g)->S2(g), one bar; source 300-4000 K, curated 1500-4000 K; 75 archived 537-species
    endpoints. No planetary validation.
- id: finite_state_comparison
  revision: '1'
  kind: numerical_verification
  statement: Every distributed Gomez state reproduces the published partition sums and exact energy moments
    with explicit permutation counting, ground zero and high-temperature coverage diagnostics.
  scope: Neutral S2, 2S(g)->S2(g), one bar; source 300-4000 K, curated 1500-4000 K; 75 archived 537-species
    endpoints. No planetary validation.
- id: scoped_retention
  revision: '1'
  kind: theoretical
  statement: Retaining current S2 is justified while the UV state list lacks complete 1500-4000 K thermal coverage;
    its truncated sum is not a production replacement.
  scope: Neutral S2, 2S(g)->S2(g), one bar; source 300-4000 K, curated 1500-4000 K; 75 archived 537-species
    endpoints. No planetary validation.
- id: physical_accuracy
  revision: '1'
  kind: physical_validation
  statement: S2 energy and thermal functions have complete quantified uncertainty and predict accurate planetary
    abundances.
  scope: Neutral S2, 2S(g)->S2(g), one bar; source 300-4000 K, curated 1500-4000 K; 75 archived 537-species
    endpoints. No planetary validation.
