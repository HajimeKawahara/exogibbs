- id: source_review
  scope: Neutral PH3, one bar; source nodes500/1000/1500/3000 K, partition diagnostics300–4000 K where provided,
    named production domain1500–4000 K, archived75+75 ideal-gas endpoints; no replacement.
  settings:
    model: curated-cos-v1
    production_change: none
    equilibrium_substitution: not_run
    standard_pressure_Pa: 100000
assessments:
- id: source_attribution_review
  kind: evidence_support
  claim: source_attribution
  claim_revision: '1'
  subject: ph3_sources_20261105
  context: source_review
  method:
    id: review_ph3_sources
    revision: '1'
    description: Separate attribution, numerical replay, scoped scientific selection and unestablished physical
      accuracy.
  evidence:
  - literature
  - source_replay
  - decision_reasoning
  reasons:
  - Official NASA intervals match the frozen coefficients; published thermal tables are reproduced with reported
    residuals. The current fit is retained, not silently rebuilt.
  - Nuclear-spin, source-R, one-bar and isotope/mean-mass conventions are explicit.
  status: supported
  origin: reviewed
- id: numerical_replay_review
  kind: evidence_support
  claim: numerical_replay
  claim_revision: '1'
  subject: ph3_sources_20261105
  context: source_review
  method:
    id: review_ph3_sources
    revision: '1'
    description: Separate attribution, numerical replay, scoped scientific selection and unestablished physical
      accuracy.
  evidence:
  - literature
  - source_replay
  - decision_reasoning
  reasons:
  - Four source nodes and exact available partition nodes replay; all150 saved endpoints converge and target
    h agrees with named curated-cos-v1. Peak ion-inclusive P fraction is 0.855991923858.
  status: supported
  origin: reviewed
- id: scoped_decision_review
  kind: evidence_support
  claim: scoped_decision
  claim_revision: '2'
  subject: ph3_sources_20261105
  context: source_review
  method:
    id: review_ph3_sources
    revision: '1'
    description: Separate attribution, numerical replay, scoped scientific selection and unestablished physical
      accuracy.
  evidence:
  - literature
  - source_replay
  - decision_reasoning
  - supplement_replay
  reasons:
  - Retain the already corrected Lodders PH3 model; the recovered 2014 distributed moment and caloric files
    require consistency clarification before a thermal candidate.
  - No replacement model or finite abundance response is asserted. Outstanding source and thermal work does
    not block merging this bounded review.
  - Lodders white-P Hf298=5.440 agrees with NASA5.439kJ/mol; the17.45kJ/mol correction must not be repeated
    on curated. Printed2014 PH3 fit misses direct Q296 by1.015%, exceeding0.4% declared fit error plus0.01035%
    coefficient rounding. SAlTY is not the complete2014 thermodynamic state set.
  - The original electronic-data access follow-up is complete. Final-row Q296 matches the direct paper value,
    but Q2 decreases between row labels 41 and 42 and gives negative variance at selected 300–2000 K nodes.
    At 3000 K dH/dT is 62.000 versus supplied Cp 57.938 J/mol/K.
  status: supported
  origin: reviewed
