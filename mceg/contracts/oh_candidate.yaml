schema_version: '0.2'
model:
  id: exogibbs.oh_candidate.v1
  name: OH NASA/ATcT candidate and finite substitution
  description: Construct an exact continuous OH candidate and measure a one-species finite response while
    retaining thermal alternatives and explicit physical limits.
  implementation: &id001
    repository: https://github.com/HajimeKawahara/exogibbs
    revision: sha256:094fe414773c7927e273c7cd3cb98acd764236d35c97539d05dba34f1f2d1eb1
    entry_points:
    - mceg/reviews/oh_candidate.py
    - mceg/reviews/oh_equilibrium_impact.py
assumptions:
- statement: The balanced H+O->OH anchor uses ATcT 1.172 D0=425604 J/mol; the NASA 425785.9 J/mol anchor
    uses its native R=8.31451, giving delta(D0/R)=-21.5857097163 K. No molecular-only uncertainty is assigned
    to the reaction.
  evidence:
  - source_scope
  - candidate_validation
- statement: NASA atomic thermal functions retain fine-structure populations; MYTHOS uses 16O1H internal
    states, aggregate mass 17.00734 u and nuclear spin removed once. Its parity and electronic states
    remain explicit.
  evidence:
  - source_scope
  - candidate_validation
- statement: Only OH changes in the fixed-network calculations; all other potentials, elemental inventories,
    ideal-gas convention and charge treatment remain the same within each comparison.
  evidence:
  - finite_execution
domains:
- kind: numerical_evaluation
  status: documented
  description: Bounded continuous candidate and fixed-network finite response.
  conditions:
  - 1500-4000 K, 1 bar standard pressure; the NASA 1000-6000 K coefficient interval contains the entire
    domain.
  - 75 hot hydrogen-rich conditions per network; 537 ion-inclusive and 421 neutral species on curated-h2o-v1;
    five temperatures 1500/2000/2500/3000/4000 K, pressures 1e-6-100 bar and three C/O ratios.
  evidence:
  - candidate_validation
  - finite_execution
- kind: scientific_applicability
  status: unknown
  description: Full isotope, energy-covariance, continuum and planetary physical accuracy are not established.
  conditions: []
  evidence:
  - source_scope
  - finite_execution
claims:
- id: continuous_thermodynamics
  revision: '1'
  kind: numerical_verification
  statement: The bounded NASA/ATcT model reconstructs the frozen NASA reaction exactly, applies the balanced
    energy convention and supplies derivative-consistent scalar/JAX thermodynamics.
  scope: H(g)+O(g)->OH(g), 1 bar, 1500-4000 K; NASA thermal functions and balanced ATcT 1.172 D0=425.604
    kJ/mol; fixed curated-h2o-v1 75-condition grids with 537 ion-inclusive or 421 neutral species; no
    production adoption.
- id: finite_substitution
  revision: '1'
  kind: numerical_verification
  statement: Changing OH alone produces conserved, numerically resolved finite equilibrium responses on
    both fixed current-default networks.
  scope: H(g)+O(g)->OH(g), 1 bar, 1500-4000 K; NASA thermal functions and balanced ATcT 1.172 D0=425.604
    kJ/mol; fixed curated-h2o-v1 75-condition grids with 537 ion-inclusive or 421 neutral species; no
    production adoption.
- id: candidate_direction
  revision: '1'
  kind: theoretical
  statement: Prefer the NASA thermal plus balanced ATcT candidate for a separately authorized scoped adoption,
    replacing the identified JANAF caloric defect while retaining the MYTHOS thermal control and physical
    limitations.
  scope: H(g)+O(g)->OH(g), 1 bar, 1500-4000 K; NASA thermal functions and balanced ATcT 1.172 D0=425.604
    kJ/mol; fixed curated-h2o-v1 75-condition grids with 537 ion-inclusive or 421 neutral species; no
    production adoption.
- id: physical_accuracy
  revision: '1'
  kind: physical_validation
  statement: The complete OH model has quantified physical uncertainty and predicts accurate planetary
    abundances throughout 1500-4000 K.
  scope: H(g)+O(g)->OH(g), 1 bar, 1500-4000 K; NASA thermal functions and balanced ATcT 1.172 D0=425.604
    kJ/mol; fixed curated-h2o-v1 75-condition grids with 537 ion-inclusive or 421 neutral species; no
    production adoption.
