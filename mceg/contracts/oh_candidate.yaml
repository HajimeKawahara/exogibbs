contexts:
- id: candidate_evaluation
  scope: H(g)+O(g)->OH(g), 1 bar, 1500-4000 K; NASA thermal functions and balanced ATcT 1.172 D0=425.604
    kJ/mol; fixed curated-h2o-v1 75-condition grids with 537 ion-inclusive or 421 neutral species; no
    production adoption.
  settings:
    reaction: H(g)+O(g)->OH(g)
    standard_pressure_bar: 1
    primary: Exact NASA9 OH-H-O reaction with balanced ATcT anchor
    alternative: Direct MYTHOS state sum at the same energy and atomic reference
    production_change: none
    prior_contract: mceg/contracts/oh_source_review.yaml
    prior_follow_up: 'candidate_and_substitution: continuous candidate and fixed-network finite substitution
      completed here; source review remains unchanged as dated history.'
assessments:
- id: continuous_thermodynamics_review
  kind: evidence_support
  claim: continuous_thermodynamics
  claim_revision: '1'
  subject: oh_candidate_and_finite_substitution_20261105
  context: candidate_evaluation
  method:
    id: review_oh_candidate_and_finite_response
    revision: '1'
    description: Separate source conventions, continuous construction, numerical response and scoped scientific
      preference from full physical accuracy.
  evidence:
  - source_scope
  - candidate_validation
  reasons:
  - The single NASA source interval covers the entire candidate domain; atomic subtraction and the -21.5857097163
    K D0/R shift need no new approximation fit. Independent coefficient reconstruction and thermodynamic
    derivatives are checked.
  status: supported
  origin: reviewed
- id: finite_substitution_review
  kind: evidence_support
  claim: finite_substitution
  claim_revision: '1'
  subject: oh_candidate_and_finite_substitution_20261105
  context: candidate_evaluation
  method:
    id: review_oh_candidate_and_finite_response
    revision: '1'
    description: Separate source conventions, continuous construction, numerical response and scoped scientific
      preference from full physical accuracy.
  evidence:
  - candidate_validation
  - finite_execution
  reasons:
  - All 150 new endpoints converge. OH ratios span 1.038811-1.129141; case 23 gains 0.436186 percentage
    points of oxygen inventory. H/C/O closure is below 9.04e-13, tighter OH log fractions differ below
    2.85e-13 and four FastChem comparisons agree within 1.19e-8 dex. Selected controls have explicitly
    limited coverage.
  status: supported
  origin: reviewed
- id: candidate_direction_review
  kind: evidence_support
  claim: candidate_direction
  claim_revision: '1'
  subject: oh_candidate_and_finite_substitution_20261105
  context: candidate_evaluation
  method:
    id: review_oh_candidate_and_finite_response
    revision: '1'
    description: Separate source conventions, continuous construction, numerical response and scoped scientific
      preference from full physical accuracy.
  evidence:
  - source_scope
  - candidate_validation
  - finite_execution
  - scientific_reasoning
  reasons:
  - The identified JANAF thermal defect motivates replacement. NASA/ATcT provides an exact continuous
    model with a small independently constructed MYTHOS thermal contrast, without claiming NASA is intrinsically
    more accurate or adopting production data in this study.
  status: supported
  origin: reviewed
- id: physical_accuracy_review
  kind: evidence_support
  claim: physical_accuracy
  claim_revision: '1'
  subject: oh_candidate_and_finite_substitution_20261105
  context: candidate_evaluation
  method:
    id: review_oh_candidate_and_finite_response
    revision: '1'
    description: Separate source conventions, continuous construction, numerical response and scoped scientific
      preference from full physical accuracy.
  evidence:
  - source_scope
  - candidate_validation
  - finite_execution
  reasons:
  - Correlated ATcT reaction uncertainty, complete isotope chemistry, continuum/high-energy uncertainty
    and atmosphere-specific physical validation are absent. Numerical completion and agreement of related
    sources do not establish this claim.
  status: unknown
  origin: reviewed
follow_ups:
- id: scoped_production_choice
  target_kind: claim
  target: candidate_direction
  revision: '1'
  action: Make a separately authorized production decision and package the reviewed bounded candidate
    without refitting.
  requires:
  - Preserve the balanced ATcT energy, NASA thermal convention, domain and derivative/inventory checks.
  - Keep the dated source review and the present candidate/equilibrium records distinct from production-adoption
    evidence.
  completion: Record the production decision and targeted runtime validation; acquisition of every historical
    paper is not required.
- id: physical_scope_and_covariance
  target_kind: claim
  target: physical_accuracy
  revision: '1'
  action: Resolve the physical limitations only to the precision and application actually claimed, or
    retain their explicit unknown status.
  requires:
  - A same-version ATcT reaction covariance, rather than the molecular OH uncertainty alone, is needed
    for a correlated energy band.
  - Complete isotope chemistry and high-state/continuum treatment need a consistent reaction model; the
    MYTHOS threshold control is not a rigorous missing-state bound.
  - Condensation, transport, photochemistry and observational validation require application-specific
    evidence.
  completion: Supply the required application-specific evidence or retain the unknown classification;
    these limitations do not invalidate the completed bounded numerical study.
limitations:
- statement: IUPAC inherits Gurvich thermal functions and NASA shares that ancestry; agreement is not
    an independent physical validation. MYTHOS and MoLLIST also share spectroscopy.
  evidence:
  - source_scope
- statement: The MYTHOS quasi-bound/threshold sensitivity and small NASA/MYTHOS difference are defined
    source-scope controls, not confidence intervals or rigorous omitted-continuum bounds.
  evidence:
  - source_scope
  - candidate_validation
  - finite_execution
- statement: The preliminary primary tolerance 1e-13 failed the unchanged visible-species stability gate;
    the archived run uses 5e-14 and tighter controls 2e-14. Trace F changes by 1.463e-6 in ln(x), while
    OH remains stable below 2.85e-13. The execution receipt is preserved as emitted.
  evidence:
  - finite_execution
  - scientific_reasoning
- statement: Fixed-network equilibrium response and cross-solver agreement validate implementation for
    the recorded ideal-gas cases; they do not demonstrate complete atmosphere accuracy.
  evidence:
  - finite_execution
