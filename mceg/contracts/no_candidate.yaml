evidence:
- id: source_scope
  kind: literature
  summary: The inspected XABC state sum, normalized by nuclear spin weight 3, agrees with NASA to about 0.04% at
    4000 K; the energy-aligned JANAF/NASA comparison is also close. The 2024 work repairs or refines thermodynamic
    construction rather than establishing a large missing thermal term. The observed state-file/prose count difference
    and above-dissociation/high-J interpretation remain documented in the source review. This is positive evidence
    for retaining the present thermal shape while updating the physical energy zero.
