contexts:
- id: fixed_ch2_networks
  scope: NO neutral gas, explicit same-version balanced physical energy; 1 bar standard state, 1500-4000 K, fixed
    curated-ch2-v1 ion537/neutral421 networks; no production adoption.
  settings:
    baseline_dataset: curated-ch2-v1
    new_endpoint_solves: 150
    new_control_solves: 22
    independent_fastchem_runs: 4
    reused_baseline_cases: 150
    curated_update: none
    recommended_variant: retained
assessments:
- id: continuous_thermodynamics_review
  kind: evidence_support
  claim: continuous_thermodynamics
  claim_revision: '1'
  subject: no_bounded_candidates_20261106
  context: fixed_ch2_networks
  method:
    id: review_no_bounded_candidates
    revision: '1'
    description: Separate source anchoring, numerical substitutions, scoped selection and unknown complete physical
      accuracy.
  evidence:
  - source_scope
  - candidate_validation
  - finite_execution
  - decision_reasoning
  reasons:
  - Physical JANAF D0=627.835000 kJ/mol changes to the balanced ATcT 1.228 D0=626.811000 kJ/mol. The retained-thermal
    variant changes formation G and H by +1024.000 J/mol, leaving S and Cp unchanged. Native NASA R and SI insertion
    are separated; missing source zero remains missing.
  status: supported
  origin: reviewed
- id: finite_substitution_review
  kind: evidence_support
  claim: finite_substitution
  claim_revision: '1'
  subject: no_bounded_candidates_20261106
  context: fixed_ch2_networks
  method:
    id: review_no_bounded_candidates
    revision: '1'
    description: Separate source anchoring, numerical substitutions, scoped selection and unknown complete physical
      accuracy.
  evidence:
  - source_scope
  - candidate_validation
  - finite_execution
  - decision_reasoning
  reasons:
  - All 150 fresh endpoints and 22 controls pass. FastChem differences are at most 1.49068e-08 dex. Both fixed networks
    use the same verified baseline archive.
  status: supported
  origin: reviewed
- id: scoped_selection_review
  kind: evidence_support
  claim: scoped_selection
  claim_revision: '1'
  subject: no_bounded_candidates_20261106
  context: fixed_ch2_networks
  method:
    id: review_no_bounded_candidates
    revision: '1'
    description: Separate source anchoring, numerical substitutions, scoped selection and unknown complete physical
      accuracy.
  evidence:
  - source_scope
  - candidate_validation
  - finite_execution
  - decision_reasoning
  reasons:
  - The inspected XABC state sum, normalized by nuclear spin weight 3, agrees with NASA to about 0.04% at 4000 K;
    the energy-aligned JANAF/NASA comparison is also close. The 2024 work repairs or refines thermodynamic construction
    rather than establishing a large missing thermal term. The observed state-file/prose count difference and above-dissociation/high-J
    interpretation remain documented in the source review. This is positive evidence for retaining the present thermal
    shape while updating the physical energy zero. Recommend the ATcT energy update with the existing thermal function;
    no additional thermal replacement is justified.
  status: supported
  origin: reviewed
- id: thermal_superiority_review
  kind: evidence_support
  claim: thermal_superiority
  claim_revision: '1'
  subject: no_bounded_candidates_20261106
  context: fixed_ch2_networks
