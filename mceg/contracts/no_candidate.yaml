assumptions:
- statement: Exact gas/isomer identity and physical source zero are preserved; never infer D0 from a fitted intercept.
  evidence:
  - source_scope
  - candidate_validation
- statement: Retained-thermal energy variants keep the fit/source residual; NASA alternatives explicitly change
    the reaction thermal function and residual.
  evidence:
  - source_scope
  - candidate_validation
- statement: Finite controls and marginal quoted widths are not a complete physical uncertainty or reaction covariance.
  evidence:
  - source_scope
  - candidate_validation
