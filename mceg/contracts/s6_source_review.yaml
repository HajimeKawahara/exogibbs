schema_version: '0.2'
model:
  id: exogibbs.s6_source_review.v1
  name: S6 energy and thermal-source investigation
  description: Inspect S6 source conventions and modern alternatives while preserving curated; distinguish source
    evidence, candidate readiness and physical accuracy.
  implementation: &id001
    repository: https://github.com/HajimeKawahara/exogibbs
    revision: sha256:750b7024dc9e5dd8c3f5ef7dc92b4a09963e53ef9c9f221d76c4ac749144e6a1
    entry_points:
    - mceg/reviews/s6_source_review.py
assumptions:
- statement: The reaction balances one neutral S6 against 6 neutral S atoms at 1 bar; source-specific atomic terms
    are retained. Balanced H298 alignment and modern energy/state diagnostics are not adopted thermochemical models.
  evidence:
  - literature_review
  - source_replay
- statement: The new RRHO calculation includes one well and one electronic component per archived record. Missing
    states, enantiomer counting, anharmonic/hindered motion and dissociation coverage are not inferred from numerical
    replay.
  evidence:
  - state_replay
domains:
- kind: numerical_evaluation
  status: documented
  description: Exact source nodes and an existing equilibrium archive.
  conditions:
  - Source decomposition at 500, 1000, 1500, 2000, 3000 and 4000 K; named curated_cos only at 1500-4000 K.
  - Positive JANAF audit nodes 298.15, 300, 500, 1000, 1500, 2000, 3000 and 4000 K.
  - 'Reused curated_cos_adoption/20261105/ions.npz: 75 cases, 537 species, 1500-4000 K, 1e-6-100 bar, reference
    C/O, 1 and 1.5. No new solve.'
  evidence:
  - source_replay
- kind: scientific_applicability
  status: unknown
  description: Complete high-temperature state counting, cooler/sulfur-rich regimes, photochemistry and physical
    atmospheric accuracy remain unvalidated.
  conditions: []
  evidence:
  - literature_review
  - source_replay
claims:
- id: source_attribution
  revision: '1'
  kind: numerical_verification
  statement: Official selected S6 NASA coefficients and JANAF nodes reproduce the frozen attribution, and balanced
    H298 alignment leaves a substantial thermal difference.
  scope: Neutral S6 gas; 6 S(g) -> S6(g), 1 bar; declared source nodes, labelled modern diagnostic and archived
    curated-cos footprint only.
- id: modern_source_screen
  revision: '2'
  kind: numerical_verification
  statement: In the original source packet, the inspected full 2023 article supports an S6 isomer-gap fact, not
    a replacement D0 or complete partition model. The separate state_reconstruction assessment records subsequent
    progress.
  scope: Neutral S6 gas; 6 S(g) -> S6(g), 1 bar; declared source nodes, labelled modern diagnostic and archived
    curated-cos footprint only.
- id: numerical_replay
  revision: '1'
  kind: numerical_verification
  statement: The source decomposition, modern diagnostic and correctly stoichiometric archived sulfur allocation
    reproduce offline with pinned inputs.
  scope: Neutral S6 gas; 6 S(g) -> S6(g), 1 bar; declared source nodes, labelled modern diagnostic and archived
    curated-cos footprint only.
- id: candidate_adoption
  revision: '1'
  kind: physical_validation
  statement: A specified replacement S6 model has sufficient evidence and numerical evaluation for curated adoption.
  scope: Neutral S6 gas; 6 S(g) -> S6(g), 1 bar; declared source nodes, labelled modern diagnostic and archived
    curated-cos footprint only.
- id: physical_accuracy
  revision: '1'
  kind: physical_validation
  statement: S6 standard functions and atmospheric abundances have quantified physical accuracy over intended applications.
  scope: Neutral S6 gas; 6 S(g) -> S6(g), 1 bar; declared source nodes, labelled modern diagnostic and archived
    curated-cos footprint only.
- id: state_reconstruction
  revision: '1'
  kind: numerical_verification
  statement: Four recovered numerical structures support a reproducible RRHO sensitivity, while missing armchair
    data and soft modes prevent treating that sum as a complete physical model.
  scope: S6 selected Jackson v1.0 PBE0/0.96 records, one RRHO well and one electronic component per stored record;
    formal 250-4000 K diagnostic at 1 bar, no complete state-count or adoption claim.
