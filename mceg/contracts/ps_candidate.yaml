assumptions:
- statement: Add only the molecular POPS-minus-NASA/Gurvich thermal difference to the literal current fit; use native
    NASA R and modern R explicitly, one-bar standard state and no extra ZPE.
  evidence:
  - source_scope
  - candidate_validation
- statement: Fixed central-D0 cutoff, spin divisor2 and natural-mass translation proxy; full-distribution and cutoff/electronic
    reductions are diagnostics rather than complete uncertainty bounds.
  evidence:
  - source_scope
  - candidate_validation
- statement: Reusing baseline endpoints requires exact matching species/elements/formula matrix/budgets and all
    potentials, with new selected baseline controls.
  evidence:
  - finite_execution
domains:
- kind: numerical_evaluation
  status: documented
  description: Neutral P(g)+S(g)->PS(g), 1 bar, 1500-4000 K; current FastChem fit plus POPS-minus-NASA/Gurvich molecular
    thermal difference, retained Lodders D0=438 kJ/mol, fixed 537-species curated-cos-v1 gas network; no adoption.
  conditions:
  - "75 ion-inclusive conditions at five temperatures,five pressures1e-6\u2013100bar and threeC/O;75 fresh candidate\
    \ endpoints and75 verified reused baselines."
  - Six tighter cold endpoints,five path solves,four independent FastChem comparisons; no neutral solve or production
    adoption.
  evidence:
  - candidate_validation
  - finite_execution
- kind: scientific_applicability
  status: unknown
  description: Complete physical uncertainty and planetary applicability are not established.
  conditions: []
  evidence:
  - source_scope
