model:
  id: exogibbs.ps_candidate.v1
  name: PS retained-energy POPS candidate and finite substitution
  description: Evaluate an optional resolved-state thermal update while retaining the Lodders energy and current
    fit residual.
  implementation: &id001
    repository: https://github.com/HajimeKawahara/exogibbs
