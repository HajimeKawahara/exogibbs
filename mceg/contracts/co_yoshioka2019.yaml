schema_version: '0.2'
model:
  id: exogibbs.co_yoshioka2019.v1
  name: Yoshioka dissolved carbon from CO fugacity
  description: Elemental-carbon mass fraction dissolved from CO-bearing fluid, with linear and natural-log
    APIs.
  implementation:
    repository: https://github.com/HajimeKawahara/exogibbs
    revision: 7dc3ce1183c0b3d74e24cde502f638cac3625b83
    entry_points:
    - exogibbs.solubility.co_yoshioka2019
    - exogibbs.solubility.volatile.ln_co_yoshioka2019
assumptions:
- statement: w_C = 10**(-7.2) * (f_CO / bar)**0.8; the logarithmic API uses ln(f_CO/bar) and returns
    ln(w_C).
  evidence:
  - implementation
- statement: Elemental-C mass fraction dissolved as CO, not CO molecular mass fraction.
  evidence:
  - implementation
- statement: The named driving partial pressure or fugacity is distinct from total melt pressure.
    Unit scaling alone does not convert partial pressure into fugacity.
  evidence:
  - implementation
domains:
- kind: numerical_evaluation
  status: documented
  description: Inspected numerical API and caller obligations; not a physical validation domain.
  conditions:
  - Finite nonnegative driving pressure/fugacity in the stated native unit. Broadcast-compatible JAX
    inputs are accepted; no clipping to reported calibration ranges is performed.
  - Zero driving pressure gives zero concentration; the fractional-power derivative is singular at
    zero. Positive interiors are needed for finite derivatives.
  evidence:
  - implementation
- kind: scientific_applicability
  status: unknown
  description: Composition-specific physical accuracy and joint applicability remain unestablished
    by this survey.
  conditions: []
  evidence:
  - upstream_model
  - implementation
claims:
- id: numerical_verification
  revision: '1'
  kind: numerical_verification
  statement: The selected module passes its literal-formula, zero/invalid-input and interior derivative
    checks. CO/N logarithmic variants and Sun-Yao composition response are covered only where explicitly
    tested. Counts include shared controls, not a separate experimental sample count.
  scope: Only the selected tests, their asserted tolerances and the recorded CPU/x64 environment.
- id: physical_accuracy
  revision: '1'
  kind: physical_validation
  statement: The model has quantitatively established physical accuracy for the intended melt/fluid
    composition and conditions.
  scope: Requires independent empirical data and explicit composition, reference-state and driving-quantity
    conventions; not established by this survey.
- id: source_formula_agreement_20261021
  revision: '1'
  kind: numerical_verification
  statement: The implementation agrees with the specified inspected reference expression at the recorded
    samples.
  scope: Three samples of the published abstract coefficients with the provider bar convention. This
    does not establish equivalence to the full published Eq. 6.
