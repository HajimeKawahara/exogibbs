assumptions:
- statement: The retained candidate changes only balanced physical ATcT-minus-JANAF D0. NASA is a separate thermal/gauge/fit-residual
    control at the same ATcT energy; native NASA energy is removed with its original R before SI-R insertion. No
    second ZPE. Solver agreement cannot establish either thermal model's physical superiority.
  evidence:
  - source_scope
  - continuous_model
domains:
- kind: numerical_evaluation
  status: documented
  description: C3O2 independent retained-thermal ATcT and NASA9/ATcT candidates on fixed curated-ch2-v1, 1500-4000
    K and 1-bar standard state; no production update.
  conditions:
  - 75 conditions per network per variant; 150 common archived baseline endpoints are not recounted.
  evidence:
  - continuous_model
  - finite_execution
claims:
- id: balanced_energy
  revision: '1'
  kind: theoretical
  statement: The source cycle separates physical D0 from the fitted intercept and inserts the selected energy exactly
    once.
  scope: C3O2 independent retained-thermal ATcT and NASA9/ATcT candidates on fixed curated-ch2-v1, 1500-4000 K and
    1-bar standard state; no production update.
- id: continuous_consistency
  revision: '1'
  kind: numerical_verification
  statement: Each finite continuous candidate has independently checked G/H/S/Cp and changes only the declared target
    potential.
  scope: C3O2 independent retained-thermal ATcT and NASA9/ATcT candidates on fixed curated-ch2-v1, 1500-4000 K and
    1-bar standard state; no production update.
- id: finite_response
  revision: '1'
  kind: numerical_verification
