  id: exogibbs.no_source_review.v1
  name: NO source review
  description: 'Prepare an ATcT energy-only candidate on the literal inherited fit, preserving its thermal
    function and fit residual. This is a smaller priority than NH2. A wholesale thermal replacement is not
    needed to correct the identified energy discrepancy: normalized XABC state sums closely reproduce NASA
    and the evaluated JANAF/NASA thermal difference is small over this range.'
