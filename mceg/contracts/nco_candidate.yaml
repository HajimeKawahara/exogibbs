    validate an entire rovibronic model.
  status: supported
  origin: reviewed
- id: physical_accuracy_review
  kind: evidence_support
  claim: physical_accuracy
  claim_revision: '1'
  subject: nco_candidates_and_substitution_20261106
  context: candidate_evaluation
  method:
    id: nco_source_and_finite_substitution
    revision: '1'
    description: Separate source energies, model contrasts and finite numerical response from physical-accuracy
      claims.
  evidence:
  - source_scope
  - candidate_validation
  - finite_execution
  - decision_reasoning
  reasons:
  - JANAF already counts the0/95.6 cm-1 spin-orbit components with weights2 each; no extra orbital or spin
    factor is added. A complete rovibronic update remains separate from the few-percent aligned thermal contrast.
    The jointly changed HNCO->H+NCO reaction shifts G/H by -14.724 kJ/mol, preserving the matched energy ledger.
    Marginal source widths do not supply reaction covariance or a complete thermal uncertainty.
  status: unknown
  origin: reviewed
