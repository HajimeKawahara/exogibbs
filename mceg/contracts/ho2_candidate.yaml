schema_version: '0.2'
model:
  id: exogibbs.ho2_candidate.v1
  name: HO2 NASA/ATcT candidate and finite substitution
  description: Verify the exact bounded energy update and single-species response; retain physical and
    photochemical applicability limits.
  implementation: &id001
    repository: https://github.com/HajimeKawahara/exogibbs
    revision: sha256:10d772922c4cb01871a6407552f87dd81f881f82430d641c3eb675d6b1434289
    entry_points:
    - mceg/reviews/ho2_candidate.py
    - mceg/reviews/ho2_equilibrium_impact.py
assumptions:
- statement: Balance H+2O->HO2 using ATcT 1.172 D0=694662 J/mol and native NASA D0=694682.762 J/mol with
    R=8.314510. Caloric outputs use modern SI R; no molecular-only reaction uncertainty.
  evidence:
  - source_scope
  - candidate_validation
- statement: Only HO2 changes; all other potentials, elemental budgets, species, ideal-gas standard state
    and charge treatment remain fixed. JANAF controls use original knots at the same D0 and NASA atoms.
  evidence:
  - candidate_validation
  - finite_execution
domains:
- kind: numerical_evaluation
  status: documented
  description: Bounded continuous candidate and fixed-network finite response.
  conditions:
  - 1500-4000 K, 1 bar standard state, within NASA 1000-6000 K source segment.
  - 75 cases each for 537 ion-inclusive and 421 neutral species; 1e-6-100 bar, three C/O ratios, curated-oh-v1.
  evidence:
  - candidate_validation
  - finite_execution
- kind: scientific_applicability
  status: unknown
  description: Total physical uncertainty and low-temperature photochemical/kinetic radical abundances
    are not established.
  conditions: []
  evidence:
  - source_scope
  - finite_execution
claims:
- id: continuous_thermodynamics
  revision: '1'
  kind: numerical_verification
  statement: The bounded NASA/ATcT model reconstructs the exact reaction, balances same-version energy
    and supplies derivative-consistent scalar/JAX thermodynamics.
  scope: H(g)+2O(g)->HO2(g), 1 bar, 1500-4000 K; exact NASA thermal functions and balanced ATcT 1.172
    D0=694.662 kJ/mol; curated-oh-v1 75-condition grids with 537 ion-inclusive or 421 neutral species;
    no production adoption or photochemical validation.
- id: finite_substitution
  revision: '1'
  kind: numerical_verification
  statement: Changing only HO2 gives conserved, stable finite equilibrium endpoints on both fixed current
    networks; some trace-species and Gibbs differences remain below numerical resolution.
  scope: H(g)+2O(g)->HO2(g), 1 bar, 1500-4000 K; exact NASA thermal functions and balanced ATcT 1.172
    D0=694.662 kJ/mol; curated-oh-v1 75-condition grids with 537 ion-inclusive or 421 neutral species;
    no production adoption or photochemical validation.
- id: candidate_direction
  revision: '1'
  kind: theoretical
  statement: Prefer the exact NASA thermal plus balanced ATcT candidate for a separately authorized bounded
    adoption because the inherited formation energy is obsolete.
  scope: H(g)+2O(g)->HO2(g), 1 bar, 1500-4000 K; exact NASA thermal functions and balanced ATcT 1.172
    D0=694.662 kJ/mol; curated-oh-v1 75-condition grids with 537 ion-inclusive or 421 neutral species;
    no production adoption or photochemical validation.
- id: physical_accuracy
  revision: '1'
  kind: physical_validation
  statement: The complete HO2 model has quantified physical uncertainty and accurate planetary radical
    abundances across the intended applications.
  scope: H(g)+2O(g)->HO2(g), 1 bar, 1500-4000 K; exact NASA thermal functions and balanced ATcT 1.172
    D0=694.662 kJ/mol; curated-oh-v1 75-condition grids with 537 ion-inclusive or 421 neutral species;
    no production adoption or photochemical validation.
