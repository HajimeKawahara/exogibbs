contexts:
- id: candidate_evaluation
  scope: H(g)+2O(g)->HO2(g), 1 bar, 1500-4000 K; exact NASA thermal functions and balanced ATcT 1.172
    D0=694.662 kJ/mol; curated-oh-v1 75-condition grids with 537 ion-inclusive or 421 neutral species;
    no production adoption or photochemical validation.
  settings:
    reaction: H(g)+2O(g)->HO2(g)
    standard_pressure_bar: 1
    primary: Exact NASA9 HO2-H-2O with balanced ATcT 1.172 energy
    thermal_control: JANAF original knots only, same D0 and NASA atomic thermal reference
    production_change: none
    prior_contract: mceg/contracts/ho2_source_review.yaml
    prior_follow_up: next_calculation completed; source-only context remains dated history
assessments:
- id: continuous_thermodynamics_review
  kind: evidence_support
  claim: continuous_thermodynamics
  claim_revision: '1'
  subject: ho2_candidate_and_finite_substitution_20261105
  context: candidate_evaluation
  method:
    id: review_ho2_candidate_and_finite_response
    revision: '1'
    description: Separate source conventions, bounded numerical verification and scientific preference
      from total physical accuracy.
  evidence:
  - source_scope
  - candidate_validation
  reasons:
  - One NASA interval covers the domain; the exact HO2-H-2O reaction requires only the -2.02096231694
    K D0/R correction. Source calorics and JAX derivatives agree to numerical precision.
  status: supported
  origin: reviewed
- id: finite_substitution_review
  kind: evidence_support
  claim: finite_substitution
  claim_revision: '1'
  subject: ho2_candidate_and_finite_substitution_20261105
  context: candidate_evaluation
  method:
    id: review_ho2_candidate_and_finite_response
    revision: '1'
    description: Separate source conventions, bounded numerical verification and scientific preference
      from total physical accuracy.
  evidence:
  - candidate_validation
  - finite_execution
  reasons:
  - All 150 candidate endpoints converge; HO2 abundance ratios span 0.446393-0.755162 and the largest
    absolute mole-fraction change is 4.731e-12. H/C/O closure is below 9.00e-13, tighter HO2 ln(x) differences
    below 1.20e-10 and four FastChem comparisons agree within 1.193e-8 dex. Tiny Gibbs differences are
    not resolved at every case.
  status: supported
  origin: reviewed
- id: candidate_direction_review
  kind: evidence_support
  claim: candidate_direction
  claim_revision: '1'
  subject: ho2_candidate_and_finite_substitution_20261105
  context: candidate_evaluation
  method:
    id: review_ho2_candidate_and_finite_response
    revision: '1'
    description: Separate source conventions, bounded numerical verification and scientific preference
      from total physical accuracy.
  evidence:
  - source_scope
  - candidate_validation
  - finite_execution
  - scientific_reasoning
  reasons:
  - The evaluated energy supersedes the obsolete JANAF anchor. NASA supplies a continuous exact representation;
    a same-energy JANAF original-knot contrast is only +0.23% to -2.01%. No new historical-paper gate
    or production change is introduced.
  status: supported
  origin: reviewed
- id: physical_accuracy_review
  kind: evidence_support
  claim: physical_accuracy
  claim_revision: '1'
  subject: ho2_candidate_and_finite_substitution_20261105
  context: candidate_evaluation
  method:
    id: review_ho2_candidate_and_finite_response
    revision: '1'
    description: Separate source conventions, bounded numerical verification and scientific preference
      from total physical accuracy.
  evidence:
  - source_scope
  - candidate_validation
  - finite_execution
  reasons:
  - Reaction covariance, high-state completeness and atmosphere-specific physical validation are absent.
    Trace HO2 in hot H-rich equilibrium does not constrain low-temperature photochemistry or kinetics.
  status: unknown
  origin: reviewed
follow_ups:
- id: scoped_production_choice
  target_kind: claim
  target: candidate_direction
  revision: '1'
  action: Make a separately authorized curated decision and package the exact candidate without refitting.
    Completed for the bounded production choice by curated-ho2-v1 on curated-kh-v1; see mceg/contracts/curated_ho2.yaml.
    Full physical scope remains unknown.
  requires:
  - Preserve balanced ATcT energy, native NASA normalization, bounded domain and derivative/inventory
    checks.
  - Keep candidate and production-adoption evidence distinct.
  completion: Record the production decision and runtime validation; obtaining every historical paper
    is not a prerequisite.
- id: physical_scope_and_covariance
  target_kind: claim
  target: physical_accuracy
  revision: '1'
  action: Resolve only the physical limits required by the claimed application and precision, or retain
    their explicit unknown status.
  requires:
  - Same-version ATcT reaction covariance for correlated energy uncertainty.
  - Consistent high-state/continuum treatment for a completeness bound.
  - Application-specific lower-temperature, photochemical or kinetic evidence for atmospheric radical
    claims.
  completion: Supply proportionate physical evidence or retain unknown; no new gate on this completed
    bounded study.
limitations:
- statement: Source agreement is not necessarily independent validation. JANAF same-energy contrasts are
    original-knot source sensitivity, not a confidence interval or omitted-state bound.
  evidence:
  - source_scope
  - candidate_validation
- statement: HO2 is extremely trace on this hot H-rich grid. The largest absolute composition response
    is 4.731e-12; many Gibbs differences are below numerical resolution despite consistent constraints
    and selected tighter controls.
  evidence:
  - finite_execution
- statement: Numerical verification and cross-solver agreement do not establish low-temperature photochemistry,
    kinetics, condensation, transport or total planetary physical accuracy.
  evidence:
  - finite_execution
  - scientific_reasoning
