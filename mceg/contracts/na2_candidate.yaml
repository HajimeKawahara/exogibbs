    location: documents/mceg/na2_candidate.rst
    inspection: inspected
    note: 'The primary publisher abstract of Jones et al. (1996), `10.1103/PhysRevA.54.R1006 <https://doi.org/10.1103/PhysRevA.54.R1006>`_,
      reports D0 = 5942.6880 +/- 0.0049 cm^-1 for 23Na2 from combined direct spectroscopic measurements. This is
      the lowest vibrational level relative to the free ground-atom limit, not De. The original full paper has not
      been obtained; that access limit is recorded rather than converted into a claim of a complete modern thermal
      evaluation. Sodium is naturally monoisotopic for this construction. The selected control moves D0 upward by
      the reported 0.0049 cm^-1 measurement uncertainty. It is one anchor sensitivity, not a confidence interval
      for the retained thermal function or atmosphere. Official2025supplements and publishercorrectionpreview inspected;
      fullcorrectionpages remain unavailable. '
