  - source_replay
- statement: Metadata maximum temperature 9000 K, paper line-list claim about 7000 K and distributed PF ending 5000
    K are distinct scopes.
  evidence:
  - literature
  - source_replay
- statement: The last approximately 1000 cm-1 of the A potential was not experimentally constrained in Rivlin 2015;
    a complete uncertainty budget is unavailable.
  evidence:
