schema_version: '0.2'
model:
  id: exogibbs.curated_tio2.v1
  name: Curated TiO2 measured thermals on the CN/PS base
  description: Adopt the exact reviewed measured-RRHO thermal difference at retained energy. Scoped scientific selection
    and production verification are supported; complete physical accuracy remains unknown.
  implementation: &id001
    repository: https://github.com/HajimeKawahara/exogibbs
    revision: sha256:876144aecb85f204cbf683415f4be3b2b92f266170e3ce312270a32d7cb5414f
    entry_points:
    - exogibbs.presets.curated_tio2.chemsetup
assumptions:
- statement: Only TiO2 changes from curated-ps-v1; CN, PS and all earlier potentials,species, budgets and atomic
    references are retained.
  evidence:
  - scientific_sources
  - production_execution
- statement: Add molecular RRHO G-H0 minus NASA molecular G-H0 to the inherited fit; preserve source D0 and the
    entire fit residual, without extrapolating a finite fit tozero K.
  evidence:
  - scientific_sources
- statement: Use measured principal-isotopologue rotation and gas fundamentals as harmonic frequencies with JANAF
    mean mass, sigma 2 and spin weight 1; do not adopt H298-control or electronic-sensitivity corrections.
  evidence:
  - scientific_sources
domains:
- kind: numerical_evaluation
  status: documented
  description: Packaged continuous TiO2 thermodynamics and fresh named-factory cold solves in both network modes.
  conditions:
  - 1500-4000K; invalid temperatures return NaN.
  - '75 conditions per network: five temperatures,five pressures 1e-6-100 bar, three C/O values.'
  - 2501-node independentcandidate parity,150 fresh endpoints,6 tighter candidate controls,2 FastChem comparisons.
  evidence:
  - scientific_sources
  - production_execution
- kind: scientific_applicability
  status: unknown
  description: Complete electronic/anharmonic/isotopic,energetic and planetary-atmospheric accuracy is unquantified.
  conditions: []
  evidence:
  - scientific_sources
  - production_execution
claims:
- id: scientific_selection
  revision: '1'
  kind: theoretical
  statement: Measured ground-state rotation and bending are preferable central thermal inputs within the declared
    RRHO approximation; adopt the reviewed retained-energy correction with explicit physical limits.
  scope: curated-tio2-v1 on 1500-4000 K at one-bar standard pressure, inheriting curated-ps-v1. Only TiO2 receives
    the measured ground-state RRHO molecular thermal difference, retaining JANAF source D0 and full fit residual
    to NASA proxy. Both 537-species ion-inclusive and 421-species neutral networks; no complete atmospheric physical
    validation.
- id: production_adoption
  revision: '1'
  kind: numerical_verification
  statement: The named curated_tio2 factory implements the reviewed correction on the cumulative CN/PS base and
    passes independently assembled candidate, conservation and finite-solver checks.
  scope: curated-tio2-v1 on 1500-4000 K at one-bar standard pressure, inheriting curated-ps-v1. Only TiO2 receives
    the measured ground-state RRHO molecular thermal difference, retaining JANAF source D0 and full fit residual
    to NASA proxy. Both 537-species ion-inclusive and 421-species neutral networks; no complete atmospheric physical
    validation.
- id: physical_accuracy
  revision: '1'
  kind: physical_validation
  statement: The complete adopted gas model has quantified physical uncertainty and validated planetary atmospheric
    abundance accuracy.
  scope: curated-tio2-v1 on 1500-4000 K at one-bar standard pressure, inheriting curated-ps-v1. Only TiO2 receives
    the measured ground-state RRHO molecular thermal difference, retaining JANAF source D0 and full fit residual
    to NASA proxy. Both 537-species ion-inclusive and 421-species neutral networks; no complete atmospheric physical
    validation.
