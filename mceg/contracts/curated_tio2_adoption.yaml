contexts:
- id: production_gas_domain
  scope: curated-tio2-v1 on 1500-4000 K at one-bar standard pressure, inheriting curated-ps-v1. Only TiO2 receives
    the measured ground-state RRHO molecular thermal difference, retaining JANAF source D0 and full fit residual
    to NASA proxy. Both 537-species ion-inclusive and 421-species neutral networks; no complete atmospheric physical
    validation.
  settings:
    dataset: curated-tio2-v1
    base_dataset: curated-ps-v1
    temperature_range_K: 1500-4000
    standard_pressure_bar: 1
    networks: ions and neutral
    energy_anchor: Retained JANAF source D0=1267.776 kJ/mol
    thermal_source: Measured ground-state RRHO correction, retaining fit residual to NASA thermal proxy
    previous_follow_up: Authorized bounded TiO2 thermal adoption completed; complete physical accuracy remains unknown
assessments:
- id: scientific_selection_review
  kind: evidence_support
  claim: scientific_selection
  claim_revision: '1'
  subject: curated_tio2_production_20261106
  context: production_gas_domain
  method:
    id: review_tio2_scoped_production_adoption
    revision: '1'
    description: Separate adopted bounded thermal choice and numerical production verification from complete physical
      accuracy.
  evidence:
  - scientific_sources
  reasons:
  - Measured rotation/bend improve the central inputs within the same RRHO approximation. The earlier 9-11% K shift
    exceeds selected bend/electronic sensitivities, but they do not bound all missing physics. SourceD0=1267.776
    kJ/mol and complete current-fit residuals to NASA molecular thermal proxy are retained; no new energy or excited-state
    correction is adopted.
  status: supported
  origin: reviewed
- id: production_adoption_review
  kind: evidence_support
  claim: production_adoption
  claim_revision: '1'
  subject: curated_tio2_production_20261106
  context: production_gas_domain
  method:
    id: review_tio2_scoped_production_adoption
    revision: '1'
    description: Separate adopted bounded thermal choice and numerical production verification from complete physical
      accuracy.
  evidence:
  - scientific_sources
  - production_execution
  reasons:
  - All 150 production endpoints, six tighter independently assembled candidate controls and two standalone FastChem
    comparisons pass. Dense h parity error2.31e-14; target strict-control ln(x) error1.71e-13; FastChem parity6.74e-09
    dex. Non-TiO2 immediate-base potentials are unchanged; cumulative CN/PS background effects and missing prior-neutral
    single-candidate comparison are explicit.
  status: supported
  origin: reviewed
- id: physical_accuracy_review
  kind: evidence_support
  claim: physical_accuracy
  claim_revision: '1'
  subject: curated_tio2_production_20261106
  context: production_gas_domain
  method:
    id: review_tio2_scoped_production_adoption
    revision: '1'
    description: Separate adopted bounded thermal choice and numerical production verification from complete physical
      accuracy.
  evidence:
  - scientific_sources
  - production_execution
  reasons:
  - Ground-state RRHO neglects anharmonicity, centrifugal distortion, complete excited manifolds and isotope-mixture
    effects. Retained source energy uncertainty and lack of planetary condensation/transport/opacity validation
    are not resolved by numerical agreement.
  status: unknown
  origin: reviewed
follow_ups:
- id: physical_scope
  target_kind: claim
  target: physical_accuracy
  revision: '1'
  action: Add complete rovibronic/anharmonic/isotope or application-specific physical evidence when claiming those
    extensions.
  requires:
  - Keep selected electronic/bend sensitivities distinct from a physical uncertainty interval.
  - A new D0 requires a separate full reaction-cycle review; it is not a prerequisite for the completed retained-energy
    thermal adoption.
  completion: Supply scoped physical evidence or retain unknown without blocking the bounded adopted thermal improvement.
limitations:
- statement: The primary adopts a ground-state RRHO approximation. Selected A-state and bend sensitivities are not
    secretly added or treated as complete error bounds.
  evidence:
  - scientific_sources
- statement: Numerical conservation and solver parity do not establish atmosphere-specific physical accuracy. Differences
    from the old TiO2-only candidate composition include CN/PS background changes.
  evidence:
  - production_execution
