schema_version: '0.2'
model:
  id: exogibbs.vo2_source_review.v1
  name: Gaseous vanadium dioxide source investigation
  description: Audit VO2 reaction conventions and literature evidence without adopting a new thermal model.
  implementation: &id001
    repository: https://github.com/HajimeKawahara/exogibbs
    revision: sha256:ff1182a665c28132cfa242d656e274f8e82a8d74f5c510d228f561f6efada751
    entry_points:
    - mceg/reviews/vo2_source_review.py
assumptions:
- statement: VO2 denotes neutral bent dioxo gas, not condensed VO2/V2O4 or charged/peroxo species.
  evidence:
  - literature_review
- statement: Reaction comparisons retain both V and O atomic references; electronic-only sums are diagnostic and
    omit state-specific rovibrational factors.
  evidence:
  - source_replay
  - literature_review
domains:
- kind: numerical_evaluation
  status: documented
  description: Pinned source nodes, fit grid and existing75-case gas archive.
  conditions:
  - Source nodes500,1000,1500,3000,4000K; no curated extrapolation below1500K.
  - NASA298.15K decomposition uses the local200K extension; the official V and VO2 records start at300K.
  - Current fit1500-4000K; electronic-only diagnostics1500,3000,4000K.
  - 'Saved537-species grid: T1500/2000/2500/3000/4000K, P1e-6/1e-4/0.01/1/100bar, C/Oreference/1/1.5; condensation
    omitted.'
  evidence:
  - source_replay
- kind: scientific_applicability
  status: unknown
  description: Complete thermal and atmospheric accuracy are not established.
  conditions: []
  evidence:
  - literature_review
  - source_replay
claims:
- id: source_attribution
  revision: '1'
  kind: numerical_verification
  statement: Fresh official tables reproduce the source comparison; the thermal difference survives energy alignment,
    and the saved gas grid establishes a finite vanadium footprint.
  scope: Neutral gaseous VO2; V(g) + 2 O(g) -> VO2(g), standard pressure1bar; no source adoption or new equilibrium
    substitution.
- id: conditional_energy_preference
  revision: '1'
  kind: theoretical
  statement: Later all-gas thermochemical evidence favours reassessing JANAF toward weaker VO2 binding; a unique
    complete replacement is not yet selected.
  scope: Directional energy preference with unresolved common atomic references, covariance and thermal model;
    not an exact recommended D0.
- id: complete_thermal_accuracy
  revision: '1'
  kind: physical_validation
  statement: A complete VO2 energy and thermal representation has quantified physical accuracy over1500-4000K.
  scope: Requires consistent energy evaluation and state-specific rovibrational and electronic completeness.
- id: atmospheric_accuracy
  revision: '1'
  kind: physical_validation
  statement: A VO2 thermochemistry replacement improves atmospheric abundance or spectral accuracy.
  scope: Requires a selected candidate and physical benchmarks including relevant condensed phases.
evidence:
- id: literature_review
  kind: literature
  summary: Inspect JANAF pages, Balducci1983 full article, Gunina2012 supporting information and resolved spectroscopy;
    preserve the missing main-text boundary, uncertainty discrepancy and common references.
  sources:
  - tests/data/validation/vo2_source_review/20261102/sources.json
  - tests/data/validation/vo2_source_review/20261102/literature.json
  - tests/data/validation/vo2_source_review/20261102/literature_inputs.json
  scope: Neutral gaseous VO2; V(g) + 2 O(g) -> VO2(g), standard pressure1bar; no source adoption or new equilibrium
    substitution.
  subject: vo2_sources_20261102
  context: source_comparison
  artifacts:
  - source: tests/data/validation/vo2_source_review/20261102/sources.json
    sha256: 4c0e8caaac4ca24b863306546a1b6aa0ddb1bfa0ae06373d800506d6e89f2d88
