contexts:
- id: source_comparison
  scope: Neutral gaseous VO2; V(g) + 2 O(g) -> VO2(g), standard pressure1bar; no source adoption or new equilibrium
    substitution.
  settings:
    standard_pressure_bar: 1
    reaction: V(g) + 2 O(g) -> VO2(g)
    reference_temperature_K: 298.15
    gas_constant_J_mol_K: 8.31446261815324
    temperatures_K: 500, 1000, 1500, 3000, 4000
    partition_scope: Electronic levels only, identical state rovibrational factors; no complete Q or adoption
    grid_dataset: curated-c2h-v1, fixed existing75cases with537species
    elemental_budget: Asplund2021; vary C/H alone for C/O before normalization
    equilibrium_source_substitution: not_run
assessments:
- id: source_attribution_review
  kind: evidence_support
  claim: source_attribution
  claim_revision: '1'
  subject: vo2_sources_20261102
  context: source_comparison
  method: &id002
    id: review_vo2_sources
    revision: '1'
    description: Separate numerical attribution, directional energy preference, complete thermal accuracy and
      physical atmosphere validation.
  evidence:
  - literature_review
  - source_replay
  reasons:
  - Fresh tables reproduce exact baseline nodes; current fit maximum lnK error is0.006291 over1500-4000K. All75
    saved grid cases converged; maxVresidual5.76e-9. These are numerical checks only.
  status: supported
  origin: reviewed
- id: conditional_energy_preference_review
  kind: evidence_support
  claim: conditional_energy_preference
  claim_revision: '1'
  subject: vo2_sources_20261102
  context: source_comparison
  method: *id002
  evidence:
  - literature_review
  - source_replay
  - energy_reasoning
  reasons:
  - Balducci1983 primary abstract reports D0=1177+-18 kJ/mol compared with JANAF1236.342; related later reevaluations
    favour weaker binding but share ancestry and unresolved reference/thermal corrections. RawNASA retains nearly
    the same old molecular formation energy.
  status: supported
  origin: reviewed
- id: complete_thermal_accuracy_review
  kind: evidence_support
  claim: complete_thermal_accuracy
  claim_revision: '1'
  subject: vo2_sources_20261102
  context: source_comparison
  method: *id002
  evidence:
  - literature_review
  - source_replay
  reasons:
  - The JANAF ground-only model omits the low states resolved in2014 spectroscopy; the assignment dispute and
    state-specific rovibrational and higher-state completeness remain. Original1983/2012 reaction data and Gurvich1982
    volume are not fully inspected.
  status: unknown
  origin: reviewed
- id: atmospheric_accuracy_review
  kind: evidence_support
  claim: atmospheric_accuracy
  claim_revision: '1'
  subject: vo2_sources_20261102
  context: source_comparison
  method: *id002
  evidence:
  - literature_review
  - source_replay
  reasons:
  - The reused gas-only footprint omits condensation; no VO2 source substitution or independent physical atmosphere
    benchmark was run.
  status: unknown
  origin: reviewed
follow_ups:
- id: reconcile_energy_and_thermal_sources
  target_kind: claim
  target: complete_thermal_accuracy
  revision: '1'
  action: Reconstruct original equilibrium evaluations with common atomic and VO references, then choose a complete
    thermal representation.
  requires:
  - Balducci1983 and Gunina2012 full reaction data, auxiliary thermochemistry and covariance
  - Original Gurvich1982 source details
  - Resolved electronic and rovibrational model with state completeness and caloric checks
  completion: Justify a consistent candidate and its1500-4000K applicability before finite substitution or production
    adoption.
- id: physical_atmosphere_validation
  target_kind: claim
  target: atmospheric_accuracy
  revision: '1'
  action: Test a selected VO2 candidate in the intended atmosphere.
  requires:
  - VO2-only finite substitution with numerical checks
  - Appropriate condensation and physical abundance/spectral benchmark
  completion: Separate mixture sensitivity from independently demonstrated physical accuracy.
limitations:
- statement: Source uncertainty labels are not converted to a common confidence level or treated as independent
    measurements.
  evidence:
  - literature_review
- statement: JANAF adopts a constant electronic ground weight of2. Its atomic analogy and hypothetical excited-state
    discussion are not an adopted molecular level list; the2024assumed4kJuncertainty does not supersede the primary41.8kJlimit.
  evidence:
  - literature_review
- statement: No exact replacement energy, complete partition function or atmospheric improvement is certified.
  evidence:
  - literature_review
  - source_replay
