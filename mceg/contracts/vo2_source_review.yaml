    sha256: 49d500e99a8a0ad58533aeb3c90792ff74f9bc458d838f41b591436e23d32182
  provenance:
    role: secondary
    location: Fixed VO2 source packet and explicitly identified primary material
    inspection: partial
    note: Primary inspection, secondary reevaluation and unavailable originals remain distinct.
- id: source_replay
  kind: numerical_test
  summary: Replay balanced source properties, printed nodes, current fit, electronic-only moments and all75 archived
    gas cases. Reproduce the1983 selected-energy paths and common-EuO sensitivity; compare printed thermal enthalpy
    increments.
  sources:
  - tests/data/validation/vo2_source_review/20261102/comparison.json
  scope: Neutral gaseous VO2; V(g) + 2 O(g) -> VO2(g), standard pressure1bar; no source adoption or new equilibrium
