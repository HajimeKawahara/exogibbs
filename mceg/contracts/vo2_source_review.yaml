contexts:
- id: source_comparison
  scope: Neutral gaseous VO2; V(g) + 2 O(g) -> VO2(g), standard pressure1bar; no source adoption or new equilibrium
    substitution.
  settings:
    standard_pressure_bar: 1
    reaction: V(g) + 2 O(g) -> VO2(g)
    reference_temperature_K: 298.15
    gas_constant_J_mol_K: 8.31446261815324
    temperatures_K: 500, 1000, 1500, 3000, 4000
    partition_scope: Electronic levels only, identical state rovibrational factors; no complete Q or adoption
    grid_dataset: curated-c2h-v1, fixed existing75cases with537species
    elemental_budget: Asplund2021; vary C/H alone for C/O before normalization
    equilibrium_source_substitution: not_run
- id: finite_gas_grid
  scope: Historical curated-c2h-v1 and energy-only, electronic-only and combined diagnostics; no adopted D0, complete
    thermal replacement or physical abundance validation.
  settings:
    standard_pressure_bar: 1
    species_count: 537
    cases_per_endpoint: 75
    endpoint_solves: 300
    tighter_cold_solves: 300
    temperature_K: 1500, 2000, 2500, 3000, 4000
    pressure_bar: 1e-6, 1e-4, 0.01, 1, 100
    C_over_O: reference, 1, 1.5; vary C/H only before normalization
    energy_shift_J_mol: 59342.0
    electronic_scope: Three doublets relative to ground weight 2, identical state rovibrational factors
    condensation: omitted
- id: experimental_reduction
  scope: Balducci Table I reactions and limited thermal/reference diagnostics; not a new experiment, complete absolute
    reevaluation or calibrated combined uncertainty.
  settings:
    reaction_focus: VO2(g) + V(g) -> 2 VO(g)
    measured_temperature_K: 1913-2282 across the three original reaction paths
    modern_VO_anchor_eV: 6.545
    atomic_limit: Lowest fine-structure separated-atom levels
    adoption: none
assessments:
- id: source_attribution_review
  kind: evidence_support
  claim: source_attribution
  claim_revision: '1'
  subject: vo2_sources_20261102
  context: source_comparison
  method: &id001
    id: review_vo2_sources
    revision: '2'
    description: Separate numerical attribution, directional energy preference, complete thermal accuracy and physical
      atmosphere validation.
  evidence:
  - literature_review
  - source_replay
  reasons:
  - Fresh tables reproduce exact baseline nodes; current fit maximum lnK error is0.006291 over1500-4000K. All75
    saved grid cases converged; maxVresidual5.76e-9. These are numerical checks only.
  status: supported
  origin: reviewed
- id: conditional_energy_preference_review
  kind: evidence_support
  claim: conditional_energy_preference
  claim_revision: '1'
  subject: vo2_sources_20261102
  context: source_comparison
  method: *id001
  evidence:
  - literature_review
  - source_replay
  - energy_reasoning
  reasons:
  - Balducci1983 full text yields D0=1177 kJ/mol through both selected reaction paths, compared with JANAF1236.342.
    The full-text selected uncertainty is11 versus18 in the abstract; Table I path errors are18/12 and share EuO/VO
    references. This supports direction, not a covariance-aware exact replacement.
  status: supported
  origin: reviewed
- id: complete_thermal_accuracy_review
  kind: evidence_support
  claim: complete_thermal_accuracy
  claim_revision: '1'
  subject: vo2_sources_20261102
  context: source_comparison
  method: *id001
  evidence:
  - literature_review
  - source_replay
  reasons:
  - Balducci1983 is now inspected but its ground-only thermal model uses a538cm^-1 bend instead of the later resolved291(2)cm^-1.
    Both JANAF and the1983 model omit resolved low electronic states. Gunina2012 main-text reevaluation, original
    Gurvich1982 and EuO auxiliary evaluations, covariance and complete state-specific thermal functions remain unresolved.
  status: unknown
  origin: reviewed
- id: atmospheric_accuracy_review
  kind: evidence_support
  claim: atmospheric_accuracy
  claim_revision: '1'
  subject: vo2_sources_20261102
  context: source_comparison
  method: *id001
  evidence:
  - literature_review
  - source_replay
  reasons:
  - The separate finite diagnostics establish numerical sensitivity only. No independent physical atmosphere benchmark
    or condensation calculation validates the response.
  status: unknown
  origin: reviewed
- id: finite_sensitivity_review
  kind: evidence_support
  claim: finite_sensitivity
  claim_revision: '1'
  subject: vo2_equilibrium_impact_20261102
  context: finite_gas_grid
  method:
    id: review_vo2_equilibrium_impact
    revision: '1'
    description: Verify archived calculations and explicit diagnostic boundaries without promoting numerical success
      to physical accuracy.
  evidence:
  - finite_sensitivity_replay
  - historical_baseline_revalidation
  reasons:
  - Four explicitly defined VO2-only variants isolate energy and electronic-state responses on the fixed 75-case
    gas grid, with conserved budgets and independent numerical checks.
  - Historical curated-c2h-v1 and energy-only, electronic-only and combined diagnostics; no adopted D0, complete thermal
    replacement or physical abundance validation.
  status: supported
  origin: reviewed
- id: raw_equilibrium_reduction_review
  kind: evidence_support
  claim: raw_equilibrium_reduction
  claim_revision: '1'
  subject: vo2_balducci_reduction_20261102
  context: experimental_reduction
  method:
    id: review_vo2_balducci_reduction
    revision: '1'
    description: Verify archived calculations and explicit diagnostic boundaries without promoting numerical success
      to physical accuracy.
  evidence:
  - raw_equilibrium_reduction_replay
  reasons:
  - Raw printed equilibrium constants reproduce scoped second-law checks and explicitly conditional reference and
    thermal reevaluations; unresolved printed-data residuals remain visible.
  - Balducci Table I reactions and limited thermal/reference diagnostics; not a new experiment, complete absolute
    reevaluation or calibrated combined uncertainty.
  status: supported
  origin: reviewed
follow_ups:
- id: run_finite_diagnostics
  target_kind: claim
  target: finite_sensitivity
  revision: '1'
  action: Evaluate explicit energy and electronic interventions before selecting a complete replacement.
  requires:
  - Fixed network and budgets
  - Thermodynamically consistent named diagnostic interventions
  completion: Archive all endpoints, tighter solves, conservation and independent solver checks; do not infer physical
    accuracy.
- id: reconcile_energy_and_thermal_sources
  target_kind: claim
  target: complete_thermal_accuracy
  revision: '1'
  action: Resolve residuals in the raw equilibrium reduction and complete the common-reference energy and thermal
    evaluation.
  requires:
  - The roughly 21 kJ/mol second-law/third-law inconsistency under the partial thermal update
  - Original reaction-3 weighting/error procedure and the inconsistent reaction-2 2087 K entry
  - Consistent VO/V and VO2 thermal functions, rotational structure, antisymmetric stretch and higher-state coverage
  - Explicit handling of shared references and original uncertainty definitions; no independent-error pooling
  - Original Gurvich1982 details and EuO auxiliary evaluations where those paths are used
  completion: Justify a traceable energy and thermal candidate with applicability limits. Exploratory finite diagnostics
    may precede this completion.
- id: inspect_gunina_when_available
  target_kind: claim
  target: complete_thermal_accuracy
  revision: '1'
  action: Inspect the incoming Gunina2012 main article and compare its reevaluation with the independent reduction.
  requires:
  - Gunina2012 main text
  - Derivation of -185 +/- 15 kJ/mol, auxiliary references, thermal corrections, uncertainty definition and reused
    experiments
  - Mapping of supporting-information reaction numbers to the main text
  - How the reevaluation treats second-law/third-law consistency after thermal changes
  completion: Explain agreement or disagreement without averaging shared experiments. Availability is not the sole
    prerequisite for independently justified adoption.
- id: decide_production_candidate
  target_kind: claim
  target: complete_thermal_accuracy
  revision: '1'
  action: Assess an independently justified candidate separately from diagnostic success.
  requires:
  - Consistent D0/De, zero-point and atomic references
  - Traceable energy reasoning and scoped uncertainty
  - Consistent continuous G/H/S/Cp and assessed omitted-state limitations
  - Finite sensitivity and numerical checks
  completion: Record the reason for adoption or retention and its applicability. A missing later paper alone is
    not a veto; current source gaps remain material.
- id: physical_atmosphere_validation
  target_kind: claim
  target: atmospheric_accuracy
  revision: '1'
  action: Test a selected candidate against an appropriate independent physical atmosphere benchmark.
  requires:
  - Defined observable and physical reference
  - Relevant condensed phases and atmospheric conditions
  completion: Assess physical accuracy independently of conserved gas-only sensitivities.
limitations:
- statement: Source uncertainty labels are not converted to a common confidence level or treated as independent
    measurements.
  evidence:
  - literature_review
- statement: JANAF adopts a constant electronic ground weight of2. Its atomic analogy and hypothetical excited-state
    discussion are not an adopted molecular level list; the2024assumed4kJuncertainty does not supersede the primary41.8kJlimit.
  evidence:
  - literature_review
- statement: No exact replacement energy, complete partition function or atmospheric improvement is certified.
  evidence:
  - literature_review
  - source_replay
- statement: Balducci1983 selected uncertainty11kJ/mol differs from abstract18 and Table I path errors18/12. Gunina2012
    SI lacks the main-text VO/VO2 reevaluation; its captions and columns number reactions differently. No new uncertainty
    or complete replacement is selected.
  evidence:
  - literature_review
  - energy_reasoning
- statement: The +59.342 kJ/mol source-gap perturbation is not a modern common-reference adopted D0. Current VO
    uses Merriles2020 spectroscopy; its separate reanchoring must not be confused with the historical-gap diagnostic.
  evidence:
  - finite_sensitivity_replay
  - raw_equilibrium_reduction_replay
- statement: The electronic-only factor assumes identical state rovibrational factors. Four diagnostic endpoints
    do not establish a complete thermal replacement or a probability distribution for abundance.
  evidence:
  - finite_sensitivity_replay
- statement: Printed-data inconsistencies and pressure/thermal assumptions are retained explicitly in the raw reduction.
    The partial thermal model produces a roughly 21 kJ/mol second-law/third-law discrepancy; its third-law energy
    cannot be adopted alone. The Gunina main text and some auxiliary originals remain unavailable.
  evidence:
  - raw_equilibrium_reduction_replay
  - literature_review
follow_up_resolutions:
- follow_up: run_finite_diagnostics
  evidence:
  - finite_sensitivity_replay
  note: Four endpoints at 75 conditions plus 300 tighter cold solves and four standalone FastChem comparisons are
    archived. Production selection and physical accuracy remain separate.
