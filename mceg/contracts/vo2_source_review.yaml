schema_version: '0.2'
model:
  id: exogibbs.vo2_source_review.v1
  name: Gaseous vanadium dioxide source investigation
  description: Audit VO2 sources, independently reduce raw equilibrium data and isolate energy/electronic sensitivities
    without changing production thermochemistry.
  implementation:
    repository: https://github.com/HajimeKawahara/exogibbs
    revision: sha256:9eb51c1b5557b1bc993bd44c69f08af40a212f50f289502c2ebf8de43fdb698e
    entry_points:
    - mceg/reviews/vo2_source_review.py
    - mceg/reviews/vo2_balducci_reduction.py
    - mceg/reviews/vo2_equilibrium_impact.py
assumptions:
- statement: VO2 denotes neutral bent dioxo gas, not condensed VO2/V2O4 or charged/peroxo species.
  evidence:
  - literature_review
- statement: Reaction comparisons retain both V and O atomic references; electronic-only sums are diagnostic and
    omit state-specific rovibrational factors.
  evidence:
  - source_replay
  - literature_review
domains:
- kind: numerical_evaluation
  status: documented
  description: Pinned source nodes, fit grid and existing75-case gas archive.
  conditions:
  - Source nodes500,1000,1500,3000,4000K; no curated extrapolation below1500K.
  - NASA298.15K decomposition uses the local200K extension; the official V and VO2 records start at300K.
  - Current fit1500-4000K; electronic-only diagnostics1500,3000,4000K.
  - 'Saved537-species grid: T1500/2000/2500/3000/4000K, P1e-6/1e-4/0.01/1/100bar, C/Oreference/1/1.5; condensation
    omitted.'
  evidence:
  - source_replay
- kind: scientific_applicability
  status: unknown
  description: Complete thermal and atmospheric accuracy are not established.
  conditions: []
  evidence:
  - literature_review
  - source_replay
- kind: numerical_evaluation
  status: documented
  description: Historical curated-c2h-v1 and energy-only, electronic-only and combined diagnostics; no adopted D0,
    complete thermal replacement or physical abundance validation.
  conditions:
  - 'standard_pressure_bar: 1'
  - 'species_count: 537'
  - 'cases_per_endpoint: 75'
  - 'endpoint_solves: 300'
  - 'tighter_cold_solves: 300'
  - 'temperature_K: 1500, 2000, 2500, 3000, 4000'
  - 'pressure_bar: 1e-6, 1e-4, 0.01, 1, 100'
  - 'C_over_O: reference, 1, 1.5; vary C/H only before normalization'
  - 'energy_shift_J_mol: 59342.0'
  - 'electronic_scope: Three doublets relative to ground weight 2, identical state rovibrational factors'
  - 'condensation: omitted'
  evidence:
  - finite_sensitivity_replay
- kind: numerical_evaluation
  status: documented
  description: Balducci Table I reactions and limited thermal/reference diagnostics; not a new experiment, complete
    absolute reevaluation or calibrated combined uncertainty.
  conditions:
  - 'reaction_focus: VO2(g) + V(g) -> 2 VO(g)'
  - 'measured_temperature_K: 1913-2282 across the three original reaction paths'
  - 'modern_VO_anchor_eV: 6.545'
  - 'atomic_limit: Lowest fine-structure separated-atom levels'
  - 'adoption: none'
  evidence:
  - raw_equilibrium_reduction_replay
claims:
- id: source_attribution
  revision: '1'
  kind: numerical_verification
  statement: Fresh official tables reproduce the source comparison; the thermal difference survives energy alignment,
    and the saved gas grid establishes a finite vanadium footprint.
  scope: Neutral gaseous VO2; V(g) + 2 O(g) -> VO2(g), standard pressure1bar; no source adoption or new equilibrium
    substitution.
- id: conditional_energy_preference
  revision: '1'
  kind: theoretical
  statement: Later all-gas thermochemical evidence favours reassessing JANAF toward weaker VO2 binding; a unique
    complete replacement is not yet selected.
  scope: Directional energy preference with unresolved common atomic references, covariance and thermal model; not
    an exact recommended D0.
- id: complete_thermal_accuracy
  revision: '1'
  kind: physical_validation
  statement: A complete VO2 energy and thermal representation has quantified physical accuracy over1500-4000K.
  scope: Requires consistent energy evaluation and state-specific rovibrational and electronic completeness.
- id: atmospheric_accuracy
  revision: '1'
  kind: physical_validation
  statement: A VO2 thermochemistry replacement improves atmospheric abundance or spectral accuracy.
  scope: Requires a selected candidate and physical benchmarks including relevant condensed phases.
- id: finite_sensitivity
  revision: '1'
  kind: numerical_verification
  statement: Four explicitly defined VO2-only variants isolate energy and electronic-state responses on the fixed
    75-case gas grid, with conserved budgets and independent numerical checks.
  scope: Historical curated-c2h-v1 and energy-only, electronic-only and combined diagnostics; no adopted D0, complete
    thermal replacement or physical abundance validation.
- id: raw_equilibrium_reduction
  revision: '1'
  kind: numerical_verification
  statement: Raw printed equilibrium constants reproduce scoped second-law checks and explicitly conditional reference
    and thermal reevaluations; unresolved printed-data residuals remain visible.
  scope: Balducci Table I reactions and limited thermal/reference diagnostics; not a new experiment, complete absolute
    reevaluation or calibrated combined uncertainty.
