assessments:
- id: source_construction_review
  kind: evidence_support
  claim: source_construction
  claim_revision: '1'
  subject: nh3_sources_20261104
  context: source_review
  method: &id004
    id: review_nh3_energy_partition_domain
    revision: '1'
    description: Separate balanced energy, spin/zero conventions, source thermal spread, printed-fit failure
      and physical accuracy.
  evidence:
  - literature
  - source_replay
  - retention_reasoning
  reasons:
  - ATcT balancedD0=1157.249kJ/mol versus nativeNASA1157.869893. NativeR treatment gives -73.8826647K
    hybrid shift and reproduces every saved NH3 potential below7.2e-15.
  status: supported
  origin: reviewed
- id: normalized_thermal_comparison_review
  kind: evidence_support
  claim: normalized_thermal_comparison
  claim_revision: '1'
  subject: nh3_sources_20261104
  context: source_review
  method: *id004
  evidence:
  - literature
  - source_replay
  - retention_reasoning
  reasons:
  - TIPS2025/24 relativeNASA is0.994369 at1500K and0.915291 at4000K; the relevant2025 method is a product
    approximation. AllowedE=.793374cm-1,g12 reproduces CoYuTeQ1. Printed2014Q296=1779.076858 disagrees
    with reported1725.24 by3.1205%, beyond fit and coefficient-rounding scales.
  status: supported
  origin: reviewed
- id: provisional_retention_review
  kind: evidence_support
  claim: provisional_retention
  claim_revision: '1'
  subject: nh3_sources_20261104
  context: source_review
  method: *id004
  evidence:
  - literature
  - source_replay
  - retention_reasoning
  reasons:
  - An independently unresolved3.1205% printed-fit discrepancy requires the electronic2014 Q/moment supplement
    before candidate use. CoYuTe opacity target1500K and2014 Q/moment convergence do not establish4000K
    completeness. Source-only review may merge; no claim that future correction is unnecessary.
  status: supported
  origin: reviewed
- id: physical_accuracy_review
  kind: evidence_support
  claim: physical_accuracy
  claim_revision: '1'
  subject: nh3_sources_20261104
  context: source_review
  method: *id004
  evidence:
  - literature
  - source_replay
  - retention_reasoning
  reasons:
  - No direct2014 moment supplement or independently complete4000K state sum, full isotope mixture, exact
    ATcT-to-formal-zero alignment, correlated energy uncertainty or finite atmospheric replacement has
    been established.
  status: unknown
  origin: reviewed
follow_ups:
- id: direct_moment_data
  target_kind: claim
  target: physical_accuracy
  revision: '1'
  action: Obtain and reconcile the electronic NH3Q and first/second moments from DOI10.1016/j.jqsrt.2014.03.012,
    or author-confirmed corrected data.
  requires:
  - Full text already acquired; only the electronic supplement/representation is unresolved.
  - Explain the printed296K mismatch before treating the fit as direct-sum evidence.
  completion: Archive hash-pinned direct moment data and reproduce Q,H,S,Cp where converged. This does
    not block source-only merge.
- id: candidate_upper_domain
  target_kind: claim
  target: physical_accuracy
  revision: '1'
  action: If a material correction is established, build a bounded candidate with a validated upper-temperature
    tail and fixed-network finite substitution.
  requires:
  - Compare DOI10.1016/j.jqsrt.2025.109568 product approximation and DOI10.1093/mnras/stz2778 distributions
    to reconciled direct thermodynamics.
  - Align energy zero and nuclear-spin conventions, separate isotope mass, and state the valid domain.
  - Do not require all historicalNASA/ATcT original papers as a blanket merge gate.
  completion: Document whether the candidate supports the full1500-4000K domain and any equilibrium response;
    retain explicit limitations.
limitations:
- statement: 2014 electronic supplement unavailable; the visually inspected polynomial fails a stated
    direct-Q checkpoint. No erratum was found by limited search; a typo is not asserted.
  evidence:
  - literature
  - source_replay
- statement: CoYuTe metadata2000K differs from the paper opacity target1500K. Full states and direct thermal
    moments were not summed; PF range is not a completeness proof.
  evidence:
  - literature
- statement: TIPS2021 describes direct sums as converged6000K whereas2025 uses a product approximation
    above692K; source labels and sharedExoMol ancestry do not establish independent high-T accuracy.
  evidence:
  - literature
  - source_replay
- statement: The75-case archive gives existing NH3allocation, not replacement sensitivity, condensation,
    transport or observational validation.
  evidence:
  - source_replay
