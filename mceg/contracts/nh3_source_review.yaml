assumptions:
- statement: ATcT atomization is balanced using N,H,NH3 in the same version; a dissociation-channel cutoff
    and individual source-gaugeH0 are not atomization energies.
  evidence:
  - literature
  - source_replay
- statement: Q/24 is the chemical equilibrium spin convention. Formal vibrational and lowest-allowed-state
    zeros require consistent energy anchors; natural-mass and dominant-isotope comparisons remain proxies.
  evidence:
  - literature
  - source_replay
domains:
- kind: numerical_evaluation
  status: documented
  description: Neutral NH3, N(g)+3H(g)->NH3(g), one bar; eight500-4000K diagnostic nodes, production1500-4000K;
    current75-case gas-only footprint, no new solve.
  conditions:
  - No extrapolation of the distributedCoYuTePF above2000K; paper opacity target1500K remains explicit.
  - 2014 fit is diagnostic only, not accepted direct-sum input.
  evidence:
  - source_replay
- kind: scientific_applicability
  status: unknown
  description: Full physical uncertainty and atmosphere accuracy are unresolved.
  conditions: []
  evidence:
  - literature
  - source_replay
claims:
- id: source_construction
  revision: '1'
  kind: numerical_verification
  statement: The unchanged NH3 reaction reproduces NASA thermal functions with same-version balanced ATcT1.172
    energy, separating nativeNASA R and JANAF atomic/thermal terms.
  scope: Neutral NH3, N(g)+3H(g)->NH3(g), one bar; eight500-4000K diagnostic nodes, production1500-4000K;
    current75-case gas-only footprint, no new solve.
- id: normalized_thermal_comparison
  revision: '1'
  kind: numerical_verification
  statement: Frozen officialPF arrays reproduce normalized thermal differences, the allowed inversion-state
    check and the unresolved2014 printed-fit mismatch with explicit source domains.
  scope: Neutral NH3, N(g)+3H(g)->NH3(g), one bar; eight500-4000K diagnostic nodes, production1500-4000K;
    current75-case gas-only footprint, no new solve.
- id: provisional_retention
  revision: '1'
  kind: theoretical
  statement: 'Retain production provisionally while reconciling dedicated direct-sum data: the2025 high-T
    product approximation, CoYuTe domain and unreconciled2014 fit do not establish a full-domain replacement.
    This is not proof that an update is unnecessary.'
  scope: Neutral NH3, N(g)+3H(g)->NH3(g), one bar; eight500-4000K diagnostic nodes, production1500-4000K;
    current75-case gas-only footprint, no new solve.
- id: physical_accuracy
  revision: '1'
  kind: physical_validation
  statement: The NH3 construction has fully quantified physical accuracy across the production and planetary-atmosphere
    domain.
  scope: Neutral NH3, N(g)+3H(g)->NH3(g), one bar; eight500-4000K diagnostic nodes, production1500-4000K;
    current75-case gas-only footprint, no new solve.
