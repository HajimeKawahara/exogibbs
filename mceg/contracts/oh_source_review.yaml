contexts:
- id: source_review
  scope: Neutral OH; H(g)+O(g)->OH(g), one bar; sampled 298.15–4000 K source diagnostics, production 1500–4000
    K; 75 archived 537-species endpoints. No substitution or planetary validation.
  settings:
    reaction: H(g)+O(g)->OH(g)
    standard_pressure_bar: 1
    atomic_energy: ATcT 1.172
    atomic_thermal: NASA native R; JANAF atomic difference separated
    partition_normalization: Common lowest-level zero; spin 2 removed once; electronic and parity states explicit
    curated_change: none
    equilibrium_substitution: not_run
assessments:
- id: source_construction_review
  kind: evidence_support
  claim: source_construction
  claim_revision: '1'
  subject: oh_sources_20261105
  context: source_review
  method:
    id: review_oh_legacy_source_and_candidate_routes
    revision: '1'
    description: Separate the known source defect, reproducible comparisons, scoped candidate recommendation
      and physical accuracy.
  evidence:
  - literature
  - source_replay
  - candidate_reasoning
  reasons:
  - ATcT D0=425.604 kJ/mol versus NASA 425.785900 and JANAF 424.435; native NASA R yields a -21.5857097163
    K shift. Current fit reproduces archived OH potentials below 1e-15.
  status: supported
  origin: reviewed
- id: normalized_thermal_comparison_review
  kind: evidence_support
  claim: normalized_thermal_comparison
  claim_revision: '1'
  subject: oh_sources_20261105
  context: source_review
  method:
    id: review_oh_legacy_source_and_candidate_routes
    revision: '1'
    description: Separate the known source defect, reproducible comparisons, scoped candidate recommendation
      and physical accuracy.
  evidence:
  - literature
  - source_replay
  - candidate_reasoning
  reasons:
  - Nuclear spin product 2 is removed once; explicit parity and fine structure remain. Actual MYTHOS and MoLLIST
    counts are 10606 and 1878; the latter metadata count of 2640 is retained as a discrepancy. Cutting levels
    above D0 changes Q by 33.56 ppm and Cp by 0.03815 J/mol/K at 4000 K.
  status: supported
  origin: reviewed
- id: candidate_priority_review
  kind: evidence_support
  claim: candidate_priority
  claim_revision: '1'
  subject: oh_sources_20261105
  context: source_review
  method:
    id: review_oh_legacy_source_and_candidate_routes
    revision: '1'
    description: Separate the known source defect, reproducible comparisons, scoped candidate recommendation
      and physical accuracy.
  evidence:
  - literature
  - source_replay
  - candidate_reasoning
  reasons:
  - IUPAC 2005 explicitly identifies JANAF degeneracy and caloric errors. NASA/ATcT K divided by current K
    is 1.129141 at 1500 K and 1.054482 at 4000 K; MYTHOS/NASA Q differs by less than 0.1% over the production
    range. No continuous candidate or adoption is implemented.
  status: supported
  origin: reviewed
- id: physical_accuracy_review
  kind: evidence_support
  claim: physical_accuracy
  claim_revision: '1'
  subject: oh_sources_20261105
  context: source_review
  method:
    id: review_oh_legacy_source_and_candidate_routes
    revision: '1'
    description: Separate the known source defect, reproducible comparisons, scoped candidate recommendation
      and physical accuracy.
  evidence:
  - literature
  - source_replay
  - candidate_reasoning
  reasons:
  - Correlated energy uncertainty, full state and continuum completeness, isotope mixtures and planetary accuracy
    remain unestablished. Existing abundances describe a footprint, not substitution responses.
  status: unknown
  origin: reviewed
follow_ups:
- id: candidate_and_substitution
  target_kind: claim
  target: candidate_priority
  revision: '1'
  action: Build a continuous NASA thermal plus ATcT candidate, compare the MYTHOS thermal alternative and run
    finite substitutions on the fixed network; check H/O conservation and H2O/OH/O/O2 responses.
  requires:
  - IUPAC 2005 DOI 10.1063/1.1724828 and MYTHOS DOI 10.1093/mnras/stae2803 are inspected; no missing essential
    paper.
  - Same energy zero, spin normalization and quasi-bound threshold sensitivity; all prior versions preserved.
  completion: Record candidate and application checks before production adoption; not required to merge this
    scoped source review.
- id: uncertainty_and_provenance
  target_kind: claim
  target: physical_accuracy
  revision: '1'
  action: Bound high-energy/continuum uncertainty and correlated energy covariance; reconcile MoLLIST metadata
    and PF distribution if reused.
  requires:
  - Optional historical Gurvich original pages, ATcT covariance and upstream distribution clarification.
  completion: Record quantified limits or remaining unknowns; original-book acquisition is not an unconditional
    merge gate.
limitations:
- statement: IUPAC/Gurvich and NASA thermal ancestry overlap; MYTHOS and MoLLIST share empirical spectroscopy.
    Agreement is not independent physical validation.
  evidence:
  - literature
- statement: Last-shell populations and a strict D0 cut are diagnostics, not rigorous completeness bounds;
    continuum and isotope mixtures remain outside scope.
  evidence:
  - source_replay
- statement: The current 75-case oxygen footprint is not an abundance response or observational/photochemical
    validation.
  evidence:
  - source_replay
