schema_version: '0.2'
model:
  id: exogibbs.oh_source_review.v1
  name: OH legacy-source defect and replacement-candidate review
  description: Prioritize a NASA/ATcT candidate with MYTHOS thermal control; production remains unchanged.
  implementation: &id001
    repository: https://github.com/HajimeKawahara/exogibbs
    revision: sha256:a9450f7616d87089293851446c5fa4241b4b29f9ef1a0a84543b4a588223c90d
    entry_points:
    - mceg/reviews/oh_source_review.py
assumptions:
- statement: Use same-version atom-balanced D0 and a common lowest-level zero; retain native NASA R in dimensionless
    functions and full atomic thermal references.
  evidence:
  - literature
  - source_replay
- statement: Remove nuclear spin product 2 once; representative 16O1H internal states with natural mass form
    an elemental proxy, not an isotope-resolved reaction.
  evidence:
  - literature
  - source_replay
domains:
- kind: numerical_evaluation
  status: documented
  description: Neutral OH; H(g)+O(g)->OH(g), one bar; sampled 298.15–4000 K source diagnostics, production
    1500–4000 K; 75 archived 537-species endpoints. No substitution or planetary validation.
  conditions:
  - No production extrapolation beyond 1500–4000 K.
  - IUPAC thermal ancestry and shared MYTHOS/MoLLIST spectroscopy limit independence.
  evidence:
  - source_replay
  - literature
- kind: scientific_applicability
  status: unknown
  description: Full physical uncertainty and planetary accuracy are unestablished.
  conditions: []
  evidence:
  - literature
  - source_replay
claims:
- id: source_construction
  revision: '1'
  kind: numerical_verification
  statement: The unchanged OH column is the inherited JANAF/FastChem fit; balanced energies, native NASA R
    and energy/thermal/fit differences are separated.
  scope: Neutral OH; H(g)+O(g)->OH(g), one bar; sampled 298.15–4000 K source diagnostics, production 1500–4000
    K; 75 archived 537-species endpoints. No substitution or planetary validation.
- id: normalized_thermal_comparison
  revision: '1'
  kind: numerical_verification
  statement: Actual MYTHOS and MoLLIST states reproduce spin-normalized moments and scoped Q/Cp comparisons,
    retaining metadata and PF inconsistencies.
  scope: Neutral OH; H(g)+O(g)->OH(g), one bar; sampled 298.15–4000 K source diagnostics, production 1500–4000
    K; 75 archived 537-species endpoints. No substitution or planetary validation.
- id: candidate_priority
  revision: '1'
  kind: theoretical
  statement: Known JANAF OH caloric defects justify prioritizing a replacement candidate; NASA thermal plus
    balanced ATcT is the smallest first route, with MYTHOS as a thermal sensitivity.
  scope: Neutral OH; H(g)+O(g)->OH(g), one bar; sampled 298.15–4000 K source diagnostics, production 1500–4000
    K; 75 archived 537-species endpoints. No substitution or planetary validation.
- id: physical_accuracy
  revision: '1'
  kind: physical_validation
  statement: OH thermal and reaction data have complete quantified uncertainty and predict accurate planetary
    abundances.
  scope: Neutral OH; H(g)+O(g)->OH(g), one bar; sampled 298.15–4000 K source diagnostics, production 1500–4000
    K; 75 archived 537-species endpoints. No substitution or planetary validation.
