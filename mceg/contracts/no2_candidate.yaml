contexts:
- id: fixed_ch2_networks
  scope: NO2 neutral gas, explicit same-version balanced physical energy; 1 bar standard state, 1500-4000 K, fixed
    curated-ch2-v1 ion537/neutral421 networks; no production adoption.
  settings:
    baseline_dataset: curated-ch2-v1
    new_endpoint_solves: 300
    new_control_solves: 28
    independent_fastchem_runs: 6
    reused_baseline_cases: 150
    curated_update: none
    recommended_variant: retained
assessments:
- id: continuous_thermodynamics_review
  kind: evidence_support
  claim: continuous_thermodynamics
  claim_revision: '1'
  subject: no2_bounded_candidates_20261106
  context: fixed_ch2_networks
  method:
    id: review_no2_bounded_candidates
    revision: '1'
    description: Separate source anchoring, numerical substitutions, scoped selection and unknown complete physical
      accuracy.
  evidence:
  - source_scope
  - candidate_validation
  - finite_execution
  - decision_reasoning
  reasons:
  - Physical JANAF D0=928.473000 kJ/mol changes to the balanced ATcT 1.228 D0=927.415000 kJ/mol. The retained-thermal
    variant changes formation G and H by +1058.000 J/mol, leaving S and Cp unchanged. Native NASA R and SI insertion
    are separated; missing source zero remains missing.
  status: supported
  origin: reviewed
- id: finite_substitution_review
  kind: evidence_support
  claim: finite_substitution
  claim_revision: '1'
  subject: no2_bounded_candidates_20261106
  context: fixed_ch2_networks
  method:
    id: review_no2_bounded_candidates
    revision: '1'
    description: Separate source anchoring, numerical substitutions, scoped selection and unknown complete physical
      accuracy.
  evidence:
  - source_scope
  - candidate_validation
  - finite_execution
  - decision_reasoning
  reasons:
  - All 300 fresh endpoints and 28 controls pass. FastChem differences are at most 1.49149e-08 dex. Both fixed networks
    use the same verified baseline archive.
  status: supported
  origin: reviewed
- id: scoped_selection_review
  kind: evidence_support
  claim: scoped_selection
  claim_revision: '1'
  subject: no2_bounded_candidates_20261106
  context: fixed_ch2_networks
  method:
    id: review_no2_bounded_candidates
    revision: '1'
    description: Separate source anchoring, numerical substitutions, scoped selection and unknown complete physical
      accuracy.
  evidence:
  - source_scope
  - candidate_validation
  - finite_execution
  - decision_reasoning
  reasons:
  - The 2025 ground-manifold TIPS diagnostic has Q/NASA about 0.96865 to 0.86081, while energy-aligned JANAF/NASA
    is about 0.939 to 0.818. A ground-manifold calculation is not a complete coupled rovibronic partition function,
    so a smaller discrepancy does not by itself validate the NASA replacement. The 2025 corrigendum concerns a mixed-isotope
    record, not a correction to the selected principal record. The balanced ATcT energy update is independent of
    this unresolved thermal ranking. Prefer the retained-thermal ATcT energy update, with NASA thermals retained
    only as a sensitivity; coordinate any adoption with the N2O4 energy cycle.
  status: supported
  origin: reviewed
- id: thermal_superiority_review
  kind: evidence_support
  claim: thermal_superiority
  claim_revision: '1'
  subject: no2_bounded_candidates_20261106
  context: fixed_ch2_networks
  method:
    id: review_no2_bounded_candidates
    revision: '1'
    description: Separate source anchoring, numerical substitutions, scoped selection and unknown complete physical
      accuracy.
  evidence:
  - source_scope
  - candidate_validation
  - finite_execution
  - decision_reasoning
  reasons:
  - Coupled electronic/vibrational completeness, isotope normalization and thermal derivatives remain physical limitations.
    The associated N2O4 packet evaluates the joint NO2/N2O4 update.
  status: unknown
  origin: reviewed
- id: universal_gibbs_resolution_review
  kind: evidence_support
  claim: universal_gibbs_resolution
  claim_revision: '1'
  subject: no2_bounded_candidates_20261106
  context: fixed_ch2_networks
  method:
    id: review_no2_bounded_candidates
    revision: '1'
    description: Separate source anchoring, numerical substitutions, scoped selection and unknown complete physical
      accuracy.
  evidence:
  - source_scope
  - candidate_validation
  - finite_execution
  - decision_reasoning
  reasons:
  - 4/300 comparisons are above the displayed diagnostic scale; 296 remain unresolved. This is not a rigorous bound
    or a cross-model physical ranking.
  status: unknown
  origin: reviewed
- id: physical_accuracy_review
  kind: evidence_support
  claim: physical_accuracy
  claim_revision: '1'
  subject: no2_bounded_candidates_20261106
  context: fixed_ch2_networks
  method:
    id: review_no2_bounded_candidates
    revision: '1'
    description: Separate source anchoring, numerical substitutions, scoped selection and unknown complete physical
      accuracy.
  evidence:
  - source_scope
  - candidate_validation
  - finite_execution
  - decision_reasoning
  reasons:
