model:
  id: exogibbs.no2_candidate.v1
  name: 'NO2: bounded candidates and fixed-network substitution'
  description: Prefer the retained-thermal ATcT energy update, with NASA thermals retained only as a sensitivity;
    coordinate any adoption with the N2O4 energy cycle.
