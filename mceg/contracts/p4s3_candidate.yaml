contexts:
- id: candidate_evaluation
  scope: Neutral P4S3 ideal gas; the old estimated table does not resolve cage isomers and has no molecular
    zero-K anchor. 1 bar standard pressure,1500-4000 K. Fixed curated-ch2-v1 ion537/neutral421 networks and75
    cases each. No production adoption.
  settings:
    dataset: curated-ch2-v1
    curated_update: none
    fresh_endpoints: 150
    reused_baseline: 150
    tighter_solves: 12
    path_solves: 10
    selected_variant_solves: 4
    FastChem_executions: 4
    dtype: float64
assessments:
- id: continuous_thermodynamics_review
  kind: evidence_support
  claim: continuous_thermodynamics
  claim_revision: '1'
  subject: p4s3_candidates_and_substitution_20261106
  context: candidate_evaluation
  method:
    id: p4s3_source_and_finite_substitution
    revision: '1'
    description: Separate source energies, model contrasts and finite numerical response from physical-accuracy
      claims.
  evidence:
  - source_scope
  - candidate_validation
  - finite_execution
  - decision_reasoning
  reasons:
  - 'The physical comparison is H298-based: G/H shift by +56.542000 kJ/mol; S/Cp and the complete fit residual
    are unchanged. Neither a molecular H0 nor a physical D0 is available. Dense and off-grid independent calorics
    agree.'
  status: supported
  origin: reviewed
- id: finite_substitution_review
  kind: evidence_support
  claim: finite_substitution
  claim_revision: '1'
  subject: p4s3_candidates_and_substitution_20261106
  context: candidate_evaluation
  method:
    id: p4s3_source_and_finite_substitution
    revision: '1'
    description: Separate source energies, model contrasts and finite numerical response from physical-accuracy
      claims.
  evidence:
  - source_scope
  - candidate_validation
  - finite_execution
  - decision_reasoning
  reasons:
  - 150 fresh endpoints and explicit selected controls pass. Bulk/source accuracy is not inferred from solver
    agreement.
  status: supported
  origin: reviewed
- id: candidate_direction_review
  kind: evidence_support
  claim: candidate_direction
  claim_revision: '1'
  subject: p4s3_candidates_and_substitution_20261106
  context: candidate_evaluation
  method:
    id: p4s3_source_and_finite_substitution
    revision: '1'
    description: Separate source energies, model contrasts and finite numerical response from physical-accuracy
      claims.
  evidence:
  - source_scope
  - candidate_validation
  - finite_execution
  - decision_reasoning
  reasons:
  - If updating this estimated source, prefer the2019 cycle-based H298 energy while retaining explicit thermal
    limitations. This is scientifically supported but very low priority for the tested hot gas. A tiny bulk
    response is not evidence of general irrelevance; a full cage thermal model remains deferred.
  status: supported
  origin: reviewed
- id: physical_accuracy_review
  kind: evidence_support
  claim: physical_accuracy
  claim_revision: '1'
  subject: p4s3_candidates_and_substitution_20261106
  context: candidate_evaluation
  method:
    id: p4s3_source_and_finite_substitution
    revision: '1'
    description: Separate source energies, model contrasts and finite numerical response from physical-accuracy
      claims.
  evidence:
  - source_scope
  - candidate_validation
  - finite_execution
  - decision_reasoning
  reasons:
  - The less-converged direct-atomization route Hf298=-103.9 is a selected sensitivity, not the primary value.
    Its TAE0+/-6.4 kJ/mol uncertainty does not belong to the preferred cycle. Old constant-Cp thermals and
    absent cage frequency data remain limitations; the finite grid has an extremely small P4S3 inventory. Marginal
    source widths do not supply reaction covariance or a complete thermal uncertainty.
  status: unknown
  origin: reviewed
- id: universal_gibbs_resolution_review
  kind: evidence_support
  claim: universal_gibbs_resolution
  claim_revision: '1'
  subject: p4s3_candidates_and_substitution_20261106
  context: candidate_evaluation
  method:
    id: p4s3_source_and_finite_substitution
    revision: '1'
    description: Separate source energies, model contrasts and finite numerical response from physical-accuracy
      claims.
  evidence:
  - source_scope
  - candidate_validation
  - finite_execution
  - decision_reasoning
  reasons:
  - Some finite trace exchanges remain below the displayed numerical scale. Path tolerances are finite consistency
    checks, not rigorous monotonicity proof for arbitrary small effects.
  status: unknown
  origin: reviewed
