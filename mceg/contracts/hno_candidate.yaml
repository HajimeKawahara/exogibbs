contexts:
- id: fixed_ch2_networks
  scope: HNO neutral gas, explicit same-version balanced physical energy; 1 bar standard state, 1500-4000 K, fixed
    curated-ch2-v1 ion537/neutral421 networks; no production adoption.
  settings:
    baseline_dataset: curated-ch2-v1
    new_endpoint_solves: 300
    new_control_solves: 28
    independent_fastchem_runs: 6
    reused_baseline_cases: 150
    curated_update: none
    recommended_variant: retained
assessments:
- id: continuous_thermodynamics_review
  kind: evidence_support
  claim: continuous_thermodynamics
  claim_revision: '1'
  subject: hno_bounded_candidates_20261106
  context: fixed_ch2_networks
  method:
    id: review_hno_bounded_candidates
    revision: '1'
    description: Separate source anchoring, numerical substitutions, scoped selection and unknown complete physical
      accuracy.
  evidence:
  - source_scope
  - candidate_validation
  - finite_execution
  - decision_reasoning
  reasons:
  - Physical JANAF D0=831.145000 kJ/mol changes to the balanced ATcT 1.228 D0=823.532000 kJ/mol. The retained-thermal
    variant changes formation G and H by +7613.000 J/mol, leaving S and Cp unchanged. Native NASA R and SI insertion
    are separated; missing source zero remains missing.
  status: supported
  origin: reviewed
- id: finite_substitution_review
  kind: evidence_support
  claim: finite_substitution
  claim_revision: '1'
  subject: hno_bounded_candidates_20261106
  context: fixed_ch2_networks
  method:
    id: review_hno_bounded_candidates
    revision: '1'
    description: Separate source anchoring, numerical substitutions, scoped selection and unknown complete physical
      accuracy.
  evidence:
  - source_scope
  - candidate_validation
  - finite_execution
  - decision_reasoning
  reasons:
  - All 300 fresh endpoints and 28 controls pass. FastChem differences are at most 3.38969e-07 dex. Both fixed networks
    use the same verified baseline archive.
  status: supported
  origin: reviewed
- id: scoped_selection_review
  kind: evidence_support
  claim: scoped_selection
  claim_revision: '1'
  subject: hno_bounded_candidates_20261106
  context: fixed_ch2_networks
  method:
    id: review_hno_bounded_candidates
    revision: '1'
    description: Separate source anchoring, numerical substitutions, scoped selection and unknown complete physical
      accuracy.
  evidence:
  - source_scope
  - candidate_validation
  - finite_execution
  - decision_reasoning
  reasons:
  - The 7.613 kJ/mol decrease in balanced atomization energy is appreciably larger than the other small nitrogen
    corrections. The inspected HNO -> H + NO threshold near 16450 cm-1 is a single fragmentation threshold, not
    the total H + N + O atomization energy. Same-version ATcT atom and molecule values are balanced explicitly.
    A complete modern hot partition function was not available; the NASA comparison tests the thermal consequence
    without treating numerical agreement with an independent solver as source validation. Recommend the retained-thermal
    ATcT energy correction; the NASA thermal alternative is a quantified sensitivity without demonstrated physical
    superiority.
  status: supported
  origin: reviewed
- id: thermal_superiority_review
  kind: evidence_support
  claim: thermal_superiority
  claim_revision: '1'
  subject: hno_bounded_candidates_20261106
  context: fixed_ch2_networks
  method:
    id: review_hno_bounded_candidates
    revision: '1'
    description: Separate source anchoring, numerical substitutions, scoped selection and unknown complete physical
      accuracy.
  evidence:
  - source_scope
  - candidate_validation
  - finite_execution
  - decision_reasoning
  reasons:
  - The source threshold, total atomization energy and source-specific thermal function remain distinct. Neither
    hot hydrogen-rich trace abundance nor solver precision validates atmospheric kinetics or complete physical uncertainty.
  status: unknown
  origin: reviewed
