contexts:
- id: declared_gas_comparison
  scope: Neutral gas equilibrium at declared temperature knots and pressure, with source and network interventions held distinct from physical validation.
  settings:
    pressure_bar: 0.001
    reference_pressure_bar: 1.0
    lower_sampled_temperature_K: 200.0
    upper_sampled_temperature_K: 3000.0
    samples_per_profile: 121
    condensation: false
    ions: false
    abundance_source: Asplund 2021
assessments:
- id: ohno_numerical_review
  kind: evidence_support
  claim: matched_numerical_closure
  claim_revision: '1'
  subject: ohno_public_snapshot
  context: declared_gas_comparison
  method: &method
    id: native_source_and_controlled_comparison
    revision: '1'
    description: Inspect native selection, primitive closure, matched-input equilibrium solvers and controlled interventions without transferring numerical support to physical accuracy.
  evidence: [numerical_execution]
  reasons:
  - All 968 ExoGibbs samples pass; maximum elemental relative residual is 4.42e-8, log mass-action residual is 9.10e-12, and matched native log mole fraction difference is 6.69e-8.
  - Four native profiles pass closure, and their standard output is byte-identical with and without diagnostic-only source writes.
  status: supported
  origin: reviewed
- id: ohno_sensitivity_review
  kind: evidence_support
  claim: source_species_background_effects
  claim_revision: '1'
  subject: ohno_public_snapshot
  context: declared_gas_comparison
  method: *method
  evidence: [numerical_execution]
  reasons:
  - At 992.851 K in the seven-element network, substituting only baseline P4O6 into full Burcat gives 99.19 percent of P atoms in P4O6 despite all additional gas competitors.
  - At 504.500 K, omitting H3PO4 and HPO2 increases Burcat P4O10 allocation from 63.41 to 94.39 percent in the seven-element network.
  - Expanding from seven to 27 elements changes one carrier by up to 12.95 percentage points in the baseline and 23.23 percentage points with Burcat priority, while the qualitative source contrast persists.
  status: supported
  origin: reviewed
- id: ohno_physical_review
  kind: evidence_support
  claim: phosphorus_physical_accuracy
  claim_revision: '1'
  subject: ohno_public_snapshot
  context: declared_gas_comparison
  method: *method
  evidence: [source_selection, numerical_execution]
  reasons:
  - Independent thermochemical constraints, per-record source validity bounds and sufficient species or phase coverage are not established; numerical solver agreement cannot resolve a shared physical error.
  status: unknown
  origin: reviewed
follow_ups:
- id: assess_source_anchors_and_phases
  target_kind: claim
  target: phosphorus_physical_accuracy
  revision: '1'
  action: Resolve source evaluations and validity intervals for competing P oxides and acids, then test candidate gases and phases at declared application conditions before production adoption.
  requires: [Original source evaluations, Reference-state and phase checks, Independent energy constraints, Application conditions]
  completion: Record independently supported source choices and controlled network effects; retain unknown where physical evidence is insufficient.
- id: compare_original_ohno_inputs
  target_kind: evidence
  target: source_selection
  action: If the original input snapshot becomes available, run it alongside the declared public comparison.
  requires: [Original GGChem revision, Selected source files, Species and element lists, Abundances and phase settings]
  completion: Compare curves with original settings and isolate any remaining changes from the declared public run.
