assessments:
- id: source_attribution_review
  kind: evidence_support
  claim: source_attribution
  claim_revision: '1'
  subject: s5_sources_20261103
  context: source_comparison
  method: &id002
    id: s5_source_review
    revision: '1'
    description: Keep source reproduction, literature access, model footprint and complete physical accuracy distinct.
  evidence:
  - literature_review
  - source_replay
  reasons:
  - Balanced energy/thermal terms reproduce the frozen discrepancy. Native atomic differences and small inherited-fit
    residuals are accounted for; the 298 K unused-column error is retained separately.
  status: supported
  origin: reviewed
- id: numerical_replay_review
  kind: evidence_support
  claim: numerical_replay
  claim_revision: '1'
  subject: s5_sources_20261103
  context: source_comparison
  method: *id002
  evidence:
  - source_replay
  reasons:
  - Input and artifact hashes pin the offline replay. The existing grid finds a tiny S5 sulfur share, but does not
    test a replacement or validate real abundances.
  status: supported
  origin: reviewed
- id: physical_accuracy_review
  kind: evidence_support
  claim: physical_accuracy
  claim_revision: '1'
  subject: s5_sources_20261103
  context: source_comparison
  method: *id002
  evidence:
  - literature_review
  - source_replay
  reasons:
  - Gurvich state/energy assumptions and Rau full text remain unreviewed; competing thermal models, isomer counting
    and uncertainty are unresolved. No candidate substitution is solved.
  status: unknown
  origin: reviewed
follow_ups:
- id: reconcile_original_sources
  target_kind: claim
  target: physical_accuracy
  revision: '1'
  action: Review the original S5 energy/state inventory and entropy normalization before selecting a replacement.
  requires:
  - Gurvich 1989 volume 1, part 1 page 281 and part 2 page 169; no verified DOI.
  - Rau et al. 1973 full text, DOI 10.1016/S0021-9614(73)80045-X, and original JANAF S5 evaluation notes.
  - Geometry, symmetry/electronic weights, vibrational frequencies, isomer counting, energy derivations and correlated
    uncertainties.
  completion: Record a scoped assessment of the entropy offset, energy anchor and uncertainty; no requirement to
    claim complete physical validation to merge this source review.
- id: evaluate_scoped_candidate
  target_kind: claim
  target: physical_accuracy
  revision: '1'
  action: If a replacement is preferred, reconstruct individual S5 standard functions and assess them in a domain-relevant
    fixed network.
  requires:
  - Consider Jackson et al. 2016, DOI 10.1039/C5SC03088A; code DOI 10.5281/zenodo.28536 and DFT data DOI 10.6084/m9.figshare.1513736
    have not been reproduced.
  - Explicit atomic energy alignment and state/isomer inventory; never substitute mixture chemical potential for
    one species.
  - Conservation, mass-action residuals, absolute abundance and sulfur allocation in declared conditions; reassess
    cooler/sulfur-rich regimes separately.
  completion: Archive candidate functions, coverage limits and a separate substitution receipt; retain unrun or
    failed cases. Existing trace footprint is not a physical error bound.
limitations:
- statement: Source agreement and numerical replay do not establish that either legacy thermal model is physically
    correct; current retention is provisional.
  evidence:
  - literature_review
  - source_replay
- statement: The official 298 K free-energy-function inconsistency is separate from H/S-based constants. Its historical
    origin and presence in the printed edition are not established.
  evidence:
  - literature_review
  - source_replay
- statement: Full publications are not committed; public-download hashes identify inspected bytes, and selected
    factual excerpts support offline reproduction.
  evidence:
  - literature_review
