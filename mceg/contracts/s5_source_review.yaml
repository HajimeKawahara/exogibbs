schema_version: '0.2'
model:
  id: exogibbs.s5_source_review.v1
  name: S5 energy and thermal-source investigation
  description: Separate the large S5 source difference from an unused JANAF-column inconsistency and a tiny existing-grid
    footprint; retain the current fit provisionally.
  implementation: &id001
    repository: https://github.com/HajimeKawahara/exogibbs
    revision: sha256:df255e49f0ed412849e43e43968c91e27d4a94413a3180d2a5f8b7ebaaa6836d
    entry_points:
    - mceg/reviews/s5_source_review.py
assumptions:
- statement: The comparison balances one neutral S5 molecule against five neutral S atoms in each source reference
    convention, at 1 bar. H298 alignment is diagnostic only.
  evidence:
  - literature_review
  - source_replay
domains:
- kind: numerical_evaluation
  status: documented
  description: Exact source nodes and an existing gas-only equilibrium archive.
  conditions:
  - Source decomposition at 500, 1000, 1500, 2000, 3000, 4000 K; curated samples only at 1500 and 3000 K from the
    frozen baseline.
  - Eight JANAF molecular rows at 298.15, 300, 500, 1000, 1500, 2000, 3000 and 4000 K; no sub-298 K extrapolation.
  - 'Reused 75-case, 537-species ion-inclusive grid: 1500-4000 K, 1e-6-100 bar; reference C/O, 1 and 1.5. No new
    equilibrium solve.'
  evidence:
  - source_replay
- kind: scientific_applicability
  status: unknown
  description: High-temperature state completeness and physical atmosphere accuracy are unresolved; tiny archived
    abundance is not an uncertainty bound.
  conditions: []
  evidence:
  - literature_review
  - source_replay
claims:
- id: source_attribution
  revision: '1'
  kind: numerical_verification
  statement: The sampled S5 difference is principally molecular and survives balanced H298 alignment; the isolated
    JANAF free-energy-function inconsistency is not used by the H/S reconstruction.
  scope: Neutral S5 gas; 5 S(g) -> S5(g), standard pressure 1 bar. Native JANAF/NASA atomic references; archived
    grid footprint only.
- id: numerical_replay
  revision: '1'
  kind: numerical_verification
  statement: The official coefficient/node checks, source decomposition and S5 sulfur share in the archived 75-case
    grid reproduce offline.
  scope: Neutral S5 gas; 5 S(g) -> S5(g), standard pressure 1 bar. Native JANAF/NASA atomic references; archived
    grid footprint only.
- id: physical_accuracy
  revision: '1'
  kind: physical_validation
  statement: The chosen S5 thermochemical functions and atmospheric abundances have quantified physical accuracy
    over the intended applications.
  scope: Neutral S5 gas; 5 S(g) -> S5(g), standard pressure 1 bar. Native JANAF/NASA atomic references; archived
    grid footprint only.
