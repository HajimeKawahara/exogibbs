follow_ups:
- id: balanced_thermal_candidate
  target_kind: claim
  target: physical_accuracy
  revision: '1'
  action: Construct a named modern atom-balanced energy and linear-radical thermal candidate; preserve cyclic and
    ionic identity distinctions.
  requires:
  - Use same-version atomic and molecular energy entries; quantify correlations where available instead of independent-error
    assumptions.
  - Assess tentative vibrational assignments, spin-orbit weights, anharmonicity and excited states; targeted originals
    Beaman 1987 DOI 10.1021/j100308a006 and Brazier 1988 DOI 10.1063/1.455122.
  - For energy provenance, Cook 1999 DOI 10.1039/A805936E and Yuan 2008 DOI 10.1021/jp800062t; Dixon 2004 DOI 10.1021/ja0303182
    is a theoretical route already contributing to ATcT.
  - Gurvich 1989 volume 1 part 1 page 325 / part 2 page 202 can resolve legacy choices; no verified DOI and not
    a requirement to obtain every historical original before evaluating a modern candidate.
  completion: Archive explicit candidate functions, source-inspection scope, energy zero, state inventory and thermal
    uncertainty over its declared domain.
- id: finite_substitution
  target_kind: claim
  target: physical_accuracy
  revision: '1'
  action: Evaluate the named candidate by controlled finite substitution on a fixed network before curated adoption.
  requires:
  - Conserved budgets, mass-action residuals, absolute abundance and nitrogen allocation; archive failures and domain
    limits.
  - Keep gas-equilibrium applicability separate from photochemical production, matrix trapping and radical lifetimes.
  completion: Record a scoped adoption assessment and candidate response, without treating the tiny baseline footprint
    as a physical error bound.
limitations:
- statement: Retaining current curated is provisional and does not assert scientific correction is unnecessary.
  evidence:
  - literature_review
  - source_replay
- statement: Native NASA thermal functions are not validated by agreement with a modern energy anchor; original
    spectroscopy and Gurvich source gaps remain.
  evidence:
  - literature_review
  - source_replay
- statement: The modern CAS and JANAF index differ; printed state and charge are used to identify the radical. No
    ionic or cyclic model is substituted.
  evidence:
  - literature_review
  - source_replay
- statement: No combined ATcT uncertainty without covariance; no new equilibrium solve and no physical validation
    from the finite archived footprint.
  evidence:
  - literature_review
  - source_replay
