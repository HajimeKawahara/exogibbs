    and archived grid.
- id: conditional_energy_direction
  revision: '1'
  kind: theoretical
  statement: A same-version modern energy evaluation supports investigating weaker binding than both inherited JANAF
    and historical NASA.
  scope: Neutral linear N3 radical, 3 N(g) -> N3(g), standard pressure 1 bar; native source atoms, ATcT 1.172 diagnostic
    and archived grid.
- id: numerical_replay
