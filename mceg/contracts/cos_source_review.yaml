limitations:
- statement: Old Gurvich volumes and original JANAF evaluation derivations were not independently reaudited;
    source attribution and numerical reproduction are narrower claims.
  evidence:
  - literature
  - source_replay
- statement: ATcT version changes are evaluated-network differences, not statistically independent measurements;
    covariance and full physical uncertainty are absent.
  evidence:
  - literature
  - source_replay
- statement: One principal isotope partition function plus natural-mass translation is an elemental proxy,
    not an isotopic mixture.
  evidence:
  - literature
  - source_replay
- statement: Finite differences of rounded PF tables are caloric diagnostics with rounding and step checks,
    not a production derivative model. The direct/product crossover is not smooth.
  evidence:
  - literature
  - source_replay
- statement: No new equilibrium substitution; the archived hot gas grid does not establish relevance across
    all planetary atmospheres.
  evidence:
  - literature
  - source_replay
