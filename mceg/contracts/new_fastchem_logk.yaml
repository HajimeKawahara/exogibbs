follow_ups:
- id: controlled_cross_retrieval
  target_kind: claim
  target: retrieval_metallicity_effect
  revision: '1'
  action: Define the consumer observing/retrieval configuration, revise the quantitative claim, and cross-retrieve
    common synthetic spectra while changing only the thermochemical table.
  requires:
  - Temperature/pressure structure and composition within the reviewed data domain; wavelength range,
    resolution, line opacities, clouds and geometry.
  - Fixed noise/covariance realization, random seeds, priors, fitted parameters and sampler convergence
    criteria.
  - Both table directions plus same-table injection/recovery controls; a declared reporting threshold
    before interpretation.
  completion: Archive spectra, posterior samples and convergence checks. Report Delta[M/H] in dex, C/O
    and temperature shifts, and shifts relative to posterior widths. Add a new context-bound assessment.
    Synthetic recovery establishes sensitivity for that experiment, not real-atmosphere accuracy.
  sources:
  - https://github.com/HajimeKawahara/exogibbs/issues/297
  - https://doi.org/10.3847/1538-4357/ac6dcd
- id: physical_thermochemistry_review
  target_kind: claim
  target: whole_mixture_accuracy
  revision: '1'
  action: Review the underlying atomic/molecular sources and independent physical constraints for a declared
    application.
  requires:
  - Primary energy and partition data with species, reference-state and temperature conventions.
  - Correlated energy uncertainties and an explicit criterion for the physical quantity being validated.
  completion: Record inspected evidence and a new scoped physical assessment, preserving unknown support
    where independent constraints remain absent.
