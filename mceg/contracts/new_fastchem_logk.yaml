schema_version: '0.2'
model:
  id: exogibbs.new_fastchem_logk_comparison.v1
  name: Preliminary FastChem logK comparison and molecular attribution
  description: 'Provider-owned record of #297 and the molecular attribution follow-up, with a separate
    untested metallicity-retrieval hypothesis.'
  implementation: &id001
    repository: https://github.com/HajimeKawahara/exogibbs
    revision: sha256:f5a54f928b525840527670f31ed4a6f49c1fcc81fc0b4c743ae5e43a066f988f
    entry_points:
    - examples/comparisons/compare_new_fastchem_logk.py:comparison_setups
    - mceg/reviews/new_fastchem_logk_20261024.py:attribution
assumptions:
- statement: Ideal gas-only equilibrium, dimensionless formation Kp at 1 bar and h=-ln(Kp). All curves
    use the same ExoGibbs solver, normalized Asplund 2021 budget and 537-species network.
  evidence:
  - column_execution
  - source_choices
- statement: At fixed T,P, molecule ratios factor into Kp ratios and constituent-atom ratios. Neutral-atom
    reference potentials are a gauge; molecular energy choices can change the equilibrium atom pools.
  evidence:
  - attribution_execution
domains:
- kind: numerical_evaluation
  status: documented
  description: Two explicitly prescribed solar columns and five selected attribution samples.
  conditions:
  - '161 pressures from 1e-6 to 100 bar; a 4000 K isotherm and the #284 prescribed 2500-4000 K inversion.'
  - Exact profile arrays and elemental budget are in the NPZ artifacts. The sampled columns do not establish
    a rectangular T/P domain or other metallicities.
  - The five attribution states are enumerated in attribution.json and molecular_samples.
  evidence:
  - column_execution
  - attribution_execution
- kind: scientific_applicability
  status: unknown
  description: Physical mixture accuracy and downstream spectral/retrieval accuracy are not established.
  conditions: []
  evidence:
  - source_choices
  - retrieval_not_run
claims:
- id: atomic_update_scope
  revision: '1'
  kind: numerical_verification
  statement: Only atomic-ion coefficient records differ between the supplied preliminary tables and the
    corresponding packaged FastChem 4 tables; catalogs and stoichiometry agree.
  scope: The three archived files only. The atmospheric calculation uses standard logK.dat with N1- and
    Zn1- omitted to match curated.
- id: column_closure
  revision: '1'
  kind: numerical_verification
  statement: Every archived layer/model state converges and satisfies relative element residual <=1e-5,
    relative charge residual <=1e-12 and absolute ln mass-action residual <=1e-8.
  scope: Two prescribed 161-layer solar-composition columns and three tables, all solved by ExoGibbs on
    the same 537-species network. Not an independent FastChem solver comparison.
- id: molecular_attribution
  revision: '1'
  kind: numerical_verification
  statement: At the five declared samples, the new/curated abundance ratio equals the formation-Kp ratio
    times the stoichiometric product of constituent-atom mole-fraction ratios, with absolute ln residual
    <=1e-8.
  scope: Fixed T and total P. The 2500 K HCN energy-only Kp ratio is within 1 percent of the full ratio.
    The atomic-product term includes coupled chemistry; it is not an atomic-ion-only intervention.
- id: retrieval_metallicity_effect
  revision: '1'
  kind: numerical_verification
  statement: Changing only the thermochemical table changes inferred metallicity under a specified observing
    and retrieval configuration.
  scope: A downstream application hypothesis. No planet, wavelength coverage, opacity set, noise model,
    priors or detection threshold has been selected. Define these and revise this claim before a quantitative
    assessment.
- id: whole_mixture_accuracy
  revision: '1'
  kind: physical_validation
  statement: The complete gas model has quantified physical accuracy under the declared atmospheric conditions.
  scope: Requires independent physical evidence and stated error criteria. Differences between two source
    choices are neither observational errors nor a one-sigma uncertainty distribution.
evidence:
- id: preliminary_inputs
  kind: implementation
  summary: Daniel supplied preliminary tables on 2026-10-23; all extracted files match the archived ZIP.
  sources:
  - https://github.com/NewStrangeWorlds/FastChem/issues/10#issuecomment-6366561070
  - results/new_fastchem_logk/logK.zip
  scope: The comment and supplied bytes were inspected. The underlying NIST level sums and anion source
    were not independently reconstructed; the update is not represented as an official release.
  artifacts:
  - source: results/new_fastchem_logk/logK.zip
    sha256: f128fd758765fa1d19b6cd9056ce38f52a364294203bfcd4334563f5ad80ab7c
  provenance:
    role: primary
    location: Daniel comment and user-supplied ZIP, with exact file hashes in the column receipt.
    inspection: inspected
    note: Source provenance for supplied inputs only; not independent inspection of their underlying atomic
      data.
- id: source_choices
  kind: implementation
  summary: Curated source choices distinguish molecular energy anchors from thermal functions.
  sources:
  - mceg/contracts/atomic_ion_adoption.yaml
  - mceg/contracts/major_molecule_adoption.yaml
  - mceg/contracts/curated_gas.yaml
  - src/exogibbs/data/curated/gas_v1.json
  - results/major_molecule_adoption/decisions.csv
  scope: HCN, S2 and H2S use CEA thermal functions plus ATcT 1.172 energies; SiS retains its FastChem
    constant. Prior source assessments retain their original scopes. Source agreement does not establish
    independent physical accuracy.
  provenance:
    role: primary
    location: Curated implementation manifest and archived adoption decisions.
    inspection: inspected
    note: Inspected local implementation choices and HCN energy values; earlier source contracts retain
      their own physical-evidence scope.
- id: column_execution
  kind: benchmark
  summary: All 966 layer/model cases passed. The file audit found 47, 79 and 228 changed atomic-ion records.
  sources:
  - examples/comparisons/compare_new_fastchem_logk.py
  - results/new_fastchem_logk/receipt.json
  - results/new_fastchem_logk/summary.csv
  - results/mceg/new_fastchem_logk_20261024/columns.log
  scope: Fresh CPU float64 execution with epsilon_crit=1e-13 and relative-charge convergence. Mole-fraction
    ratios are source sensitivity, not opacity changes or metallicity errors.
  subject: comparison_snapshot
  context: columns
  result: passed
  artifacts:
  - source: results/new_fastchem_logk/receipt.json
    sha256: b00bfabfa86421e9d9791aab8aa690229a3ff5d6fcb72cc2d5b61fad3db550e4
  - source: results/new_fastchem_logk/summary.csv
    sha256: 2fa5f1f470f183ad70ab2e65c388ae01a24b225d83764de30b500d68e975cf09
  - source: results/new_fastchem_logk/isothermal.npz
    sha256: 5f59a8d4d10e324cd03eaffbcd1cbca9c255e28ba8a4c037bc5ea6893483514b
  - source: results/new_fastchem_logk/inverted.npz
    sha256: 20ed8258a6e2442803f8a2ea167313f9ab9dfea2683d0c34c87d2ef0f0176191
  - source: results/mceg/new_fastchem_logk_20261024/columns.log
    sha256: 5c4102b47e246dd38cb8edd5b27a95515f29e07c4491c90ee656123afb682ad8
  provenance:
    role: primary
    location: Comparison code, input audit, six closure reports and primitive arrays.
    inspection: inspected
    note: Fresh execution inspected for the stated numerical criteria only.
- id: attribution_execution
  kind: benchmark
  summary: Five mass-action decompositions passed. At 2500 K and 0.01 bar, HCN new/curated = 0.75300568
    x 0.98874048 = 0.74452720.
  sources:
  - mceg/reviews/new_fastchem_logk_20261024.py
  - results/mceg/new_fastchem_logk_20261024/attribution.json
  - results/mceg/new_fastchem_logk_20261024/attribution.log
  scope: At 2500 K, the HCN D0 shift is 0.06019568 eV and predicts Kp ratio 0.75622469; the remaining
    thermal/fit factor is 0.99574331. SiS at 3500 K and 100 bar has identical Kp; its 1.10964313 abundance
    ratio comes from the atomic product. No retrieval was run.
  subject: comparison_snapshot
  context: attribution
  result: passed
  artifacts:
  - source: mceg/reviews/new_fastchem_logk_20261024.py
    sha256: 183f28789617e11b83bfce0483a347098949efe714c5cea63eabaa8d53564c70
  - source: results/mceg/new_fastchem_logk_20261024/attribution.json
    sha256: f5e8bb1c4a9e77e556e0d0b0ca44e5df77e8d1f9e5082c57b554f0059fc689d7
  - source: results/mceg/new_fastchem_logk_20261024/attribution.log
    sha256: dcb68f9cbb84a294c685d61ca365db70a18430099ac8388a4a914b52872c2e0c
  provenance:
    role: primary
    location: Attribution code, five-sample report and execution log.
    inspection: inspected
    note: Inspected the fixed-T,P identity, HCN energy calculation and replay output.
- id: retrieval_literature
  kind: literature
  summary: Al-Refaie et al. (2022) report biased metallicity retrievals when the chemical element sets
    do not match.
  sources:
  - https://doi.org/10.3847/1538-4357/ac6dcd
  scope: 'Inspected abstract: about 20 percent metallicity offsets with reported uncertainties below 1
    percent in some catalog-mismatch experiments. This motivates a follow-up; it does not measure the
    effect of these logK tables on a fixed network.'
  provenance:
    role: primary
    location: Published article abstract.
    inspection: partial
    note: Background on catalog mismatch; no claim that its numerical bias transfers to this fixed-catalog
      thermochemical comparison.
- id: retrieval_not_run
  kind: benchmark
  summary: No radiative-transfer spectrum or retrieval has been executed for this comparison.
  sources:
  - documents/mceg/new_fastchem_logk.rst
  scope: No Delta[M/H], C/O posterior shift, observational significance or calibrated thermochemical uncertainty
    has been measured.
  subject: comparison_snapshot
  context: retrieval_planning
  result: not_run
  provenance:
    role: primary
    location: The local retrieval planning record and current experiment scope.
    inspection: inspected
    note: Records absence of a spectrum/retrieval execution; supplies no downstream result.
limitations:
- statement: No condensation, transport, photoionization, non-LTE or spectral calculation is included.
    The two tables differ in molecular source choices as well as remaining atomic-ion fits.
  evidence:
  - column_execution
  - source_choices
- statement: The HCN maximum in the inverted column occurs at mole fractions about 1e-10. Its 25.5 percent
    abundance difference is not a 25.5 percent metallicity error and does not demonstrate an observable
    spectral difference.
  evidence:
  - attribution_execution
  - retrieval_not_run
- statement: Alternative-table differences are model sensitivity, not a probabilistic uncertainty estimate.
    Shared source ancestry and correlated atomic/molecular energy anchors prevent treating all agreements
    as independent evidence.
  evidence:
  - source_choices
  - retrieval_literature
