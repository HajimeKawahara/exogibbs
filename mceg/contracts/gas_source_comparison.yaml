contexts:
- id: screening_samples
  scope: Formation-Kp source comparisons at four discrete temperatures, with a 1500 K screening table and explicit missing data.
  settings:
    backend: cpu
    dtype: float64
    python: 3.12.7
    numpy: 2.1.0
    jax: 0.6.2
    jaxlib: 0.6.2
    baseline_id: baseline-001
    baseline_revision: f37556abc89a699598e7d67a29ec2159ad2c1a3c
    temperatures_K: '500, 1000, 1500, 3000'
    table_temperature_K: 1500
    standard_pressure_bar: 1
    included_molecules: 93
    excluded_candidates: 14
    provisional_mappings: 70
    historical_ratio_tolerance_dex: 1.0e-10
    archived_numeric_absolute_tolerance: 2.0e-11
    archived_numeric_relative_tolerance: 2.0e-12
    grade_rule: 'F=max(r,1/r); green F<2; yellow 2<=F<10; red F>=10; use unrounded ratios'
    major_flag_rule: 'Frozen major-molecule membership and r<=0.9 or r>=1.1 in each ratio column'
assessments:
- id: baseline_replay_review
  kind: evidence_support
  claim: baseline_replay
  claim_revision: '1'
  subject: baseline_001
  context: screening_samples
  method: &method
    id: review_gas_source_baseline
    revision: '1'
    description: Inspect fixed identities, replay criteria, generated values and receipt separately from source provenance and physical support.
  evidence: [frozen_inputs, baseline_execution]
  reasons: [All 93 historical ratios reproduce within 1e-10 dex; the archived 372-sample report and generated tables pass replay with the declared tolerances and exact display rules.]
  status: supported
  origin: reviewed
- id: source_accuracy_review
  kind: evidence_support
  claim: source_accuracy
  claim_revision: '1'
  subject: baseline_001
  context: screening_samples
  method: *method
  evidence: [frozen_inputs, baseline_execution]
  reasons: [Numerical agreement cannot authenticate local source acquisition, resolve provisional molecular identities or establish independent physical accuracy.]
  status: unknown
  origin: reviewed
follow_ups:
- id: inspect_molecular_identity_and_sources
  target_kind: evidence
  target: frozen_inputs
  action: Inspect unresolved molecular identities and exact source ancestry before attributing or adopting a discrepancy.
  requires: [Identified source version and acquisition, molecular isomer/phase/composition/charge, atomic and molecular reference conventions, energy-anchor and thermal-function ancestry]
  completion: Add inspected source evidence and a scoped assessment for the reviewed molecules; preserve unreviewed mappings and inherited annotations elsewhere.
- id: quantify_physical_accuracy
  target_kind: claim
  target: source_accuracy
  revision: '1'
  action: Assess physical accuracy for a declared molecular and application scope using independent constraints.
  requires: [Independent measurements or observations, a physical error criterion, shared-source dependencies and uncertainties]
  completion: Add a scoped physical assessment; retain unknown support wherever independent constraints remain absent.
limitations:
- statement: Numerical colors and the atmospheric-major 10% marker describe disagreement only. They do not authorize source adoption or establish physical error bounds.
  evidence: [baseline_execution]
- statement: The rightmost basis labels preserve recorded curated annotations, including explicit ATcT corrections and inherited_unreviewed entries; missing ancestry is not equivalent to no correction.
  evidence: [frozen_inputs]
- statement: No molecular investigation, abundance solve or downstream atmospheric prediction is performed by this baseline.
  evidence: [baseline_execution]
