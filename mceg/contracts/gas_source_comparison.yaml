schema_version: '0.2'
model:
  id: exogibbs.gas_source_comparison.v1
  name: Pinned JANAF, NASA and curated gas-source comparison
  description: Reproducible screening baseline with explicit missing values, provisional mappings and source-review limits; no source adoption.
  implementation: &implementation
    repository: https://github.com/HajimeKawahara/exogibbs
    revision: sha256:f40856bcda0b1602b09350bb01035b9ec98ba105551ea3f786a09467b6c17914
    entry_points: [mceg/reviews/gas_source_comparison.py]
assumptions:
- statement: Compare dimensionless formation Kp from neutral gas atoms at a 1 bar standard pressure, using each raw source's own atomic references.
  evidence: [frozen_inputs, baseline_execution]
- statement: The historical table's current curated label denotes the implementation and data pinned by this subject, not a moving preset alias.
  evidence: [frozen_inputs]
domains:
- kind: numerical_evaluation
  status: documented
  description: Discrete screening samples; missing values remain missing and no continuous-domain accuracy is inferred.
  conditions:
  - 93 included molecules, 14 excluded candidates and 70 provisional molecular mappings.
  - Temperatures 500, 1000, 1500 and 3000 K; the table is the 1500 K projection.
  - Curated results are evaluated only within its fitted 1500-4000 K range.
  evidence: [frozen_inputs, baseline_execution]
- kind: scientific_applicability
  status: unknown
  description: Molecular identities, source ancestry and independent physical accuracy are not established by a reproducible comparison.
  conditions: []
  evidence: [frozen_inputs, baseline_execution]
claims:
- id: baseline_replay
  revision: '1'
  kind: numerical_verification
  statement: The portable comparison reproduces the frozen historical expectations and the archived comparison and table under its declared replay tolerances.
  scope: Fixed baseline-001 inputs and sampled temperatures. Historical ratios agree within 1e-10 dex; archived numeric results use absolute tolerance 2e-11 and relative tolerance 2e-12. Metadata, tables, basis labels, grades and major-molecule flags match exactly.
- id: source_accuracy
  revision: '1'
  kind: physical_validation
  statement: The compared thermochemical sources have independently established molecular identities, source ancestry and quantified physical accuracy for the sampled species and conditions.
  scope: Requires independent source inspection and physical constraints; database agreement is not a calibrated uncertainty or adoption criterion.
evidence:
- id: frozen_inputs
  kind: implementation
  summary: Selected source records and annotations preserve 93 mappings, 14 exclusions and the historical expectations without upgrading provisional identity or source-review status.
  sources:
  - tests/data/validation/gas_source_comparison/baseline-001/inputs.json
  - tests/data/validation/gas_source_comparison/baseline-001/README.rst
  - https://github.com/HajimeKawahara/exogibbs/issues/308
  scope: Local NASA acquisition remains unverified despite agreement of 94 coefficient intervals with an existing official-derived reference fixture. Seventy curated entries are inherited_unreviewed; annotations do not prove exact upstream versions or ATcT ancestry.
  subject: baseline_001
  context: screening_samples
  artifacts:
  - source: tests/data/validation/gas_source_comparison/baseline-001/inputs.json
    sha256: 90380ae7d3f8b3c03be534f205139d9ddc050eae6d93cf44ae6fdfb4c4e33385
  provenance:
    role: implementation
    location: Frozen local input selection and historical screening expectations.
    inspection: partial
    note: Preserves recorded identifiers and limitations; 70 provisional mappings have not received independent molecular-identity confirmation.
- id: baseline_execution
  kind: numerical_test
  summary: Fresh portable execution reproduces all 93 historical rows with a maximum difference of 9.450773497121645e-15 dex; archived replay passes for 372 sampled records and all display tables.
  sources:
  - mceg/reviews/gas_source_comparison.py
  - tests/data/validation/gas_source_comparison/baseline-001/comparison.json
  - tests/data/validation/gas_source_comparison/baseline-001/receipt.json
  - tests/data/validation/gas_source_comparison/baseline-001/table.csv
  - tests/data/validation/gas_source_comparison/baseline-001/table.rst
  - tests/data/validation/gas_source_comparison/baseline-001/table.md
  scope: Fresh portable execution is distinct from the historical scratch probe. Reproduction does not validate the physical sources or choose a production source.
  subject: baseline_001
  context: screening_samples
  result: passed
  artifacts:
  - source: tests/data/validation/gas_source_comparison/baseline-001/comparison.json
    sha256: eb84560b0e9ba99d70105f905174f2ff0ced8078a9e7a7755cf618e28647655c
  - source: tests/data/validation/gas_source_comparison/baseline-001/table.csv
    sha256: add7e0285f8ba6d5be73b37518cdcb5c5f8c06393867c822371d4f9f72948660
