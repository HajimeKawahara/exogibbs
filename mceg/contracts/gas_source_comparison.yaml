    sha256: c20257508790fac3626dfc2990e731347a01328e1fdf147d4c8ead1e0c2335a3
  - source: tests/data/validation/gas_source_comparison/baseline-001/table.md
    sha256: bcce582b80e8f55bbf00a894ba2de5e3836af2ed220697a59f29b91f916656d2
  - source: tests/data/validation/gas_source_comparison/baseline-001/receipt.json
    sha256: b7fd476232e6fc45eab545758ab19baf346b51e08a62f6bf16af21eb7c923e3d
  provenance:
    role: primary
    location: ExoGibbs execution receipt and generated comparison artifacts.
    inspection: inspected
    note: Successful historical replay and fresh archived replay inspected; numerical agreement does not authenticate the original acquisitions or resolve provisional mappings.
