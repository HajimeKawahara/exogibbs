contexts:
- id: fixed_ch2_networks
  scope: N2O neutral gas, explicit same-version balanced physical energy; 1 bar standard state, 1500-4000 K, fixed
    curated-ch2-v1 ion537/neutral421 networks; no production adoption.
  settings:
    baseline_dataset: curated-ch2-v1
    new_endpoint_solves: 300
    new_control_solves: 28
    independent_fastchem_runs: 6
    reused_baseline_cases: 150
    curated_update: none
    recommended_variant: retained
assessments:
- id: continuous_thermodynamics_review
  kind: evidence_support
  claim: continuous_thermodynamics
  claim_revision: '1'
  subject: n2o_bounded_candidates_20261106
  context: fixed_ch2_networks
  method:
    id: review_n2o_bounded_candidates
    revision: '1'
    description: Separate source anchoring, numerical substitutions, scoped selection and unknown complete physical
      accuracy.
  evidence:
  - source_scope
  - candidate_validation
  - finite_execution
  - decision_reasoning
  reasons:
  - Physical JANAF D0=1102.951000 kJ/mol changes to the balanced ATcT 1.228 D0=1102.122000 kJ/mol. The retained-thermal
    variant changes formation G and H by +829.000 J/mol, leaving S and Cp unchanged. Native NASA R and SI insertion
    are separated; missing source zero remains missing.
  status: supported
  origin: reviewed
- id: finite_substitution_review
  kind: evidence_support
  claim: finite_substitution
  claim_revision: '1'
  subject: n2o_bounded_candidates_20261106
  context: fixed_ch2_networks
  method:
    id: review_n2o_bounded_candidates
    revision: '1'
    description: Separate source anchoring, numerical substitutions, scoped selection and unknown complete physical
      accuracy.
  evidence:
  - source_scope
  - candidate_validation
  - finite_execution
  - decision_reasoning
  reasons:
  - All 300 fresh endpoints and 28 controls pass. FastChem differences are at most 1.04597e-08 dex. Both fixed networks
    use the same verified baseline archive.
  status: supported
  origin: reviewed
- id: scoped_selection_review
  kind: evidence_support
  claim: scoped_selection
  claim_revision: '1'
  subject: n2o_bounded_candidates_20261106
  context: fixed_ch2_networks
  method:
    id: review_n2o_bounded_candidates
    revision: '1'
    description: Separate source anchoring, numerical substitutions, scoped selection and unknown complete physical
      accuracy.
  evidence:
  - source_scope
  - candidate_validation
  - finite_execution
  - decision_reasoning
  reasons:
  - The energy-aligned JANAF/NASA ratio decreases from about 0.983 to 0.912. The inspected 2025 principal-isotopologue
    TIPS values, divided by nuclear spin weight 9, give Q/NASA about 1.00023 to 0.97053 at the source knots. NASA
    is closer to that particular high-temperature partition diagnostic, but this does not isolate the absolute thermal
    reference or provide complete molecular/atomic caloric derivatives. Sparse Q knots cannot be promoted to a derivative-complete
    replacement. The approximately 4520 K state-sum crossover lies above this calculation interval. Retaining the
    existing thermal function makes the well-defined energy correction separately reviewable without declaring the
    two thermal functions equally accurate. Prefer the retained-thermal ATcT energy candidate for a bounded update;
    keep NASA plus ATcT as a tested thermal sensitivity, not an established improvement.
  status: supported
  origin: reviewed
- id: thermal_superiority_review
  kind: evidence_support
  claim: thermal_superiority
  claim_revision: '1'
  subject: n2o_bounded_candidates_20261106
  context: fixed_ch2_networks
  method:
    id: review_n2o_bounded_candidates
    revision: '1'
    description: Separate source anchoring, numerical substitutions, scoped selection and unknown complete physical
      accuracy.
  evidence:
  - source_scope
  - candidate_validation
  - finite_execution
  - decision_reasoning
  reasons:
  - Independent derivative-consistent modern Q/moments and a common absolute entropy/isotope reference could justify
    a later thermal choice. The finite TIPS comparison does not quantify complete physical uncertainty.
  status: unknown
  origin: reviewed
- id: universal_gibbs_resolution_review
  kind: evidence_support
  claim: universal_gibbs_resolution
  claim_revision: '1'
  subject: n2o_bounded_candidates_20261106
  context: fixed_ch2_networks
  method:
    id: review_n2o_bounded_candidates
    revision: '1'
    description: Separate source anchoring, numerical substitutions, scoped selection and unknown complete physical
      accuracy.
  evidence:
  - source_scope
  - candidate_validation
  - finite_execution
  - decision_reasoning
  reasons:
  - 10/300 comparisons are above the displayed diagnostic scale; 290 remain unresolved. This is not a rigorous bound
    or a cross-model physical ranking.
  status: unknown
  origin: reviewed
- id: physical_accuracy_review
  kind: evidence_support
  claim: physical_accuracy
  claim_revision: '1'
  subject: n2o_bounded_candidates_20261106
  context: fixed_ch2_networks
  method:
    id: review_n2o_bounded_candidates
    revision: '1'
    description: Separate source anchoring, numerical substitutions, scoped selection and unknown complete physical
      accuracy.
  evidence:
  - source_scope
  - candidate_validation
  - finite_execution
  - decision_reasoning
  reasons:
  - Marginal source widths lack reaction covariance; finite grid and selected controls do not quantify complete
    thermal/electronic, network, phase or kinetic uncertainty.
  status: unknown
  origin: reviewed
