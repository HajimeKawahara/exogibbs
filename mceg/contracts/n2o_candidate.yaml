model:
  id: exogibbs.n2o_candidate.v1
  name: 'N2O: bounded candidates and fixed-network substitution'
  description: Prefer the retained-thermal ATcT energy candidate for a bounded update; keep NASA plus ATcT as a
    tested thermal sensitivity, not an established improvement.
  implementation: &id001
    repository: https://github.com/HajimeKawahara/exogibbs
