assumptions:
- statement: Exact gas/isomer identity and physical source zero are preserved; never infer D0 from a fitted intercept.
  evidence:
  - source_scope
  - candidate_validation
- statement: Retained-thermal energy variants keep the fit/source residual; NASA alternatives explicitly change
    the reaction thermal function and residual.
  evidence:
  - source_scope
  - candidate_validation
- statement: Finite controls and marginal quoted widths are not a complete physical uncertainty or reaction covariance.
  evidence:
  - source_scope
  - candidate_validation
domains:
- kind: numerical_evaluation
  status: documented
  description: N2O neutral gas, explicit same-version balanced physical energy; 1 bar standard state, 1500-4000
    K, fixed curated-ch2-v1 ion537/neutral421 networks; no production adoption.
  conditions:
  - 300 fresh main endpoints; 28 selected controls; 6 FastChem executions.
  - 150 common reused baseline endpoints; five T, five P and three C/O values per network.
  evidence:
  - candidate_validation
  - finite_execution
- kind: scientific_applicability
  status: unknown
  description: Independent derivative-consistent modern Q/moments and a common absolute entropy/isotope reference
    could justify a later thermal choice. The finite TIPS comparison does not quantify complete physical uncertainty.
  conditions: []
  evidence:
  - source_scope
  - decision_reasoning
