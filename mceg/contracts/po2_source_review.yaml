schema_version: '0.2'
model:
  id: exogibbs.po2_source_review.v1
  name: PO2 source and energy review
  description: Separate inherited 1962 estimates, modern source leads, balanced reaction energies and
    the archived phosphorus footprint without changing production.
  implementation: &id001
    repository: https://github.com/HajimeKawahara/exogibbs
    revision: sha256:c5e8b3d2972acc982ed0fea0f59dedc2c53741c6363e6e7ac7b7f5487a749a35
    entry_points:
    - mceg/reviews/po2_source_review.py
assumptions:
- statement: Balance source-specific neutral P/O atoms before comparing PO2 energies; elemental Hf, total
    atomization D0 and an electronic well depth are distinct.
  evidence:
  - literature
  - source_replay
- statement: Gurvich/NASA/CCCBDB share an evaluated lineage; its overlap with the 1972 experiment quoted
    in 2023 has not been established.
  evidence:
  - literature
domains:
- kind: numerical_evaluation
  status: documented
  description: Six exact JANAF source nodes, 26 fit-audit nodes and an existing 75-case grid.
  conditions:
  - 'Source nodes: 500, 1000, 1500, 2000, 3000, 4000 K; curated only at 1500-4000 K.'
  - 'Fit: 26 nodes from 1500 to 4000 K at 100 K spacing.'
  - 'Existing grid: 1500, 2000, 2500, 3000, 4000 K; 1e-6, 1e-4, 0.01, 1, 100 bar; C/O=0.5888436553555908,
    1, 1.5.'
  evidence:
  - source_replay
- kind: scientific_applicability
  status: unknown
  description: Full thermal-state accuracy and atmospheric accuracy have not been established.
  conditions: []
  evidence:
  - literature
claims:
- id: source_attribution
  revision: '1'
  kind: numerical_verification
  statement: The inherited PO2 fit agrees with JANAF H/S; most of its discrepancy with NASA is reaction
    energy, with a separately quantified thermal residual and finite baseline P footprint.
  scope: Neutral gaseous PO2, P(g)+2O(g)->PO2(g), 1 bar; 500-4000 K source diagnostics, 1500-4000 K fit
    audit and existing finite 75-case footprint; no adoption.
- id: conditional_energy_direction
  revision: '1'
  kind: theoretical
  statement: Later quoted experiment and theory favor investigating weaker PO2 binding than the inherited
    JANAF estimate; NASA is a concrete candidate for evaluation, not a validated replacement.
  scope: Neutral gaseous PO2, P(g)+2O(g)->PO2(g), 1 bar; 500-4000 K source diagnostics, 1500-4000 K fit
    audit and existing finite 75-case footprint; no adoption.
- id: complete_replacement_accuracy
  revision: '1'
  kind: physical_validation
  statement: A complete PO2 energy and thermal replacement has quantified accuracy over 1500-4000 K.
  scope: Neutral gaseous PO2, P(g)+2O(g)->PO2(g), 1 bar; 500-4000 K source diagnostics, 1500-4000 K fit
    audit and existing finite 75-case footprint; no adoption.
- id: atmospheric_accuracy
  revision: '1'
  kind: physical_validation
  statement: The retained or a candidate PO2 model predicts accurate atmospheric abundances.
  scope: Neutral gaseous PO2, P(g)+2O(g)->PO2(g), 1 bar; 500-4000 K source diagnostics, 1500-4000 K fit
    audit and existing finite 75-case footprint; no adoption.
evidence:
- id: literature
  kind: literature
  summary: Inspect printed JANAF notes and current nodes, official NASA neutral records, CCCBDB ancestry,
    and Chen 2023 Table 3; distinguish primary inspection from later quotations.
