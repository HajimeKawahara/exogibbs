    audit and existing finite 75-case footprint; no adoption.
  settings:
    standard_pressure_Pa: 100000
    reaction: P(g)+2O(g)->PO2(g)
    equilibrium_substitution: not_run
    production_change: none
    energy_alignment: diagnostic reaction H298 only
assessments:
- id: source_attribution_review
  kind: evidence_support
  claim: source_attribution
  claim_revision: '1'
  subject: po2_sources_20261103
  context: source_review
  method:
    id: review_po2_sources_and_reference_conventions
    revision: '1'
    description: Separate numerical source reproduction and conditional scientific direction from complete
      physical validation.
  evidence:
  - literature
  - source_replay
  reasons:
  - Fresh official JANAF tables reproduce the four baseline nodes. The curated residual is below 0.010471
    ln K on 26 nodes. Reaction H298 differs by -32.889 kJ/mol and thermal residual remains; P footprint
    is 0.0743313 percent at its grid maximum.
  status: supported
  origin: reviewed
- id: conditional_energy_direction_review
  kind: evidence_support
  claim: conditional_energy_direction
  claim_revision: '1'
  subject: po2_sources_20261103
  context: source_review
  method:
    id: review_po2_sources_and_reference_conventions
    revision: '1'
    description: Separate numerical source reproduction and conditional scientific direction from complete
      physical validation.
  evidence:
  - literature
  - source_replay
  - reference_reasoning
  reasons:
  - The directly inspected old source uses estimated energy and thermal inputs. Later experimental D0
    and ZPE-corrected theory quoted in Chen indicate weaker binding, but their genealogy and complete
    original definitions remain unresolved; this supports an evaluation direction, not raw-NASA adoption.
  status: supported
  origin: reviewed
- id: complete_replacement_accuracy_review
  kind: evidence_support
  claim: complete_replacement_accuracy
  claim_revision: '1'
  subject: po2_sources_20261103
  context: source_review
  method:
    id: review_po2_sources_and_reference_conventions
    revision: '1'
    description: Separate numerical source reproduction and conditional scientific direction from complete
      physical validation.
  evidence:
  - literature
  - source_replay
  reasons:
  - Original Gurvich energy selection and state construction, experimental cycle and theoretical numerical
    tables are not fully inspected. Modern fundamentals are not a complete hot partition; no replacement
    has been selected or tested.
  status: unknown
  origin: reviewed
- id: atmospheric_accuracy_review
  kind: evidence_support
  claim: atmospheric_accuracy
  claim_revision: '1'
  subject: po2_sources_20261103
  context: source_review
  method:
    id: review_po2_sources_and_reference_conventions
    revision: '1'
    description: Separate numerical source reproduction and conditional scientific direction from complete
      physical validation.
  evidence:
  - source_replay
  reasons:
  - Existing finite model abundances are neither observations nor a source-substitution response.
  status: unknown
  origin: reviewed
follow_ups:
- id: balanced_energy_candidate
  target_kind: claim
  target: complete_replacement_accuracy
  revision: '1'
  action: Evaluate a source-consistent modern atomization anchor, favoring a weaker-binding direction
    than JANAF.
  requires:
  - 'One auditable original energy evaluation: Drowart 1972 (10.1039/F29726801749) or Bauschlicher 1999
    (10.1021/jp992409k), with uncertainty and atomic/ZPE/thermal definitions.'
  - Establish overlap with Gurvich before treating evaluations as independent; recover the historical
    270 kcal/mol cycle only if needed for that comparison.
  completion: Document a justified balanced reaction energy and source dependence; obtaining every historical
    source is not a prerequisite for the initial review.
- id: thermal_and_substitution_candidate
  target_kind: claim
  target: complete_replacement_accuracy
  revision: '1'
  action: Audit a named thermal model against spectroscopy and test its equilibrium response before adoption.
  requires:
  - Gurvich volume 1 part 1 p408 / part 2 p260 or a documented alternative; inspect frequencies, electronic
    levels, symmetry and partition normalization.
  - Targeted spectroscopy such as Lei 2001 (10.1021/jp011778p); do not substitute fundamentals as harmonic
    frequencies without justification.
  - Check thermodynamic derivatives and interval boundaries on 1500-4000 K; measure a fixed-network candidate
    substitution with conservation and solver checks.
  completion: Publish the selected complete candidate and its numerical sensitivity within the declared
    domain.
limitations:
- statement: Historical estimated uncertainty is not a calibrated high-temperature or abundance uncertainty.
    The old 270 kcal/mol note does not exactly reconstruct current JANAF atom-balanced D0.
  evidence:
  - literature
  - source_replay
- statement: The finite archived footprint does not imply universal atmospheric irrelevance; no candidate
    substitution, condensation, nonideality, photochemistry or observational validation is performed.
  evidence:
  - source_replay
