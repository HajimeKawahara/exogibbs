assessments:
- id: source_attribution_review
  kind: evidence_support
  claim: source_attribution
  claim_revision: '1'
  subject: tio_sources_20261103
  context: source_comparison
  method: &id003
    id: tio_source_review
    revision: '1'
    description: Separate inspected source assumptions, conditional modern-candidate preference, numerical replay
      and unvalidated atmospheric accuracy.
  evidence:
  - literature_review
  - source_replay
  reasons:
  - JANAF printed 1973 notes and the current BC selection are inspected; the old a1Delta Te assumption is distinguished
    from the modern rovibronic minimum.
  status: supported
  origin: reviewed
- id: modern_candidate_direction_review
  kind: evidence_support
  claim: modern_candidate_direction
  claim_revision: '1'
  subject: tio_sources_20261103
  context: source_comparison
  method: *id003
  evidence:
  - literature_review
  - source_replay
  - reference_reasoning
  reasons:
  - Jain 2023 D0 refers to Ti(a3F2)+O(3P2); normalized TOTO Q is 12-13% below JANAF over 1500-4000 K. The preferred
    direction is not NASA matching or production adoption.
  status: supported
  origin: reviewed
- id: numerical_replay_review
  kind: evidence_support
  claim: numerical_replay
  claim_revision: '1'
  subject: tio_sources_20261103
  context: source_comparison
  method: *id003
  evidence:
  - source_replay
  reasons:
  - Source values close independently to the baseline; all 75 archived TiO potentials match the current hybrid
    and Ti budgets are checked.
  status: supported
  origin: reviewed
- id: physical_accuracy_review
  kind: evidence_support
  claim: physical_accuracy
  claim_revision: '1'
  subject: tio_sources_20261103
  context: source_comparison
  method: *id003
  evidence:
  - literature_review
  - source_replay
  reasons:
  - No derivative-consistent natural-isotope candidate or finite substitution has been tested; condensation,
    cold trapping and atmosphere accuracy are outside the gas-only archive.
  status: unknown
  origin: reviewed
follow_ups:
- id: complete_modern_candidate
  target_kind: claim
  target: physical_accuracy
  revision: '1'
  action: Construct a minimal derivative-consistent modern TiO candidate at 1500-4000 K with an explicit isotope
    convention and ground-state D0.
  requires:
  - Reconcile PF/states versions, degeneracy, mass, energy zero and completeness; primary TOTO 2019 DOI 10.1093/mnras/stz1818
    and 2024 DOI 10.1093/rasti/rzae037 are already inspected.
  - Use Jain 2023 DOI 10.1063/5.0146365 experimental 6.824 +/- 0.010 eV D0 without a second ZPE or theoretical
    spin-orbit correction. Huang 2013 full text DOI 10.1063/1.4803161 is useful threshold traceability, not
    a merge gate.
  - The Luo original and Gurvich 1982 part 1 p.99 / part 2 p.101 are recorded ancestry gaps, not a requirement
    to obtain every old source before modern evaluation.
  completion: Archive G/H/S/Cp, interpolation and state-completeness uncertainties, source hashes and an explicit
    isotope approximation.
- id: finite_substitution
  target_kind: claim
  target: physical_accuracy
  revision: '1'
  action: Run fixed-network controlled finite substitution before production adoption.
  requires:
  - Check Ti/O conservation, mass action, absolute abundance and element allocation; archive failures.
  - Separate gas-only equilibrium from condensation, cold traps, transport and line-opacity validation.
  completion: Scoped candidate response and adoption assessment; do not interpret baseline Ti share as an error
    bound.
limitations:
- statement: Curated unchanged is provisional; modern D0 and Q support a scientific update direction, not a
    finding that correction is unnecessary.
  evidence:
  - literature_review
  - source_replay
- statement: JANAF estimated singlet Te and TOTO lowest rovibronic level are different quantities; their subtraction
    is not an exact transition energy.
  evidence:
  - literature_review
  - source_replay
- statement: PF tabulation to 8000 K is not physical validation; line-list metadata recommends 5000 K and current
    runtime is 1500-4000 K.
  evidence:
  - literature_review
  - source_replay
- statement: Acquisition-time state sums differ from the distributed PF by less than 4e-5 over 1500-4000 K;
    the version difference is retained.
  evidence:
  - literature_review
  - source_replay
- statement: The new D0 uncertainty is not combined thermal or abundance uncertainty; no extra atomic term-centroid
    shift or ZPE subtraction is applied.
  evidence:
  - literature_review
  - source_replay
