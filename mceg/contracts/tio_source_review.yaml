schema_version: '0.2'
model:
  id: exogibbs.tio_source_review.v1
  name: TiO ground energy and partition source investigation
  description: Assess TiO source assumptions and a modern candidate for planetary applications without changing
    curated.
  implementation: &id002
    repository: https://github.com/HajimeKawahara/exogibbs
    revision: sha256:efc95b8b27665a79e935d1a5cfd74dcac396765d9326b71f2a76f76efd15f3a3
    entry_points:
    - mceg/reviews/tio_source_review.py
assumptions:
- statement: Use lowest fine-structure atomic and rovibronic molecular zeros;normalize nuclear spin and retain
    source translational masses. Fixed-mass48Ti16O diagnostics are not a natural-isotope thermochemical replacement.
  evidence:
  - literature_review
  - source_replay
- statement: The candidate uses 48Ti16O internal levels as an explicit elemental approximation, with NASA molecular
    mass and neutral-atom gauge. Isotope-weighted Q is a sensitivity, not a complete natural-mixture replacement.
  evidence:
  - candidate_definition
- statement: The central 6.824 eV bound-state inventory stays fixed when varying only D0; current TOTO already
    includes approximate high electronic states, so no duplicate supplement is added.
  evidence:
  - candidate_definition
  - candidate_fit_execution
- statement: Finite substitution changes only TiO thermochemistry. Species, budgets, atomic references, charge
    conventions and pressure normalization stay fixed.
  evidence:
  - candidate_equilibrium_execution
domains:
- kind: numerical_evaluation
  status: documented
  description: Exact source/PF nodes and the existing gas-only archive.
  conditions:
  - Source diagnostics at 300, 500, 1000, 1500, 2000, 3000, 4000, 5000 K; current curated at 1500-4000 K.
  - 75 converged cases with 537 species, 1500-4000 K, 1e-6-100 bar and three C/O values; no new solve.
  evidence:
  - source_replay
- kind: scientific_applicability
  status: unknown
  description: Complete candidate adoption and physical atmospheric accuracy remain unquantified.
  conditions: []
  evidence:
  - literature_review
  - source_replay
- kind: numerical_evaluation
  status: documented
  description: Completed representative-isotope candidate and finite gas-network substitution, supplementing
    the historical source-only domain.
  conditions:
  - C2 quintic molecular Gibbs function at six knots from 1500 to 4000 K; 45 frozen independent off-knot references.
  - 75 archived reference cases plus 150 new endpoints, with selected tight solves, finite path, D0-only sensitivity
    and one-condition independent FastChem comparison.
  evidence:
  - candidate_fit_execution
  - candidate_equilibrium_execution
- kind: scientific_applicability
  status: unknown
  description: Absolute accuracy of the representative-isotope candidate and physical planetary atmospheres
    remains unquantified after numerical completion. Isotope-resolved networks, condensation, rainout, cold
    trapping, transport and radiative transfer have not been validated.
  conditions: []
  evidence:
  - candidate_definition
  - candidate_adoption_reasoning
claims:
- id: source_attribution
  revision: '1'
  kind: numerical_verification
  statement: Current JANAF thermal plus BC/Luo energy selection is reproduced and its legacy singlet-origin
    assumption identified.
  scope: Neutral TiO, Ti(g)+O(g)->TiO(g),1bar; source-native ground energy, molecular thermal partitions and
    fixed-mass48Ti16O diagnostics; archived gas-only grid.
- id: modern_candidate_direction
  revision: '1'
  kind: theoretical
  statement: Normalized modern partitions and the 2023 D0 at the lowest atomic fine-structure limit support
    prioritizing a complete modern TiO candidate.
  scope: Neutral TiO, Ti(g)+O(g)->TiO(g),1bar; source-native ground energy, molecular thermal partitions and
    fixed-mass48Ti16O diagnostics; archived gas-only grid.
- id: numerical_replay
  revision: '1'
  kind: numerical_verification
  statement: Balanced source decomposition, isotope normalization and conserved titanium accounting reproduce
    offline.
  scope: Neutral TiO, Ti(g)+O(g)->TiO(g),1bar; source-native ground energy, molecular thermal partitions and
    fixed-mass48Ti16O diagnostics; archived gas-only grid.
- id: physical_accuracy
  revision: '1'
  kind: physical_validation
  statement: A complete adopted TiO model and its atmospheric abundance predictions have quantified physical
    accuracy.
  scope: Neutral TiO, Ti(g)+O(g)->TiO(g),1bar; source-native ground energy, molecular thermal partitions and
    fixed-mass48Ti16O diagnostics; archived gas-only grid.
- id: candidate_thermodynamic_consistency
  revision: '1'
  kind: numerical_verification
  statement: The named TiO candidate reproduces direct finite-state moments with one C2 Gibbs function and consistent
    caloric derivatives within its declared interpolation targets.
  scope: Representative 48Ti16O internal states for element-aggregated TiO; NASA mass 63.8664 u and neutral
    atoms, Jain D0=6.824 eV, 1 bar, 1500-4000 K; central bound-state inventory fixed.
- id: candidate_finite_response
  revision: '1'
  kind: numerical_verification
  statement: The finite TiO abundance and titanium-allocation response is reproduced on the fixed gas network
    with conservation, mass-action, tightening and independent-solver checks.
  scope: TiO-only substitution on the fixed 537-species ion-inclusive gas network; 75 archived reference cases
    and 150 new endpoints, 1500-4000 K, 1e-6-100 bar, three C/O budgets; no production adoption or transport
    model.
- id: candidate_scoped_adoption_readiness
  revision: '1'
  kind: theoretical
  statement: TOTO/Jain is the preferred fully specified candidate for a separate curated adoption decision on
    1500-4000 K; the NASA/Jain thermal proxy is a close comparison approximation on the tested grid.
  scope: TiO-only substitution on the fixed 537-species ion-inclusive gas network; 75 archived reference cases
    and 150 new endpoints, 1500-4000 K, 1e-6-100 bar, three C/O budgets; no production adoption or transport
    model.
- id: candidate_physical_accuracy
  revision: '1'
  kind: physical_validation
  statement: The candidate has quantified complete thermochemical uncertainty and validated physical atmospheric
    abundance accuracy.
  scope: TiO-only substitution on the fixed 537-species ion-inclusive gas network; 75 archived reference cases
    and 150 new endpoints, 1500-4000 K, 1e-6-100 bar, three C/O budgets; no production adoption or transport
    model.
