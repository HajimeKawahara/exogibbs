contexts:
- id: source_comparison
  scope: Neutral TiO, Ti(g)+O(g)->TiO(g),1bar; source-native ground energy, molecular thermal partitions and
    fixed-mass48Ti16O diagnostics; archived gas-only grid.
  settings:
    reaction: Ti + O -> TiO
    standard_pressure_bar: 1
    curated_change: none
    equilibrium_substitution: not_run
    atomic_reference: NASA neutral thermal background with explicit source-ground D0
    isotope_scope: MonoisotopeQ diagnostics; no natural-isotope replacement
- id: candidate_thermal_model
  scope: Representative 48Ti16O internal states for element-aggregated TiO; NASA mass 63.8664 u and neutral
    atoms, Jain D0=6.824 eV, 1 bar, 1500-4000 K; central bound-state inventory fixed.
  settings:
    candidate: tio_48_internal_elemental_candidate_v1
    temperature_min_K: 1500
    temperature_max_K: 4000
    molecular_mass_u: 63.8664
    D0_eV: 6.824
    central_bound_inventory: 300670 levels; 575 source levels above the central D0 excluded
    atomic_reference: Existing NASA neutral-atom thermal functions
    production_adoption: false
- id: candidate_finite_substitution
  scope: TiO-only substitution on the fixed 537-species ion-inclusive gas network; 75 archived reference cases
    and 150 new endpoints, 1500-4000 K, 1e-6-100 bar, three C/O budgets; no production adoption or transport
    model.
  settings:
    variants: current, toto, nasa_proxy
    reference_cases: 75
    new_endpoint_solves: 150
    primary_solver_tolerance: 1.0e-13
    tight_solver_tolerance: 5.0e-14
    D0_sensitivity_lower_eV: 6.814
    D0_sensitivity_upper_eV: 6.834
    new_thermal_inventory_in_D0_sensitivity: false
    production_adoption: false
assessments:
- id: source_attribution_review
  kind: evidence_support
  claim: source_attribution
  claim_revision: '1'
  subject: tio_sources_20261103
  context: source_comparison
  method: &id003
    id: tio_source_review
    revision: '1'
    description: Separate inspected source assumptions, conditional modern-candidate preference, numerical replay
      and unvalidated atmospheric accuracy.
  evidence:
  - literature_review
  - source_replay
  reasons:
  - JANAF printed 1973 notes and the current BC selection are inspected; the old a1Delta Te assumption is distinguished
    from the modern rovibronic minimum.
  status: supported
  origin: reviewed
- id: modern_candidate_direction_review
  kind: evidence_support
  claim: modern_candidate_direction
  claim_revision: '1'
  subject: tio_sources_20261103
  context: source_comparison
  method: *id003
  evidence:
  - literature_review
  - source_replay
  - reference_reasoning
  reasons:
  - Jain 2023 D0 refers to Ti(a3F2)+O(3P2); normalized TOTO Q is 12-13% below JANAF over 1500-4000 K. The preferred
    direction is not NASA matching or production adoption.
  status: supported
  origin: reviewed
- id: numerical_replay_review
  kind: evidence_support
  claim: numerical_replay
  claim_revision: '1'
  subject: tio_sources_20261103
  context: source_comparison
  method: *id003
  evidence:
  - source_replay
  reasons:
  - Source values close independently to the baseline; all 75 archived TiO potentials match the current hybrid
    and Ti budgets are checked.
  status: supported
  origin: reviewed
- id: physical_accuracy_review
  kind: evidence_support
  claim: physical_accuracy
  claim_revision: '1'
  subject: tio_sources_20261103
  context: source_comparison
  method: *id003
  evidence:
  - literature_review
  - source_replay
  reasons:
  - No derivative-consistent natural-isotope candidate or finite substitution has been tested; condensation,
    cold trapping and atmosphere accuracy are outside the gas-only archive.
  status: unknown
  origin: reviewed
- id: candidate_thermodynamic_consistency_review
  kind: evidence_support
  claim: candidate_thermodynamic_consistency
  claim_revision: '1'
  subject: tio_candidate_model_20261103
  context: candidate_thermal_model
  method:
    id: tio_candidate_and_substitution_review
    revision: '1'
    description: Assess the explicit candidate, finite numerical response and scoped scientific preference separately
      from physical validation and production adoption.
  evidence:
  - candidate_definition
  - candidate_fit_execution
  reasons:
  - Off-knot errors are at most 1.024e-6 in ln K and 0.002492 J/(mol K) in Cp; the shared Gibbs representation
    preserves C2 and caloric consistency.
  status: supported
  origin: reviewed
- id: candidate_finite_response_review
  kind: evidence_support
  claim: candidate_finite_response
  claim_revision: '1'
  subject: tio_candidate_substitution_20261103
  context: candidate_finite_substitution
  method:
    id: tio_candidate_and_substitution_review
    revision: '1'
    description: Assess the explicit candidate, finite numerical response and scoped scientific preference separately
      from physical validation and production adoption.
  evidence:
  - candidate_equilibrium_execution
  reasons:
  - All 150 new endpoints converge; TiO ratios span 0.62426-0.96201. The largest Ti share change is 60.5723%
    to 48.9572%; independent FastChem parity is below 6.80e-9 dex at the selected condition.
  status: supported
  origin: reviewed
- id: candidate_scoped_adoption_readiness_review
  kind: evidence_support
  claim: candidate_scoped_adoption_readiness
  claim_revision: '1'
  subject: tio_candidate_substitution_20261103
  context: candidate_finite_substitution
  method:
    id: tio_candidate_and_substitution_review
    revision: '1'
    description: Assess the explicit candidate, finite numerical response and scoped scientific preference separately
      from physical validation and production adoption.
  evidence:
  - candidate_adoption_reasoning
  - candidate_equilibrium_execution
  reasons:
  - Modern energy and state thermodynamics address an identified legacy assumption, and a complete derivative-consistent
    candidate plus finite network test are now available. NASA/Jain differs by at most 0.009187 in ln mole fraction
    over the grid, but is the less direct thermal approximation. No production change is made.
  status: supported
  origin: reviewed
- id: candidate_physical_accuracy_review
  kind: evidence_support
  claim: candidate_physical_accuracy
  claim_revision: '1'
  subject: tio_candidate_substitution_20261103
  context: candidate_finite_substitution
  method:
    id: tio_candidate_and_substitution_review
    revision: '1'
    description: Assess the explicit candidate, finite numerical response and scoped scientific preference separately
      from physical validation and production adoption.
  evidence:
  - candidate_adoption_reasoning
  - candidate_equilibrium_execution
  reasons:
  - Numerical checks and isotope/state sensitivities do not quantify all physical uncertainty or validate condensation,
    cold traps, transport, isotope fractionation or observed spectra.
  status: unknown
  origin: reviewed
follow_ups:
- id: complete_modern_candidate
  target_kind: claim
  target: physical_accuracy
  revision: '1'
  action: Construct a minimal derivative-consistent modern TiO candidate at 1500-4000 K with an explicit isotope
    convention and ground-state D0.
  requires:
  - Reconcile PF/states versions, degeneracy, mass, energy zero and completeness; primary TOTO 2019 DOI 10.1093/mnras/stz1818
    and 2024 DOI 10.1093/rasti/rzae037 are already inspected.
  - Use Jain 2023 DOI 10.1063/5.0146365 experimental 6.824 +/- 0.010 eV D0 without a second ZPE or theoretical
    spin-orbit correction. Huang 2013 full text DOI 10.1063/1.4803161 is useful threshold traceability, not
    a merge gate.
  - The Luo original and Gurvich 1982 part 1 p.99 / part 2 p.101 are recorded ancestry gaps, not a requirement
    to obtain every old source before modern evaluation.
  completion: Archive G/H/S/Cp, interpolation and state-completeness uncertainties, source hashes and an explicit
    isotope approximation.
- id: finite_substitution
  target_kind: claim
  target: physical_accuracy
  revision: '1'
  action: Run fixed-network controlled finite substitution before production adoption.
  requires:
  - Check Ti/O conservation, mass action, absolute abundance and element allocation; archive failures.
  - Separate gas-only equilibrium from condensation, cold traps, transport and line-opacity validation.
  completion: Scoped candidate response and adoption assessment; do not interpret baseline Ti share as an error
    bound.
- id: candidate_production_decision
  target_kind: claim
  target: candidate_scoped_adoption_readiness
  revision: '1'
  action: Review and record a separate scoped production adoption decision before changing curated TiO data.
  requires:
  - Preserve the declared elemental isotope approximation, 1500-4000 K domain and modern-source rationale.
  - Keep numerical readiness distinct from unknown complete physical accuracy and atmospheric applicability.
  completion: A versioned adoption decision and any authorized production change with targeted regression and
    equilibrium checks.
limitations:
- statement: Curated unchanged is provisional; modern D0 and Q support a scientific update direction, not a
    finding that correction is unnecessary.
  evidence:
  - literature_review
  - source_replay
- statement: JANAF estimated singlet Te and TOTO lowest rovibronic level are different quantities; their subtraction
    is not an exact transition energy.
  evidence:
  - literature_review
  - source_replay
- statement: PF tabulation to 8000 K is not physical validation; line-list metadata recommends 5000 K and current
    runtime is 1500-4000 K.
  evidence:
  - literature_review
  - source_replay
- statement: Acquisition-time state sums differ from the distributed PF by less than 4e-5 over 1500-4000 K;
    the version difference is retained.
  evidence:
  - literature_review
  - source_replay
- statement: The new D0 uncertainty is not combined thermal or abundance uncertainty; no extra atomic term-centroid
    shift or ZPE subtraction is applied.
  evidence:
  - literature_review
  - source_replay
- statement: The completed candidate is an explicit representative-isotope approximation, not the fully natural-isotope
    model left untested in the historical source-only assessment.
  evidence:
  - candidate_definition
  - candidate_fit_execution
- statement: The scoped candidate preference and finite abundance response do not certify physical atmospheric
    accuracy or adopt any production curated data.
  evidence:
  - candidate_adoption_reasoning
  - candidate_equilibrium_execution
- statement: D0-only sensitivity and represented-state truncation tests are not a total thermochemical uncertainty
    interval or a bound on missing levels.
  evidence:
  - candidate_definition
  - candidate_equilibrium_execution
- statement: Gibbs consistency is evaluated under the same model with the first-order residual-budget term removed;
    different models absolute Gibbs energies are not physical selection evidence.
  evidence:
  - candidate_equilibrium_execution
follow_up_resolutions:
- follow_up: complete_modern_candidate
  evidence:
  - candidate_definition
  - candidate_fit_execution
  note: 'Completed for the explicitly scoped representative-isotope candidate: source versions, ground zero,
    nuclear spin, mass, central cutoff, G/H/S/Cp, interpolation checks and source sensitivities are archived.
    Complete physical uncertainty remains unknown; no claim of a full natural-isotope network is made.'
- follow_up: finite_substitution
  evidence:
  - candidate_equilibrium_execution
  - candidate_adoption_reasoning
  note: Completed 150 new fixed-network endpoints, conserved-budget and mass-action checks, selected tightening,
    finite path, D0 sensitivity and independent-solver comparison. The scoped adoption preference is recorded;
    production adoption and physical atmosphere validation remain separate.
