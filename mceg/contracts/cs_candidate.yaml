schema_version: '0.2'
model:
  id: exogibbs.cs_candidate.v1
  name: CS retained-NASA ATcT1.228 candidate and finite substitution
  description: Evaluate one same-version balanced energy correction while preserving the adopted thermal representation
    and its explicit physical limits.
  implementation: &id001
    repository: https://github.com/HajimeKawahara/exogibbs
