follow_ups:
- id: scoped_adoption_decision
  target_kind: claim
  target: candidate_direction
  revision: '1'
  action: Consider this tested retained-thermal ATcT energy update for a separately authorized curated adoption.
  requires:
  - No new legacy full text is mandatory for this bounded energy calculation.
  - Retain the explicit covariance, thermal-state and physical-applicability limits.
  completion: An explicit scoped adoption or retention decision; this packet leaves production unchanged.
- id: broader_thermal_and_uncertainty
  target_kind: claim
  target: physical_accuracy
  revision: '1'
  action: Evaluate a complete thermal replacement and propagated reaction uncertainty only when suitable evidence
    is available.
  requires:
  - Consistent molecular/atomic state zeros, masses, degeneracy and symmetry conventions; convergence of Q/H/S/Cp.
  - Reaction covariance and domain-relevant equilibrium or kinetic validation rather than a version-difference significance
    claim.
  completion: Scoped quantified physical evidence; do not require an unbounded paper-acquisition campaign for this
    numerical review.
limitations:
- statement: The old/new ATcT results are correlated network evaluations. No statistically significant discrepancy
    or independent physical correction is established by their small central-value difference.
  evidence:
  - source_scope
  - decision_reasoning
- statement: A floating-point Gibbs comparison scale is a diagnostic rather than a rigorous numerical or physical
    bound; unresolved conditions and small background changes remain explicit.
  evidence:
  - finite_execution
- statement: The existing thermal model is retained without claiming complete electronic/isotopic or physical accuracy
    at every temperature.
  evidence:
  - source_scope
  - candidate_validation
