    - mceg/reviews/cs_equilibrium_impact.py
assumptions:
- statement: Both D0 energies balance ground-state gas C, 1 S and CS within their respective ATcT versions. Apply
    only their +379 J/mol difference to the already aligned adopted reaction.
  evidence:
  - source_scope
  - candidate_validation
- statement: Retain the literal NASA9 thermal coefficients, native NASA R in source reconstruction, modern R for
    ATcT energy conversion, one-bar standard state and existing isotope/mass/degeneracy conventions.
  evidence:
  - candidate_validation
- statement: The same species/elements/formula matrix/budgets and all baseline potentials are checked before reusing
    archived curated_cos endpoints. Fresh selected baseline controls accompany new candidate solves.
  evidence:
  - finite_execution
domains:
- kind: numerical_evaluation
  status: documented
  description: C(g) + 1 S(g) -> CS(g), 1 bar, 1500-4000 K; exact current NASA thermal reaction with balanced ATcT1.172-to-1.228
    delta D0=+379 J/mol; fixed 537-species curated-cos-v1 network; no adoption.
  conditions:
  - Five temperatures1500-4000K, five pressures1e-6-100bar, three C/O values; 75 ion-inclusive conditions.
  - 75 fresh candidate endpoints,75 reused baselines,six fresh strict endpoints,five finite-path nodes,four standalone
    FastChem comparisons.
  - No neutral solve, new thermal fit, production change or physical atmospheric validation.
  evidence:
  - candidate_validation
  - finite_execution
- kind: scientific_applicability
  status: unknown
  description: Complete uncertainty and intended planetary applicability are not established.
  conditions: []
  evidence:
  - source_scope
  - finite_execution
