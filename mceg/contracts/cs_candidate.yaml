contexts:
- id: fixed_cos_network
  scope: C(g) + 1 S(g) -> CS(g), 1 bar, 1500-4000 K; exact current NASA thermal reaction with balanced ATcT1.172-to-1.228
    delta D0=+379 J/mol; fixed 537-species curated-cos-v1 network; no adoption.
  settings:
    baseline_dataset: curated-cos-v1
    species: C1S1
    standard_pressure_bar: 1
    energy_shift_J_mol: 379
    new_endpoint_solves: 75
    reused_baseline_cases: 75
    curated_update: none
    gibbs_conditions_above_displayed_scale: 70
assessments:
- id: continuous_thermodynamics_review
  kind: evidence_support
  claim: continuous_thermodynamics
  claim_revision: '1'
  subject: cs_atct1228_candidate_20261105
  context: fixed_cos_network
  method:
    id: review_cs_atct_candidate
    revision: '1'
    description: Separate balanced energy provenance, continuous calorics, finite numerical response, unresolved
      comparisons and physical accuracy.
  evidence:
  - source_scope
  - candidate_validation
  - finite_execution
  - decision_reasoning
  reasons:
  - The exact adopted NASA9 reaction reconstructs current curated_cos at 2501 temperatures. A single +379 J/mol
    D0 change shifts G/H down by that amount, leaving S/Cp unchanged; the independent original-source reconstruction
    agrees within5e-14 in h.
  status: supported
  origin: reviewed
- id: finite_substitution_review
  kind: evidence_support
  claim: finite_substitution
  claim_revision: '1'
  subject: cs_atct1228_candidate_20261105
  context: fixed_cos_network
  method:
    id: review_cs_atct_candidate
    revision: '1'
    description: Separate balanced energy provenance, continuous calorics, finite numerical response, unresolved
      comparisons and physical accuracy.
  evidence:
  - source_scope
  - candidate_validation
  - finite_execution
  - decision_reasoning
  reasons:
  - All execution endpoints and controls converge. Target mole-fraction ratios span 1.00146887-1.03085527; selected
    tighter controls and independent FastChem support the response. Abundance changes near control variation and
    Gibbs comparisons below their displayed scale remain unresolved.
  status: supported
  origin: reviewed
- id: candidate_direction_review
  kind: evidence_support
  claim: candidate_direction
  claim_revision: '1'
  subject: cs_atct1228_candidate_20261105
  context: fixed_cos_network
  method:
    id: review_cs_atct_candidate
    revision: '1'
    description: Separate balanced energy provenance, continuous calorics, finite numerical response, unresolved
      comparisons and physical accuracy.
  evidence:
  - source_scope
  - candidate_validation
  - finite_execution
  - decision_reasoning
  reasons:
  - The evaluated same-version energy central values are preferable for a scoped source refresh. Current NASA thermals
    remain justified by the earlier review; the version change is not an independent measurement, significance test
    or a complete physical error correction.
  status: supported
  origin: reviewed
- id: universal_gibbs_resolution_review
  kind: evidence_support
  claim: universal_gibbs_resolution
  claim_revision: '1'
  subject: cs_atct1228_candidate_20261105
  context: fixed_cos_network
  method:
    id: review_cs_atct_candidate
    revision: '1'
    description: Separate balanced energy provenance, continuous calorics, finite numerical response, unresolved
      comparisons and physical accuracy.
  evidence:
  - source_scope
  - candidate_validation
  - finite_execution
  - decision_reasoning
  reasons:
  - Only 70 of75 conditions have both feasibility-corrected same-model exchange signs above the displayed floating-point
    scale. The remaining cases do not establish universal resolution. Absolute Gibbs differences between models
    cannot determine physical preference.
  status: unknown
  origin: reviewed
- id: physical_accuracy_review
  kind: evidence_support
