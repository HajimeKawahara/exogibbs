model:
  id: exogibbs.n2o5_candidate.v1
  name: 'N2O5: bounded candidates and fixed-network substitution'
  description: Recommend the retained-thermal ATcT H298 energy correction; keep NASA plus ATcT as a tested thermal
    sensitivity, with thermal superiority unresolved.
  implementation: &id001
    repository: https://github.com/HajimeKawahara/exogibbs
