contexts:
- id: fixed_ch2_networks
  scope: N2O5 neutral gas, explicit same-version balanced physical energy; 1 bar standard state, 1500-4000 K, fixed
    curated-ch2-v1 ion537/neutral421 networks; no production adoption.
  settings:
    baseline_dataset: curated-ch2-v1
    new_endpoint_solves: 300
    new_control_solves: 44
    independent_fastchem_runs: 8
    reused_baseline_cases: 150
    curated_update: none
    recommended_variant: retained_h298
assessments:
- id: continuous_thermodynamics_review
  kind: evidence_support
  claim: continuous_thermodynamics
  claim_revision: '1'
  subject: n2o5_bounded_candidates_20261106
  context: fixed_ch2_networks
  method:
    id: review_n2o5_bounded_candidates
    revision: '1'
    description: Separate source anchoring, numerical substitutions, scoped selection and unknown complete physical
      accuracy.
  evidence:
  - source_scope
  - candidate_validation
  - finite_execution
  - decision_reasoning
  reasons:
  - JANAF lacks a 0 K N2O5 row, but both evaluations supply 298.15 K formation enthalpies. Balanced atomization
    H298 is 2179.934 kJ/mol for JANAF and 2176.321 kJ/mol for ATcT 1.228. Therefore formation G/H can be raised
    by 3613 J/mol while retaining the existing thermal function and its source-fit residual. This is an H298 anchor
    correction, not a D0 update or a fitted-intercept interpretation. It removes the need to replace an unresolved
    thermal function merely to adopt the modern energy reference. Both separate candidates have consistent scalar/JAX
    G/H/S/Cp over 2752 temperatures.
  status: supported
  origin: reviewed
- id: finite_substitution_review
  kind: evidence_support
  claim: finite_substitution
  claim_revision: '1'
  subject: n2o5_bounded_candidates_20261106
  context: fixed_ch2_networks
  method:
    id: review_n2o5_bounded_candidates
    revision: '1'
    description: Separate source anchoring, numerical substitutions, scoped selection and unknown complete physical
      accuracy.
  evidence:
  - source_scope
  - candidate_validation
  - finite_execution
  - decision_reasoning
  reasons:
  - All 300 endpoints and 44 controls converge; FastChem maximum difference is 1.0499141e-8 dex. The retained-H298
    target ratio is 0.7484911-0.8970569, versus NASA 1.174208-1.386054. Shared baseline is counted once.
  status: supported
  origin: reviewed
- id: scoped_selection_review
  kind: evidence_support
  claim: scoped_selection
  claim_revision: '1'
  subject: n2o5_bounded_candidates_20261106
  context: fixed_ch2_networks
  method:
    id: review_n2o5_bounded_candidates
    revision: '1'
    description: Separate source anchoring, numerical substitutions, scoped selection and unknown complete physical
      accuracy.
  evidence:
  - source_scope
  - candidate_validation
  - finite_execution
  - decision_reasoning
  reasons:
  - JANAF lacks a 0 K N2O5 row, but both evaluations supply 298.15 K formation enthalpies. Balanced atomization
    H298 is 2179.934 kJ/mol for JANAF and 2176.321 kJ/mol for ATcT 1.228. Therefore formation G/H can be raised
    by 3613 J/mol while retaining the existing thermal function and its source-fit residual. This is an H298 anchor
    correction, not a D0 update or a fitted-intercept interpretation. It removes the need to replace an unresolved
    thermal function merely to adopt the modern energy reference. Recommend the retained-thermal ATcT H298 energy
    correction; keep NASA plus ATcT as a tested thermal sensitivity, with thermal superiority unresolved.
  status: supported
  origin: reviewed
- id: thermal_superiority_review
  kind: evidence_support
  claim: thermal_superiority
  claim_revision: '1'
  subject: n2o5_bounded_candidates_20261106
  context: fixed_ch2_networks
  method:
    id: review_n2o5_bounded_candidates
    revision: '1'
    description: Separate source anchoring, numerical substitutions, scoped selection and unknown complete physical
      accuracy.
  evidence:
  - source_scope
  - candidate_validation
  - finite_execution
  - decision_reasoning
  reasons:
  - H298 supplies the bounded energy correction without selecting a new thermal function. Cold NO2+NO3 equilibrium
    provenance does not discriminate high-temperature thermal models.
