    gas-only endpoints. No planetary validation.
  settings:
    reaction: 2H(g)+S(g)->H2S(g)
    standard_pressure_bar: 1
    atomic_energy: ATcT1.172
    atomic_thermal: NASA; native JANAF difference separated
