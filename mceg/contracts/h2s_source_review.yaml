assessments:
- id: source_construction_review
  kind: evidence_support
  claim: source_construction
  claim_revision: '1'
  subject: h2s_sources_20261104
  context: source_review
  method:
    id: review_h2s_energy_thermal_and_scope
    revision: '1'
    description: Separate source construction, numerical state/thermal comparison, scoped retention and physical
      accuracy.
  evidence:
  - literature
  - source_replay
  - retention_reasoning
  reasons:
  - ATcT D0=726.268 kJ/mol versus NASA 724.673796; correct native-R shift 192.23535753 K. Archived H2S potentials
    reproduce below 2e-12; sulfur budget closes below 3e-12. The first H+SH threshold is 376.214 kJ/mol, not
    total atomization.
  status: supported
  origin: reviewed
- id: normalized_thermal_comparison_review
  kind: evidence_support
  claim: normalized_thermal_comparison
  claim_revision: '1'
  subject: h2s_sources_20261104
  context: source_review
  method:
    id: review_h2s_energy_thermal_and_scope
    revision: '1'
    description: Separate source construction, numerical state/thermal comparison, scoped retention and physical
      accuracy.
  evidence:
  - literature
  - source_replay
  - retention_reasoning
  reasons:
  - 220630 states with common para-ground zero and spin product 4. Current versus original calculated energies
    affect Q below 4.6 ppm; one inconsistent J/gtot row remains raw and has at most 1.70 ppm sensitivity. TIPS
    shares the AYT2 state sum and is not an independent check.
  status: supported
  origin: reviewed
- id: scoped_retention_review
  kind: evidence_support
  claim: scoped_retention
  claim_revision: '1'
  subject: h2s_sources_20261104
  context: source_review
  method:
    id: review_h2s_energy_thermal_and_scope
    revision: '1'
    description: Separate source construction, numerical state/thermal comparison, scoped retention and physical
      accuracy.
  evidence:
  - literature
  - source_replay
  - retention_reasoning
  reasons:
  - AYT2/NASA normalized Q declines from 0.997749 at 1500 K to 0.891967 at 4000 K; Cp at 4000 K=43.370 versus
    NASA 61.070/JANAF 59.509 J/mol/K. J40 alone carries 0.8507% of Q at 4000 K. These diagnostics challenge
    reported4000 K convergence without proving an exact missing-state correction. Current production remains
    unchanged.
  status: supported
  origin: reviewed
- id: physical_accuracy_review
  kind: evidence_support
  claim: physical_accuracy
  claim_revision: '1'
  subject: h2s_sources_20261104
  context: source_review
  method:
    id: review_h2s_energy_thermal_and_scope
    revision: '1'
    description: Separate source construction, numerical state/thermal comparison, scoped retention and physical
      accuracy.
  evidence:
  - literature
  - source_replay
  - retention_reasoning
  reasons:
  - High-J/vibrational completeness, molecular excited states, isotope mixtures, correlated ATcT uncertainty
    and full atomic-level completeness are unbounded. No finite substitution, photochemistry, condensation,
    transport or observational fit was performed.
  status: unknown
  origin: reviewed
follow_ups:
- id: high_temperature_convergence
  target_kind: claim
  target: physical_accuracy
  revision: '1'
  action: Extend J/vibrational coverage and check Q, H, S and Cp convergence to 4000 K; reconcile TIPS2017
    claim before fitting a candidate and performing finite substitution.
  requires:
  - AYT2 DOI 10.1093/mnras/stw1133 and TIPS2017 DOI 10.1016/j.jqsrt.2017.03.045 already inspected.
  - First H+SH threshold and consistent atom-balanced energy; missing-state bounds, not an arbitrary numerical
    patch.
  completion: A converged derivative-consistent thermal candidate and sulfur-conserving finite-substitution
    evidence; not required to merge this scoped source review.
- id: distribution_reconciliation
  target_kind: claim
  target: physical_accuracy
  revision: '1'
  action: Reconcile row 76644 J/gtot, official metadata and PF/Cp generation constants.
  requires:
  - Original raw lines and same-version definition/readme archived with hashes.
  - Optional Gurvich 1989 original pages to trace the legacy NASA/JANAF difference; no unconditional acquisition
    gate.
  completion: Record upstream or calculation-based resolution, retain prior source receipts and rerun affected
    comparisons.
limitations:
- statement: AYT2, MARVEL and TIPS primary methods were inspected, but the historical Gurvich original and
    ATcT network covariance were not reaudited.
  evidence:
  - literature
- statement: AYT2 and TIPS share state ancestry. Reported 4000 K convergence conflicts with finite-list diagnostics;
    their numerical agreement is not independent physical validation.
  evidence:
  - literature
  - source_replay
- statement: Natural-mass representative-isotope comparisons and archived sulfur allocations are scoped proxies,
    not isotope-resolved reactions, finite substitution responses or planetary accuracy bounds.
  evidence:
  - source_replay
