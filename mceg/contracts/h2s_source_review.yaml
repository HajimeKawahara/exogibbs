    entry_points:
    - mceg/reviews/h2s_source_review.py
assumptions:
- statement: Use same-version atom-balanced ground-relative D0, not De or the first dissociation threshold;
    NASA native R stays in dimensionless functions.
  evidence:
  - literature
  - source_replay
- statement: Remove nuclear spin product 4 once; allowed states encode symmetry. 1H2-32S levels with natural
    translation are an elemental proxy, not an isotope-resolved reaction.
  evidence:
  - literature
  - source_replay
domains:
- kind: numerical_evaluation
  status: documented
  description: Neutral H2S; 2H(g)+S(g)->H2S(g), one bar; nine 300-4000 K source nodes, curated 1500-4000 K,
    75 archived gas-only endpoints. No planetary validation.
  conditions:
  - Source nodes 300,500,1000,1500,2000,2500,3000,3500,4000 K; production only 1500-4000 K.
  - 75 archived 537-species endpoints over 1e-6-100 bar and three C/O values; no new solve.
  evidence:
  - source_replay
- kind: scientific_applicability
  status: unknown
  description: Full physical uncertainty and planetary accuracy remain unestablished.
  conditions: []
  evidence:
  - literature
  - source_replay
claims:
- id: source_construction
  revision: '1'
  kind: numerical_verification
  statement: The unchanged H2S column combines NASA thermal functions with same-version atom-balanced ATcT
    1.172 D0; the native NASA R, atomic fine-structure zero and first-fragmentation threshold are explicit.
  scope: Neutral H2S; 2H(g)+S(g)->H2S(g), one bar; nine 300-4000 K source nodes, curated 1500-4000 K, 75 archived
    gas-only endpoints. No planetary validation.
- id: normalized_thermal_comparison
  revision: '1'
  kind: numerical_verification
  statement: All distributed AYT2 states and pinned HAPI H2S tables reproduce spin-normalized Q and direct
    moment calorics; assignment anomalies, metadata limits and shared source ancestry remain explicit.
  scope: Neutral H2S; 2H(g)+S(g)->H2S(g), one bar; nine 300-4000 K source nodes, curated 1500-4000 K, 75 archived
    gas-only endpoints. No planetary validation.
- id: scoped_retention
  revision: '1'
  kind: theoretical
  statement: Retaining the current H2S construction is justified while high-temperature AYT2/TIPS state convergence
    is unresolved; the finite distributed list is not adopted as a 4000 K production correction.
  scope: Neutral H2S; 2H(g)+S(g)->H2S(g), one bar; nine 300-4000 K source nodes, curated 1500-4000 K, 75 archived
    gas-only endpoints. No planetary validation.
- id: physical_accuracy
  revision: '1'
  kind: physical_validation
  statement: H2S energy and thermal functions have complete quantified physical uncertainty and produce accurate
    planetary abundances.
  scope: Neutral H2S; 2H(g)+S(g)->H2S(g), one bar; nine 300-4000 K source nodes, curated 1500-4000 K, 75 archived
    gas-only endpoints. No planetary validation.
