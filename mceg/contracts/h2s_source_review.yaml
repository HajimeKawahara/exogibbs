schema_version: '0.2'
model:
  id: exogibbs.h2s_source_review.v1
  name: H2S balanced energy and high-temperature thermal review
  description: Retain current construction provisionally; require high-J convergence before adopting the distributed
    AYT2/TIPS thermal sums.
  implementation:
    repository: https://github.com/HajimeKawahara/exogibbs
