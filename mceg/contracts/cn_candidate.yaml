follow_ups:
- id: scoped_adoption_decision
  target_kind: claim
  target: candidate_direction
  revision: '1'
  action: Adopt the tested retained-thermal ATcT energy correction in a separately authorized curated change, with
    source-fit residual and scientific limits documented.
  requires:
  - No new legacy full text is mandatory for this bounded energy calculation.
  - Retain covariance, thermal-state and physical-applicability limits.
  completion: Explicit scoped adoption or retention decision; this packet leaves production unchanged.
    Completed 2026-11-06 in mceg/contracts/curated_cn_adoption.yaml.
    The authorized CN energy correction is now a named curated_cn layer with fresh production verification.
    Original claims and receipts retain their historical scope; complete physical accuracy remains unknown.
- id: broader_thermal_and_uncertainty
  target_kind: claim
  target: physical_accuracy
  revision: '1'
  action: Quantify complete thermal and correlated reaction uncertainty only when suitable evidence is available.
  requires:
  - Consistent molecular/atomic state zeros, masses, degeneracy and symmetry, with Q/H/S/Cp convergence.
  - Reaction covariance and domain-relevant physical evidence.
  completion: Scoped physical evidence; no unbounded paper-acquisition gate for this numerical review.
limitations:
- statement: Marginal ATcT uncertainties are correlated. The JANAF-to-ATcT central-energy difference is not a significance
    test or a complete reaction uncertainty.
  evidence:
  - source_scope
  - decision_reasoning
- statement: Historical FastChem fitting weights and exact construction are incompletely recovered; the current
    fit/source residual is retained explicitly.
  evidence:
  - source_scope
  - candidate_validation
- statement: The floating-point Gibbs scale is a diagnostic, not a rigorous bound. Unresolved conditions and small
    background changes remain explicit.
  evidence:
  - finite_execution
- statement: The retained thermal model and finite ideal-gas grid do not establish complete electronic, isotope-mixture,
    condensation or disequilibrium planetary accuracy.
  evidence:
  - source_scope
  - finite_execution
