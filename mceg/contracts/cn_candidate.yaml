assumptions:
- statement: Balance ground-level gas C, N and CN within ATcT1.228; compare with the balanced physical JANAF D0.
    Apply only -4801 J/mol delta D0 once; do not add ZPE again.
  evidence:
  - source_scope
  - candidate_validation
- statement: Retain all literal five-coefficient fit terms, one-bar standard state and existing isotope/mass/degeneracy
    conventions. The formal fit intercept is not an independent physical D0.
  evidence:
  - candidate_validation
- statement: Check all species/elements/formula matrix/budgets and baseline potentials before archived reuse; fresh
    tighter baseline controls accompany the candidate solves.
  evidence:
  - finite_execution
domains:
- kind: numerical_evaluation
  status: documented
  description: C(g) + N(g) -> CN(g), 1 bar, 1500-4000 K; literal current five-coefficient thermal fit with physical
    JANAF-to-ATcT1.228 delta D0=-4801 J/mol and retained source-fit residual; fixed 537-species curated-cos-v1 network;
    no adoption.
  conditions:
  - Five temperatures 1500-4000 K, five pressures 1e-6-100 bar, three C/O values; 75 ion-inclusive conditions.
  - 75 fresh candidate endpoints, 75 reused baselines, six fresh strict endpoints, five finite-path nodes, four
    standalone FastChem comparisons.
  - No neutral-network solve, new thermal fit, production change or full physical atmospheric validation.
  evidence:
  - candidate_validation
  - finite_execution
- kind: scientific_applicability
  status: unknown
  description: Complete uncertainty and planetary applicability are not established.
  conditions: []
  evidence:
  - source_scope
  - finite_execution
