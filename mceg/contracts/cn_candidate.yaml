contexts:
- id: fixed_cos_network
  scope: C(g) + N(g) -> CN(g), 1 bar, 1500-4000 K; literal current five-coefficient thermal fit with physical JANAF-to-ATcT1.228
    delta D0=-4801 J/mol and retained source-fit residual; fixed 537-species curated-cos-v1 network; no adoption.
  settings:
    baseline_dataset: curated-cos-v1
    species: C1N1
    standard_pressure_bar: 1
    energy_shift_J_mol: -4801
    new_endpoint_solves: 75
    reused_baseline_cases: 75
    curated_update: none
    gibbs_conditions_above_displayed_scale: 67
assessments:
- id: continuous_thermodynamics_review
  kind: evidence_support
  claim: continuous_thermodynamics
  claim_revision: '1'
  subject: cn_atct1228_candidate_20261106
  context: fixed_cos_network
  method:
    id: review_cn_atct_candidate
    revision: '1'
    description: Separate balanced source energy and formal fit intercept, continuous calorics, finite numerical
      response, scoped preference and complete physical accuracy.
  evidence:
  - source_scope
  - candidate_validation
  - finite_execution
  - decision_reasoning
  reasons:
  - The literal fit reproduces current curated_cos at 2501 temperatures within 2.14e-14 in h. The physical source-energy
    correction raises G/H by 4801 J/mol and leaves S/Cp unchanged; source-fit residuals remain within 1e-14 of their
    prior values. Formal R*a=750234.141 J/mol is not relabelled as the physical JANAF D0=750156 J/mol.
  status: supported
  origin: reviewed
- id: finite_substitution_review
  kind: evidence_support
  claim: finite_substitution
  claim_revision: '1'
  subject: cn_atct1228_candidate_20261106
  context: fixed_cos_network
  method:
    id: review_cn_atct_candidate
    revision: '1'
    description: Separate balanced source energy and formal fit intercept, continuous calorics, finite numerical
      response, scoped preference and complete physical accuracy.
  evidence:
  - source_scope
  - candidate_validation
  - finite_execution
  - decision_reasoning
  reasons:
  - All endpoints and controls converge. CN mole-fraction ratios span 0.680483491-0.872135149. At 2500 K, 1e-4 bar,
    C/O=1.5, nitrogen in CN changes from 8.68248 to 6.98291 percent. Four independent FastChem comparisons agree
    within 1.05e-7 dex; eight same-model Gibbs comparisons below the displayed scale are retained.
  status: supported
  origin: reviewed
- id: candidate_direction_review
  kind: evidence_support
  claim: candidate_direction
  claim_revision: '1'
  subject: cn_atct1228_candidate_20261106
  context: fixed_cos_network
  method:
    id: review_cn_atct_candidate
    revision: '1'
    description: Separate balanced source energy and formal fit intercept, continuous calorics, finite numerical
      response, scoped preference and complete physical accuracy.
  evidence:
  - source_scope
  - candidate_validation
  - finite_execution
  - decision_reasoning
  reasons:
  - The same-version evaluated ATcT energy is scientifically preferable for this bounded refresh. The earlier state-sum
    and source comparisons support retaining thermals; the material 12.79-31.95 percent CN abundance decrease supports
    priority. Production adoption remains separate. Missing historical fit weights or universal uncertainty do not
    block merging this evidence.
  status: supported
  origin: reviewed
- id: universal_gibbs_resolution_review
  kind: evidence_support
  claim: universal_gibbs_resolution
  claim_revision: '1'
  subject: cn_atct1228_candidate_20261106
  context: fixed_cos_network
  method:
    id: review_cn_atct_candidate
    revision: '1'
    description: Separate balanced source energy and formal fit intercept, continuous calorics, finite numerical
      response, scoped preference and complete physical accuracy.
  evidence:
  - source_scope
  - candidate_validation
  - finite_execution
  - decision_reasoning
  reasons:
  - Only 67 of 75 conditions have both feasibility-corrected same-model exchange signs above the displayed floating-point
    scale. Eight cases remain unresolved. This scale is diagnostic rather than a rigorous bound, and absolute cross-model
    G does not establish physical preference.
  status: unknown
  origin: reviewed
- id: physical_accuracy_review
  kind: evidence_support
  claim: physical_accuracy
  claim_revision: '1'
  subject: cn_atct1228_candidate_20261106
  context: fixed_cos_network
  method:
    id: review_cn_atct_candidate
    revision: '1'
    description: Separate balanced source energy and formal fit intercept, continuous calorics, finite numerical
      response, scoped preference and complete physical accuracy.
  evidence:
  - source_scope
  - candidate_validation
  - finite_execution
  - decision_reasoning
  reasons:
  - Full reaction covariance, complete high-temperature state/thermal uncertainty, isotope-mixture treatment and
    planetary disequilibrium/condensation validation are unavailable. Ideal-gas numerical agreement alone does not
    supply them.
  status: unknown
