follow_ups:
- id: candidate_step_1
  target_kind: claim
  target: candidate_adoption
  revision: '1'
  action: Use the recovered W4-08 physical TAE0 only with a defensible molecular thermal reference. JANAF D298 is
    known, but its intrinsic D0 remains unavailable from the inspected table; the Jackson-based bridge is explicitly
    hybrid.
  requires:
  - Keep neutral-atom references, 1 bar, gas constant, zero-point and energy units consistent.
  - State electronic, rotational/vibrational, symmetry and isomer counting; retain unquantified uncertainties explicitly.
  completion: Archive scoped source/candidate calculations and their limits. Missing complete physical validation
    is not a blanket blocker for merging this source review.
- id: candidate_step_2
  target_kind: claim
  target: candidate_adoption
  revision: '1'
  action: Obtain Matus 2007 state energies, rovibrational constants and zero-point conventions (10.1063/1.2774973).
    Inspect singlet/triplet, symmetry, low barriers and possible double-counting before a partition calculation.
  requires:
