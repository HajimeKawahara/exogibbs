schema_version: '0.2'
model:
  id: exogibbs.s4_source_review.v1
  name: S4 energy and thermal-source investigation
  description: Inspect S4 source conventions and modern alternatives while preserving curated; distinguish source
    evidence, candidate readiness and physical accuracy.
  implementation: &id001
    repository: https://github.com/HajimeKawahara/exogibbs
    revision: sha256:6fe7417b91c71aca0bb6656d3fa50fcc829e287e59b0f96769f54f0e19dc8736
    entry_points:
    - mceg/reviews/s4_source_review.py
assumptions:
- statement: The reaction balances one neutral S4 against 4 neutral S atoms at 1 bar; source-specific atomic terms
    are retained. Balanced H298 alignment and modern energy/state diagnostics are not adopted thermochemical models.
  evidence:
  - literature_review
  - source_replay
- statement: The new RRHO calculation includes one well and one electronic component per archived record. Missing
    states, enantiomer counting, anharmonic/hindered motion and dissociation coverage are not inferred from numerical
    replay.
  evidence:
  - state_replay
domains:
- kind: numerical_evaluation
  status: documented
  description: Exact source nodes and an existing equilibrium archive.
  conditions:
  - Source decomposition at 500, 1000, 1500, 2000, 3000 and 4000 K; named curated_cos only at 1500-4000 K.
  - Positive JANAF audit nodes 298.15, 300, 500, 1000, 1500, 2000, 3000 and 4000 K.
  - 'Reused curated_cos_adoption/20261105/ions.npz: 75 cases, 537 species, 1500-4000 K, 1e-6-100 bar, reference
    C/O, 1 and 1.5. No new solve.'
  evidence:
  - source_replay
- kind: scientific_applicability
  status: unknown
  description: Complete high-temperature state counting, cooler/sulfur-rich regimes, photochemistry and physical
    atmospheric accuracy remain unvalidated.
  conditions: []
  evidence:
  - literature_review
  - source_replay
claims:
- id: source_attribution
  revision: '1'
  kind: numerical_verification
  statement: Official selected S4 NASA coefficients and JANAF nodes reproduce the frozen attribution, and balanced
    H298 alignment leaves a substantial thermal difference.
  scope: Neutral S4 gas; 4 S(g) -> S4(g), 1 bar; declared source nodes, labelled modern diagnostic and archived
    curated-cos footprint only.
- id: modern_source_screen
  revision: '2'
  kind: numerical_verification
  statement: In the original source packet, a primary abstract supports an illustrative triplet electronic weight,
    while physical TAE0 and complete rovibrational/state counting remain unresolved. The separate state_reconstruction
    assessment records subsequent progress.
  scope: Neutral S4 gas; 4 S(g) -> S4(g), 1 bar; declared source nodes, labelled modern diagnostic and archived
    curated-cos footprint only.
- id: numerical_replay
  revision: '1'
  kind: numerical_verification
  statement: The source decomposition, modern diagnostic and correctly stoichiometric archived sulfur allocation
    reproduce offline with pinned inputs.
  scope: Neutral S4 gas; 4 S(g) -> S4(g), 1 bar; declared source nodes, labelled modern diagnostic and archived
    curated-cos footprint only.
- id: candidate_adoption
  revision: '1'
  kind: physical_validation
  statement: A specified replacement S4 model has sufficient evidence and numerical evaluation for curated adoption.
  scope: Neutral S4 gas; 4 S(g) -> S4(g), 1 bar; declared source nodes, labelled modern diagnostic and archived
    curated-cos footprint only.
- id: physical_accuracy
  revision: '1'
  kind: physical_validation
  statement: S4 standard functions and atmospheric abundances have quantified physical accuracy over intended applications.
  scope: Neutral S4 gas; 4 S(g) -> S4(g), 1 bar; declared source nodes, labelled modern diagnostic and archived
    curated-cos footprint only.
- id: state_reconstruction
  revision: '1'
  kind: numerical_verification
  statement: Recovered numerical structures support a reproducible but incomplete RRHO diagnostic; physical W4-08
    S4 TAE0 is distinguished from JANAF D298 and a hybrid thermal sensitivity.
  scope: S4 selected Jackson v1.0 PBE0/0.96 records, one RRHO well and one electronic component per stored record;
    formal 250-4000 K diagnostic at 1 bar, no complete state-count or adoption claim. Separately inspected W4-08
    physical TAE0 and an explicitly hybrid JANAF/Jackson temperature bridge.
