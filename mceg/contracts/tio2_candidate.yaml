limitations:
- statement: Measured fundamentals are treated as harmonic constants; the ground-only primary omits real excited-state
    populations. Selected equal-rotation A-state and equal-rovib legacy-triplet sensitivities are not completeness
    bounds.
  evidence:
  - source_scope
  - continuous_model
- statement: NASA is a continuous proxy for JANAF thermals, not exact table interpolation. Retaining all inherited
    fit residuals does not prove their physical correctness. H298-control and fixed-D0 candidates have different
    energy-reference conventions.
  evidence:
  - continuous_model
- statement: Trace-element residuals reach1.46e-6 and all-species strict variations1.46e-5 in ln(x); target and
    major-element accuracy are reported separately. Floating-point total-G resolution is a diagnostic, not a physical
    bound.
  evidence:
  - finite_execution
