schema_version: '0.2'
model:
  id: exogibbs.tio2_candidate.v1
  name: TiO2 retained-energy measured RRHO thermal candidate
  description: Evaluate one continuous molecular thermal correction while preserving source D0, atomic references
    and current-fit residuals; quantify its bounded gas-network response.
  implementation: &id001
    repository: https://github.com/HajimeKawahara/exogibbs
