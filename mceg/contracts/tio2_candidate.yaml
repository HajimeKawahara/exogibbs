assumptions:
- statement: The literal current fit plus the new-minus-NASA molecular G-H0 preserves its documented source D0 and
    its full residual relative to that continuous thermal proxy; no unique 0K fit limit is assumed.
  evidence:
  - source_scope
  - continuous_model
- statement: Use measured48Ti16O2 rotation and gas fundamentals as harmonic frequencies, JANAF mass79.8788u, sigma2
    and spin weight1; ground-state-only primary with separately reported electronic sensitivities.
  evidence:
  - source_scope
  - continuous_model
- statement: All species/elements/formula-matrix/budgets/baseline potentials are verified against named curated_cos
    before reusing archives; selected baseline endpoints are solved afresh.
  evidence:
  - finite_execution
domains:
- kind: numerical_evaluation
  status: documented
  description: Ti(g) + 2 O(g) -> TiO2(g), 1 bar, 1500-4000 K; retained JANAF source D0 and complete current-fit
    residual relative to NASA thermal proxy; fixed 537-species curated-cos-v1 network; no adoption.
  conditions:
  - Continuous1500-4000K; no out-of-domain extrapolation.
  - '75 ion-inclusive conditions: five temperatures,five pressures1e-6-100bar,three C/O values.'
  - 75fresh+75reused endpoints,14selected controls,four standalone FastChem comparisons.
  evidence:
  - continuous_model
  - finite_execution
- kind: scientific_applicability
  status: unknown
  description: RRHO thermal sensitivity is scoped; complete high-temperature physical accuracy and planetary applicability
    are not established.
  conditions: []
  evidence:
  - source_scope
  - decision_reasoning
