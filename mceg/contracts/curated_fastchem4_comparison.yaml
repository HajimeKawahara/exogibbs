schema_version: '0.2'
model:
  id: exogibbs.curated_fastchem4_comparison.v1
  name: Current curated versus official FastChem 4.0.4 gas constants
  description: A fixed five-temperature neutral-formation comparison with the officially incorporated HCN update
    and refreshed current-curated/frozen-NASA quotients; no runtime source adoption or equilibrium abundance solve.
  implementation: &id001
    repository: https://github.com/HajimeKawahara/exogibbs
    revision: sha256:275dd19ba2630ab411aa714042d4d61b38ab4f823fbfefab7c785539f0fc0424
    entry_points:
    - mceg/reviews/curated_fastchem4_comparison.py
assumptions:
- statement: Both compared functions represent natural-log, dimensionless molecular formation Kp from constituent
    neutral gas atoms at 1 bar. No number-density conversion, extra 1e6 factor, gas-constant rescaling or second
    atomic-reference subtraction is applied.
  evidence:
  - official_sources
  - sampled_execution
- statement: The public curated alias is an execution-time snapshot; reproducible evaluation binds to named curated_v2
    and its pinned curated-gas-v2 chain, not future alias changes.
  evidence:
  - official_sources
  - sampled_execution
- statement: The 14 historical NASA exclusions remain separate identity/coverage annotations even when an exact
    FastChem/curated record-column match exists.
  evidence:
  - official_sources
  - sampled_execution
domains:
- kind: numerical_evaluation
  status: documented
  description: 108 explicitly identified neutral molecular records (93 historical main rows, 14 original NASA exclusions
    and C3H), 1500/2000/2500/3000/4000 K, dimensionless neutral-atom formation Kp at 1 bar; 540 curated-gas-v2/FastChem4
    ratios, 465 current-curated/frozen-NASA ratios for the original 93 only, and zero equilibrium abundance solves.
  conditions:
  - Five discrete temperatures only; the 1500 K projection is a source-disagreement screen.
  - All 108 targets are neutral; ion coefficients present in the source file are not compared as targets.
  evidence:
  - sampled_execution
- kind: scientific_applicability
  status: unknown
  description: Full physical error, correlated uncertainties, state completeness and planetary abundance or retrieval
    accuracy are not established.
  conditions: []
  evidence:
  - official_sources
  - sampled_execution
claims:
- id: source_selection
  revision: '1'
  kind: numerical_verification
  statement: The pinned official FastChem 4.0.4 full gas table contains the updated HCN coefficients and is paired
    with the explicit named curated-gas-v2 snapshot using reviewed record identities and the same one-bar neutral-atom
    formation convention.
  scope: 108 explicitly identified neutral molecular records (93 historical main rows, 14 original NASA exclusions
    and C3H), 1500/2000/2500/3000/4000 K, dimensionless neutral-atom formation Kp at 1 bar; 540 curated-gas-v2/FastChem4
    ratios, 465 current-curated/frozen-NASA ratios for the original 93 only, and zero equilibrium abundance solves.
    Exact source/record selection is supported; the original external fitting recipe and complete physical accuracy
    are not reconstructed.
- id: sampled_replay
  revision: '1'
  kind: numerical_verification
  statement: The archived 540 ratios, 465 NASA comparators, exact record metadata and display classifications reproduce
    under the declared replay criteria; independently evaluated five-coefficient fits agree with the native FastChem
    provider.
  scope: 108 explicitly identified neutral molecular records (93 historical main rows, 14 original NASA exclusions
    and C3H), 1500/2000/2500/3000/4000 K, dimensionless neutral-atom formation Kp at 1 bar; 540 curated-gas-v2/FastChem4
    ratios, 465 current-curated/frozen-NASA ratios for the original 93 only, and zero equilibrium abundance solves.
    Numeric replay uses relative tolerance 2e-11 and absolute tolerance 3e-13; identifiers, compositions, missing
    NASA values, grades and flags match exactly.
- id: physical_accuracy
  revision: '1'
  kind: physical_validation
  statement: Independent physical constraints establish complete thermochemical accuracy, uncertainties and atmospheric
    predictive accuracy for the compared models.
  scope: Requires independent physical evidence beyond database agreement, historical source ancestry, internal
    polynomial identities or successful numerical replay.
