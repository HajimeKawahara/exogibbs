schema_version: '0.2'
model:
  id: exogibbs.alh_source_review.v1
  name: Aluminium hydride source investigation and sensitivity
  description: Audit AlH energy and thermal conventions, conditionally favour a stronger binding energy, and measure
    a diagnostic source substitution.
  implementation: &id001
    repository: https://github.com/HajimeKawahara/exogibbs
    revision: sha256:7a07ed256bd09c4bab2f859760d64ea5a868bf4a6746c47262739c4eda0b209f
    entry_points:
    - mceg/reviews/alh_source_review.py
assumptions:
- statement: AlH is the neutral gas-phase diatomic X1Sigma+ species, not AlH3, a condensed hydride or an ion.
  evidence:
  - literature_review
  - source_replay
- statement: De, D0, zero-point energy and atomic fine-structure limits must be distinguished; ExoMol Q includes
    a nuclear-spin weight of 12 for 27AlH.
  evidence:
  - literature_review
  - source_replay
- statement: Only AlH thermochemistry changes within each fixed-network source pair; C/H alone varies between C/O
    settings.
  evidence:
  - finite_substitution
domains:
- kind: numerical_evaluation
  status: documented
  description: Exact-node source decomposition and thermal checks, a saved priority screen and 75 paired equilibrium
    cases.
  conditions:
  - Source decomposition at 500, 1000, 1500, 3000 K with 298.15 K reference; no curated evaluation below 1500 K.
  - Fit and caloric comparison over 1500-4000 K; ExoMol Q uses the explicitly recorded nuclear-spin and mass convention.
  - 'Equilibrium: 1500, 2000, 2500, 3000, 4000 K; 1e-6, 1e-4, 0.01, 1, 100 bar; C/O = 0.5888436553555908, 1, 1.5.'
  evidence:
  - source_replay
  - finite_substitution
- kind: scientific_applicability
  status: unknown
  description: The energy preference is conditional; neither a complete replacement thermal model nor atmospheric
    accuracy is established.
  conditions: []
  evidence:
  - literature_review
  - source_replay
  - finite_substitution
claims:
- id: source_attribution
  revision: '1'
  kind: numerical_verification
  statement: The current fit agrees with JANAF; its difference from NASA is dominated by the reaction energy anchor,
    with smaller but nonzero thermal and atomic contributions.
  scope: Neutral gaseous AlH, Al(g) + H(g) -> AlH(g), standard pressure 1 bar; source review without production
    adoption.
- id: conditional_energy_preference
  revision: '1'
  kind: theoretical
  statement: The inspected spectroscopic evidence conditionally favours a NASA-like stronger AlH binding energy
    over the old JANAF threshold.
  scope: Direction of energy selection only, not certification of an exact D0, adoption of 3.16 eV as D0, or validation
    of the NASA thermal model.
- id: finite_source_sensitivity
  revision: '1'
  kind: numerical_verification
  statement: A PH2-independent AlH-only raw-NASA substitution redistributes aluminium in the fixed gas network with
    verified constraints and solver checks.
  scope: 75 paired ideal-gas conditions, current curated-c2h-v1 versus a raw-NASA AlH-only diagnostic, 537 ion-inclusive
    species.
- id: complete_thermal_accuracy
  revision: '1'
  kind: physical_validation
  statement: A replacement AlH energy and thermal model has quantified accuracy throughout 1500-4000 K.
  scope: Requires exact dissociation-reference reconciliation and assessment of thermal-state completeness and caloric
    derivatives.
- id: atmospheric_accuracy
  revision: '1'
  kind: physical_validation
  statement: The AlH substitution improves predicted atmospheric abundances or spectra.
  scope: Physical atmosphere accuracy is separate from fixed-model numerical sensitivity.
evidence:
- id: literature_review
  kind: literature
  summary: Inspect the JANAF evaluation, NASA ancestry, Barklem-Collet source columns, primary dissociation abstract
    and modern spectroscopic work; record De/D0 and nuclear-spin conventions and access limits.
  sources:
