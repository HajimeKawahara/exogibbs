    correction.
- id: physical_atmosphere_validation
  target_kind: claim
  target: atmospheric_accuracy
  revision: '1'
  action: Evaluate a selected candidate against physical benchmarks for the intended atmosphere or spectrum.
  requires:
  - Defined physical target and benchmark
  - Justified candidate including relevant phases and processes
  completion: Assess physical accuracy independently of the raw-NASA source-sensitivity experiment.
limitations:
- statement: The conditional energy preference does not certify an exact replacement D0 or imply that NASA thermal
    functions are uniformly preferable.
  evidence:
  - literature_review
  - source_replay
- statement: The finite raw-NASA substitution is a diagnostic, not an uncertainty interval or a production adoption.
  evidence:
  - finite_substitution
- statement: The priority screen is restricted to selected candidates and the saved gas-only grid; neutral-only
    sensitivity, condensation, nonideality, kinetics and spectra were not evaluated.
  evidence:
