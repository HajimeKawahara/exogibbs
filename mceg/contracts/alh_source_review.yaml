contexts:
- id: source_comparison
  scope: Neutral gaseous AlH, Al(g) + H(g) -> AlH(g), standard pressure 1 bar; source review without production
    adoption.
  settings:
    standard_pressure_bar: 1
    reaction: Al(g) + H(g) -> AlH(g)
    reference_temperature_K: 298.15
    gas_constant_J_mol_K: 8.31446261815324
    temperatures_K: 500, 1000, 1500, 3000
    partition_convention: 27AlH Q/12; source-R and common-mass details retained in the source report.
    network: Individual source records; no equilibrium mixture
    elemental_budget: Not applicable to source property comparison
- id: fixed_network_sensitivity
  scope: 75 paired ideal-gas conditions, current curated-c2h-v1 versus a raw-NASA AlH-only diagnostic, 537 ion-inclusive
    species.
  settings:
    baseline: curated-c2h-v1
    probe: curated-c2h-v1+raw-nasa-alh-diagnostic
    standard_pressure_bar: 1
    network_species: 537
    ions: true
    temperatures_K: 1500, 2000, 2500, 3000, 4000
    pressures_bar: 1e-6, 1e-4, 0.01, 1, 100
    C_over_O: 0.5888436553555908, 1, 1.5
    elemental_budget: Asplund 2021 reference; vary only C/H; preserve other element/H ratios before normalization.
    solver: CPU float64 cold starts at epsilon_crit 1e-13 and 5e-14
    independent_solver: Standalone FastChem 4.0.3 at C/O=1.5, 3000 K, 100 bar, identical h/A/b at each endpoint.
    neutral_only: not_run
assessments:
- id: source_attribution_review
  kind: evidence_support
  claim: source_attribution
  claim_revision: '1'
  subject: alh_sources_20261102
  context: source_comparison
  method:
    id: review_alh_sources_and_sensitivity
    revision: '1'
    description: Distinguish numerical attribution, conditional energy selection, thermal completeness and finite
      mixture sensitivity.
  evidence:
  - literature_review
  - source_replay
  reasons:
  - The current JANAF fit and independent source reconstruction agree; reaction H298 differs by about 10.46 kJ/mol.
    Energy alignment removes most of the formation-K discrepancy.
  status: supported
  origin: reviewed
- id: conditional_energy_preference_review
  kind: evidence_support
  claim: conditional_energy_preference
  claim_revision: '1'
  subject: alh_sources_20261102
  context: source_comparison
  method:
    id: review_alh_sources_and_sensitivity
    revision: '1'
    description: Distinguish numerical attribution, conditional energy selection, thermal completeness and finite
      mixture sensitivity.
  evidence:
  - literature_review
  - source_replay
  - energy_reasoning
  reasons:
  - Primary reported De near 3.17 eV, a spectroscopic zero-point correction near 0.1034 eV and independent theoretical
    work favour stronger binding than JANAF D0 near 2.942 eV. NASA D0 near 3.050 eV is the better candidate, conditionally
    on unresolved fine-structure and original-source conventions; its exact value is not certified.
  status: supported
  origin: reviewed
- id: finite_source_sensitivity_review
  kind: evidence_support
  claim: finite_source_sensitivity
  claim_revision: '1'
  subject: alh_substitution_20261102
  context: fixed_network_sensitivity
  method:
    id: review_alh_sources_and_sensitivity
    revision: '1'
    description: Distinguish numerical attribution, conditional energy selection, thermal completeness and finite
      mixture sensitivity.
  evidence:
  - finite_substitution
  reasons:
  - All 300 cold solves pass; maximum tolerance delta-x is below 9.2e-14 and independent-solver disagreement below
    4.5e-8 dex. AlH takes 50.9702% to 63.4698% of Al at the highlighted condition.
  status: supported
  origin: reviewed
- id: complete_thermal_accuracy_review
  kind: evidence_support
  claim: complete_thermal_accuracy
  claim_revision: '1'
  subject: alh_sources_20261102
  context: source_comparison
  method:
    id: review_alh_sources_and_sensitivity
    revision: '1'
    description: Distinguish numerical attribution, conditional energy selection, thermal completeness and finite
      mixture sensitivity.
  evidence:
  - literature_review
  - source_replay
  reasons:
  - The original dissociation limit and uncertainty convention and Gurvich details remain incomplete. Agreement
    of partition functions at sampled temperatures does not certify complete electronic-state sums or high-temperature
    caloric accuracy.
  status: unknown
  origin: reviewed
- id: atmospheric_accuracy_review
  kind: evidence_support
