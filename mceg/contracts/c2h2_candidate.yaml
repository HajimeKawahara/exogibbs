contexts:
- id: candidate_evaluation
  scope: Neutral acetylene 2C+2H->C2H2, 1 bar standard pressure, 1500-4000 K; retained fit and exact NASA thermals
    at ATcT1.228 D0=1626018 J/mol; fixed curated-tio2-v1 75-case grids with 537 ion-inclusive and 421 neutral
    species. No production adoption.
  settings:
    dataset: curated-tio2-v1
    curated_update: none
    fresh_candidate_endpoints: 300
    reused_baselines: 150
    tighter_solves: 18
    path_solves: 10
    FastChem_comparisons: 6
    dtype: float64
assessments:
- id: continuous_thermodynamics_review
  kind: evidence_support
  claim: continuous_thermodynamics
  claim_revision: '1'
  subject: c2h2_candidates_and_substitution_20261106
  context: candidate_evaluation
  method:
    id: c2h2_candidate_source_and_substitution_review
    revision: '1'
    description: Separate exact source normalization and finite numerical response from physical and resolution
      claims.
  evidence:
  - source_scope
  - candidate_validation
  - finite_execution
  - decision_reasoning
  reasons:
  - The balanced -1135 J/mol D0 shift preserves S/Cp and fit residual; exact NASA native-R removal and SI-R
    energy insertion agree with independent expansion and JAX derivatives.
  status: supported
  origin: reviewed
- id: finite_substitution_review
  kind: evidence_support
  claim: finite_substitution
  claim_revision: '1'
  subject: c2h2_candidates_and_substitution_20261106
  context: candidate_evaluation
  method:
    id: c2h2_candidate_source_and_substitution_review
    revision: '1'
    description: Separate exact source normalization and finite numerical response from physical and resolution
      claims.
  evidence:
  - source_scope
  - candidate_validation
  - finite_execution
  - decision_reasoning
  reasons:
  - 300 candidate endpoints pass both fixed networks. C2H2 x ratios are 0.913012-0.995680 (retained) and 0.876749-0.993457
    (NASA); carbon redistribution is distinct from K sensitivity. All comparisons have explicit numerical bounds.
  status: supported
  origin: reviewed
- id: candidate_direction_review
  kind: evidence_support
  claim: candidate_direction
  claim_revision: '1'
  subject: c2h2_candidates_and_substitution_20261106
  context: candidate_evaluation
  method:
    id: c2h2_candidate_source_and_substitution_review
    revision: '1'
    description: Separate exact source normalization and finite numerical response from physical and resolution
      claims.
  evidence:
  - source_scope
  - candidate_validation
  - finite_execution
  - decision_reasoning
  reasons:
  - The evaluated ATcT energy is preferable to the old JANAF anchor. NASA changes the thermal reference and
    inherited residual but has no demonstrated superior full-range thermal accuracy; retain it as a control,
    not a confidence interval.
  status: supported
  origin: reviewed
- id: physical_accuracy_review
  kind: evidence_support
  claim: physical_accuracy
  claim_revision: '1'
  subject: c2h2_candidates_and_substitution_20261106
  context: candidate_evaluation
  method:
    id: c2h2_candidate_source_and_substitution_review
    revision: '1'
    description: Separate exact source normalization and finite numerical response from physical and resolution
      claims.
  evidence:
  - source_scope
  - candidate_validation
  - finite_execution
  - decision_reasoning
  reasons:
  - ATcT reaction covariance, complete thermal/isotopic/electronic uncertainty and atmospheric validation remain
    unavailable. Retained fit Cp residuals and unchanged background-source uncertainty persist.
  status: unknown
  origin: reviewed
- id: universal_gibbs_resolution_review
  kind: evidence_support
  claim: universal_gibbs_resolution
  claim_revision: '1'
  subject: c2h2_candidates_and_substitution_20261106
  context: candidate_evaluation
  method:
    id: c2h2_candidate_source_and_substitution_review
    revision: '1'
    description: Separate exact source normalization and finite numerical response from physical and resolution
      claims.
  evidence:
  - source_scope
  - candidate_validation
  - finite_execution
  - decision_reasoning
  reasons:
  - Corrected same-model differences satisfy a 5e-14 absolute numerical test. Individual ~1e-18 differences
    are unresolved; the finite checks do not establish arbitrary sign resolution.
  status: unknown
  origin: reviewed
follow_ups:
- id: bounded_production_decision
  target_kind: claim
  target: candidate_direction
  revision: '1'
  action: Review and separately authorize a bounded retained-thermal ATcT production adoption, then package
    and validate it without refitting.
  completion: A distinct production decision and validation, or explicit retention; no production change in
    this candidate packet.
- id: thermal_and_application_scope
  target_kind: claim
  target: physical_accuracy
  revision: '1'
  action: Compare complete thermal calorics, source corrections and background uncertainties before broader
    thermal or atmospheric claims.
  completion: Supply scoped evidence or retain unknown; ancestral full-text gaps alone do not block this completed
    finite candidate evaluation.
limitations:
- statement: ATcT marginal molecular uncertainty is not reaction covariance; the NASA model contrast is not
    a physical confidence band.
  evidence:
  - source_scope
- statement: Inherited Cp fit residual reaches 2.418 J/mol/K at a source node. The aCeTY finite PF is not a
    full-range candidate.
  evidence:
  - source_scope
  - candidate_validation
- statement: Neutral trace ln x varies by 8.83e-6 under tighter tolerances, while target ln x changes below
    4e-13. FastChem samples two ion-network conditions only.
  evidence:
  - finite_execution
- statement: All-element closure reaches 1.40e-6 in a trace inventory; H/C/O, charge and formation residuals
    are separately bounded. No condensation, transport, photochemistry or opacity calculation is provided.
  evidence:
  - finite_execution
