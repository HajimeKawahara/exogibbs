assessments:
- id: source_construction_review
  kind: evidence_support
  claim: source_construction
  claim_revision: '1'
  subject: cs_sources_20261105
  context: source_review
  method:
    id: review_cs_energy_thermal_and_scope
    revision: '1'
    description: Separate source reconstruction, numerical comparisons, scoped decision and physical accuracy.
  evidence:
  - literature
  - source_replay
  - retention_reasoning
  reasons:
  - Balanced current D0=709.311 kJ/mol, native NASA 710.814980. Native Rshift=-180.400027 K; all 75 savedCS potentials
    reproduce. Same-version ATcT 1.228 gives 709.690 kJ/mol, a 379 J/mol change.
  status: supported
  origin: reviewed
- id: normalized_thermal_comparison_review
  kind: evidence_support
  claim: normalized_thermal_comparison
  claim_revision: '1'
  subject: cs_sources_20261105
  context: source_review
  method:
    id: review_cs_energy_thermal_and_scope
    revision: '1'
    description: Separate source reconstruction, numerical comparisons, scoped decision and physical accuracy.
  evidence:
  - literature
  - source_replay
  - retention_reasoning
  reasons:
  - JnK 11497 states have spin factor 1 and ground zero 0. Q/NASA=.999926 at 1500 K and 1.000915 at 4000 K; publishedPFends
    3000 K. Above-D0levels carry 5.62e-9 of Q at 4000 K. Metadata/paper discrepancies remain explicit.
  status: supported
  origin: reviewed
- id: scoped_retention_and_candidate_priority_review
  kind: evidence_support
  claim: scoped_retention_and_candidate_priority
  claim_revision: '1'
  subject: cs_sources_20261105
  context: source_review
  method:
    id: review_cs_energy_thermal_and_scope
    revision: '1'
    description: Separate source reconstruction, numerical comparisons, scoped decision and physical accuracy.
  evidence:
  - literature
  - source_replay
  - retention_reasoning
  reasons:
  - The newer energy would multiply formationKby 1.030855 at 1500 K/1.011461 at 4000 K; no abundance substitution
    was run. Current thermal retention is supported while complete electronic thermal replacement is unestablished;
    current energy remains provisional.
  status: supported
  origin: reviewed
- id: physical_accuracy_review
  kind: evidence_support
  claim: physical_accuracy
  claim_revision: '1'
  subject: cs_sources_20261105
  context: source_review
  method:
    id: review_cs_energy_thermal_and_scope
    revision: '1'
    description: Separate source reconstruction, numerical comparisons, scoped decision and physical accuracy.
  evidence:
  - literature
  - source_replay
  - retention_reasoning
  reasons:
  - Missing-state bounds, complete electronic/rovibrational accuracy, isotope mixture, correlated reaction uncertainty
    and planetary validation remain unestablished.
  status: unknown
  origin: reviewed
follow_ups:
- id: balanced_energy_candidate
  target_kind: claim
  target: physical_accuracy
  revision: '1'
  action: Build a NASA-thermal/ATcT 1.228 balanced-energy candidate and run fixed-network sulfur redistribution
    before production adoption.
  requires:
  - Official same-version C, S, CS entries are already inspected.
  - No mandatory additional historical full text; preserve old curated data and evidence.
  completion: Finite substitution with conservation/convergence controls and explicit adoption decision.
- id: precision_thermal_completion
  target_kind: claim
  target: physical_accuracy
  revision: '1'
  action: If higher thermal accuracy is needed, reconcile distribution/PF metadata and converge full electronic
    Q, H, S, Cp with consistent energy zeros.
  requires:
  - Optional Coxon 2023 full text/supplement DOI 10.1016/j.jms.2023.111861 for improved ground potential; no unconditional
    merger gate.
  - Paulose 2015 and Li 2022 full texts and current JnK states are already inspected.
  completion: Derivative-consistent thermal candidate with bounded omitted-state contributions; source-review merge
    does not require it.
limitations:
- statement: Legacy Gurvich/Prinslow originals and ATcT reaction covariance were not reaudited; the version shift
    is not a measured statistical discrepancy.
  evidence:
  - literature
- statement: Finite boundary populations are not global completeness bounds; JnK 4000 K and the Te-only electronic
    model remain diagnostics.
  evidence:
  - literature
  - source_replay
- statement: Current sulfur allocation is not a finite-substitution response and excludes photochemistry, condensation,
    transport and observational validation.
  evidence:
  - source_replay
