schema_version: '0.2'
model:
  id: exogibbs.ph2_source_review.v1
  name: Phosphino source investigation and sensitivity
  description: Audit printed/online JANAF PH2 and a finite raw-NASA substitution; retain current production
    coefficients.
  implementation: &id001
    repository: https://github.com/HajimeKawahara/exogibbs
    revision: sha256:7008d6932b2531ab513088c0b9db7ef8dd1e89cb101e9ade6603fb5b5f452200
    entry_points:
    - mceg/reviews/ph2_source_review.py
assumptions:
- statement: Compare the same neutral PH2 molecule with balanced source-specific atomic references at 1 bar.
  evidence:
  - literature_review
  - source_replay
- statement: Ideal-gas equilibrium uses fixed species, formula matrix and budgets within each pair; only PH2
    thermochemistry changes.
  evidence:
  - finite_substitution
domains:
- kind: numerical_evaluation
  status: documented
  description: Four source-comparison nodes, 26 fit-audit nodes and 75 paired equilibrium conditions.
  conditions:
  - 'Source decomposition: 500, 1000, 1500, 3000 K, reference 298.15 K; curated unavailable below 1500 K.'
  - 'Fit comparison: 26 exact JANAF nodes over 1500-4000 K.'
  - 'Online reference signature: 64 exact PH2/H2 nodes over 100-6000 K; printed reference closure: five inspected
    nodes.'
  - 'Equilibrium: 1500, 2000, 2500, 3000, 4000 K; 1e-6, 1e-4, 0.01, 1, 100 bar; C/O = 0.5888436553555908, 1,
    1.5.'
  evidence:
  - source_replay
  - finite_substitution
- kind: scientific_applicability
  status: unknown
  description: No quantified high-temperature PH2 accuracy or validation of a physical atmosphere.
  conditions: []
  evidence:
  - literature_review
  - finite_substitution
claims:
- id: source_attribution
  revision: '1'
  kind: numerical_verification
  statement: Printed and online JANAF PH2 differ; the online formation columns have an inconsistent elemental-reference
    signature while the current fit agrees with the printed H/S reconstruction.
  scope: Neutral gaseous PH2, P(g) + 2 H(g) -> PH2(g), 1 bar; offline source comparison, not model adoption.
- id: finite_source_sensitivity
  revision: '1'
  kind: numerical_verification
  statement: Replacing only PH2 by the frozen raw-NASA reaction redistributes phosphorus under the fixed ideal-gas
    network, with conservation and solver checks.
  scope: 75 ideal-gas paired cases, current curated-c2h-v1 versus a PH2-only raw-NASA diagnostic, 537 ion-inclusive
    species.
- id: preferred_physical_replacement
  revision: '1'
  kind: physical_validation
  statement: A preferred replacement PH2 energy and thermal model has quantified accuracy over 1500-4000 K.
  scope: Requires consistent modern molecular/atomic energy references and independent thermal-state review.
- id: atmospheric_accuracy
  revision: '1'
  kind: physical_validation
  statement: The PH2 substitution improves predicted atmospheric abundances.
  scope: Physical atmospheric accuracy is distinct from fixed-model numerical sensitivity.
evidence:
- id: literature_review
  kind: literature
  summary: Identify PH2, JANAF print/web differences and later source ancestry; visually verify the supplied
    complete 2009 Matus correction and confirm the prior numerical transcription.
  sources:
  - tests/data/validation/ph2_source_review/20261102/sources.json
  - tests/data/validation/ph2_source_review/20261102/literature.json
  scope: Neutral gaseous PH2, P(g) + 2 H(g) -> PH2(g), 1 bar; offline source comparison, not model adoption.
  subject: ph2_sources_20261102
  context: source_comparison
  artifacts:
  - source: tests/data/validation/ph2_source_review/20261102/sources.json
    sha256: 42d9ae99a87372b746fc2dcbbfad064f2c90abfa69c6b7893d44149248e40b83
  - source: tests/data/validation/ph2_source_review/20261102/literature.json
    sha256: 14af088301218da9982744c023b2a0d157e608f5e00794da2878adb03b52d423
  provenance:
    role: secondary
    location: Fixed PH2 review packet; source versions and inspection limits are explicit.
    inspection: partial
    note: The supplied PDF is the one-page 2009 correction, not the 2007 main/SI. PH2 theory/quoted-experiment
      reference conventions and the original experimental cycle remain unresolved.
- id: source_replay
  kind: numerical_test
  summary: Reproduce the frozen discrepancy, online 1.5 H2 signature, printed P(ref)+H2 closure and current-fit
    agreement; decompose energy, thermal and atomic differences.
  sources:
  - tests/data/validation/ph2_source_review/20261102/comparison.json
  - tests/data/validation/ph2_source_review/20261102/receipt.json
  scope: Neutral gaseous PH2, P(g) + 2 H(g) -> PH2(g), 1 bar; offline source comparison, not model adoption.
  subject: ph2_sources_20261102
  context: source_comparison
  artifacts:
  - source: tests/data/validation/ph2_source_review/20261102/comparison.json
    sha256: 9bfc8792910f4abbb5d169b837ffa646f82f6a12c4b0696275b440b067e6ba62
  - source: tests/data/validation/ph2_source_review/20261102/receipt.json
    sha256: 868c8bce3197a8c3ee59305afb74369156c0454fb137e6b76d3c7be49f4114d1
  provenance:
    role: primary
    location: Fixed PH2 review packet; source versions and inspection limits are explicit.
    inspection: inspected
    note: No inference of physical accuracy from numerical agreement.
  result: passed
- id: finite_substitution
  kind: numerical_test
  summary: 300 cold solves pass diagnostics; save full endpoints and P/C/N budgets, tighter-tolerance stability,
    and a separate 3000 K FastChem comparison at both endpoints.
  sources:
