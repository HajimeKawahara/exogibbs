contexts:
- id: source_comparison
  scope: Neutral gaseous PH2, P(g) + 2 H(g) -> PH2(g), 1 bar; offline source comparison, not model adoption.
  settings:
    standard_pressure_bar: 1
    reaction: P(g) + 2 H(g) -> PH2(g)
    reference_temperature_K: 298.15
    gas_constant_J_mol_K: 8.31446261815324
    temperatures_K: 500, 1000, 1500, 3000
    network: Individual source records; no equilibrium mixture
    elemental_budget: Not applicable to source property comparison
- id: fixed_network_sensitivity
  scope: 75 ideal-gas paired cases, current curated-c2h-v1 versus a PH2-only raw-NASA diagnostic, 537 ion-inclusive
    species.
  settings:
    baseline: curated-c2h-v1
    probe: curated-c2h-v1+raw-nasa-ph2-diagnostic
    standard_pressure_bar: 1
    network_species: 537
    ions: true
    temperatures_K: 1500, 2000, 2500, 3000, 4000
    pressures_bar: 1e-6, 1e-4, 0.01, 1, 100
    C_over_O: 0.5888436553555908, 1, 1.5
    elemental_budget: Asplund 2021 reference; vary only C/H; preserve other element/H ratios before normalization.
    solver: CPU float64; cold starts at epsilon_crit 1e-13 and 5e-14
    independent_solver: Standalone FastChem 4.0.3 at reference C/O, 3000 K, 100 bar, identical h/A/b for each
      endpoint
    neutral_only: not_run
assessments:
- id: source_attribution_review
  kind: evidence_support
  claim: source_attribution
  claim_revision: '1'
  subject: ph2_sources_20261102
  context: source_comparison
  method:
    id: review_ph2_sources_and_sensitivity
    revision: '2'
    description: Distinguish source/version attribution, numerical sensitivity and physical source selection.
  evidence:
  - literature_review
  - source_replay
  reasons:
  - The online 1.5 H2 signature and printed P(ref)+H2 closure hold within table rounding; current-fit residual
    is below 0.012 in ln K. Agreement does not identify the historical fit-generation procedure.
  status: supported
  origin: reviewed
- id: finite_source_sensitivity_review
  kind: evidence_support
  claim: finite_source_sensitivity
  claim_revision: '1'
  subject: ph2_substitution_20261102
  context: fixed_network_sensitivity
  method:
    id: review_ph2_sources_and_sensitivity
    revision: '2'
    description: Distinguish source/version attribution, numerical sensitivity and physical source selection.
  evidence:
  - finite_substitution
  reasons:
  - All 300 cold solves pass; maximum tolerance delta-x is below 9.2e-14 and the separate independent-solver
    comparison is below 5.7e-7 dex. The highlighted PH2 P share falls from 64.2509% to 50.3632%.
  status: supported
  origin: reviewed
- id: preferred_physical_replacement_review
  kind: evidence_support
  claim: preferred_physical_replacement
  claim_revision: '1'
  subject: ph2_sources_20261102
  context: source_comparison
  method:
    id: review_ph2_sources_and_sensitivity
    revision: '2'
    description: Distinguish source/version attribution, numerical sensitivity and physical source selection.
  evidence:
  - literature_review
  - source_replay
  reasons:
  - Printed JANAF uses an old estimated energy and thermal model; raw NASA and newer theory/experiment differ.
    Modern atomic-reference conventions, uncertainty definitions and high-temperature state sums require further
    reconciliation. Retain the current fit provisionally.
  status: unknown
  origin: reviewed
- id: atmospheric_accuracy_review
  kind: evidence_support
  claim: atmospheric_accuracy
  claim_revision: '1'
  subject: ph2_substitution_20261102
  context: fixed_network_sensitivity
  method:
    id: review_ph2_sources_and_sensitivity
    revision: '2'
    description: Distinguish source/version attribution, numerical sensitivity and physical source selection.
  evidence:
  - finite_substitution
  reasons:
  - Source sensitivity and solver agreement are not physical validation; no atmospheric abundance observations
    or independent physical benchmarks are evaluated.
  status: unknown
  origin: reviewed
follow_ups:
- id: reconcile_modern_energy_and_thermal_model
  target_kind: claim
  target: preferred_physical_replacement
  revision: '1'
  action: Reconcile modern PH2 atomization/formation energies and measured spectroscopy before selecting a
    replacement.
  requires:
  - Original Matus 2007 main/SI atomization, zero-point and thermal inputs, and Berkowitz 1989 experimental
    cycle; the supplied 2009 correction is already inspected
  - Consistent P/H atomic references, white/red phosphorus conventions and uncertainty definitions
  - Thermal-state construction from measured vibration/rotation/electronic levels over the declared temperature
    range
  completion: Record a justified energy/thermal candidate and applicability limits, then evaluate it under
    a new model identity.
- id: physical_abundance_validation
  target_kind: claim
  target: atmospheric_accuracy
  revision: '1'
  action: Evaluate an adopted candidate against physical benchmarks appropriate to the intended use.
  requires:
  - Justified thermochemical candidate
  - Explicit atmosphere and observable/benchmark definition
  completion: Assess physical accuracy without repurposing the raw-NASA diagnostic as validation.
limitations:
- statement: The raw-NASA endpoint is a diagnostic, not an adoption, preferred source ranking or uncertainty
    interval.
  evidence:
  - literature_review
  - finite_substitution
- statement: The online reference signature does not establish the historical cause; current-fit agreement
    is numerical attribution rather than a recovered fit-generation record.
  evidence:
  - source_replay
- statement: No neutral-only sensitivity, condensation, nonideality, quenching, photochemistry or spectra are
    evaluated.
  evidence:
  - finite_substitution
