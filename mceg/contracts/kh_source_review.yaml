limitations:
- statement: Published PF includes noninteger rounded temperature knots. Replay uses the actual nearest knot, not
    an invented exact integer value; remaining small mismatch is not claimed to be fully explained by rounding.
  evidence:
  - literature
  - source_replay
- statement: Paper PF discussion names X/A/B while distributed states also include C. C contribution and boundary
    populations are quantified without discarding states or declaring completeness.
  evidence:
