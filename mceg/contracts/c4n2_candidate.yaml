assessments:
- id: continuous_thermodynamics_review
  kind: evidence_support
  claim: continuous_thermodynamics
  claim_revision: '1'
  subject: c4n2_candidates_and_substitution_20261106
  context: candidate_evaluation
  method:
    id: c4n2_source_and_finite_substitution
    revision: '1'
    description: Separate source energies, model contrasts and finite numerical response from physical-accuracy
      claims.
  evidence:
  - source_scope
  - candidate_validation
  - finite_execution
  - decision_reasoning
  reasons:
  - Original physical D0=3257.782000000 and selected D0=3262.140965000 kJ/mol. The retained G/H shift is -4.358965000
    kJ/mol; S/Cp and the complete fit residual are unchanged. Dense and off-grid independent calorics agree.
  status: supported
  origin: reviewed
- id: finite_substitution_review
  kind: evidence_support
  claim: finite_substitution
  claim_revision: '1'
  subject: c4n2_candidates_and_substitution_20261106
  context: candidate_evaluation
  method:
    id: c4n2_source_and_finite_substitution
    revision: '1'
    description: Separate source energies, model contrasts and finite numerical response from physical-accuracy
      claims.
  evidence:
  - source_scope
  - candidate_validation
  - finite_execution
  - decision_reasoning
  reasons:
  - 300 fresh endpoints and explicit selected controls pass. Bulk/source accuracy is not inferred from solver
    agreement.
  status: supported
  origin: reviewed
- id: candidate_direction_review
  kind: evidence_support
  claim: candidate_direction
  claim_revision: '1'
  subject: c4n2_candidates_and_substitution_20261106
  context: candidate_evaluation
  method:
    id: c4n2_source_and_finite_substitution
    revision: '1'
    description: Separate source energies, model contrasts and finite numerical response from physical-accuracy
      claims.
  evidence:
  - source_scope
  - candidate_validation
  - finite_execution
  - decision_reasoning
  reasons:
  - A bounded corrected-energy update using the explicitly selected NASA physical anchor is supported by the
    documented combustion correction. Prefer retaining thermals for that step; the second full NASA model is
    a sensitivity. This trace-species update has low immediate priority on the tested grid.
  status: supported
  origin: reviewed
- id: physical_accuracy_review
  kind: evidence_support
  claim: physical_accuracy
  claim_revision: '1'
  subject: c4n2_candidates_and_substitution_20261106
  context: candidate_evaluation
  method:
    id: c4n2_source_and_finite_substitution
    revision: '1'
    description: Separate source energies, model contrasts and finite numerical response from physical-accuracy
      claims.
  evidence:
  - source_scope
  - candidate_validation
  - finite_execution
  - decision_reasoning
  reasons:
  - The NASA/JANAF thermal contrast remains separate from the documented combustion correction. The full correction
    text was not reanalysed, and no new high-temperature partition function is inferred from the structure
    paper. Marginal source widths do not supply reaction covariance or a complete thermal uncertainty.
  status: unknown
  origin: reviewed
