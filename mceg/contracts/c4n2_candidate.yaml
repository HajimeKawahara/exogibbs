  kind: evidence_support
  claim: universal_gibbs_resolution
  claim_revision: '1'
  subject: c4n2_candidates_and_substitution_20261106
  context: candidate_evaluation
  method:
    id: c4n2_source_and_finite_substitution
    revision: '1'
    description: Separate source energies, model contrasts and finite numerical response from physical-accuracy
      claims.
  evidence:
  - source_scope
  - candidate_validation
  - finite_execution
  - decision_reasoning
  reasons:
  - Some finite trace exchanges remain below the displayed numerical scale. Path tolerances are finite consistency
    checks, not rigorous monotonicity proof for arbitrary small effects.
  status: unknown
  origin: reviewed
