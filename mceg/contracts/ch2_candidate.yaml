contexts:
- id: fixed_tio2_network
  scope: C(g) + 2 H(g) -> CH2(g), 1 bar, 1500-4000 K; retained-thermal ATcT1.228 energy candidate and independent
    reconstructed three-state RRHO sensitivity; fixed curated-tio2-v1 ion-inclusive 537-species and neutral 421-species
    networks; no production adoption.
  settings:
    baseline_dataset: curated-tio2-v1
    species: C1H2
    standard_pressure_bar: 1
    delta_D0_J_mol: -4948
    new_endpoint_solves: 300
    selected_cold_solves: 34
    unique_reused_baselines: 150
    independent_fastchem_comparisons: 4
    curated_update: none
    gibbs_conditions_above_displayed_scale_per_candidate_network: 63
assessments:
- id: source_reconstruction_audit_review
  kind: evidence_support
  claim: source_reconstruction_audit
  claim_revision: '1'
  subject: ch2_energy_and_rrho_candidates_20261106
  context: fixed_tio2_network
  method:
    id: review_ch2_candidates
    revision: '1'
    description: Separate source-table reconstruction, balanced physical energy, continuous proxy residual, finite
      numerical response, scoped recommendation and physical/adoption limits.
  evidence:
  - source_scope
  - continuous_model
  - finite_execution
  - decision_reasoning
  reasons:
  - 'The triplet-only and singlet-only tables reproduce within 1.076 and 0.468 J/mol in H over all 16 printed nodes.
    Direct combination of the two printed tables with the physical 3147 cm-1 origin independently disagrees with
    the printed equilibrated table: at 3000 K delta H=-2974.938 J/mol, delta S=-2.716719 J/mol/K, delta G=5175.220
    J/mol. The cause remains unresolved; the independent model is not relabeled as the IUPAC equilibrated table.'
  status: supported
  origin: reviewed
- id: continuous_thermodynamics_review
  kind: evidence_support
  claim: continuous_thermodynamics
  claim_revision: '1'
  subject: ch2_energy_and_rrho_candidates_20261106
  context: fixed_tio2_network
  method:
    id: review_ch2_candidates
    revision: '1'
    description: Separate source-table reconstruction, balanced physical energy, continuous proxy residual, finite
      numerical response, scoped recommendation and physical/adoption limits.
  evidence:
  - source_scope
  - continuous_model
  - finite_execution
  - decision_reasoning
  reasons:
  - The balanced ATcT D0=752392 J/mol versus JANAF757340 produces G/H+4948 and unchanged S/Cp. The formal fit intercept758027.186
    J/mol is distinct. The RRHO sensitivity retains the current-fit residual relative to NASA molecular and atomic
    thermal proxies. Dense scalar/JAX calorics and independent finite sums agree within their declared precision.
    The 3000-4000 K interval is an explicit model extension, not source-validated physical accuracy.
  status: supported
  origin: reviewed
- id: finite_substitution_review
  kind: evidence_support
  claim: finite_substitution
  claim_revision: '1'
  subject: ch2_energy_and_rrho_candidates_20261106
  context: fixed_tio2_network
  method:
    id: review_ch2_candidates
    revision: '1'
    description: Separate source-table reconstruction, balanced physical energy, continuous proxy residual, finite
      numerical response, scoped recommendation and physical/adoption limits.
  evidence:
  - source_scope
  - continuous_model
  - finite_execution
  - decision_reasoning
  reasons:
  - All 300 fresh endpoints and 34 selected controls converge; source/baseline hashes, all species/formula matrix/budgets
    and named-factory potentials match before reuse. Four FastChem comparisons agree within2.34e-8 dex. Maximum
    major-element residual2.69e-13, all-element trace-relative residual1.40e-6, charge2.82e-14 and formation1.37e-12.
    Tighter target ln(x) change is below3e-13; all-species difference reaches1.40e-5.
  status: supported
  origin: reviewed
- id: candidate_direction_review
  kind: evidence_support
  claim: candidate_direction
  claim_revision: '1'
  subject: ch2_energy_and_rrho_candidates_20261106
  context: fixed_tio2_network
  method:
    id: review_ch2_candidates
    revision: '1'
    description: Separate source-table reconstruction, balanced physical energy, continuous proxy residual, finite
      numerical response, scoped recommendation and physical/adoption limits.
  evidence:
  - source_scope
  - continuous_model
  - finite_execution
  - decision_reasoning
  reasons:
  - The supported direction is energy-only ATcT1.228. Ion-inclusive CH2 abundance becomes0.672510-0.868368 of baseline,
    and maximum carbon allocation becomes2.25999205% from2.60379173%. The reconstructed RRHO sensitivity gives2.24792979%
    at the same4000K/100bar/C/O1.5 condition, but its proximity to NASA and solver convergence do not justify thermal
    adoption. Production adoption remains separate.
  status: supported
  origin: reviewed
- id: universal_gibbs_resolution_review
  kind: evidence_support
  claim: universal_gibbs_resolution
  claim_revision: '1'
  subject: ch2_energy_and_rrho_candidates_20261106
  context: fixed_tio2_network
  method:
    id: review_ch2_candidates
    revision: '1'
    description: Separate source-table reconstruction, balanced physical energy, continuous proxy residual, finite
      numerical response, scoped recommendation and physical/adoption limits.
  evidence:
  - source_scope
  - continuous_model
  - finite_execution
  - decision_reasoning
  reasons:
  - Each candidate/network has63 of75 feasibility-corrected same-model Gibbs exchanges above the displayed floating-point
    scale;12 remain unresolved. The diagnostic is not a rigorous numerical bound, and absolute cross-model Gibbs
    values do not select the physical source.
  status: unknown
  origin: reviewed
- id: physical_accuracy_review
  kind: evidence_support
  claim: physical_accuracy
  claim_revision: '1'
  subject: ch2_energy_and_rrho_candidates_20261106
  context: fixed_tio2_network
  method:
    id: review_ch2_candidates
    revision: '1'
    description: Separate source-table reconstruction, balanced physical energy, continuous proxy residual, finite
      numerical response, scoped recommendation and physical/adoption limits.
  evidence:
  - source_scope
  - continuous_model
  - finite_execution
  - decision_reasoning
  reasons:
  - Complete correlated reaction uncertainty, large-amplitude and Renner-Teller thermals, anharmonicity, isotope
    mixtures, spin-resolved populations and planetary nonequilibrium/condensation accuracy remain unestablished.
    The 2024 manuscript/SI validates convergence at296K only and does not provide a complete1500-4000K state or
    partition archive.
  status: unknown
  origin: reviewed
- id: production_adoption_review
  kind: evidence_support
  claim: production_adoption
  claim_revision: '1'
  subject: ch2_energy_and_rrho_candidates_20261106
  context: fixed_tio2_network
  method:
    id: review_ch2_candidates
    revision: '1'
    description: Separate source-table reconstruction, balanced physical energy, continuous proxy residual, finite
      numerical response, scoped recommendation and physical/adoption limits.
  evidence:
  - source_scope
  - continuous_model
  - finite_execution
  - decision_reasoning
  reasons:
  - Only review helpers, offline evidence and documentation are added. Production runtime and packaged curated data
    are unchanged; a separately authorized implementation and verification are required.
  status: unknown
  origin: reviewed
follow_ups:
- id: scoped_energy_adoption
  target_kind: claim
  target: candidate_direction
  revision: '1'
  action: Adopt the retained-thermal ATcT energy correction only in a separately scoped production change; preserve
    physical-versus-fit energy distinction and immutable source history.
  requires:
  - Explicit production adoption scope and deterministic packaged potential verification.
  - Retain correlated energy uncertainty and thermal-model limits.
  completion: Production decision and verification; no new ancestral full text is mandatory for the bounded energy
    candidate.
- id: resolve_thermal_model
  target_kind: claim
  target: physical_accuracy
  revision: '1'
  action: Resolve the printed component/equilibrium discrepancy and obtain a converged large-amplitude/anharmonic
    thermal model before recommending a thermal replacement.
  requires:
  - Consistent electronic origins, degeneracies, nuclear-spin and energy zeros.
  - Q/H/S/Cp convergence across the claimed temperature domain.
  completion: A separately justified thermal candidate; this does not block merging the scoped energy and sensitivity
    evidence.
limitations:
- statement: The reconstructed RRHO model fails to reproduce the published combined table even within1500-3000K;3000-4000K
    is a declared analytic sensitivity extension. Neither is asserted as source-guaranteed physical accuracy.
  evidence:
  - source_scope
  - continuous_model
- statement: The thermal residual is defined against NASA molecular and atomic proxies, not directly against a literal
    JANAF molecular table. The NASA control is an exact identity and adds no independent solves.
  evidence:
  - continuous_model
- statement: Marginal ATcT uncertainties do not give the correlated atomization uncertainty; old fitting construction
    and source residual are retained explicitly.
  evidence:
  - source_scope
  - continuous_model
- statement: Twelve of75 same-model Gibbs exchanges per candidate/network remain below the diagnostic scale; finite
    ideal-gas numerical agreement does not prove planetary physical accuracy.
  evidence:
  - finite_execution
  - decision_reasoning
