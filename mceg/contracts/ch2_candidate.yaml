schema_version: '0.2'
model:
  id: exogibbs.ch2_candidate.v1
  name: CH2 retained-thermal ATcT candidate and reconstructed thermal sensitivity
  description: Evaluate the balanced energy correction and independently reconstruct published state constants without
    equating that model with an inconsistent printed equilibrium table.
  implementation: &id001
    repository: https://github.com/HajimeKawahara/exogibbs
    revision: sha256:edd12923c6dc3722ff221f3ee216dcb13865ac08abc39ccd40166a90c24b486d
    entry_points:
    - mceg/reviews/ch2_candidate.py
    - mceg/reviews/ch2_equilibrium_impact.py
    - mceg/reviews/ch2_rrho_audit.py
assumptions:
- statement: Use only ATcT1.228 neutral C/H/regular CH2 in the balanced ground-level energy cycle; apply delta D0=-4948
    J/mol once, without adding ZPE.
  evidence:
  - source_scope
  - continuous_model
- statement: Preserve the literal current thermals for the primary. For thermal sensitivities preserve the full
    residual relative to NASA thermal proxies and the same atomic gauge; NASA re-insertion is identically the energy-only
    model.
  evidence:
  - continuous_model
- statement: Use electronic weights3/1/1, sigma2 per state, excluded nuclear spin weight1 and mean mass14.02658u;
    triplet-only is a different partial species. The reconstructed three-state RRHO is not the printed IUPAC equilibrium
    model.
  evidence:
  - source_scope
  - continuous_model
- statement: Verify archived baseline hashes, named factory potentials, species, elements, formula matrix, conditions
    and budgets before reuse; fresh tighter baseline checks accompany candidate endpoints.
  evidence:
  - finite_execution
domains:
- kind: numerical_evaluation
  status: documented
  description: C(g) + 2 H(g) -> CH2(g), 1 bar, 1500-4000 K; retained-thermal ATcT1.228 energy candidate and independent
    reconstructed three-state RRHO sensitivity; fixed curated-tio2-v1 ion-inclusive 537-species and neutral 421-species
    networks; no production adoption.
  conditions:
  - Five temperatures1500,2000,2500,3000,4000K; five pressures1e-6-100bar; three C/O values;75 cases per network.
  - Two candidates each receive75 ions+75 neutral fresh endpoints;150 unique baselines reused;34 selected fresh
    cold controls;4 independent ion-inclusive FastChem comparisons.
  - Independent RRHO sensitivity1500-4000K; component tables150-3000K; extension beyond3000K is not author-validated
    physical applicability.
  evidence:
  - continuous_model
  - finite_execution
- kind: scientific_applicability
  status: unknown
  description: Complete high-temperature CH2 thermal and atmospheric accuracy is not established.
  conditions: []
  evidence:
  - source_scope
  - decision_reasoning
claims:
- id: source_reconstruction_audit
  revision: '1'
  kind: numerical_verification
  statement: Independent component-table reconstruction and direct combination of printed calorics identify a discrepancy
    with the published equilibrated CH2 table, without fitting source parameters.
  scope: C(g) + 2 H(g) -> CH2(g), 1 bar, 1500-4000 K; retained-thermal ATcT1.228 energy candidate and independent
    reconstructed three-state RRHO sensitivity; fixed curated-tio2-v1 ion-inclusive 537-species and neutral 421-species
    networks; no production adoption.
- id: continuous_thermodynamics
  revision: '1'
  kind: numerical_verification
  statement: The energy candidate preserves current thermals; the RRHO sensitivity preserves the full current-fit
    residual relative to the declared NASA thermal proxy, with continuous scalar/JAX G/H/S/Cp.
  scope: C(g) + 2 H(g) -> CH2(g), 1 bar, 1500-4000 K; retained-thermal ATcT1.228 energy candidate and independent
    reconstructed three-state RRHO sensitivity; fixed curated-tio2-v1 ion-inclusive 537-species and neutral 421-species
    networks; no production adoption.
- id: finite_substitution
  revision: '1'
  kind: numerical_verification
  statement: Fresh endpoints and selected tighter/path/triplet/FastChem controls verify the finite network response
    while preserving unresolved numerical comparisons.
  scope: C(g) + 2 H(g) -> CH2(g), 1 bar, 1500-4000 K; retained-thermal ATcT1.228 energy candidate and independent
    reconstructed three-state RRHO sensitivity; fixed curated-tio2-v1 ion-inclusive 537-species and neutral 421-species
    networks; no production adoption.
- id: candidate_direction
  revision: '1'
  kind: theoretical
  statement: Prefer the evaluated ATcT energy-only candidate for a separately scoped production update; do not recommend
    the reconstructed thermal sensitivity for adoption.
  scope: C(g) + 2 H(g) -> CH2(g), 1 bar, 1500-4000 K; retained-thermal ATcT1.228 energy candidate and independent
    reconstructed three-state RRHO sensitivity; fixed curated-tio2-v1 ion-inclusive 537-species and neutral 421-species
    networks; no production adoption.
- id: universal_gibbs_resolution
  revision: '1'
  kind: numerical_verification
  statement: Every same-model total-system Gibbs exchange is numerically resolved over the sampled conditions.
  scope: C(g) + 2 H(g) -> CH2(g), 1 bar, 1500-4000 K; retained-thermal ATcT1.228 energy candidate and independent
    reconstructed three-state RRHO sensitivity; fixed curated-tio2-v1 ion-inclusive 537-species and neutral 421-species
    networks; no production adoption.
- id: physical_accuracy
  revision: '1'
  kind: physical_validation
  statement: Complete thermal/reaction uncertainty and atmosphere-specific physical accuracy are established across
    intended applications.
  scope: C(g) + 2 H(g) -> CH2(g), 1 bar, 1500-4000 K; retained-thermal ATcT1.228 energy candidate and independent
    reconstructed three-state RRHO sensitivity; fixed curated-tio2-v1 ion-inclusive 537-species and neutral 421-species
    networks; no production adoption.
- id: production_adoption
  revision: '1'
  kind: numerical_verification
  statement: The evaluated candidate is adopted into production curated data and public presets.
  scope: C(g) + 2 H(g) -> CH2(g), 1 bar, 1500-4000 K; retained-thermal ATcT1.228 energy candidate and independent
    reconstructed three-state RRHO sensitivity; fixed curated-tio2-v1 ion-inclusive 537-species and neutral 421-species
    networks; no production adoption.
