schema_version: '0.2'
model:
  id: exogibbs.c4_source_review.v1
  name: C4 energy, state identity and thermal-source investigation
  description: Explain the temperature reversal through energy/entropy cancellation, distinguish linear/cyclic
    states and retain curated provisionally with scoped adoption follow-ups.
  implementation: &id001
    repository: https://github.com/HajimeKawahara/exogibbs
    revision: sha256:b4be9e95c3f4aac8b0e6ff700f265162567fd1d772e17aa4d971cecbc3b38302
    entry_points:
    - mceg/reviews/c4_source_review.py
assumptions:
- statement: Balance one neutral C4 molecule against four neutral C atoms at 1 bar. Common composition does
    not prove common isomer or electronic inventory. H298 alignment and isolated electronic weights are diagnostic
    only.
  evidence:
  - literature_review
  - source_replay
domains:
- kind: numerical_evaluation
  status: documented
  description: Exact legacy source nodes, separately published state-specific energies and an existing gas-only
    equilibrium archive.
  conditions:
  - Source decomposition at 500, 1000, 1500, 2000, 3000, 4000 K; frozen curated samples only at 1500 and 3000
    K.
  - Nine selected JANAF rows including explicit 0 K thermal anchor; NASA 0 K energy uses header anchors, not
    polynomial extrapolation.
  - Published W4 linear/cyclic TAE0 and one measured linear singlet electronic weight are diagnostics, not
    a full candidate.
  - 'Reused 75-case, 537-species ion-inclusive grid: 1500-4000 K, 1e-6-100 bar; reference C/O, 1 and 1.5. No
    new equilibrium solve.'
  evidence:
  - source_replay
- kind: scientific_applicability
  status: unknown
  description: Physical accuracy, complete hot-state/isomer inventory and candidate atmospheric sensitivity
    remain unknown.
  conditions: []
  evidence:
  - literature_review
  - source_replay
claims:
- id: source_attribution
  revision: '1'
  kind: numerical_verification
  statement: The C4 source-ratio reversal is explained by energy/entropy cancellation, and the inspected JANAF
    notes use an estimated linear singlet distinct from the observed triplet. The thermal difference survives
    H298 alignment.
  scope: Neutral C4 gas; 4 C(g) -> C4(g), standard pressure 1 bar. Native JANAF/NASA anchors, separately identified
    linear/cyclic literature energies and reused grid footprint.
- id: numerical_replay
  revision: '1'
  kind: numerical_verification
  statement: Selected official coefficients/nodes, native zero-K energy balances, an isolated electronic-weight
    diagnostic and the archived C4 footprint reproduce offline.
  scope: Neutral C4 gas; 4 C(g) -> C4(g), standard pressure 1 bar. Native JANAF/NASA anchors, separately identified
    linear/cyclic literature energies and reused grid footprint.
- id: physical_accuracy
  revision: '1'
  kind: physical_validation
  statement: The chosen C4 thermochemical model has quantified physical accuracy and a consistent state/isomer
    inventory over intended applications.
  scope: Neutral C4 gas; 4 C(g) -> C4(g), standard pressure 1 bar. Native JANAF/NASA anchors, separately identified
    linear/cyclic literature energies and reused grid footprint.
