    reaction: 4 C(g) -> C4(g)
    standard_pressure_bar: 1
    source_temperatures_K: 500, 1000, 1500, 2000, 3000, 4000
    baseline: gas_source_comparison/baseline-001
    atomic_reference_policy: Native JANAF/NASA; balance molecule minus four atoms
    grid_reuse: curated_default_adoption/20261102/ions.npz; no new solve
    curated_change: none
    state_policy: Keep linear triplet and cyclic singlet distinct; no aggregate candidate adopted
assessments:
- id: source_attribution_review
  kind: evidence_support
  claim: source_attribution
  claim_revision: '1'
  subject: c4_sources_20261103
  context: source_comparison
  method: &id002
    id: c4_source_review
    revision: '1'
    description: Separate numerical reproduction, conditional energy preference, isomer/state completeness,
      literature access and physical validation.
  evidence:
  - literature_review
  - source_replay
  reasons:
  - The balanced energy/entropy terms explain the reversal. Original JANAF notes directly document an estimated
    linear singlet construction fitted to vapor-pressure data, distinct from the measured linear triplet. Energy
    alignment alone does not reconcile thermal functions.
  status: supported
  origin: reviewed
- id: numerical_replay_review
  kind: evidence_support
  claim: numerical_replay
  claim_revision: '1'
  subject: c4_sources_20261103
  context: source_comparison
  method: *id002
  evidence:
  - source_replay
  reasons:
  - Hash-pinned replay closes the frozen source values, balances explicit zero-K anchors and reuses the archived
    grid. This does not constitute candidate substitution or independent quantum calculation.
  status: supported
  origin: reviewed
- id: physical_accuracy_review
  kind: evidence_support
  claim: physical_accuracy
  claim_revision: '1'
  subject: c4_sources_20261103
  context: source_comparison
  method: *id002
  evidence:
  - literature_review
  - source_replay
  reasons:
  - Gurvich state inventory, complete hot thermal functions and state-resolved energy alignment are not established;
    underlying historical experiments remain uninspected. The original JANAF notes are inspected and document
    an obsolete linear-singlet construction. No candidate substitution has been solved.
  status: unknown
  origin: reviewed
follow_ups:
- id: reconcile_state_and_energy_inventory
  target_kind: claim
  target: physical_accuracy
  revision: '1'
  action: Reconcile linear/cyclic and electronic-state conventions, zero-point/atomic references and the legacy
    experimental reductions.
  requires:
  - Gurvich 1991 volume 2 part 1 page 18 and part 2 page 16 (no verified DOI). JANAF C4 evaluation notes are
    inspected; check underlying historical papers where their reduction assumptions affect the candidate.
  - Gingerich et al. 1994 full paper, DOI 10.1021/ja00088a025, for pressure calibration, third-law thermal
    corrections and uncertainty.
  - Supporting Martin et al. 1991, DOI 10.1063/1.459747; reconcile with inspected W4 DOI 10.1080/00268970802708959
    and resolve Xu DOI 10.1063/1.474715 singlet-entry conflict if using that state.
  completion: Record an explicit state-resolved energy assessment and remaining limitations; do not require
    every historical reference or complete physical validation to merge this source review.
- id: evaluate_consistent_candidate
  target_kind: claim
  target: physical_accuracy
  revision: '1'
  action: Construct a consistent state-resolved or explicitly aggregated C4 model and evaluate finite substitution
    in a fixed relevant network.
  requires:
  - Define electronic/spin and rotational symmetry weights, vibrations, isomer counting, zero-point and atomic
    energy conventions; prevent double counting.
  - Document thermal coverage and gaps rather than adding isolated measured states to an uninspected legacy
    function.
  - Archive conservation, mass-action residuals, absolute abundances and carbon allocation; preserve unrun/failed
    cases and reassess domains outside the existing grid.
  completion: Archive a separately reviewed candidate with uncertainty and finite-substitution receipt; no
    existing trace abundance is a physical error bound.
limitations:
- statement: Retaining curated is provisional. Modern W4 energies favor weaker binding, but numerical source
    agreement does not establish either legacy thermal model as physically correct.
  evidence:
  - literature_review
  - source_replay
- statement: The W4 linear/cyclic energies and isolated electronic weight are not a complete candidate. The
    Xu 1Sigma_g+ source conflict remains unresolved; no value from that conflicting assignment is used.
  evidence:
  - literature_review
  - source_replay
- statement: Full downloaded papers are not committed. Selected facts and acquisition hashes identify inspected
    sources; Gurvich state-inventory pages and some underlying experimental details remain uninspected. JANAF
    original evaluation notes are inspected.
  evidence:
  - literature_review
