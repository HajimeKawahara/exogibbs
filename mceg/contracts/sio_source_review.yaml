follow_ups:
- id: existing_energy_provenance
  target_kind: claim
  target: physical_accuracy
  revision: '1'
  action: Complete the same-version SiO energy provenance and covariance trail when accessible; use relevant
    originals if their definitions could change the balanced anchor.
  requires:
  - ATcT 1.172 species 540 provenance page and reaction covariance; index and Si/O pages already inspected.
  - Feller 2008 DOI 10.1063/1.3008061 original atomization table, or the relevant evaluated source sufficient
    to resolve a concrete energy question; identify Karton 2011 ATcT bibliography 4414 before assigning
    its DOI.
  - Gurvich 1991 volume 2 part 1 p247 / part 2 p227 if needed to resolve legacy state assumptions; obtaining
    every historical original is not a merge prerequisite.
  completion: Record energy zero, source dependence and a justified uncertainty or its remaining covariance
    limitation; keep current adoption unless a material correction is established.
- id: specific_atmosphere_scope
  target_kind: claim
  target: physical_accuracy
  revision: '1'
  action: Define an actual planetary composition and boundary model before translating source uncertainty
    into abundance or spectral consequences.
  requires:
  - Separate hydrogen-rich gas footprints from hot mineral atmospheres and gas/melt, condensation or rainout
    boundaries; Ito 2015 DOI 10.1088/0004-637X/801/2/144 motivates priority but uses CEA itself.
  - For a proposed material thermal improvement, document isotope/energy-zero conventions, hot-state completeness,
    caloric derivatives and interval joins, then run a conserved fixed-network finite substitution.
  - SiOUVenIR DOI 10.1093/mnras/stab3267 full text and data are already inspected; its fixed De is not
    independent validation of ATcT D0.
  completion: Archive a scoped application or named candidate assessment; the present close thermal agreement
    does not require production replacement.
limitations:
- statement: SiO-specific ATcT provenance URL was inaccessible; species values are verified in the same-version
    index. Gurvich and original energy calculations remain partially uninspected and covariance is not
    propagated.
  evidence:
