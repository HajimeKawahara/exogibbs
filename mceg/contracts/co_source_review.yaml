  evidence:
  - source_replay
- kind: scientific_applicability
  status: unknown
  description: Complete physical uncertainty and planetary atmosphere accuracy are not established.
  conditions: []
  evidence:
  - literature
  - source_replay
claims:
- id: source_construction
  revision: '1'
  kind: numerical_verification
  statement: The unchanged CO reaction polynomial uses NASA thermal functions with same-version atom-balanced
    ATcT 1.172 energy; native energy and atomic thermal differences are explicit.
  scope: Neutral CO, C(g)+O(g)->CO(g), one bar; eight 500-4000 K thermal nodes, curated only 1500-4000
    K; 75 archived gas-only cases, not atmospheric validation.
- id: normalized_thermal_comparison
  revision: '1'
  kind: numerical_verification
  statement: Every distributed 4thplus and Li2015 state reproduces the normalized thermal comparison and
    direct energy-moment calorics; actual weights, temperature columns and energy limits take precedence
    over conflicting metadata.
  scope: Neutral CO, C(g)+O(g)->CO(g), one bar; eight 500-4000 K thermal nodes, curated only 1500-4000
    K; 75 archived gas-only cases, not atmospheric validation.
- id: scoped_retention
  revision: '1'
  kind: theoretical
  statement: 'Retain the existing CO thermal and energy construction on the sampled domain: modern state
    moments, JANAF Cp and published partition comparisons show no material thermal correction requiring
    a new production model.'
  scope: Neutral CO, C(g)+O(g)->CO(g), one bar; eight 500-4000 K thermal nodes, curated only 1500-4000
    K; 75 archived gas-only cases, not atmospheric validation.
- id: physical_accuracy
  revision: '1'
  kind: physical_validation
  statement: The current CO model has complete quantified energy, isotope, excited-state and planetary
    abundance accuracy.
  scope: Neutral CO, C(g)+O(g)->CO(g), one bar; eight 500-4000 K thermal nodes, curated only 1500-4000
    K; 75 archived gas-only cases, not atmospheric validation.
