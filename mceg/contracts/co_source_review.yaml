  - literature
  - source_replay
- statement: Actual 12C16O nuclear spin and symmetry factors are one. Natural elemental translation with
    representative-isotope internal levels is an approximation, not an isotope-balanced reaction.
  evidence:
  - literature
  - source_replay
domains:
- kind: numerical_evaluation
  status: documented
  description: Neutral CO, C(g)+O(g)->CO(g), one bar; eight 500-4000 K thermal nodes, curated only 1500-4000
    K; 75 archived gas-only cases, not atmospheric validation.
  conditions:
  - Samples at 500, 1000, 1500, 2000, 2500, 3000, 3500 and 4000 K; actual curated evaluated only on 1500-4000
