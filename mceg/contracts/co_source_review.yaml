contexts:
- id: source_review
  scope: Neutral CO, C(g)+O(g)->CO(g), one bar; eight 500-4000 K thermal nodes, curated only 1500-4000
    K; 75 archived gas-only cases, not atmospheric validation.
  settings:
    reaction: C(g)+O(g)->CO(g)
    standard_pressure_bar: 1
    atomic_energy: ATcT 1.172
    atomic_thermal: NASA for aligned comparisons; native JANAF term separately recorded
    partition_normalization: Ground zero, g_ns=1, actual g=2J+1, no extra symmetry/electronic factor
    curated_change: none
    equilibrium_substitution: not_run
assessments:
- id: source_construction_review
  kind: evidence_support
  claim: source_construction
  claim_revision: '1'
  subject: co_sources_20261103
  context: source_review
  method: &id005
    id: review_co_energy_thermal_and_scope
    revision: '1'
    description: Separate balanced energy, normalized state/caloric consistency, scoped retention and
      full physical accuracy.
  evidence:
  - literature
  - source_replay
  - retention_reasoning
  reasons:
  - ATcT C+O-CO gives 1072.019 kJ/mol versus native NASA 1071.800005 kJ/mol. The 27.07365 K hybrid shift
    also includes the NASA R convention. Every archived CO potential is reproduced; carbon/oxygen relative
    budgets close below 2.26e-13.
  status: supported
  origin: reviewed
- id: normalized_thermal_comparison_review
  kind: evidence_support
  claim: normalized_thermal_comparison
  claim_revision: '1'
  subject: co_sources_20261103
  context: source_review
  method: *id005
  evidence:
  - literature
  - source_replay
  - retention_reasoning
  reasons:
  - All 11264 4thplus and 6383 Li2015 states have g=2J+1 and ground zero. Q differs by at most 1.1 ppm
    between lists; JANAF Cp differs by less than 0.014 J/mol/K. Published PF residuals and printed-temperature
    sensitivity are recorded, not silently normalized.
  status: supported
  origin: reviewed
- id: scoped_retention_review
  kind: evidence_support
  claim: scoped_retention
  claim_revision: '1'
  subject: co_sources_20261103
  context: source_review
  method: *id005
  evidence:
  - literature
  - source_replay
  - retention_reasoning
  reasons:
  - At six 1500-4000 K nodes, common-mass Q/NASA is 1.00014816-1.00025660 and absolute Cp difference is
    below 0.004442 J/mol/K. Shared spectroscopy limits independence, but direct thermodynamic checks support
    retention; newer spectral intensities alone do not justify replacement.
  status: supported
  origin: reviewed
- id: physical_accuracy_review
  kind: evidence_support
  claim: physical_accuracy
  claim_revision: '1'
  subject: co_sources_20261103
  context: source_review
  method: *id005
  evidence:
  - literature
  - source_replay
  - retention_reasoning
  reasons:
  - Natural-isotope internal mixtures, correlated energy uncertainty and omitted electronic/rotational
    states are not bounded. No finite substitution, condensation, transport or observational comparison
    establishes planetary abundance accuracy.
  status: unknown
  origin: reviewed
follow_ups:
- id: distribution_metadata_reconciliation
  target_kind: claim
  target: physical_accuracy
  revision: '1'
  action: Reconcile ExoMol metadata and PF-generation details if future precision requires them; do not
    change normalized states to force metadata or table agreement.
  requires:
  - 4thplus DOI 10.1093/mnras/stag985 and Li2015 DOI 10.1088/0067-0049/216/1/15 official data already
    retrieved.
  - Resolve metadata spin factor 2 versus actual 1, 4thplus non-integer printed temperatures/end 9001
    K and actual upper energy exceeding metadata.
  - Distinguish PF output rounding from unresolved generator differences, especially Li2015 if its integer-K
    grid is exact.
  completion: Record an upstream explanation or corrected version with hashes and rerun the affected comparison;
    this does not block current scoped retention.
- id: precision_and_atmosphere_scope
  target_kind: claim
  target: physical_accuracy
  revision: '1'
  action: Before a future precision-driven replacement, quantify the relevant isotope, atomic-energy and
    omitted-state terms, then evaluate a conserved fixed-network substitution for a named atmosphere.
  requires:
  - A defined target accuracy and temperature/composition domain, including condensation or non-equilibrium
    boundaries when relevant.
  - Natural-isotope internal weighting and atomic balance, ATcT energy covariance when needed, and omitted
    triplet/rotational-tail estimates.
  - The full historical Gurvich monograph or all original energy papers are not blanket merge prerequisites;
    obtain sources only to resolve a concrete material uncertainty.
  completion: Archive a scoped candidate assessment and finite abundance response if a material correction
    is established; no replacement is required by current source differences.
limitations:
- statement: 4thplus full author manuscript was inspected; Li2015 rendered methods were inspected but
    its PDF was unavailable. NASA historical Gurvich original and complete ATcT covariance network were
    not reaudited.
  evidence:
  - literature
- statement: The two line lists share ground-state potential ancestry. Their excellent agreement and full
    distributed-state sum are not independent evidence that all physical states are complete.
  evidence:
  - literature
  - source_replay
- statement: Representative-isotope/natural-mass and isotope-mass ratios are explicit proxies; saved near-unity
    carbon/oxygen shares are not new responses or atmospheric error bounds.
  evidence:
  - source_replay
