schema_version: '0.2'
model:
  id: exogibbs.cis_hno2_candidate.v1
  name: 'cis-HONO: bounded candidates and fixed-network substitution'
  description: Prefer the coordinated cis/trans ATcT energy candidate as the internally consistent evaluated option.
    Keep the 2023 measured-gap hybrid and its quoted-width edges as explicit alternatives; do not adopt a mixed-isomer
    thermal function.
  implementation: &id001
    repository: https://github.com/HajimeKawahara/exogibbs
    revision: sha256:a3f19aec5e64b281ca7e1ddb58e8c9ef7db49fe773f5e7b423866935aadf79d3
    entry_points:
    - mceg/reviews/pending_nitrogen_inputs.py
    - mceg/reviews/pending_candidate.py
    - mceg/reviews/pending_equilibrium_impact.py
assumptions:
- statement: Exact gas/isomer identity and physical source zero are preserved; never infer D0 from a fitted intercept.
  evidence:
  - source_scope
  - candidate_validation
- statement: Retained-thermal energy variants keep the fit/source residual; NASA alternatives explicitly change
    the reaction thermal function and residual.
  evidence:
  - source_scope
  - candidate_validation
- statement: Finite controls and marginal quoted widths are not a complete physical uncertainty or reaction covariance.
  evidence:
  - source_scope
  - candidate_validation
domains:
- kind: numerical_evaluation
  status: documented
  description: cis-HONO neutral gas, explicit same-version balanced physical energy; 1 bar standard state, 1500-4000
    K, fixed curated-ch2-v1 ion537/neutral421 networks; no production adoption.
  conditions:
  - 450 fresh main endpoints; 42 selected controls; 8 FastChem executions.
  - 150 common reused baseline endpoints; five T, five P and three C/O values per network.
  evidence:
  - candidate_validation
  - finite_execution
- kind: scientific_applicability
  status: unknown
  description: The measurement suggests a smaller gap, but this packet cannot establish that its hybrid central
    value is physically more accurate than the evaluated pair. The measured-gap edge runs sample only two conditions
    per network, not a full uncertainty envelope. Each isomer retains its own thermal function and symmetry convention.
  conditions: []
  evidence:
  - source_scope
  - decision_reasoning
