evidence:
- id: source_scope
  kind: literature
  summary: The production records are separate cis and trans molecules. The NASA and 2025 TIPS equilibrium-mixture
    records cannot be copied into either record. Original JANAF cis-minus-trans H0 is 2165 J/mol; the rounded same-version
    ATcT gap is 1610 J/mol. The 2023 intensity-derived ground-state gap is 95.8 +/- 9.2 cm-1, or 1146.022499 +/-
    110.056440 J/mol. It is not an isomerization barrier. Its fit combines 787 lines (508 trans, 279 cis) at 240/270/296
    K with fixed dipole magnitudes; that quoted width does not establish the complete systematic uncertainty of
    a hybrid thermochemical network. The selected indexed primary manuscript tables and publisher record were inspected;
    direct full-manuscript retrieval remains unavailable. Joint ATcT preserves a single evaluated absolute-energy
    network. The measured-gap hybrid fixes the trans ATcT anchor and changes only the cis energy difference; it
    is a concrete, potentially useful follow-up, not a second additive correction or a statistical combination with
    ATcT.
