- id: fixed_ch2_networks
  scope: cis-HONO neutral gas, explicit same-version balanced physical energy; 1 bar standard state, 1500-4000 K,
    fixed curated-ch2-v1 ion537/neutral421 networks; no production adoption.
  settings:
    baseline_dataset: curated-ch2-v1
    new_endpoint_solves: 450
    new_control_solves: 42
    independent_fastchem_runs: 8
    reused_baseline_cases: 150
    curated_update: none
    recommended_variant: joint_cis_trans_atct
assessments:
- id: continuous_thermodynamics_review
  kind: evidence_support
  claim: continuous_thermodynamics
  claim_revision: '1'
  subject: cis_hno2_bounded_candidates_20261106
  context: fixed_ch2_networks
  method:
    id: review_cis_hno2_bounded_candidates
    revision: '1'
    description: Separate source anchoring, numerical substitutions, scoped selection and unknown complete physical
      accuracy.
  evidence:
  - source_scope
  - candidate_validation
  - finite_execution
  - decision_reasoning
  reasons:
  - Physical JANAF D0=1250.945000 kJ/mol changes to the balanced ATcT 1.228 D0=1251.685000 kJ/mol. The retained-thermal
    variant changes formation G and H by -740.000 J/mol, leaving S and Cp unchanged. Native NASA R and SI insertion
    are separated; missing source zero remains missing.
  status: supported
  origin: reviewed
- id: finite_substitution_review
  kind: evidence_support
  claim: finite_substitution
  claim_revision: '1'
  subject: cis_hno2_bounded_candidates_20261106
  context: fixed_ch2_networks
  method:
    id: review_cis_hno2_bounded_candidates
    revision: '1'
    description: Separate source anchoring, numerical substitutions, scoped selection and unknown complete physical
      accuracy.
  evidence:
  - source_scope
  - candidate_validation
  - finite_execution
  - decision_reasoning
  reasons:
  - All 450 fresh endpoints and 42 controls pass. FastChem differences are at most 1.77641e-08 dex. Both fixed networks
    use the same verified baseline archive.
  status: supported
  origin: reviewed
- id: scoped_selection_review
  kind: evidence_support
  claim: scoped_selection
  claim_revision: '1'
  subject: cis_hno2_bounded_candidates_20261106
  context: fixed_ch2_networks
  method:
    id: review_cis_hno2_bounded_candidates
    revision: '1'
    description: Separate source anchoring, numerical substitutions, scoped selection and unknown complete physical
      accuracy.
  evidence:
  - source_scope
  - candidate_validation
  - finite_execution
  - decision_reasoning
  reasons:
  - The production records are separate cis and trans molecules. The NASA and 2025 TIPS equilibrium-mixture records
    cannot be copied into either record. Original JANAF cis-minus-trans H0 is 2165 J/mol; the rounded same-version
    ATcT gap is 1610 J/mol. The 2023 intensity-derived ground-state gap is 95.8 +/- 9.2 cm-1, or 1146.022499 +/-
    110.056440 J/mol. It is not an isomerization barrier. Its fit combines 787 lines (508 trans, 279 cis) at 240/270/296
