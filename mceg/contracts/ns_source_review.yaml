limitations:
- statement: Lodders molecular+NASA atomic reconstruction intentionally differs in atomic convention and
    inherited fit by approximately1–2%; it is an attribution diagnostic, not exact recovery of the historical
    fitting process.
  evidence:
  - literature
  - source_replay
- statement: Peebles H298 shift is only a scale diagnostic; no modern ATcT NS value or same-version NS/atom
    network has been pinned.
  evidence:
  - literature
  - source_replay
- statement: Natural elemental translation and one principal isotope Q are an approximation; explicit
    isotope mixture is uncomputed.
  evidence:
  - literature
  - source_replay
- statement: No new equilibrium solve; trace footprint on this grid is not a statement about all planetary
    atmospheres.
  evidence:
