contexts:
- id: source_samples
  scope: SH source identity, formation-column diagnosis and source-energy comparison.
  settings:
    reaction: H(g) + S(g) -> SH(g)
    standard_pressure_Pa: 100000
    temperatures_K: 500,1000,1500,3000
    baseline_id: baseline-001
    baseline_revision: be1e52726a1700cec180ee0a0380240276feefed
    production_network: unchanged; no equilibrium calculation
    pressure_and_composition: not applicable to source-only ideal-gas thermochemical comparison
    dtype: float64
    comparison_absolute_tolerance: 2.0e-11
    comparison_relative_tolerance: 2.0e-12
assessments:
- id: source_diagnosis_review
  kind: evidence_support
  claim: source_diagnosis
  claim_revision: '1'
  subject: sh_20261102
  context: source_samples
  method: &id002
    id: sh_source_review
    revision: '1'
    description: Separate published source defects, balanced energy comparisons and remaining physical uncertainty.
  evidence:
  - inspected_sources
  - reaction_identity
  - offline_replay
  reasons:
  - Lodders explicitly identifies the old SH columns as erroneous; the fresh official tables reproduce the frozen discrepancy.
  status: supported
  origin: reviewed
- id: numerical_replay_review
  kind: evidence_support
  claim: numerical_replay
  claim_revision: '1'
  subject: sh_20261102
  context: source_samples
  method: *id002
  evidence:
  - offline_replay
  reasons:
  - Selected-node and reaction decomposition checks pass; the existing balanced correction matches direct curated evaluation.
  status: supported
  origin: reviewed
- id: physical_accuracy_review
  kind: evidence_support
  claim: physical_accuracy
  claim_revision: '1'
  subject: sh_20261102
  context: source_samples
  method: *id002
  evidence:
  - inspected_sources
  reasons:
  - The source investigation supplies no full high-temperature uncertainty model or abundance experiment.
  status: unknown
  origin: reviewed
follow_ups:
- id: complete_thermal_and_uncertainty_review
  target_kind: claim
  target: physical_accuracy
  revision: '1'
  action: Inspect original Gurvich state sums and Zhou full text; quantify high-temperature and correlated reaction uncertainty before application claims.
  requires:
  - Original Gurvich 1989 v1 p296 / v2 p179
  - Zhou 2005 full text
  - State-resolved partition sums and covariance-aware D0 uncertainty
  - Fixed-network abundance comparison if proposing a source replacement
  completion: Add scoped physical and abundance evidence; do not infer it from source ratios.
limitations:
- statement: The reviewed disposition is conditional retention, not a new adoption or whole-mixture validation.
  evidence:
  - inspected_sources
  - offline_replay
- statement: The publication error is documented, but its exact historical computational mechanism remains unknown.
  evidence:
  - inspected_sources
