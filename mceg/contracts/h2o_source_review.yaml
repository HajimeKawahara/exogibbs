model:
  id: exogibbs.h2o_source_review.v1
  name: H2O balanced energy and evaluated thermal review
  description: Prioritize the 2025 evaluated water thermal functions as a later candidate while retaining
    production during source investigation; separate spectroscopy, normalization and numerical scope.
  implementation: &id001
    repository: https://github.com/HajimeKawahara/exogibbs
