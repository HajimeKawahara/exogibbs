follow_ups:
- id: continuous_thermal_candidate
  target_kind: claim
  target: physical_accuracy
  revision: '1'
  action: Build a continuous 2025 thermal candidate at the existing balanced ATcT anchor and NASA atomic
    gauge, then compare it on a fixed equilibrium network.
  requires:
  - Full 2025 DOI 10.1063/5.0273661 and supplements 10.60893/figshare.jpr.29087330.v1, 10.60893/figshare.jpr.29087339.v1,
    10.60893/figshare.jpr.29087342.v1 are already obtained.
  - Resolve numeric J/mol enthalpy and already spin-free entropy before fitting; verify G/H/S/Cp derivatives,
    interval joins and independent off-node values over 1500-4000 K.
  - State whether evaluated-table additional contributions or only discrete PW2024 states are included;
    compare the scopes and assess unbound/scattering consistency with separately represented OH/H species.
  - Keep dominant-isotope internal states at aggregate mass explicit or implement a justified isotope
    treatment; run conserved fixed-network finite substitution before adoption.
  completion: Record the selected thermodynamic scope, fit errors and finite equilibrium response, then
    make a separately justified production adoption decision.
- id: existing_energy_provenance
  target_kind: claim
  target: physical_accuracy
  revision: '1'
  action: Complete the same-version reaction covariance trail or targeted historical provenance when needed
    to resolve a concrete energy question.
  requires:
  - ATcT 1.172 covariance for 2H+O-H2O; individual rounded species uncertainties cannot be treated as
    independent exact values.
  - Original NASA header references Cox 1989, Woolley 1987 and TRC (10/88) tuv25, or sufficient evaluated
    documentation for a concrete discrepancy; not every original is a merge prerequisite.
  completion: Record a justified balanced-energy uncertainty or its remaining covariance limit without
    conflating first dissociation with total atomization.
limitations:
- statement: Current ExoMol, PW2024 and evaluated thermochemistry share spectroscopic and potential-energy
    inputs; agreement is not independent physical validation.
  evidence:
  - literature
- statement: The 4000 K evaluated-minus-direct Cp difference 0.067981 J/mol/K exceeds published expanded
    uncertainty 0.042. A unique central-value attribution to the unbound model is not established; few
    above-threshold discrete states do not explain it.
  evidence:
  - literature
  - source_replay
- statement: Reaction covariance and some historical originals are unavailable; expanded thermal uncertainties
    exclude whole-mixture and isotope-model uncertainty.
  evidence:
  - literature
- statement: The 90.6116 percent oxygen footprint is an archived gas calculation, not a source-substitution
    response or observed atmospheric validation.
  evidence:
  - source_replay
