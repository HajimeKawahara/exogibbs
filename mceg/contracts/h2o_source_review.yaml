assumptions:
- statement: Balance H/O/H2O in ATcT 1.172 at ground-state zero. First H+OH dissociation and total 2H+O
    atomization are different energies.
  evidence:
  - literature
  - source_replay
- statement: Raw water Q includes spin weights 3/1; thermochemical Q removes the product four, while published
    2025 S already removes it. Numeric CSV enthalpy is J/mol despite its kJ/mol header.
  evidence:
  - literature
  - source_replay
- statement: Normalize translation to 18.01528 u at 1 bar but retain dominant-isotope internal states;
    this is not a complete natural-isotope reaction or mixture.
  evidence:
  - literature
  - source_replay
domains:
- kind: numerical_evaluation
  status: documented
  description: Frozen source tables, full-state moments and existing current-default gas footprint.
  conditions:
  - 298.15, 300, 500, 1000, 1500, 2000, 2500, 3000, 3500, 4000 K diagnostics; production comparisons only
    1500-4000 K.
  - 75 converged cases, 537 species, 1500-4000 K, 1e-6-100 bar and three C/O values; no new solve.
  evidence:
  - source_replay
- kind: scientific_applicability
  status: unknown
  description: Complete natural-isotope thermochemistry and atmospheric abundance accuracy are not quantified.
  conditions: []
  evidence:
  - literature
  - source_replay
