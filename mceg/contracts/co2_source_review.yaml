schema_version: '0.2'
model:
  id: exogibbs.co2_source_review.v1
  name: CO2 energy and modern thermal-source review
  description: Retain current NASA/ATcT production and prioritize a convention-consistent NIST thermal
    candidate; distinguish printed equations, actual data and cutoff completeness.
  implementation: &id001
    repository: https://github.com/HajimeKawahara/exogibbs
    revision: sha256:cbefe937fe4ad5fd7b6a6dc3db6106f4417a93224292bc940df391c02de89172
    entry_points:
    - mceg/reviews/co2_source_review.py
assumptions:
- statement: Balance C+2O within one ATcT 1.172 version. The44000cm-1 CO+O cutoff is not total atomization
    D0; retain NASA atomic thermal references.
  evidence:
  - literature
  - source_replay
- statement: For626, zero is the lowest rovibrational level and spin factor1; allowed states enforce symmetry.
    Natural isotope entropy is not a drop-in replacement for NASA atomic conventions.
  evidence:
  - literature
  - source_replay
domains:
- kind: numerical_evaluation
  status: documented
  description: Frozen source nodes and current archived gas grid.
  conditions:
  - 500,1000,1500,2000,2500,3000,3500,4000K diagnostic samples; current curated only1500-4000K.
  - 75 existing converged gas cases,537species,1e-6-100bar and threeC/O values; no new solve.
  evidence:
  - source_replay
- kind: scientific_applicability
  status: unknown
  description: Complete equilibrium/atmospheric physical accuracy is unquantified; high-temperature bound-state/dissociation
    and isotope-reference conditions remain.
  conditions: []
  evidence:
  - literature
  - source_replay
claims:
- id: source_construction
  revision: '1'
  kind: numerical_verification
  statement: The existing CO2 polynomial preserves NASA thermal functions with atom-balanced ATcT 1.172
    energy; native energy, atomic reference and molecular thermal differences are separated.
  scope: Neutral CO2, C(g)+2O(g)->CO2(g), 1 bar; eight 500-4000 K source nodes, production 1500-4000 K
    only; existing 75-case, 537-species curated-tio-v1 gas archive. No new substitution or physical atmospheric
    validation.
- id: thermal_consistency
  revision: '1'
  kind: numerical_verification
  statement: Published NIST Q/H/S/Cp satisfy independent caloric identities despite the printed variance-sign
    error; isotope conventions and the current UCL 26000 cm-1 PF cutoff are distinguished from full-state
    sums.
  scope: Neutral CO2, C(g)+2O(g)->CO2(g), 1 bar; eight 500-4000 K source nodes, production 1500-4000 K
    only; existing 75-case, 537-species curated-tio-v1 gas archive. No new substitution or physical atmospheric
    validation.
- id: candidate_direction
  revision: '1'
  kind: theoretical
  statement: The modern NIST effective-Hamiltonian thermal evaluation is the preferred basis of a bounded
    CO2 candidate, with explicit isotope/entropy normalization and high-state limits; retain production
    during this source review.
  scope: Neutral CO2, C(g)+2O(g)->CO2(g), 1 bar; eight 500-4000 K source nodes, production 1500-4000 K
    only; existing 75-case, 537-species curated-tio-v1 gas archive. No new substitution or physical atmospheric
    validation.
- id: numerical_replay
  revision: '1'
  kind: numerical_verification
  statement: The frozen source calculation and retained CO2 potentials and carbon/oxygen budgets reproduce
    offline.
  scope: Neutral CO2, C(g)+2O(g)->CO2(g), 1 bar; eight 500-4000 K source nodes, production 1500-4000 K
    only; existing 75-case, 537-species curated-tio-v1 gas archive. No new substitution or physical atmospheric
    validation.
- id: physical_accuracy
  revision: '1'
  kind: physical_validation
  statement: The complete CO2 model has quantified physical accuracy for hot planetary equilibrium abundances
    and spectra.
  scope: Neutral CO2, C(g)+2O(g)->CO2(g), 1 bar; eight 500-4000 K source nodes, production 1500-4000 K
    only; existing 75-case, 537-species curated-tio-v1 gas archive. No new substitution or physical atmospheric
    validation.
