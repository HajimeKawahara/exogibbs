assessments:
- id: source_construction_review
  kind: evidence_support
  claim: source_construction
  claim_revision: '1'
  subject: co2_sources_20261103
  context: source_review
  method:
    id: review_co2_energy_thermal_and_scope
    revision: '1'
    description: Separate balanced energy, independent caloric identities, normalization and scientific
      source preference from complete physical accuracy.
  evidence:
  - literature
  - source_replay
  reasons:
  - ATcT 1.172 C+2O-CO2 gives 1598.180 kJ/mol. Current minus native NASA D0/k is 32.513472 K; the curated
    polynomial equals the independently reconstructed hybrid and all saved current CO2 potentials.
  status: supported
  origin: reviewed
- id: thermal_consistency_review
  kind: evidence_support
  claim: thermal_consistency
  claim_revision: '1'
  subject: co2_sources_20261103
  context: source_review
  method:
    id: review_co2_energy_thermal_and_scope
    revision: '1'
    description: Separate balanced energy, independent caloric identities, normalization and scientific
      source preference from complete physical accuracy.
  evidence:
  - literature
  - source_replay
  reasons:
  - NIST derivative identities close within 2e-6 for Cp/R and 1e-7 for H/RT. Full UCL states reproduce
    NIST Table6, while the 26000 cm-1 subset reproduces distributed PF within 1.4e-6; full Dozen matches
    distributed PF within 1.5e-6. Natural isotope averages and spin/entropy limits are explicit.
  status: supported
  origin: reviewed
- id: candidate_direction_review
  kind: evidence_support
  claim: candidate_direction
  claim_revision: '1'
  subject: co2_sources_20261103
  context: source_review
  method:
    id: review_co2_energy_thermal_and_scope
    revision: '1'
    description: Separate balanced energy, independent caloric identities, normalization and scientific
      source preference from complete physical accuracy.
  evidence:
  - literature
  - source_replay
  - scientific_reasoning
  reasons:
  - NIST provides a more extensive effective-Hamiltonian construction and parameter covariance than the
    legacy thermal source. Same-mass representative626 Q/NASA is 1.000651-1.007913 over 1500-4000 K. This
    motivates a bounded candidate rather than an immediate drop-in natural-entropy replacement; differences
    below rounding or within uncertainty are not adoption proof.
  status: supported
  origin: reviewed
- id: numerical_replay_review
  kind: evidence_support
  claim: numerical_replay
  claim_revision: '1'
  subject: co2_sources_20261103
  context: source_review
  method:
    id: review_co2_energy_thermal_and_scope
    revision: '1'
    description: Separate balanced energy, independent caloric identities, normalization and scientific
      source preference from complete physical accuracy.
  evidence:
  - source_replay
  reasons:
  - All 75 saved endpoints converge; carbon/oxygen budgets close below 2.3e-13 relative and CO2 potentials
    equal the unchanged hybrid. Maximum CO2 carbon share 0.01316% describes this hot hydrogen-rich archive
    only.
  status: supported
  origin: reviewed
- id: physical_accuracy_review
  kind: evidence_support
  claim: physical_accuracy
  claim_revision: '1'
  subject: co2_sources_20261103
  context: source_review
  method:
    id: review_co2_energy_thermal_and_scope
    revision: '1'
    description: Separate balanced energy, independent caloric identities, normalization and scientific
      source preference from complete physical accuracy.
  evidence:
  - literature
  - source_replay
  reasons:
  - No full correlated energy/thermal uncertainty, natural-isotope production normalization, finite replacement
    or observational atmosphere validation is established. The high-temperature non-dissociating-species
    warning and incomplete continuum/model treatment remain.
  status: unknown
  origin: reviewed
follow_ups:
- id: bounded_nist_candidate
  target_kind: claim
  target: candidate_direction
  revision: '1'
  action: Build a derivative-consistent NIST-based CO2 candidate with explicit isotope/spin/entropy normalization
    and unchanged balanced ATcT/NASA-atom reference; then measure a conserved finite substitution.
  requires:
  - Quantify representative626 versus natural isotope approximation, entropy convention and isotope energy-zero
    effect rather than silently replacing natural S.
  - Document source constants, interpolation/caloric derivatives, upper-state cutoff and bound-species
    versus reacting-gas applicability over1500-4000K.
  - Use already inspected DOI10.1063/5.0276615 and dataset10.18434/mds2-2364; Dozen DOI10.1093/mnras/staf2135
    is a cutoff-sensitive comparison, not independent precision proof.
  completion: Archive a named bounded candidate and finite conserved response; no all-historical-papers
    gate.
- id: source_provenance_limits
  target_kind: claim
  target: physical_accuracy
  revision: '1'
  action: Resolve source gaps if they could change a concrete energy or thermal decision, without blocking
    this source review.
  requires:
  - Retain inaccessible ATcT C provenance, original Gurvich pages and incomplete reaction covariance as
    documented limitations.
  - Clarify distributed UCL PF/Cp cutoff/release history if that pair is reused; currently26000cm-1 is
    a demonstrated numerical explanation, not confirmed release intent.
  completion: Document the relevant additional provenance or retain the scoped limitation; obtaining every
    original is not required.
limitations:
- statement: NIST parameter-covariance errors do not certify all systematic high-state, continuum or electronic-state
    contributions; the non-dissociating CO2 table warning is not a reacting-gas validation.
  evidence:
  - literature
- statement: Source-native isotope Q and naturalCp are useful diagnostics, but natural S/spin/energy conventions
    are not normalized into a production candidate here.
  evidence:
  - literature
  - source_replay
- statement: Full state sums, PF-file consistency and the hot hydrogen-rich grid footprint do not validate
    equilibrium abundances for cooler or enriched atmospheres.
  evidence:
  - source_replay
  - scientific_reasoning
