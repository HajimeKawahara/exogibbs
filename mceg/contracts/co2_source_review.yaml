follow_ups:
- id: bounded_nist_candidate
  target_kind: claim
  target: candidate_direction
  revision: '1'
  action: Build a derivative-consistent NIST-based CO2 candidate with explicit isotope/spin/entropy normalization
    and unchanged balanced ATcT/NASA-atom reference; then measure a conserved finite substitution.
  requires:
  - Quantify representative626 versus natural isotope approximation, entropy convention and isotope energy-zero
    effect rather than silently replacing natural S.
  - Document source constants, interpolation/caloric derivatives, upper-state cutoff and bound-species versus
    reacting-gas applicability over1500-4000K.
  - Use already inspected DOI10.1063/5.0276615 and dataset10.18434/mds2-2364; Dozen DOI10.1093/mnras/staf2135
    is a cutoff-sensitive comparison, not independent precision proof.
  completion: Archive a named bounded candidate and finite conserved response; no all-historical-papers gate.
- id: source_provenance_limits
  target_kind: claim
  target: physical_accuracy
  revision: '1'
  action: Resolve source gaps if they could change a concrete energy or thermal decision, without blocking
    this source review.
  requires:
  - Retain inaccessible ATcT C provenance, original Gurvich pages and incomplete reaction covariance as documented
    limitations.
  - Clarify distributed UCL PF/Cp cutoff/release history if that pair is reused; currently26000cm-1 is a demonstrated
    numerical explanation, not confirmed release intent.
  completion: Document the relevant additional provenance or retain the scoped limitation; obtaining every
    original is not required.
- id: candidate_production_adoption
  target_kind: claim
  target: scoped_adoption_direction
  revision: '1'
  action: If the scoped candidate is adopted, publish a versioned curated model that preserves these temperature,
    isotope and source-reference choices, with old-version reproducibility and production-entry verification.
  requires:
  - A production adoption decision for the specified 626 elemental approximation, without claiming exact natural-isotope
    or planetary physical accuracy.
  - Retain bounded 1500-4000 K behavior, the existing ATcT energy and NASA atom gauge, and the documented high-temperature
    source limitations.
  completion: Record versioned production adoption and verification; the current candidate and finite substitution
    are already complete.
limitations:
- statement: NIST parameter-covariance errors do not certify all systematic high-state, continuum or electronic-state
    contributions; the non-dissociating CO2 table warning is not a reacting-gas validation.
  evidence:
  - literature
- statement: Source-native isotope Q and naturalCp are useful diagnostics, but natural S/spin/energy conventions
    are not normalized into a production candidate here.
  evidence:
  - literature
  - source_replay
- statement: Full state sums, PF-file consistency and the hot hydrogen-rich grid footprint do not validate
    equilibrium abundances for cooler or enriched atmospheres.
  evidence:
  - source_replay
  - scientific_reasoning
- statement: The fixed-isotope thermal average preserves each isotope ground zero and omits isotope-specific
    D0 and atom/molecule mixing conventions needed for complete natural chemistry. Its response is a scope
    diagnostic, not an error bound.
  evidence:
  - candidate_definition
  - candidate_adoption_reasoning
- statement: The high-temperature non-dissociating CO2 warning concerns frozen-species thermodynamics; the
    reacting gas network handles chemical dissociation but does not establish a complete continuum or excited-state
    treatment.
  evidence:
  - candidate_definition
  - candidate_adoption_reasoning
- statement: The hydrogen-poor six-case grid is a controlled application-domain comparison, not a particular
    planetary atmosphere or observational validation.
  evidence:
  - candidate_equilibrium_execution
