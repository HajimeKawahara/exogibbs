contexts:
- id: source_review
  scope: Neutral CO2, C(g)+2O(g)->CO2(g), 1 bar; eight 500-4000 K source nodes, production 1500-4000 K only;
    existing 75-case, 537-species curated-tio-v1 gas archive. No new substitution or physical atmospheric validation.
  settings:
    reaction: C(g)+2O(g)->CO2(g)
    standard_pressure_bar: 1
    thermal_diagnostics: NIST626 versus NASA at fixed NASA mass; naturalCp separately; full UCL/Dozen moments
      and cutoff subsets
    energy_anchor: ATcT 1.172,1598.180kJ/mol
    atomic_thermal: NASA retained
    curated_change: none
    equilibrium_substitution: not_run
- id: bounded_candidate_and_substitution
  scope: 'CO2 only on 1500-4000 K at 1 bar standard pressure; 626 internal thermodynamics, NASA molecular mass
    and atomic references, retained ATcT 1.172 energy. Fixed 537-species gas network: 75 original cases and
    six idealized hydrogen-poor cases. No production adoption or atmospheric physical validation.'
  settings:
    primary_model: NIST 626 internal thermodynamics with NASA mass 44.0095 u
    isotope_diagnostic: Fixed terrestrial-fraction average G/H/S/Cp, spin product removed, common translation;
      no extra molecular mixing entropy or isotope D0 shift
    energy_anchor_kJ_mol: 1598.18
    atomic_thermal: Existing NASA C and O functions
    source_constants: NIST c2 retained; modern SI translation and common R calorics
    curated_change: none
    original_cases: 75
    hydrogen_poor_cases: 6
    new_endpoint_solves: 87
    source_Q_sensitivity: Local plus/minus one standard uncertainty only, not a complete physical error band
- id: co2_production_domain
  scope: Versioned curated-co2-v1 on 1500-4000 K and 1 bar standard pressure; representative 12C16O2 internal
    thermodynamics at NASA elemental mass, retained ATcT atomization energy and NASA atomic references. Fixed
    537-species ion-inclusive and 421-species neutral gas networks. No physical atmosphere validation.
  settings:
    dataset: curated-co2-v1
    base_dataset: curated-tio-v1
    temperature_min_K: 1500
    temperature_max_K: 4000
    standard_pressure_bar: 1
    pressure_min_bar: 1.0e-06
    pressure_max_bar: 100
    C_over_O: 0.5888436553555908, 1, 1.5
    D0_J_mol: 1598180.0
    molecular_mass_u: 44.0095
    nuclear_spin_factor: 1
    network_modes: ions=True (537 species); ions=False (421 species)
    cases_per_network: 75
    solver_tolerance: 5.0e-14
    production_adoption: true
