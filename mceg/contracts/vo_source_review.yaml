- id: retained_energy_review
  kind: evidence_support
  claim: retained_energy
  claim_revision: '1'
  subject: vo_sources_20261103
  context: source_comparison
  method: *id003
  evidence:
  - literature_review
  - source_replay
  - energy_reasoning
  reasons:
  - Merriles author full text resolves the old abstract-only inspection gap. Calibration controls and four thresholds
    support the adopted neutral energy; possible barrier interpretation remains explicit.
  status: supported
  origin: reviewed
- id: partition_diagnostic_review
  kind: evidence_support
  claim: partition_diagnostic
  claim_revision: '1'
  subject: vo_sources_20261103
  context: source_comparison
  method: *id003
  evidence:
  - literature_review
  - source_replay
  reasons:
  - HyVO/JANAF internal Q grows from 1.00278 at 1500 K to 1.37980 at 4000 K after dividing by8. Mass-corrected fixed-D0
    proxy is 1.37974 at 4000 K, conditional on zero alignment; no abundance factor inferred.
  status: supported
  origin: reviewed
- id: physical_accuracy_review
  kind: evidence_support
  claim: physical_accuracy
  claim_revision: '1'
  subject: vo_sources_20261103
  context: source_comparison
  method: *id003
  evidence:
  - literature_review
  - source_replay
  reasons:
  - Modern zero/isotope reconciliation, continuous H/S/Cp and finite substitution remain undone. Condensation, cold
    trapping, transport and irradiation are outside the gas-only archive.
  status: unknown
  origin: reviewed
follow_ups:
- id: continuous_thermal_candidate
  target_kind: claim
  target: physical_accuracy
  revision: '1'
  action: Build a normalized HyVO-based continuous VO G/H/S/Cp candidate over 1500-4000 K while retaining the supported
    modern D0.
  requires:
  - Resolve hyperfine/fine energy zero and molecular versus atomic isotope/mass conventions; preserve state weights
    and native atom references.
  - Use HyVO DOI 10.1093/mnras/stae542 and VOMYT DOI 10.1093/mnras/stw1969; pin versions, distinguish downloaded
    VOMYT from paper Table 3 and quantify cutoff/derivative effects.
  - Merriles DOI 10.1063/5.0014006 full author text is now inspected; PDF/raw data may improve reanalysis but obtaining
    every historical Gurvich original is not a merge prerequisite.
  completion: Archive explicit candidate and derivative/normalization checks with a scoped thermal uncertainty assessment.
- id: finite_substitution
  target_kind: claim
  target: physical_accuracy
  revision: '1'
  action: Evaluate the named thermal candidate by fixed-network finite substitution before curated adoption.
  requires:
  - Check conservation, mass action, vanadium allocation and absolute abundances; do not equate K ratio with abundance
    ratio.
  - Separate gas thermochemical adoption from condensate, cold-trap, transport and spectroscopic line-position/intensity
    accuracy.
  completion: Record reproducible candidate response and a bounded adoption decision; physical atmospheric accuracy
    stays scoped.
limitations:
- statement: Retaining curated is provisional; a 38% high-temperature partition diagnostic supports further thermal
    work, not scientific irrelevance.
  evidence:
  - literature_review
  - source_replay
- statement: Quoted 0.002 eV measurement uncertainty is not full K or atmospheric uncertainty; threshold-to-D0 inference
    retains the stated barrier caveat.
  evidence:
  - literature_review
  - source_replay
- statement: HyVO declared 5400 K completeness and VOMYT comparison are not rigorous physical uncertainty bounds.
  evidence:
  - literature_review
  - source_replay
- statement: The 51V16O Q proxy keeps legacy NASA atoms and assumes zero alignment; it is not a complete isotope-resolved
    reaction.
  evidence:
  - literature_review
  - source_replay
- statement: 'No new equilibrium solve or production changes; VO2 and Gunina-dependent PR #318 are outside this
    review.'
  evidence:
  - literature_review
  - source_replay
