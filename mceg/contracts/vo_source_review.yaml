schema_version: '0.2'
model:
  id: exogibbs.vo_source_review.v1
  name: VO energy and modern partition investigation
  description: Inspect adopted modern energy beyond its abstract and quantify a normalized modern thermal candidate;
    retain current curated pending a scoped replacement.
  implementation: &id002
    repository: https://github.com/HajimeKawahara/exogibbs
    revision: sha256:83d86d9461044a0e2920be8403c7a79d2a64b4dacfa0d741de6c859f76eeca1b
    entry_points:
    - mceg/reviews/vo_source_review.py
assumptions:
- statement: Q/8 excludes nuclear spin; the conditional molecular replacement keeps adopted D0 and NASA atoms, applies
    molecular mass correction and assumes unresolved zero alignment.
  evidence:
  - literature_review
  - source_replay
domains:
- kind: numerical_evaluation
  status: documented
  description: Exact source nodes, selected modern partition rows and saved ideal-gas equilibrium endpoints.
  conditions:
  - Curated 1500-4000 K only; source decomposition at 500, 1000, 1500, 2000, 3000, 4000 K.
  - 75 saved cases, 537 species, 1e-6-100 bar, three C/O values; no new solve.
  evidence:
  - source_replay
- kind: scientific_applicability
  status: unknown
  description: Full energy-zero/isotope alignment, thermal derivatives and physical atmospheric applicability are
    not established.
  conditions: []
  evidence:
  - literature_review
  - source_replay
claims:
- id: source_reconstruction
  revision: '1'
  kind: numerical_verification
  statement: Native energy/atomic references reconstruct the frozen VO comparison and actual current hybrid; archived
    vanadium accounting is reproducible.
  scope: Neutral VO, V(g) + O(g) -> VO(g), p0=1 bar; current hybrid 1500-4000 K, source-only nodes outside this
    domain, normalized 51V16O molecular-Q diagnostic and 75 archived gas-only cases.
- id: retained_energy
  revision: '1'
  kind: theoretical
  statement: The inspected Merriles (2020) author manuscript supports retaining the adopted neutral D0=6.545 eV
    with its conditional threshold interpretation.
  scope: Neutral VO, V(g) + O(g) -> VO(g), p0=1 bar; current hybrid 1500-4000 K, source-only nodes outside this
    domain, normalized 51V16O molecular-Q diagnostic and 75 archived gas-only cases.
- id: partition_diagnostic
  revision: '1'
  kind: numerical_verification
  statement: Removing 51V nuclear-spin weight and treating molecular mass and energy zero explicitly exposes a high-temperature
    HyVO/JANAF population difference.
  scope: Neutral VO, V(g) + O(g) -> VO(g), p0=1 bar; current hybrid 1500-4000 K, source-only nodes outside this
    domain, normalized 51V16O molecular-Q diagnostic and 75 archived gas-only cases.
- id: physical_accuracy
  revision: '1'
  kind: physical_validation
  statement: A complete continuous VO thermochemical model and atmospheric predictions have quantified physical
    accuracy.
  scope: Neutral VO, V(g) + O(g) -> VO(g), p0=1 bar; current hybrid 1500-4000 K, source-only nodes outside this
    domain, normalized 51V16O molecular-Q diagnostic and 75 archived gas-only cases.
