schema_version: '0.2'
model:
  id: exogibbs.curated_h2o.v1
  name: Curated gas default with evaluated H2O and NIST CO2
  description: Adopt the exact reviewed evaluated H2O analytic thermal model on the pinned CO2-corrected
    base. Scientific selection and joint production numerical verification are supported within scope;
    complete physical accuracy remains unknown.
  implementation:
    repository: https://github.com/HajimeKawahara/exogibbs
    revision: sha256:83ede67521dbf1a0b8c8127316c5b619b65fd73a7ad553a78f6bf42309b09b6f
    entry_points:
    - exogibbs.presets.curated.chemsetup
    - exogibbs.presets.curated_h2o.chemsetup
assumptions:
- statement: Only H2O changes from curated-co2-v1. The combined production model differs from curated-tio-v1
    in H2O and CO2 alone, with retained species, budgets, charge treatment, pressure and atomic gauge.
  evidence:
  - scientific_sources
  - production_execution
- statement: Water retains ATcT 1.172 total atomization 917.819 kJ/mol and NASA atomic thermal functions.
    H2(16O) internal thermodynamics at mass 18.01528 u is an explicit dominant-isotope approximation.
  evidence:
  - scientific_sources
- statement: The evaluated Cp polynomial and exact H/S integrals are transferred without refitting. Source
    H numbers are J/mol despite their CSV labels, and source S already removes the spin product four;
    no extra spin, symmetry or ZPE factor is added.
  evidence:
  - scientific_sources
  - production_execution
- statement: Evaluated scattering contributions are retained in the source scope. Their interaction assignment
    in the ideal reacting mixture remains unverified; separate OH/H species do not alone establish simple
    double counting.
  evidence:
  - scientific_sources
domains:
- kind: numerical_evaluation
  status: documented
  description: Continuous packaged thermochemistry and joint production cold solves in both network modes.
  conditions:
  - No extrapolation outside 1500-4000 K; nonfinite/out-of-range inputs return NaN.
  - '75 conditions per network: five temperatures 1500/2000/2500/3000/4000 K, five pressures 1e-6/1e-4/0.01/1/100
    bar and three C/O ratios 0.5888436553555908/1/1.5.'
  - Production potentials match an independent assembly of both frozen candidates on 2501 temperatures;
    all other species match curated-tio-v1.
  evidence:
  - scientific_sources
  - production_execution
- kind: scientific_applicability
  status: unknown
  description: Complete isotopic, scattering and energy uncertainty, condensation, transport and atmospheric
    observations are outside the validated scope.
  conditions: []
  evidence:
  - scientific_sources
  - production_execution
claims:
- id: scientific_selection
  revision: '1'
  kind: theoretical
  statement: The evaluated 2025 water thermal source is scientifically preferred for this explicitly bounded
    gas model, with retained ATcT energy and documented isotope/scattering scope.
  scope: curated-h2o-v1 on 1500-4000 K and 1 bar standard pressure, inheriting curated-co2-v1. H2(16O)
    internal thermodynamics at aggregate mass 18.01528 u, retained ATcT total energy and NASA atoms. Both
    537-species ion-inclusive and 421-species neutral networks; no complete atmospheric physical validation.
- id: production_adoption
  revision: '1'
  kind: numerical_verification
  statement: The public curated default implements the exact reviewed H2O candidate on curated-co2-v1
    and passes joint ion-inclusive and neutral production verification.
