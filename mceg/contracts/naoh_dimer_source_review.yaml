model:
  id: exogibbs.naoh_dimer_source_review.v1
  name: Neutral sodium hydroxide dimer source investigation
  description: Trace and decompose JANAF versus Gurvich/NASA thermochemistry and reuse a sodium footprint without
    changing production.
  implementation: &id004
    repository: https://github.com/HajimeKawahara/exogibbs
