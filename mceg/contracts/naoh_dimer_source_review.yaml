assumptions:
- statement: H2Na2O2 and NASA Na2O2H2 denote the neutral hydroxide dimer, distinct from peroxide, monomer,
    hydrates, ions and condensed phases.
  evidence:
  - literature
- statement: Both source comparisons use 1 bar; frozen atomic references are retained explicitly, while 2NaOH(g)->dimer
    association cancels atoms but changes both molecular source functions.
  evidence:
  - source_replay
domains:
- kind: numerical_evaluation
  status: documented
  description: 'Neutral ideal-gas hydroxide dimer source investigation: four frozen screening nodes, seven
    published thermal-function nodes, archived 75-case sodium footprint; no production adoption.'
  conditions:
  - Screening at 500, 1000, 1500 and 3000 K; current fit only evaluated at 1500-4000 K.
  - Published absolute-function comparison at 298.15, 500, 1000, 1500, 2000, 3000 and 4000 K.
  - 'Archived grid: 1500-4000 K, five pressures from 1e-6 to100bar, C/O=0.5888436553555908,1,1.5.'
  evidence:
  - source_replay
- kind: scientific_applicability
  status: unknown
  description: Complete high-temperature physical accuracy and atmospheric applicability are not established.
  conditions: []
  evidence:
  - literature
claims:
- id: source_and_footprint
  revision: '1'
  kind: numerical_verification
  statement: The frozen source discrepancy is reproduced and decomposed; the NASA record follows Gurvich1996,
    the printed molecular-constant change explains the thermal difference, and the archived maximum dimer sodium
    fraction is 7.073911009e-9.
  scope: 'Neutral ideal-gas hydroxide dimer source investigation: four frozen screening nodes, seven published
    thermal-function nodes, archived 75-case sodium footprint; no production adoption.'
- id: conditional_source_preference
  revision: '1'
  kind: theoretical
  statement: Among the inspected sources, Gurvich1996/NASA is the scientifically preferred improvement direction
    because it revises molecular thermal construction and the experimental energy analysis; empirical constants
    and shared experimental ancestry remain explicit.
  scope: 'Neutral ideal-gas hydroxide dimer source investigation: four frozen screening nodes, seven published
    thermal-function nodes, archived 75-case sodium footprint; no production adoption.'
- id: original_source_confirmation
  revision: '1'
  kind: physical_validation
