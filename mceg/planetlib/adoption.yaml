schema_version: '0.6'
model:
  id: exogibbs.planetlib.adoption
  name: ExoGibbs adoption of pinned Planetlib definitions
  description: Shared scientific definitions with local implementation mappings; the existing provider and study
    records retain their historical judgments.
  implementation:
    repository: https://github.com/HajimeKawahara/exogibbs
    revision: 8b34501a90f24d04c31f17dffac14eb0b0694fa2
    entry_points:
    - src/exogibbs/solubility/sun_yao2026.py:h2o_sun_yao2026
    - src/exogibbs/thermo/standard.py:_nasa9
    - src/exogibbs/thermo/ideal_gibbs.py:gibbs_j
assumptions:
- statement: Water partial pressure and total melt pressure are separate bar inputs. The caller normalizes the complete
    dry oxide inventory before supplying Na2O and Al2O3 fractions. The result is binary total H2O-equivalent mass
    fraction, not wt percent or a dry-host mass ratio. The continuous zero-water limit and NaN guards remain provider
    behavior; no Gibbs continuation is adopted.
  evidence:
  - exogibbs.planetlib.sun_yao.source
- statement: Each coefficients row is (a1,a2,a3,a4,a5,a6,a7,b1,b2); output tuple is (g/RT,s/R,cp/R). Temperature
    is numerical Kelvin. h/RT is recovered as g/RT+s/R. This is a one-interval algebraic correspondence, excluding
    coefficient datasets, interval joins, reference-gauge reconstruction, and the validity of any curated gas mixture.
  evidence:
  - exogibbs.planetlib.nasa9.source
- statement: At fixed positive T and P and two positive amounts, catalog G is provider gibbs_j/(R*T). Catalog u0i
    is standard_potentials_rt[i]+log(pressure_pa/1e5), adding the one-bar pressure contribution exactly once. Catalog
    ui is the provider amount derivative divided by R*T. No insertion bound, zero-amount derivative, arbitrary-species
    model or chemical equilibrium validation is adopted.
  evidence:
  - exogibbs.planetlib.ideal_mixing.source
domains:
- kind: scientific_applicability
  status: unknown
  description: These local correspondence declarations do not assess physical accuracy of any target material or
    gas mixture.
  conditions: []
  evidence:
  - exogibbs.planetlib.selection
limitations:
- statement: Native validation and the sampled provider comparisons do not prove general code equivalence or renew
    historical assessments.
  evidence:
  - exogibbs.planetlib.selection
