equations:
- id: planetlib.solubility.sun_yao2026.water_mass_fraction
  revision: '2'
  description: Two pressure powers for molecular water and hydroxyl, with the ten
    published water coefficients and one wt%-to-mass-fraction conversion.
  scope: Sun-Yao Eq. 7/Table 1 evaluated with T in K and both pressures in bar, restricted
    here to the explicit binary dry-host/water mass convention. Fixed coefficient
    precision follows the inspected source and consumer review.
  symbols:
    T:
      latex: T
      description: Melt-fluid temperature
      unit: K
    P:
      latex: P
      description: Total melt pressure
      unit: bar
    p_H2O:
      latex: p_{H_2O}
      description: Fluid water partial pressure
      unit: bar
    x_Na2O:
      latex: X_{Na_2O}
      description: Complete dry-oxide-basis Na2O mole fraction
      unit: '1'
    x_Al2O3:
      latex: X_{Al_2O_3}
      description: Complete dry-oxide-basis Al2O3 mole fraction
      unit: '1'
    w:
      latex: w
      description: Binary dissolved H2O-equivalent mass fraction
      unit: '1'
  assumptions:
  - Pressure and temperature occur as numerical values in the specified units; changing
    units requires these normalizations.
  - Water partial pressure is not replaced by fugacity.
  - The complete dry oxide denominator and its iron-redox convention are supplied
    externally.
  - The two terms use the same H2O-equivalent mass basis; no separate hydroxyl hydrogen
    budget is added.
  - At zero water partial pressure the continuous extension is w=0, with a singular
    pressure derivative.
  - 'SymPy symbols are numerical magnitudes: T in K, P and p_H2O in bar, and mole/mass
    fractions dimensionless.'
  evidence:
  - planetlib.solubility.sun_yao2026.provider_source
  - planetlib.solubility.sun_yao2026.paper_review
  sympy:
    format: sympy-srepr-v1
    expression: Equality(Symbol('w'), Add(Mul(Rational(1, 100), Pow(Symbol('T'), Rational(-43771,
      62500)), Pow(Symbol('p_H2O'), Rational(161561, 200000)), exp(Add(Mul(Integer(-1),
