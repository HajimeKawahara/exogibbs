- id: planetlib.thermodynamics.ideal_mixing.euler
  revision: '1'
  description: Euler consistency relation.
  scope: 'Two components at fixed temperature and pressure, with composition-independent
    supplied standards. The finite two-component model is a minimal reusable instance,
    not an arbitrary-species solver. Pressure contributions belong to the supplied
    standards: one-bar ideal-gas standards require a separate ln(P/P0) addition exactly
    once. No gas law, activity correction, phase equilibrium or boundary derivative
    is selected.'
  symbols:
    G:
      latex: G/(RT)
      description: Total extensive Gibbs energy divided by R T; this is not molar
        Gibbs energy.
      unit: mol
    n1:
      latex: n_1
      description: Amount of host component 1.
      unit: mol
    n2:
      latex: n_2
      description: Amount of host component 2.
      unit: mol
    u1:
      latex: u_1
      description: Component 1 chemical potential divided by R T.
      unit: '1'
    u2:
      latex: u_2
      description: Component 2 chemical potential divided by R T.
      unit: '1'
  assumptions:
  - Amounts are positive for chemical-potential derivatives; the zero-amount energy
    limit does not define a finite insertion potential.
  - The scalar G/(R T) has units of mol, whereas each chemical potential divided by
    R T is dimensionless.
  - The selected standards already refer to the fixed pressure; ideal mixing is counted
    exactly once.
  evidence:
  - planetlib.thermodynamics.ideal_mixing.source
  sympy:
    format: sympy-srepr-v1
    expression: Equality(Symbol('G'), Add(Mul(Symbol('n1', positive=True), Symbol('u1')),
      Mul(Symbol('n2', positive=True), Symbol('u2'))))
