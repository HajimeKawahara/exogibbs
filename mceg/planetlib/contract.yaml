- id: planetlib.thermodynamics.ideal_mixing.model
  revision: '1'
  description: Binary ideal mixing Gibbs energy and chemical potentials.
  scope: 'Two components at fixed temperature and pressure, with composition-independent
    supplied standards. The finite two-component model is a minimal reusable instance,
    not an arbitrary-species solver. Pressure contributions belong to the supplied
    standards: one-bar ideal-gas standards require a separate ln(P/P0) addition exactly
    once. No gas law, activity correction, phase equilibrium or boundary derivative
    is selected.'
  quantities:
    n1:
      quantity:
        id: planetlib.thermodynamics.ideal_mixing.n1
        revision: '1'
      role: input
    n2:
      quantity:
        id: planetlib.thermodynamics.ideal_mixing.n2
        revision: '1'
      role: input
    u01:
      quantity:
        id: planetlib.thermodynamics.ideal_mixing.u01
        revision: '1'
      role: input
    u02:
      quantity:
        id: planetlib.thermodynamics.ideal_mixing.u02
        revision: '1'
      role: input
    G:
      quantity:
        id: planetlib.thermodynamics.ideal_mixing.G
        revision: '1'
      role: derived
    u1:
      quantity:
        id: planetlib.thermodynamics.ideal_mixing.u1
        revision: '1'
      role: derived
    u2:
      quantity:
        id: planetlib.thermodynamics.ideal_mixing.u2
        revision: '1'
      role: derived
  relations:
  - id: planetlib.thermodynamics.ideal_mixing.gibbs_relation
    equation:
      id: planetlib.thermodynamics.ideal_mixing.gibbs
      revision: '1'
    kind: equation
    role: Extensive scalar
    quantities:
      G: G
      n1: n1
      n2: n2
      u01: u01
      u02: u02
  - id: planetlib.thermodynamics.ideal_mixing.potential_1_relation
    equation:
      id: planetlib.thermodynamics.ideal_mixing.potential_1
      revision: '1'
    kind: equation
    role: First component chemical potential
    quantities:
      n1: n1
      n2: n2
      u01: u01
      u1: u1
  - id: planetlib.thermodynamics.ideal_mixing.potential_2_relation
    equation:
      id: planetlib.thermodynamics.ideal_mixing.potential_2
      revision: '1'
    kind: equation
    role: Second component chemical potential
    quantities:
      n1: n1
      n2: n2
      u02: u02
      u2: u2
  - id: planetlib.thermodynamics.ideal_mixing.euler_relation
    equation:
      id: planetlib.thermodynamics.ideal_mixing.euler
      revision: '1'
    kind: equation
    role: Euler consistency relation
    quantities:
      G: G
      n1: n1
      n2: n2
      u1: u1
      u2: u2
