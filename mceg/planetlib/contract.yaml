mathematical_models:
- id: planetlib.solubility.sun_yao2026.binary_water
  revision: '2'
  description: Water-solubility relation with five externally supplied thermodynamic
    and composition inputs.
  scope: T, P, p_H2O, X_Na2O and X_Al2O3 are external inputs; w is derived. No gas
    composition solver, phase equilibrium, iron-redox closure, multisolute mass convention,
    Gibbs continuation or boundary condition is selected.
  quantities:
    temperature:
      quantity:
        id: planetlib.solubility.sun_yao2026.temperature
        revision: '1'
      role: input
    total_pressure:
      quantity:
        id: planetlib.solubility.sun_yao2026.melt_total_pressure
        revision: '1'
      role: input
    water_pressure:
      quantity:
        id: planetlib.solubility.sun_yao2026.water_partial_pressure
        revision: '1'
      role: input
    sodium_fraction:
      quantity:
        id: planetlib.solubility.sun_yao2026.dry_na2o_mole_fraction
        revision: '1'
      role: input
    aluminium_fraction:
      quantity:
        id: planetlib.solubility.sun_yao2026.dry_al2o3_mole_fraction
        revision: '1'
      role: input
    water_fraction:
      quantity:
        id: planetlib.solubility.sun_yao2026.binary_water_mass_fraction
        revision: '1'
      role: derived
  relations:
  - id: planetlib.solubility.sun_yao2026.solubility
    equation:
      id: planetlib.solubility.sun_yao2026.water_mass_fraction
      revision: '2'
    kind: equation
    role: Empirical water relation on the selected mass basis
    quantities:
      T: temperature
      P: total_pressure
      p_H2O: water_pressure
      x_Na2O: sodium_fraction
      x_Al2O3: aluminium_fraction
      w: water_fraction
