name: Planetlib adoption

on:
  pull_request:
    paths:
      - 'mceg/planetlib/**'
      - 'tests/model_contracts/planetlib_test.py'
      - 'src/exogibbs/solubility/**'
      - 'src/exogibbs/thermo/standard.py'
      - 'src/exogibbs/thermo/ideal_gibbs.py'
      - '.github/workflows/planetlib.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adoption:
    runs-on: ubuntu-latest
    env:
      JAX_PLATFORMS: cpu
      JAX_ENABLE_X64: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: HajimeKawahara/planetlib
          ref: a83b3fb255c7a383c6a8ef502328266f4dd16bff
          path: planetlib-source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare development dependencies
        run: python -m pip install -e . -r mceg/planetlib/requirements.txt
      - name: Reproduce the native snapshot offline
        run: |
          python planetlib-source/tools/planetlib.py build \
            mceg/planetlib/adoption.yaml --lock mceg/planetlib/imports.lock.json \
            --output "$RUNNER_TEMP/planetlib-contract.yaml"
          diff -u mceg/planetlib/contract.yaml "$RUNNER_TEMP/planetlib-contract.yaml"
          python -m mceg mceg/planetlib/contract.yaml
      - name: Check local identity and sampled provider correspondence offline
        run: python -m pytest -q tests/model_contracts/planetlib_test.py
